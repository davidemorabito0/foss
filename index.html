/* torna false se si puo', altrimenti il motivo */
function negato(a){
  if(sonoAdmin || !a) return false;
  if(SOLO_ADMIN.indexOf(a)>=0) return 'admin';
  let k = PERM_AZIONE[a];
  if(a==='nuovo-da-tel') k = (state.schermo==='spazi' || !state.spazioId)? 'spazi' : 'crea_lavori';
  if((a==='elimina-spazio' || a==='conferma-elimina-spazio') && !puo('spazi')) return 'spazi';
  return (k && !puo(k))? k : false;
}
/* chi e' l'amministratore dell'archivio (in locale sono io) */
function adminId(){ return state.adminId || (sonoAdmin? state.utente : null); }
function permessiDi(uid){ return (state.permessi && state.permessi[uid]) || {}; }
/* le persone vere che posso rendere partecipi di un lavoro (non me) */
function personeOrg(){ return state.utenti.filter(u=>u.id!==state.utente && !u.senzaAccount); }
/* Nel cloud e' il database a decidere cosa mi arriva: qui resta solo la
   domanda "questo spazio e' mio?", per non mostrare scatole vuote altrui. */
let spazioMio = () => true;
/* un progetto di un altro non lo riorganizzo: lo lascio dov'e' */
let mioProgetto = () => true;
const IO = () => state.utente;
/* Chi non è il titolare dell'archivio vede solo i progetti in cui è nel team
   o è taggato su una task: gli altri lavori non lo riguardano. */
function vedeProgetto(p){
  if(sonoTitolare) return true;                             // il titolare vede tutto
  if((p.team||[]).indexOf(state.utente) >= 0) return true;
  return (p.subs||[]).some(s => (s.taggati||[]).some(x => x.u === state.utente));
}
function progettiDi(sid){ return state.progetti.filter(p=>p.spazio===sid && vedeProgetto(p)); }
/* Al collaboratore non mostro gli spazi in cui non ha nessun progetto:
   sarebbero scatole vuote di lavori che non lo riguardano. */
function spaziVisibili(){
  return state.spazi.filter(sp => spazioMio(sp) || progettiDi(sp.id).length > 0);
}

function saluto(){
  const o = new Date().getHours();
  if(o<5) return 'Buonanotte';
  if(o<12) return 'Buongiorno';
  if(o<18) return 'Buon pomeriggio';
  return 'Buonasera';
}
/* ---------- LA PRIMA COSA DA FARE ----------
   In home non basta dire quante notifiche ci sono: deve dire da dove partire,
   e portarci con un tocco. L'ordine è quello che userebbe una persona:
   prima quello che è già scaduto, poi quello che si chiude con un clic,
   poi quello che tocca a te, e solo alla fine il resto. */
function primaCosa(){
  const attivi = state.progetti.filter(p=>!p.completato && vedeProgetto(p));
  if(!attivi.length) return null;
  const g = p => { const q = giorniA(p.consegna); return q==null? 9999 : q; };
  const ord = attivi.slice().sort((a,b)=> g(a)-g(b) || (PESO[a.prio]-PESO[b.prio]));
  const dove = p => (state.spazi.find(x=>x.id===p.spazio)||{}).nome || '';
  const quando = p => { const q = g(p); if(q===9999) return 'senza data';
    if(q<0) return 'scaduto da '+(-q)+(q===-1?' giorno':' giorni');
    if(q===0) return 'consegna oggi'; if(q===1) return 'consegna domani';
    return 'tra '+q+' giorni'; };

  /* 1 — una fase è al 100%: è a un clic dalla chiusura */
  for(const p of ord){
    if(prog(p, p.fase) === 100){
      const ultima = p.fase >= FZ(p).length-1;
      return {urg: g(p)<=1, lb: ultima? 'Pronto da consegnare' : 'Pronto ad avanzare',
        tx: esc(p.nome), sub: FZ(p)[p.fase].nome+' è al 100% — '+(ultima?'premi COMPLETATO e il lavoro è chiuso':'la fase successiva è '+FZ(p)[p.fase+1].nome)+' · '+dove(p)+' · '+quando(p),
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'">'+svg('right')+'Aprilo</button>'};
    }
  }
  /* 2 — qualcosa assegnato a me, nel progetto più urgente */
  for(const p of ord){
    const {voce, mie} = prossimaCosa(p);
    if(voce && voce.mia){
      return {urg: g(p)<=1, lb:'Tocca a te',
        tx: esc(voce.it.t), sub:'in '+esc(voce.t.titolo)+' · '+esc(p.nome)+' · '+dove(p)+' · '+quando(p)+(mie>1? ' · altre '+(mie-1)+' assegnate a te':''),
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'" data-sid="'+voce.t.id+'">'+svg('right')+'Portami lì</button>'};
    }
  }
  /* 3 — il lavoro più vicino alla consegna, chiunque lo stia facendo */
  for(const p of ord){
    const {voce, tutte} = prossimaCosa(p);
    if(voce){
      return {urg: g(p)<=1, lb: g(p)<0? 'In ritardo' : 'Il più urgente',
        tx: esc(p.nome), sub:'prossima: '+esc(voce.it.t)+' · '+esc(U(voce.t.assegnato||p.team[0]).nome.split(' ')[0])+' · '+dove(p)+' · '+quando(p)+' · '+tutte+' cose aperte',
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'" data-sid="'+voce.t.id+'">'+svg('right')+'Portami lì</button>'};
    }
  }
  return null;
}

/* ---------- DOVE MI HANNO TAGGATO ----------
   La prima domanda di chi apre l'app dal telefono \u00e8 sempre la stessa:
   qualcuno mi ha cercato? Rispondo prima di tutto il resto. */
function taggatoSu(){
  const out = [];
  state.progetti.forEach(p=>{
    if(p.completato || !vedeProgetto(p)) return;
    (p.subs||[]).forEach(s=>{
      if((s.taggati||[]).some(x=>x && x.u===state.utente)) out.push({p, s, tipo:'tag'});
      (s.items||[]).forEach(i=>{ if(i && i.ass===state.utente && !i.done) out.push({p, s, i, tipo:'sub'}); });
    });
  });
  return out;
}

/* ---------- LE MIE TASK ----------
   Tutto quello che aspetta me, in un posto solo: le voci che mi sono
   state assegnate e quelle dove mi hanno taggato, progetto per progetto. */
/* Le voci appena spuntate da «Per te» restano in lista, barrate, finche'
   non esco dalla schermata: cosi' si vede cosa ho fatto e si puo' togliere
   la spunta se ho sbagliato. */
const mieAppena = new Set();
function mieCose(){
  const out = [];
  state.progetti.forEach(p=>{
    if(p.completato || !vedeProgetto(p)) return;
    const voci = [];
    (p.subs||[]).forEach(s=>{
      const taggato = (s.taggati||[]).some(x=>x && x.u===state.utente);
      (s.items||[]).forEach((i,ix)=>{
        if(i.done && !(state.schermo==='mie' && mieAppena.has(p.id+'|'+s.id+'|'+ix))) return;
        const mia = i.ass===state.utente || (!i.ass && s.assegnato===state.utente);
        if(mia || taggato) voci.push({s, i, ix, taggato: taggato && !mia});
      });
    });
    if(voci.length) out.push({p, voci});
  });
  const g = x => { const q = giorniA(x.p.consegna); return q==null? 9999 : q; };
  return out.sort((a,b)=> g(a)-g(b));
}
function contaMie(){ return mieCose().reduce((n,x)=>n+x.voci.filter(v=>!v.i.done).length, 0); }

function renderMie(){
  const gruppi = mieCose();
  const tot = contaMie();
  let h = '<div class="pane"><div class="scroller" style="padding:16px 14px 14px">';
  h += '<div style="padding:0 2px 14px">'+
       '<p style="margin:0;font-size:13px;color:var(--mute)">'+
       (tot? '<b style="color:var(--text)">'+tot+'</b>'+(tot===1?' cosa aperta':' cose aperte')+' in '+gruppi.length+(gruppi.length===1?' lavoro':' lavori')
           : 'Niente in sospeso: non c\'\u00e8 nessuna voce assegnata a te.')+'</p></div>';
  if(!tot){
    h += '<div class="empty" style="padding:26px">Quando qualcuno ti assegna una voce o ti tagga, la trovi qui.</div>';
  }
  gruppi.forEach(x=>{
    const sc = scadenza(x.p);
    h += '<div class="mie-g"><button class="mie-h" data-action="apri" data-id="'+x.p.id+'" style="--acc:'+x.p.col+'">'+
      '<span class="tx"><b>'+esc(x.p.nome)+'</b><span>'+esc(x.p.cliente)+'</span></span>'+
      '<span class="chip '+sc.c+'">'+sc.t+'</span></button>';
    x.voci.forEach(v=>{
      h += '<div class="mie-r'+(v.i.done?' fatta':'')+'" role="button" tabindex="0" data-action="vai-primo" data-pid="'+x.p.id+'" data-sid="'+v.s.id+'">'+
        '<span class="box'+(v.i.done?' fatto':'')+'" role="button" tabindex="0" data-action="check-mia" data-pid="'+x.p.id+'" '+
          'data-sid="'+v.s.id+'" data-i="'+v.ix+'" aria-label="'+(v.i.done?'Togli la spunta':'Segna come fatto')+'">'+svg('check',3.2)+'</span>'+
        '<span class="tx"><b>'+esc(v.i.t)+'</b><span>'+esc(v.s.titolo)+'</span></span>'+
        (v.taggato? '<span class="chip">taggato</span>':'')+'</div>';
    });
    h += '</div>';
  });
  h += '</div></div>';
  el('stage').innerHTML = h;
}

/* ---------- CERCA ----------
   Sul telefono la lente ha una pagina sua: si scrive e si vede subito. */
/* dove cercare un lavoro: nome, cliente, tipo di lavoro, indirizzo, tag e i
   dettagli della professione (controparte, numero di ruolo, codice fiscale...) */
function testoCercabile(p){
  const T = TIPO(p.tipo);
  return [p.nome, p.cliente, nomeLavoro(p), p.indirizzo, (p.tags||[]).join(' ')]
    .concat((T.dett||[]).map(d=>p[d[0]]||'')).join(' ').toLowerCase();
}
function trovatoPer(p, q){
  if(((p.nome||'')+' '+(p.cliente||'')).toLowerCase().indexOf(q)>=0) return '';
  const d = (TIPO(p.tipo).dett||[]).find(x=>String(p[x[0]]||'').toLowerCase().indexOf(q)>=0);
  if(d) return d[1]+': '+p[d[0]];
  if((p.indirizzo||'').toLowerCase().indexOf(q)>=0) return p.indirizzo;
  return nomeLavoro(p);
}
function renderCerca(){
  const q = (state.filtro||'').trim().toLowerCase();
  const tutti = state.spazi.flatMap(sp=>progettiDi(sp.id));
  const prog = q? tutti.filter(p=> testoCercabile(p).indexOf(q)>=0) : [];
  const voci = [];
  if(q) tutti.forEach(p=> (p.subs||[]).forEach(s=>{
    if((s.titolo||'').toLowerCase().indexOf(q)>=0 && voci.length<40)
      voci.push({p, s, i:{t:s.titolo, done:(s.items||[]).length>0 && s.items.every(x=>x.done)}, task:true});
    (s.items||[]).forEach((i,ix)=>{
      if(i.t.toLowerCase().indexOf(q)>=0 && voci.length<40) voci.push({p,s,i});
      (i.lista||[]).forEach(v=>{ if(v.t.toLowerCase().indexOf(q)>=0 && voci.length<40) voci.push({p,s,i:v, di:i, ix}); });
    });
  }));
  let h = '<div class="pane"><div class="scroller" style="padding:16px 14px 14px">'+
    '<div class="cerca-box"><span class="ic">'+svg('cerca',2)+'</span>'+
    '<input id="qTel" type="search" placeholder="Cerca un lavoro, un cliente, una task, una checklist\u2026" '+
    'value="'+esc(state.filtro||'')+'" autocomplete="off"></div>';
  if(!q){
    h += '<div class="empty" style="padding:26px">Scrivi qualcosa: cerco tra i lavori, i clienti, i dettagli (controparte, codice fiscale, numero di ruolo\u2026), le task e le checklist.</div>';
  } else {
    if(prog.length){
      h += '<div class="lbl" style="margin:16px 0 8px">Lavori \u00b7 '+prog.length+'</div>';
      prog.forEach(p=>{ const sc = scadenza(p);
        h += '<button class="mie-h" style="--acc:'+p.col+';margin-bottom:7px" data-action="apri" data-id="'+p.id+'">'+
          '<span class="tx"><b>'+esc(p.nome)+'</b><span>'+esc(p.cliente||'')+
            (trovatoPer(p,q)? ' \u00b7 '+esc(trovatoPer(p,q)) : '')+'</span></span>'+
          '<span class="chip '+sc.c+'">'+sc.t+'</span></button>'; });
    }
    if(voci.length){
      h += '<div class="lbl" style="margin:16px 0 8px">Task \u00b7 '+voci.length+'</div>';
      voci.forEach(v=>{
        h += '<button class="mie-r" data-action="vai-primo" data-pid="'+v.p.id+'" data-sid="'+v.s.id+'"'+(v.di? ' data-lista="'+v.ix+'"':'')+'>'+
          '<span class="box'+(v.i.done?' fatto':'')+'">'+svg('check',3.2)+'</span>'+
          '<span class="tx"><b>'+esc(v.i.t)+'</b><span class="due">'+esc(v.p.nome)+' \u00b7 '+
            (v.di? 'checklist di \u00ab'+esc(v.di.t)+'\u00bb' : v.task? 'task' : esc(v.s.titolo))+'</span></span></button>';
      });
    }
    if(!prog.length && !voci.length) h += '<div class="empty" style="padding:26px">Nessun risultato per \u00ab'+esc(q)+'\u00bb.</div>';
  }
  h += '</div></div>';
  el('stage').innerHTML = h;
  const n = el('qTel'); if(n && state.mettiFuoco){ state.mettiFuoco = false; n.focus(); }
}

/* ---------- LA BARRA DELLE SEZIONI ----------
   Sul telefono si naviga da qui, come nelle app che la gente usa gi\u00e0:
   cinque posti, sempre gli stessi, sempre nello stesso ordine. */
function renderTabbar(){
  const n = el('tabbar'); if(!n) return;
  const dentro = state.schermo==='progetto' || state.schermo==='gate';
  n.hidden = !suTelefono() || dentro;
  if(n.hidden){ n.innerHTML = ''; return; }
  const mie = contaMie();
  const T = [
    {k:'progetti', l:'Lavori',  ic:'grid'},
    {k:'mie',      l:'Per te',  ic:'check', n:mie},
    {k:'note',     l:'Note',    ic:'pen'},
    {k:'cerca',    l:'Cerca',   ic:'cerca'},
    {k:'profilo',  l:'Profilo', ic:'user'}
  ];
  const attivo =
    (state.schermo==='profilo' || state.schermo==='guida') ? 'profilo' :
    state.schermo==='mie'     ? 'mie' :
    state.schermo==='cerca'   ? 'cerca' :
    (state.schermo==='home' && state.vista==='note') ? 'note' :
    (state.schermo==='home' || state.schermo==='spazi') ? 'progetti' : '';
  n.innerHTML = T.map(t=>
    '<button class="tb'+(attivo===t.k?' on':'')+'" data-action="tab-tel" data-k="'+t.k+'">'+
      '<span class="ic">'+svg(t.ic)+(t.n? '<span class="n">'+(t.n>9?'9+':t.n)+'</span>':'')+'</span>'+
      '<span class="lb">'+t.l+'</span></button>').join('');
}

/* ---------- LA HOME DEL TELEFONO ----------
   Tre cose, in quest'ordine: chi sei, se ti hanno cercato, cosa fare adesso.
   Il resto viene dopo: sullo schermo piccolo la prima schermata deve
   rispondere, non riempirsi. */
function testataTelefono(){
  if(!boxSaluto && !boxDaFare) return '';
  const tg = taggatoSu();
  const nuove = state.notifiche.filter(n=>n.nuova).length;
  const pc = primaCosa();
  let h = '<div class="tel-home">';
  if(boxSaluto){
  h += '<div class="riga-saluto"><h2 class="tel-saluto">'+saluto()+', '+esc(nomeVisibile().split(' ')[0])+'</h2>'+
       '<button class="chiudi-saluti" data-action="chiudi-saluti" data-b="saluto" '+
       'title="Nascondi fino al prossimo accesso" aria-label="Nascondi">'+svg('x',2.6)+'</button></div>';

  if(tg.length){
    const primo = tg[0];
    const dove = primo.tipo==='sub' ? esc(primo.i.t)+' \u00b7 '+esc(primo.s.titolo) : esc(primo.s.titolo);
    h += '<button class="tel-avviso tag" data-action="vai-primo" data-pid="'+primo.p.id+'" data-sid="'+primo.s.id+'">'+
      '<span class="ic">'+svg('user',2.2)+'</span>'+
      '<span class="tx"><b>'+(tg.length===1? 'Ti hanno taggato in un punto' : 'Ti hanno taggato in '+tg.length+' punti')+'</b>'+
      '<span>'+dove+' \u00b7 '+esc(primo.p.nome)+'</span></span>'+
      '<span class="fr">'+svg('right',2.2)+'</span></button>';
  } else if(nuove){
    h += '<button class="tel-avviso" data-action="notifiche">'+
      '<span class="ic">'+svg('bell',2.2)+'</span>'+
      '<span class="tx"><b>'+nuove+(nuove===1?' notifica da leggere':' notifiche da leggere')+'</b>'+
      '<span>Nessuno ti ha taggato direttamente</span></span>'+
      '<span class="fr">'+svg('right',2.2)+'</span></button>';
  } else {
    h += '<div class="tel-avviso calmo">'+
      '<span class="ic">'+svg('check',2.2)+'</span>'+
      '<span class="tx"><b>Nessuno ti ha taggato</b><span>Puoi lavorare tranquillo</span></span></div>';
  }
  }

  if(pc && boxDaFare){
    h += '<div class="tel-prima'+(pc.urg?' urg':'')+'">'+
      '<button class="chiudi-saluti fuori" data-action="chiudi-saluti" data-b="fare" '+
        'title="Nascondi fino al prossimo accesso" aria-label="Nascondi">'+svg('x',2.6)+'</button>'+
      '<span class="lb">'+esc(pc.lb)+'</span>'+
      '<b>'+pc.tx+'</b>'+
      '<span class="tel-prima-sub">'+esc(pc.sub.split(' \u00b7 ').slice(0,2).join(' \u00b7 '))+'</span>'+
      pc.az+'</div>';
  }
  h += '</div>';
  return h;
}

/* I riquadri di benvenuto servono appena entri, non mentre lavori:
   la X li chiude per questa visita e tornano al prossimo accesso.
   Sta fuori da state apposta: non finisce nell'archivio. */
let boxSaluto = true, boxDaFare = true, boxProssima = true;

function benvenuto(){
  if(!boxSaluto && !boxDaFare) return '';
  const nuove = state.notifiche.filter(n=>n.nuova).length;
  const urg = state.progetti.filter(p=>{ const g = giorniA(p.consegna); return !p.completato && g!=null && g<=7; }).length;
  const attivi = state.progetti.filter(p=>!p.completato).length;
  let mie = 0;
  state.progetti.forEach(p=>{ if(p.completato) return;
    p.subs.forEach(t=>{ if(t.assegnato===state.utente) t.items.forEach(i=>{ if(!i.done) mie++; }); }); });
  const pc = primaCosa();
  return '<div class="benvenuto">'+
    (boxSaluto? '<div class="benv">'+
    '<button class="chiudi-saluti fuori" data-action="chiudi-saluti" data-b="saluto" '+
      'title="Nascondi fino al prossimo accesso" aria-label="Nascondi">'+svg('x',2.6)+'</button>'+
    '<span class="campana'+(nuove?'':' zero')+'">'+svg(nuove?'bell':'check')+
      (nuove? '<span class="n">'+(nuove>99?'99+':nuove)+'</span>':'')+'</span>'+
    '<div class="benv-tx">'+
      '<h2>'+saluto()+', '+esc(nomeVisibile().split(' ')[0])+'</h2>'+
      '<p>'+(nuove
        ? 'Ci sono <b>'+nuove+'</b> '+(nuove===1?'notifica':'notifiche')+' da leggere: meglio partire da lì.'
        : 'Nessuna notifica in sospeso. Puoi metterti a lavorare tranquillo.')+'</p>'+
      '<div class="mini">'+
        '<div><b>'+attivi+'</b>progetti attivi</div>'+
        (urg? '<div class="urg"><b>'+urg+'</b>in consegna entro 7 giorni</div>':'')+
        (mie? '<div><b>'+mie+'</b>subtask assegnate a te</div>':'')+
      '</div>'+
    '</div>'+
    '<div class="az">'+
      (nuove? '<button class="btn'+(pc?' ghost':' primary')+'" data-action="notifiche">'+svg('bell')+'Apri le notifiche</button>':'')+
      '<button class="btn ghost" data-action="me">'+svg('user')+'Profilo</button>'+
      '<button class="btn ghost" data-action="apri-guida">'+svg('help')+'Guida</button>'+
    '</div></div>' : '')+
    ((pc && boxDaFare)? '<div class="daffare'+(pc.urg?' urg':'')+'">'+
        '<button class="chiudi-saluti fuori" data-action="chiudi-saluti" data-b="fare" '+
          'title="Nascondi fino al prossimo accesso" aria-label="Nascondi">'+svg('x',2.6)+'</button>'+
        '<span class="ic">'+svg(pc.urg?'clock':'spark',2.4)+'</span>'+
        '<span class="tx"><span class="lb">'+esc(pc.lb)+'</span><b>'+pc.tx+'</b><span>'+esc(pc.sub)+'</span></span>'+
        '<span class="az">'+pc.az+'</span></div>' : '')+
  '</div>';
}

function renderSpazi(){
  /* sul telefono il saluto sta solo nella pagina dei lavori */
  let h = '<div class="pane"><div class="scroller" style="padding:0">'+ (suTelefono()? '' : benvenuto()) +
    '<div class="spazi-head"><h1>I tuoi spazi di lavoro</h1>'+
    '<p>Ogni spazio raccoglie i progetti di un ambito del tuo lavoro, con le fasi della tua professione. '+
    'Dentro allo spazio trovi progetti, task e calendario separati dagli altri.</p></div><div class="spazi">';

  const elenco = spaziVisibili();
  elenco.forEach(sp=>{
    const ps = progettiDi(sp.id);
    const aperti = ps.filter(p=>!p.completato).length;
    const urg = ps.filter(p=>{ const g = giorniA(p.consegna); return g!=null && g<=7; }).length;
    const task = ps.reduce((n,p)=>n+p.subs.length,0);
    h += '<button class="spazio" style="--acc:'+sp.col+'" data-action="apri-spazio" data-id="'+sp.id+'">'+
      '<span class="ic">'+svg(sp.icona)+'</span>'+

      '<div class="nums">'+
        '<div><b>'+ps.length+'</b><span>Progetti</span></div>'+
        '<div><b>'+aperti+'</b><span>Aperti</span></div>'+
        '<div><b>'+task+'</b><span>Task</span></div>'+
        (urg? '<div><b style="color:var(--alert)">'+urg+'</b><span>In scadenza</span></div>':'')+
      '</div></button>';
  });
  if(puo('spazi')) h += '<button class="spazio nuovo" data-action="nuovo-spazio"><span>'+
    '<span class="ic">'+svg('plus')+'</span>'+
    '<b style="font-family:Sora;font-size:14px;display:block">Nuovo spazio di lavoro</b>'+
    '<span style="font-size:11.5px;color:var(--mute)">Un ambito nuovo, anche di un\u2019altra professione</span></span></button>';
  h += '</div>' + sezionePreset() + '</div></div>';
  el('stage').innerHTML = h;
}

function wzCrea(){

              icona:wz.icona, col:wz.col, tipo:wz.tipo, tags:wz.tags.slice()};

/* ============ PAGINA DEL CLIENTE: la gestione ============ */
/* Un link senza registrazione per il cliente: vede avanzamento, prossime
   date, messaggio e materiale; risponde «Approvo» o «Vorrei modifiche».
   Il link vive nel database (link_cliente), qui solo la finestra. */
let cliMod = null;          // {pid, stato: carico | nessuno | ok | errore, l, errore}
let tClienteSalva = null;
function modaleCliente(pid){
  const p = state.progetti.find(x=>x.id===pid); if(!p) return;
  if(!cloudAttivo() || typeof leggiLinkCliente !== 'function'){
    modale('<h3>Pagina del cliente</h3><div class="modal-b"><div class="nota-box">Serve il database del team: '+
      'senza, non c’è un indirizzo da mandare al cliente.</div></div>'+
      '<div class="modal-f"><button class="btn" data-action="chiudi-modale">Chiudi</button></div>');
    return;
  }
  cliMod = {pid, stato:'carico'};
  disegnaModaleCliente();
  leggiLinkCliente(pid).then(l=>{
    if(!cliMod || cliMod.pid !== pid) return;
    cliMod.l = l; cliMod.stato = l ? 'ok' : 'nessuno'; disegnaModaleCliente();
  }).catch(e=>{
    if(!cliMod || cliMod.pid !== pid) return;
    cliMod.stato = 'errore'; cliMod.errore = (e && e.message) || 'errore'; disegnaModaleCliente();
  });
}
function disegnaModaleCliente(){
  if(!cliMod) return;
  const p = state.progetti.find(x=>x.id===cliMod.pid); if(!p) return;
  const testa = '<h3 style="display:flex;align-items:center;gap:8px">'+svg('review',2.2).replace('<svg','<svg style="width:16px;height:16px;color:var(--amber-ink)"')+
    'Pagina del cliente'+(cliMod.stato==='ok' ? '<span class="chip" id="statoCliente" style="margin-left:auto">Si salva da sola</span>' : '')+'</h3>'+
    '<div class="sub-t">'+esc(p.nome)+(p.cliente? ' · '+esc(p.cliente) : '')+'</div>';
  const piede = b => '<div class="modal-f">'+b+'</div>';
  if(cliMod.stato==='carico'){
    modale(testa+'<div class="modal-b"><div class="nota-box">Controllo…</div></div>'+piede('<button class="btn" data-action="chiudi-modale">Chiudi</button>'));
    return;
  }
  if(cliMod.stato==='errore'){
    modale(testa+'<div class="modal-b"><div class="nota-box">Non riesco a leggere la pagina: '+esc(cliMod.errore||'')+'. Riprova tra poco.</div></div>'+
      piede('<button class="btn" data-action="chiudi-modale">Chiudi</button>'));
    return;
  }
  if(cliMod.stato==='nessuno'){
    modale(testa+'<div class="modal-b">'+
      '<div class="cl-spiega">'+
        '<div><b>Cosa vede</b><span>A che punto è il lavoro, le fasi, le prossime date, il tuo messaggio e il link al materiale.</span></div>'+
        '<div><b>Cosa fa</b><span>Risponde «Approvo» o «Vorrei modifiche»: la risposta arriva nella chat del lavoro e ti arriva una notifica.</span></div>'+
        '<div><b>Cosa non vede</b><span>Task, chat, soldi e persone del team. E non deve registrarsi.</span></div>'+
      '</div></div>'+
      piede('<button class="btn" data-action="chiudi-modale">Annulla</button>'+
            '<button class="btn primary" data-action="cliente-crea">'+svg('link')+'Crea la pagina</button>'));
    return;
  }
  const l = cliMod.l, url = indirizzoCliente(l.token), bozza = cliMod.bozza || {};
  const testoInvio = 'Ciao! Qui vedi a che punto è «'+p.nome+'» e puoi darmi un riscontro: '+url;
  const sw = (az, on, tit, sotto) => '<div class="riga"><div class="tx"><b>'+tit+'</b><span>'+sotto+'</span></div>'+
    '<button class="sw'+(on?' on':'')+'" data-action="'+az+'" aria-pressed="'+on+'" aria-label="'+tit+'"></button></div>';
  modale(testa+'<div class="modal-b">'+
    '<div class="field"><label>Link da mandare al cliente</label>'+
      '<div class="link-box'+(l.attivo?'':' spento')+'" id="clLink">'+esc(url)+'</div>'+
      (l.attivo ? '' : '<div class="nota-box" style="color:var(--alert);margin-top:6px">La pagina è spenta: chi apre il link vede «Pagina non attiva».</div>')+
      '<div class="cal-az" style="margin-top:8px">'+
        '<button class="btn sm primary" data-action="copia" data-l="'+esc(url)+'">'+svg('clip')+'Copia link</button>'+
        (navigator.share ? '<button class="btn sm" data-action="cliente-manda">'+svg('share')+'Invia…</button>'
                         : '<a class="btn sm" href="https://wa.me/?text='+encodeURIComponent(testoInvio)+'" target="_blank" rel="noopener">'+svg('chat')+'WhatsApp</a>')+
        '<a class="btn sm ghost" href="'+esc(url)+'?anteprima=1" target="_blank" rel="noopener">'+svg('review')+'Guarda come la vede</a>'+
      '</div></div>'+
    '<div class="field"><label>Messaggio per il cliente</label>'+
      '<textarea id="cl_msg" rows="3" maxlength="1000" placeholder="Es. Ecco il primo montaggio: guardalo con calma e dimmi cosa ne pensi.">'+
        esc(bozza.messaggio != null ? bozza.messaggio : (l.messaggio||''))+'</textarea></div>'+
    '<div class="field"><label>Link al materiale</label>'+
      '<input id="cl_link" inputmode="url" maxlength="500" placeholder="https://… WeTransfer, Drive, Vimeo, YouTube" value="'+
        esc(bozza.link != null ? bozza.link : (l.link||''))+'"></div>'+
    sw('cliente-date', l.mostra_date, 'Mostra le date', 'Vede data e titolo dei prossimi appuntamenti del lavoro e la consegna prevista')+
    sw('cliente-attiva', l.attivo, 'Pagina attiva', 'Spenta, il link smette di funzionare finché non la riaccendi')+
    '<div class="riga"><div class="tx"><b>Cambia link</b><span>Quello vecchio smette di funzionare; messaggio e impostazioni restano</span></div>'+
      '<button class="btn sm ghost" data-action="cliente-rinnova">'+svg('undo')+'Cambia</button></div>'+
    '</div>'+piede('<button class="btn" data-action="chiudi-modale">Chiudi</button>'));
}
function clienteCrea(tasto){
  if(!cliMod) return;
  const pid = cliMod.pid;
  if(tasto){ tasto.disabled = true; tasto.innerHTML = 'Creo…'; }
  creaLinkCliente(pid).then(l=>{
    if(!cliMod || cliMod.pid !== pid) return;
    cliMod.l = l; cliMod.stato = 'ok'; disegnaModaleCliente();
    const p = state.progetti.find(x=>x.id===pid);
    if(p){ logga(p, 'Creata la pagina del cliente'); render(); }
  }).catch(e=>{
    if(tasto){ tasto.disabled = false; tasto.innerHTML = svg('link')+'Crea la pagina'; }
    toast((e && e.message) || 'Riprova tra poco.','warn','Pagina non creata');
  });
}
function clienteRinnova(tasto){
  if(!cliMod || !cliMod.l) return;
  if(!tasto.dataset.sicuro){
    tasto.dataset.sicuro = '1'; tasto.innerHTML = 'Sicuro? Tocca ancora';
    setTimeout(()=>{ if(tasto.isConnected){ delete tasto.dataset.sicuro; tasto.innerHTML = svg('undo')+'Cambia'; } }, 3500);
    return;
  }
  const pid = cliMod.pid;
  tasto.disabled = true;
  creaLinkCliente(pid).then(l=>{
    if(!cliMod || cliMod.pid !== pid) return;
    cliMod.l = l; disegnaModaleCliente();
    const b = el('clLink'); if(b) flash(b);
  }).catch(e=>{ tasto.disabled = false; toast((e && e.message) || 'Riprova tra poco.','warn','Link non cambiato'); });
}
function clienteCambia(patch){
  if(!cliMod || !cliMod.l) return;
  const l = cliMod.l, prima = Object.assign({}, l);
  Object.assign(l, patch); disegnaModaleCliente();
  salvaLinkCliente(l.token, patch).then(()=>statoCliente('Salvato')).catch(e=>{
    Object.assign(l, prima); disegnaModaleCliente();
    toast((e && e.message) || 'Riprova tra poco.','warn','Non salvato');
  });
}
function statoCliente(t){
  const n = el('statoCliente'); if(!n) return;
  n.textContent = t; n.classList.add('ok-flash');
  clearTimeout(n.__t); n.__t = setTimeout(()=>{ if(n.isConnected){ n.textContent = 'Si salva da sola'; n.classList.remove('ok-flash'); } }, 1800);
}
/* messaggio e link al materiale: si salvano da soli mentre scrivi. Quello che
   scrivi resta nella bozza finche' il database non l'ha preso: se tocchi un
   interruttore o chiudi la finestra non si perde niente. */
function clienteScrive(){
  if(!cliMod || !cliMod.l) return;
  const m = el('cl_msg'), k = el('cl_link');
  cliMod.bozza = cliMod.bozza || {};
  if(m) cliMod.bozza.messaggio = m.value.slice(0, 1000);
  if(k) cliMod.bozza.link = k.value;
  statoCliente('Salvo\u2026');
  clearTimeout(tClienteSalva);
  const questa = cliMod;
  tClienteSalva = setTimeout(()=>salvaBozzaCliente(questa), 700);
}
function linkMateriale(v){
  v = String(v || '').trim();
  if(v && !/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+/.test(v)) v = 'https://' + v;     // «vimeo.com/123» va bene lo stesso
  return (!v || /^https?:\/\/[^\s<>"]+$/i.test(v)) ? v : null;
}
function salvaBozzaCliente(m){
  if(!m || !m.l || !m.bozza) return;
  const l = m.l, b = m.bozza, patch = {};
  let linkStorto = false;
  if(b.messaggio != null && b.messaggio !== (l.messaggio||'')) patch.messaggio = b.messaggio;
  if(b.link != null){
    const v = linkMateriale(b.link);
    if(v == null) linkStorto = true;
    else if(v !== (l.link||'')) patch.link = v;
  }
  if(!Object.keys(patch).length){ if(cliMod === m) statoCliente(linkStorto ? 'Link non valido' : 'Salvato'); return; }
  salvaLinkCliente(l.token, patch).then(()=>{
    Object.assign(l, patch);
    if(patch.messaggio != null && b.messaggio === patch.messaggio) delete b.messaggio;
    if(patch.link != null && linkMateriale(b.link) === patch.link) delete b.link;
    if(cliMod === m) statoCliente(linkStorto ? 'Link non valido' : 'Salvato');
  }).catch(e=>{
    if(cliMod === m) statoCliente('Non salvato');
    toast((e && e.message) || 'Riprova tra poco.','warn','Pagina del cliente non salvata');
  });
}
function clienteManda(){
  if(!cliMod || !cliMod.l || !navigator.share) return;
  const p = state.progetti.find(x=>x.id===cliMod.pid);
  const url = indirizzoCliente(cliMod.l.token);
  navigator.share({title:p ? p.nome : 'FOSS', text:'Qui vedi a che punto è «'+(p?p.nome:'il lavoro')+'» e puoi darmi un riscontro:', url}).catch(()=>{});
}

/* ============ PAGINA DEL CLIENTE: quella che vede lui ============ */
function dataCliente(iso, ora){
  const d = new Date(String(iso)+'T12:00:00');
  if(isNaN(d)) return esc(iso||'');
  return esc(d.toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'long'})) + (ora ? ' · '+esc(ora) : '');
}
function quandoCliente(ts){
  const d = new Date(ts); if(isNaN(d)) return '';
  const oggi = new Date(), ieri = new Date(); ieri.setDate(oggi.getDate()-1);
  const hm = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(d.toDateString()===oggi.toDateString()) return 'oggi '+hm;
  if(d.toDateString()===ieri.toDateString()) return 'ieri '+hm;
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'})+' '+hm;
}
function iniDi(nome){ return esc(String(nome||'?').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase() || '?'); }

function riduciImmagine(file, maxLato, qualita){
  return new Promise((ok, ko)=>{
    const r = new FileReader();
    r.onerror = ko;
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ko;
      img.onload = ()=>{
        const sc = Math.min(1, maxLato/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', qualita));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function leggiIndirizzo(){
  const h = location.hash || '';
  const g = /^#\/guida(?:\/([a-z-]+))?/.exec(h);
  if(g){
    const gn = /[?&]n=([^&]+)/.exec(h);
    let gid = null; try{ gid = gn ? decodeURIComponent(gn[1]) : null; }catch(e){ gid = null; }
    return {guida:true, cap:g[1] || null, nid:gid};
  }
  const sp = /^#\/s\/([^\/?]+)/.exec(h);
  if(sp) return {spid:sp[1], ospite:/[?&]v=1/.test(h)};
  const m = /^#\/p\/([^\/?]+)(?:\/t\/([^?]+))?/.exec(h);
  if(!m) return null;
  const nn = /[?&]n=([^&]+)/.exec(h);
  let nid = null; try{ nid = nn ? decodeURIComponent(nn[1]) : null; }catch(e){ nid = null; }
  return {pid:m[1], sid:m[2]||null, ospite:/[?&]v=1/.test(h), nid};
}
function applicaIndirizzo(){
  const a = leggiIndirizzo(); if(!a) return false;
  if(a.guida){
    /* la guida (anche da un avviso: una segnalazione arrivata). Tolgo il
       segno dall'indirizzo, cosi' ricaricando non ci torno */
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    if(a.nid){
      if(typeof segnaLetteCloud === 'function') segnaLetteCloud([a.nid]);
      const n = state.notifiche.find(x=>x.db===a.nid); if(n) n.nuova = false;
    }
    state.ospite = false;
    apriGuida(a.cap && (a.cap === 'segnalazioni' || GUIDA.some(c=>c.id===a.cap)) ? a.cap : null);
    return true;
  }
  if(a.spid){
    const sp = state.spazi.find(x=>x.id===a.spid);
    if(!sp){ toast('Il link punta a uno spazio che non è in questo archivio.','warn','Non trovato'); return false; }
    state.ospite = !!a.ospite;
    state.spazioId = sp.id; state.schermo = 'home'; state.progettoId = null;
    state.filtro = ''; state.filtroAttivo = null;
    render(); return true;
  }
  if(a.nid){
    /* arrivo dal tocco su un avviso del telefono: tolgo il segno dall'indirizzo
       (se ricarico non la riapro) e faccio come se l'avessi toccata qui */
    try{ history.replaceState(null, '', location.pathname + location.search + '#/p/' + a.pid); }catch(e){}
    state.ospite = false;
    const n = state.notifiche.find(x=>x.db===a.nid);
    if(n && state.progetti.some(x=>x.id===n.p)){ apriNotifica(n); return true; }
    if(typeof segnaLetteCloud === 'function') segnaLetteCloud([a.nid]);
    if(n) n.nuova = false;
  }
  const p = state.progetti.find(x=>x.id===a.pid);
  if(!p){ toast('Il link punta a un progetto che non è in questo archivio.','warn','Non trovato'); return false; }
  state.ospite = !!a.ospite;
  if(p.spazio) state.spazioId = p.spazio;
  state.progettoId = p.id; state.schermo = 'progetto';
  if(a.sid){
    const s = p.subs.find(x=>x.id===a.sid);
    if(s){ p.fase = Math.min(s.fase, p.avanz); s.aperto = true; state.taskEvidenziata = s.id; }
  }
  render(); introProgetto();
  if(state.taskEvidenziata) setTimeout(()=>flash('#sub_'+state.taskEvidenziata), 200);
  return true;
}

/* trascinamento e ridimensionamento dei post-it */
let notaTrascinata = null, notaRidim = null;
const NOTA_W = 186, NOTA_H = 150;   /* il massimo è il doppio, non di più */
document.addEventListener('pointerdown', function(e){
  const g = e.target.closest && e.target.closest('.grip');
  if(g && !state.ospite){
    const box = g.closest('.postit');
    const n = (SPZ().note||[]).find(x=>x.id===g.dataset.grip);
    if(n){
      notaRidim = {n, box, x0:e.clientX, y0:e.clientY, w0:box.offsetWidth, h0:box.offsetHeight};
      staTrascinando = true;
      box.classList.add('trascino');
      g.setPointerCapture && g.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    return;
  }
  const pit = e.target.closest && e.target.closest('.postit');
  if(!pit || state.ospite) return;
  if(e.target.closest('textarea') || e.target.closest('.via')) return;
  const rr = pit.getBoundingClientRect();          // angolo in basso a destra: lo lascio al ridimensionamento
  if(e.clientX > rr.right-20 && e.clientY > rr.bottom-20) return;
  const sp = SPZ(); const n = (sp.note||[]).find(x=>x.id===pit.dataset.nota); if(!n) return;
  notaTrascinata = {n, pit, dx:e.clientX - pit.offsetLeft, dy:e.clientY - pit.offsetTop};
  staTrascinando = true;
  pit.classList.add('trascino');
  pit.setPointerCapture && pit.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', function(e){
  if(notaRidim){
    const w = Math.max(NOTA_W, Math.min(NOTA_W*2, notaRidim.w0 + (e.clientX - notaRidim.x0)));
    const hh = Math.max(NOTA_H, Math.min(NOTA_H*2, notaRidim.h0 + (e.clientY - notaRidim.y0)));
    notaRidim.box.style.width = w+'px';
    notaRidim.box.style.height = hh+'px';
    notaRidim.ultimo = {w, hh};
    return;
  }
  if(!notaTrascinata) return;
  const b = el('bacheca'); if(!b) return;
  const r = b.getBoundingClientRect(), w = notaTrascinata.pit.offsetWidth, hh = notaTrascinata.pit.offsetHeight;
  let x = e.clientX - notaTrascinata.dx, y = e.clientY - notaTrascinata.dy;
  x = Math.max(0, Math.min(r.width - w, x));
  y = Math.max(0, Math.min(Math.max(0, r.height - hh), y));
  notaTrascinata.pit.style.left = x+'px';
  notaTrascinata.pit.style.top  = y+'px';
  notaTrascinata.ultimo = {x, y};
});
document.addEventListener('pointerup', function(){
  if(notaRidim){
    const {n, box, ultimo} = notaRidim;
    box.classList.remove('trascino');
    if(ultimo){ n.w = Math.round(ultimo.w); n.h = Math.round(ultimo.hh); save(); }
    notaRidim = null;
    return;
  }
  if(!notaTrascinata) return;
  const {n, pit, ultimo} = notaTrascinata;
  pit.classList.remove('trascino');
  if(ultimo){ n.x = Math.round(ultimo.x); n.y = Math.round(ultimo.y); }
  n.w = Math.round(pit.offsetWidth); n.h = Math.round(pit.offsetHeight);
  save();
  notaTrascinata = null;
});

/* ---------- DALL'INDIRIZZO AL PUNTO SULLA MAPPA ----------
   Chiedo le coordinate una volta sola e me le tengo nel progetto: dalla
   seconda volta la mappa si disegna senza chiedere niente a nessuno. */
function daGeocodificare(){
  return state.progetti.filter(p => p.indirizzo && p.indirizzo.trim() && !p.coord && !p.senzaCoord);
}
let geoInCorso = false;
function avviaGeocodifica(){
  if(geoInCorso || !window.fetch) return;
  const da = daGeocodificare(); if(!da.length) return;
  geoInCorso = true;
  const passo = (k)=>{
    if(k >= da.length){ geoInCorso = false; save(); if(state.vista==='mappa') render(); return; }
    const p = da[k];
    const q = /milan|\(mi\)|italia/i.test(p.indirizzo) ? p.indirizzo : p.indirizzo+', Milano, Italia';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))
      .then(r=>r.json())
      .then(d=>{
        if(d && d[0]) p.coord = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
        else p.senzaCoord = true;
      })
      .catch(()=>{ p.senzaCoord = true; })
      .then(()=>{ setTimeout(()=>passo(k+1), 1100); });   // una richiesta al secondo: sono le loro regole
  };
  passo(0);
}

/* lo schema di riserva, quando la mappa vera non è disponibile */
function mappaSchema(L){
  const W = 1000, H = 640;
  const px = (c)=>({ x:(c[1]-9.19)*1000/0.30*1 + W/2, y:H/2 - (c[0]-45.4642)*640/0.16 });
  let h = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+
    '<rect width="'+W+'" height="'+H+'" fill="var(--surface-2)"/>'+
    '<ellipse cx="500" cy="330" rx="330" ry="250" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>'+
    '<ellipse cx="500" cy="330" rx="150" ry="115" fill="none" stroke="var(--line)" stroke-width="2"/>'+
    '<text x="500" y="334" text-anchor="middle" font-family="Sora" font-size="13" font-weight="700" fill="var(--mute)">DUOMO</text>';
  L.forEach((l,i)=>{
    const q = px(l.coord);
    const x = Math.max(24, Math.min(W-24, q.x)), y = Math.max(24, Math.min(H-24, q.y));
    h += '<g class="pin" style="--acc:'+l.p.col+'" data-action="'+(l.s?'vai-task':'apri')+'" data-id="'+l.p.id+'"'+
         (l.s?' data-sid="'+l.s.id+'"':'')+'>'+
      '<title>'+esc(l.nome+' — '+(l.sotto||''))+'</title>'+
      '<circle class="alone" cx="'+x+'" cy="'+y+'" r="26"/>'+
      '<path class="corpo" d="M'+x+' '+(y+16)+' c-9-11-14-17-14-24 a14 14 0 1 1 28 0 c0 7-5 13-14 24 z"/>'+
      '<text x="'+x+'" y="'+(y-3)+'" text-anchor="middle">'+(i+1)+'</text></g>';
  });
  return h+'</svg>';
}

let registroChi = '';
function quandoBreve(v){
  if(!v.t) return v.ts || '';
  const d = new Date(v.t), oggi = new Date();
  const ora = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  if(d.toDateString()===oggi.toDateString()) return 'oggi '+ora;
  const ieri = new Date(oggi); ieri.setDate(oggi.getDate()-1);
  if(d.toDateString()===ieri.toDateString()) return 'ieri '+ora;
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' '+ora;
}

/* ---------- TENERE PREMUTO ----------
   Col mouse c'e' il tasto destro. Col dito no, quindi tenere premuto
   fa la stessa cosa: si alza la scheda e, se si lascia, esce il menu;
   se invece si muove il dito, la scheda si trascina. Come le icone
   del telefono. */
const ZONE_MENU = '.tile,.spazio,.postit,.bacheca,.ev,.day,.chk,.sub,.rg,.luogo,.mie-r,.mie-h,.step,.proj-head,.rail-sec,.cm-msg';
const ZONE_SPOSTA = '.tile,.spazio,.rg';
const ATTESA_PRESA = 520;

let presa = null;        // {el, x, y, spostabile, armato, trascina, sc, top}
let timerPresa = null;
let scorrimentoAuto = null;

/* Il contenitore che scorre sotto la scheda: durante lo spostamento lo
   blocco, sennò la pagina scappa mentre trascino. Torna a scorrere solo
   quando porto la scheda al bordo. */
function contenitore(el){
  let n = el.parentElement;
  while(n && n !== document.body){
    const o = getComputedStyle(n).overflowY;
    if((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
    n = n.parentElement;
  }
  return null;
}
function bloccaPagina(){
  if(!presa) return;
  const sc = contenitore(presa.el);
  if(!sc) return;
  presa.sc = sc; presa.top = sc.scrollTop;
  /* il fondo vero della pagina, preso adesso: la scheda spostata allunga
     l'area scorribile e senza questo limite si scenderebbe nel vuoto */
  presa.maxTop = sc.scrollHeight - sc.clientHeight;
  sc.classList.add('fermo');
}
function sbloccaPagina(){
  if(presa && presa.sc){
    const t = presa.sc.scrollTop;
    presa.sc.classList.remove('fermo');
    presa.sc.scrollTop = t;
  }
  clearInterval(scorrimentoAuto); scorrimentoAuto = null;
}
/* al bordo la pagina riprende a scorrere, piano, finché resto lì */
function bordo(y){
  if(!presa || !presa.sc) return;
  const r = presa.sc.getBoundingClientRect(), M = 96;
  /* piu' il dito entra nella fascia del bordo, piu' la pagina corre */
  let v = 0;
  /* scorre solo verso dove sto portando la scheda: se la prendo vicino al
     fondo e la tiro su, la pagina non deve scendere */
  if(y < r.top + M && y < presa.yDito)          v = -Math.min(26, 5 + Math.round((r.top + M - y) / 3));
  else if(y > r.bottom - M && y > presa.yDito)  v =  Math.min(26, 5 + Math.round((y - (r.bottom - M)) / 3));
  clearInterval(scorrimentoAuto); scorrimentoAuto = null;
  if(!v) return;
  scorrimentoAuto = setInterval(()=>{
    if(!presa || !presa.sc || !presa.trascina){ clearInterval(scorrimentoAuto); scorrimentoAuto = null; return; }
    const sc = presa.sc, prima = sc.scrollTop;
    sc.classList.remove('fermo');
    sc.scrollTop = Math.max(0, Math.min(presa.maxTop != null ? presa.maxTop : 1e9, prima + v));
    sc.classList.add('fermo');
    const d = sc.scrollTop - prima;
    if(!d){ clearInterval(scorrimentoAuto); scorrimentoAuto = null; return; }   // arrivato in cima o in fondo
    /* il contenuto e' salito o sceso di d: sposto il riferimento della
       scheda di altrettanto, cosi' resta ferma sotto il dito */
    presa.y0 -= d;
    aggiornaPresa();
  }, 16);
}

function vibra(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||12); }catch(e){} }

function fermaPresa(){
  clearTimeout(timerPresa); timerPresa = null;
  sbloccaPagina();
  document.querySelectorAll('.fermo').forEach(n=>n.classList.remove('fermo'));
  if(presa && presa.el){ presa.el.classList.remove('preso'); presa.el.style.transform = ''; }
  document.querySelectorAll('.preso,.buco').forEach(n=>n.classList.remove('preso','buco'));
  document.body.classList.remove('sto-spostando');
  presa = null;
}

/* Le tre fasi della presa, uguali per il dito e per il mouse. */
function iniziaPresa(target, x, y, tipo){
  if(target.closest('input,textarea,select,[contenteditable="true"],.ctx,.modale,.wz')) return;
  const spost = target.closest(ZONE_SPOSTA);
  const menu  = target.closest(ZONE_MENU);
  const z = spost || menu;
  if(!z) return;
  /* col mouse il menu c'e' gia' col tasto destro: la pressione serve
     solo per spostare le schede */
  if(tipo === 'mouse' && !spost) return;
  presa = {el:z, src:target, x0:x, y0:y, x, y, yDito:y, spostabile:!!spost, armato:false, trascina:false, tipo};
  clearTimeout(timerPresa);
  timerPresa = setTimeout(()=>{
    if(!presa) return;
    presa.armato = true;
    presa.el.classList.add('preso');
    clearTimeout(tenuta && tenuta.t); if(typeof fermaTenuta==='function') fermaTenuta();
    vibra();
  }, ATTESA_PRESA);
}

/* torna true se la presa si e' presa il gesto (e quindi va fermato lo scorrimento) */
function muoviPresa(x, y){
  if(!presa) return false;
  const dx = x - presa.x0, dy = y - presa.y0;
  const mosso = Math.abs(dx) > 8 || Math.abs(dy) > 8;
  if(!presa.armato){ if(mosso) fermaPresa(); return false; }
  if(!presa.spostabile) return true;          // tenuto su una task: niente scorrimento finche' non lascio
  if(!presa.trascina && mosso){
    presa.trascina = true;
    document.body.classList.add('sto-spostando');
    bloccaPagina();
  }
  if(presa.trascina){
    presa.x = x; presa.y = y;
    aggiornaPresa();
    bordo(y);
  }
  return true;
}
/* la scheda segue il dito, e se passa sopra un'altra si scambiano di posto */
function aggiornaPresa(){
  if(!presa || !presa.trascina) return;
  const x = presa.x, y = presa.y;
  presa.el.style.transform = 'translate('+(x - presa.x0)+'px,'+(y - presa.y0)+'px) scale(1.03)';
  const sotto = vicinoA(x, y, presa.el);
  if(sotto) scambia(presa.el, sotto, x, y);
}

function rilasciaPresa(x, y){
  if(!presa) return false;
  const p = presa;
  if(p.armato && p.trascina){
    p.el.style.transform = '';
    fermaPresa();              // prima sblocco la pagina: cosi' il ridisegno la lascia dov'e'
    salvaOrdine(p.el);
    appenaTenuto = true; setTimeout(()=>{ appenaTenuto = false; }, 500);
    return true;
  }
  if(p.armato && !p.trascina){
    /* tenuto fermo e lasciato: esce il menu, come col tasto destro */
    fermaPresa();
    appenaTenuto = true; setTimeout(()=>{ appenaTenuto = false; }, 500);
    const da = (p.src && p.src.isConnected && p.el.contains(p.src)) ? p.src : p.el;     // cosi' il menu sa quale campo ho premuto
    da.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, cancelable:true, clientX:x, clientY:y}));
    return true;
  }
  fermaPresa();
  return false;
}

/* ---------- IL DITO ----------
   Uso gli eventi del tocco, non i pointer: sono gli unici che lasciano
   fermare lo scorrimento del telefono. Finche' la scheda non si e'
   alzata la pagina scorre normale; da quando si alza, il gesto e' mio. */
document.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1){ fermaPresa(); return; }
  const t = e.touches[0];
  iniziaPresa(e.target, t.clientX, t.clientY, 'touch');
}, {passive:true, capture:true});

document.addEventListener('touchmove', function(e){
  if(!presa) return;
  const t = e.touches[0];
  const mio = muoviPresa(t.clientX, t.clientY);
  if(mio && e.cancelable) e.preventDefault();       // qui la pagina smette di scorrere
}, {passive:false, capture:true});

document.addEventListener('touchend', function(e){
  if(!presa) return;
  const t = e.changedTouches[0];
  if(rilasciaPresa(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
}, {passive:false, capture:true});

document.addEventListener('touchcancel', function(){ fermaPresa(); }, true);

/* ---------- IL MOUSE ---------- */
document.addEventListener('pointerdown', function(e){
  if(e.pointerType !== 'mouse') return;
  if(e.button && e.button!==0) return;
  iniziaPresa(e.target, e.clientX, e.clientY, 'mouse');
}, true);
document.addEventListener('pointermove', function(e){
  if(!presa || presa.tipo !== 'mouse') return;
  if(muoviPresa(e.clientX, e.clientY)) e.preventDefault();
}, {passive:false});
document.addEventListener('pointerup', function(e){
  if(!presa || presa.tipo !== 'mouse') return;
  if(rilasciaPresa(e.clientX, e.clientY)) e.preventDefault();
});

window.addEventListener('wheel', function(){ if(presa && !presa.trascina) fermaPresa(); }, {passive:true});

/* la scheda piu' vicina al dito, tra quelle sorelle */
function vicinoA(x, y, el){
  const fratelli = [...el.parentElement.children].filter(n=>n!==el && n.matches(ZONE_SPOSTA));
  let migliore = null, dist = 1e9;
  fratelli.forEach(n=>{
    const r = n.getBoundingClientRect();
    if(x < r.left-8 || x > r.right+8 || y < r.top-8 || y > r.bottom+8) return;
    const d = Math.hypot(x-(r.left+r.width/2), y-(r.top+r.height/2));
    if(d < dist){ dist = d; migliore = n; }
  });
  return migliore;
}
/* scambio di posto nel DOM, poi riaggancio la scheda al dito da dove e' finita */
function scambia(el, sotto, x, y){
  const genitore = el.parentElement;
  const figli = [...genitore.children];
  const i = figli.indexOf(el), j = figli.indexOf(sotto);
  el.style.transform = '';
  if(i < j) genitore.insertBefore(el, sotto.nextSibling);
  else genitore.insertBefore(el, sotto);
  /* la casella nuova diventa il punto di partenza: la scheda resta
     sotto il dito senza saltare */
  const r = el.getBoundingClientRect();
  presa.x0 = r.left + r.width/2; presa.y0 = r.top + r.height/2;
  el.style.transform = 'translate('+(x - presa.x0)+'px,'+(y - presa.y0)+'px) scale(1.03)';
}

/* l'ordine nuovo lo scrivo nei dati, sennò al prossimo disegno torna com'era */
function salvaOrdine(el){
  const genitore = el.parentElement;
  const ids = [...genitore.children].filter(n=>n.matches(ZONE_SPOSTA)).map(n=>n.dataset.id);
  if(el.matches('.spazio')){
    snap('Ordine degli spazi');
    const mappa = {}; state.spazi.forEach(sp=>mappa[sp.id]=sp);
    const nuovi = ids.map(id=>mappa[id]).filter(Boolean);
    state.spazi.forEach(sp=>{ if(nuovi.indexOf(sp)<0) nuovi.push(sp); });
    state.spazi = nuovi;
    azione('Spazi rimessi in ordine');
    toast('Spostato. L\'ordine resta questo.','ok','Ordine cambiato');
  } else {
    snap('Ordine dei progetti');
    /* numero tutte le schede come le vedo adesso, non solo il gruppo
       toccato: cosi' passando a «il mio ordine» gli altri gruppi restano
       dove erano */
    const tutti = [...document.querySelectorAll(el.matches('.rg')? '.rg[data-id]' : '.tile[data-id]')].map(n=>n.dataset.id);
    (tutti.length? tutti : ids).forEach((id,i)=>{ const pr = state.progetti.find(z=>z.id===id); if(pr) pr.ord = i; });
    state.ordina = 'manuale';
    azione('Progetti rimessi in ordine');
    toast('Spostato. L\'ordine ora \u00e8 il tuo.','ok','Ordine cambiato');
  }
  render();
}

/* ============ NOTIFICHE ============ */
/* Quelle degli altri arrivano dal database (una riga per chi le riceve);
   quelle delle mie azioni restano qui, come promemoria, e non accendono niente. */
const IC_NOTIFICA = {assegnata:'user', taggato:'users', menzione:'tag', commento:'chat', chat:'chat', fase:'spark',
  consegnato:'check', aperto:'users', cliente:'review', segnalazione:'bandiera'};
const NOTIFICA_FORTE = {assegnata:1, taggato:1, menzione:1, aperto:1, cliente:1};
function testoNotifica(tipo, d){
  d = d || {};
  const chi = '<b>'+esc(d.chi || 'Qualcuno')+'</b>', pr = d.progetto ? ' \u00b7 '+esc(d.progetto) : '';
  const n = +d.n || 1, cit = x => '\u00ab'+esc(x || '')+'\u00bb';
  switch(tipo){
    case 'assegnata': return n>1 ? chi+' ti ha assegnato '+n+' cose'+pr
                                 : chi+' ti ha assegnato '+cit(d.titolo)+(d.in? ' in '+cit(d.in) : '')+pr;
    case 'taggato':   return chi+' ti ha aggiunto a '+cit(d.titolo)+pr;
    case 'menzione':  return chi+' ti ha menzionato'+(d.titolo? ' su '+cit(d.titolo) : '')+': '+cit(d.testo)+pr;
    case 'commento':  return (n>1 ? n+' commenti nuovi, l\u2019ultimo di '+chi : chi+' ha commentato')+(d.titolo? ' '+cit(d.titolo) : '')+': '+cit(d.testo)+pr;
    case 'chat':      return (n>1 ? n+' messaggi in chat, l\u2019ultimo di '+chi : chi+' in chat')+': '+cit(d.testo)+pr;
    case 'fase':      return '<b>'+esc(d.progetto || 'Un lavoro')+'</b> \u00e8 passato a '+(d.fase_nome? cit(d.fase_nome) : 'la fase successiva');
    case 'consegnato':return '<b>'+esc(d.progetto || 'Un lavoro')+'</b> \u00e8 stato consegnato';
    case 'aperto':    return chi+' ti ha aperto il lavoro <b>'+esc(d.progetto || '')+'</b>';
    case 'cliente':   return '<b>'+esc(d.nome || 'Il cliente')+'</b> '+(d.esito==='ok'
                        ? 'ha approvato'+(d.fase_nome? ' '+cit(d.fase_nome) : '')
                        : 'chiede delle modifiche'+(d.testo? ': '+cit(d.testo) : ''))+pr;
    case 'segnalazione': return chi+' ha mandato una segnalazione ('+esc(((TIPI_SEGN[d.esito]||{}).corto || 'nuova').toLowerCase())+'): '+cit(d.testo);
  }
  return chi+pr;
}
function titoloNotifica(tipo, d){
  if(tipo==='cliente') return (d && d.esito==='ok') ? 'Il cliente ha approvato' : 'Il cliente chiede modifiche';
  if(tipo==='segnalazione') return 'Nuova segnalazione';
  return {assegnata:'Ti hanno assegnato una cosa', taggato:'Ti hanno aggiunto a una task', menzione:'Ti hanno menzionato',
          aperto:'Hai un lavoro nuovo'}[tipo] || 'Nuova notifica';
}
function notificaDaRiga(r){
  const d = r.dati || {}, t = Date.parse(r.aggiornata_il || r.creata_il) || Date.now();
  return {id:'db:'+r.id, db:r.id, tipo:r.tipo, p:r.progetto_id, f:(d.fase==null || d.fase==='' ? null : +d.fase), t,
          ts:quandoBreve({t}), nuova:!r.letta, ic:IC_NOTIFICA[r.tipo] || 'bell', tx:testoNotifica(r.tipo, d), dati:d};
}
/* le notifiche del database e le mie azioni, in ordine di tempo */
function unisciNotifiche(dalDb, locali){
  const tempo = n => n.t || (/^n(\d{10,})/.test(n.id||'') ? +String(n.id).slice(1) : 0);
  return dalDb.concat((locali||[]).filter(n=>!n.db)).sort((a,b)=>tempo(b)-tempo(a)).slice(0, 150);
}
/* una notifica arrivata adesso (o aggiornata: commenti ravvicinati si sommano) */
function arrivaNotifica(r, appenaNata){
  if(!r || r.tipo === 'prova') return;           // l'avviso di prova vive solo sul telefono
  if(r.tipo === 'segnalazione' && appenaNata && Array.isArray(segnRicevute)) caricaSegnalazioni();
  const n = notificaDaRiga(r);
  const i = state.notifiche.findIndex(x=>x.db===r.id);
  if(i >= 0) state.notifiche.splice(i, 1);
  state.notifiche.unshift(n);
  renderTop();
  const b = el('bellBtn') && el('bellBtn').querySelector('.bell-dot');
  if(b && n.nuova){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  if(state.drawer) renderDrawer();
  if(appenaNata && n.nuova && NOTIFICA_FORTE[r.tipo] && state.cfg.boxFull && Date.now() >= (state.snoozeFino||0)
     && document.visibilityState === 'visible' && !alertCorrente && state.schermo !== 'gate'){
    const pr = state.progetti.find(x=>x.id===r.progetto_id);
    alertGrande({ic:n.ic, tit:esc(titoloNotifica(r.tipo, n.dati)), tx:n.tx, n,
                 prog: pr ? (pr.cliente? pr.cliente+' \u00b7 ' : '')+pr.nome : (n.dati.progetto||'')});
  }
}
/* tocco su una notifica (nella campanella o sul telefono): segno letta e
   porto dove e' successo: la task, la fase, i commenti o la chat */
function apriNotifica(n){
  n.nuova = false; state.drawer = false;
  if(n.db && typeof segnaLetteCloud === 'function') segnaLetteCloud([n.db]);
  if(n.tipo === 'segnalazione'){ apriGuida('segnalazioni'); return true; }    // non sta in un lavoro: va nella guida
  const pr = state.progetti.find(x=>x.id===n.p);
  if(!pr){ render(); return false; }
  const d = n.dati || {};
  const s2 = d.task ? pr.subs.find(x=>x.id===d.task) : null;
  const f = s2 ? s2.fase : n.f;
  if(f!=null){ pr.fase = Math.min(f, pr.avanz); pr.revisione = pr.fase<pr.avanz; }
  if(s2) s2.aperto = true;
  apriProgetto(pr.id, false);
  /* un commento dentro una task: apro la sua discussione */
  if((n.tipo==='commento' || (n.tipo==='menzione' && d.dove!=='chat')) && d.task && pr.subs.some(x=>x.id===d.task)){
    apriCommenti(pr.id, d.task, d.voce || null);
    return true;
  }
  /* chat, risposte del cliente e vecchi commenti: apro la chat del lavoro */
  if(['commento','chat','menzione','cliente'].indexOf(n.tipo) >= 0){
    pr.tab = 'chat';
    state.showFeed = true; render();
  }
  if(s2) setTimeout(()=>{ flash('#sub_'+s2.id); const x = el('sub_'+s2.id); if(x) x.scrollIntoView({block:'center', behavior:'smooth'}); }, 120);
  else flash('#step'+pr.fase);
  return true;
}
function renderDrawer(){
  const l = el('nlist');
  if(!state.notifiche.length){ l.innerHTML = '<div class="empty">Nessuna notifica.</div>'; return; }
  l.innerHTML = state.notifiche.map(n=>
    '<button class="nitem'+(n.nuova?' new':'')+'" data-action="vai-notifica" data-id="'+n.id+'">'+
    '<span class="ic">'+svg(I[n.ic]?n.ic:'spark')+'</span>'+
    '<span><span class="tx">'+sicuro(n.tx)+'</span><span class="mt">'+esc(n.ts||'')+'</span></span></button>').join('');
}

/* ============ APERTURA PROGETTO ============ */
function apriProgetto(id, conDissolvenza){
  const p = state.progetti.find(x=>x.id===id); if(!p) return;
  if(p.spazio && p.spazio!==state.spazioId) state.spazioId = p.spazio;   // segue il progetto nel suo spazio
  const vai = ()=>{
    state.progettoId = p.id; state.schermo='progetto'; state.showFeed=false; state.railOn=false; state.drawer=false;
    render(); introProgetto();
  };
  if(!conDissolvenza){ vai(); return; }
  const l = el('fadeLayer');
  l.innerHTML = '<div class="fade-in"><div class="mark"></div>'+
    '<div class="cli">'+esc(p.cliente)+'</div><h2>'+esc(p.nome)+'</h2>'+
    '<div class="bar"><i></i></div>'+
    '<div class="st">Preparo l\'interfaccia del progetto…</div></div>';
  l.classList.add('on');
  setTimeout(()=>{ vai(); setTimeout(()=>{ l.classList.remove('on'); setTimeout(()=>l.innerHTML='',400); }, 120); }, 900);
}

function introProgetto(){
  const p = PROJ(); if(!p) return;
  const c = document.querySelector('.ring .fg'), n = document.querySelector('.ring-n');
  if(c){
    const fin = c.getAttribute('stroke-dasharray'), C = fin.split(' ')[1];
    c.style.transition = 'none'; c.setAttribute('stroke-dasharray','0 '+C);
    requestAnimationFrame(()=>{ c.style.transition=''; c.setAttribute('stroke-dasharray',fin); });
  }
  if(n){
    const target = prog(p,p.fase); let t0 = null;
    n.textContent = '0%';
    const step = ts => { if(!t0) t0 = ts;
      const k = Math.min(1,(ts-t0)/950);
      n.textContent = Math.round(target*(1-Math.pow(1-k,3)))+'%';
      if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const st = el('step'+p.fase);
  if(st){ st.classList.remove('pulse-once'); void st.offsetWidth; st.classList.add('pulse-once');
    setTimeout(()=>st.classList.remove('pulse-once'), 1500); }
}

/* usata dagli eventi reali quando il team sarà collegato al database */
function scattaEvento(manuale){
  if(state.schermo==='gate') return;
  const e = EVENTI_RT[rtIdx++ % EVENTI_RT.length];
  const pr = state.progetti.find(x=>x.id===e.p);
  if(pr && state.cfg.soloMiei && !pr.team.includes(state.utente) && !manuale) return;

  /* l'evento lascia un segno vero nel progetto: i pallini rossi crescono */
  if(pr){
    const ts = 'oggi '+oraOra();
    if(e.dove==='commenti'){ (pr.commenti[e.f] = pr.commenti[e.f]||[]).push({u:e.u, tx:e.msg, ts}); }
    else if(e.dove==='chat'){ pr.chat.push({u:e.u, tx:e.msg, ts}); }
    else { logga(pr, e.msg, true, true); }
  }
  notifica('<b>'+e.tit+'</b> — '+e.tx, e.p, e.f, e.ic, true);
  if(state.schermo==='progetto') render();

  if(!state.cfg.boxFull){ toast(e.tit,'info','Nuova notifica'); return; }
  if(Date.now() < state.snoozeFino){
    const min = Math.ceil((state.snoozeFino-Date.now())/60000);
    toast(e.tit+' — box riattivi tra '+min+' min.','info','Notifica silenziata');
    return;
  }
  alertGrande(Object.assign({prog: pr? pr.cliente+' · '+pr.nome : ''}, e));
}

/* ============ ANIMAZIONE DELLE TESSERE ============ */
/* prendo le posizioni prima, ridisegno, e le riporto indietro per farle scivolare al posto nuovo */
function animaTessere(cambia){
  const ridotto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(ridotto || state.vista!=='tessere'){ cambia(); return; }
  const prima = {};
  document.querySelectorAll('.tile[data-id]').forEach(n=>{ prima[n.dataset.id] = n.getBoundingClientRect(); });
  cambia();
  const nuove = document.querySelectorAll('.tile[data-id]');
  if(!nuove.length) return;
  requestAnimationFrame(()=>{
    nuove.forEach((n,i)=>{
      const p0 = prima[n.dataset.id];
      if(p0){
        const p1 = n.getBoundingClientRect();
        const dx = p0.left - p1.left, dy = p0.top - p1.top;
        if(Math.abs(dx)>1 || Math.abs(dy)>1){
          n.style.transition = 'none';
          n.style.transform = 'translate('+dx+'px,'+dy+'px)';
          requestAnimationFrame(()=>{
            n.style.transition = 'transform .46s cubic-bezier(.2,.85,.25,1)';
            n.style.transform = '';
            setTimeout(()=>{ n.style.transition=''; }, 500);
          });
        }
      } else {
        n.style.animation = 'entraTessera .42s cubic-bezier(.2,.9,.3,1) backwards';
        n.style.animationDelay = Math.min(i*26, 260)+'ms';
        setTimeout(()=>{ n.style.animation=''; n.style.animationDelay=''; }, 800);
      }
    });
  });
}

   e alzo di altrettanto il resto dell'app, così la barra sotto non gonfia. */
/* Barra in alto su iPad e finestre strette: le viste stanno al centro
   finche' c'e' posto; se toccano ricerca o nome dello spazio passano in fila,
   poi perdono le scritte (restano le icone), poi la ricerca si nasconde. */
function adattaBarra(){
  const tb = document.querySelector('.topbar'), vs = el('viewswitch');
  if(!tb) return;
  tb.classList.remove('stretta','senza-etichette','senza-ricerca','senza-tema');
  if(suTelefono() || !vs || vs.hidden) return;
  const r = vs.getBoundingClientRect();
  const vicini = [...tb.children].filter(n=>n!==vs && !n.classList.contains('spacer') && n.offsetParent!==null);
  const tocca = vicini.some(n=>{ const b = n.getBoundingClientRect(); return b.width && b.right > r.left - 10 && b.left < r.right + 10; });
  const cr = el('crumb'), ce = el('searchWrap');
  const troppo = () => tb.scrollWidth > tb.clientWidth + 1 ||
    vicini.some(n=>n.getBoundingClientRect().right > tb.getBoundingClientRect().right + 1) ||
    (cr && cr.offsetParent && cr.scrollWidth > cr.clientWidth + 1) ||         // il nome dello spazio non si legge
    (ce && ce.offsetParent && ce.getBoundingClientRect().width < 150);
  /* anche senza toccarsi la fila puo' essere troppo lunga (iPad in verticale,
     finestre affiancate): il nome dello spazio si schiaccia e l'ultimo tasto esce */
  if(!tocca && !troppo()) return;
  tb.classList.add('stretta');
  if(troppo()) tb.classList.add('senza-etichette');
  if(troppo()) tb.classList.add('senza-tema');          // il tema si cambia anche dal profilo
  if(troppo()) tb.classList.add('senza-ricerca');
}
function misuraNav(){
  adattaBarra();
  if(!suTelefono()){ document.documentElement.style.setProperty('--nav-h','0px'); return; }
  const tb = el('tabbar'), vs = el('viewswitch');
  const n = (tb && !tb.hidden) ? tb : ((vs && !vs.hidden) ? vs : null);
  document.documentElement.style.setProperty('--nav-h', (n? n.offsetHeight : 0)+'px');
}
let timerNav = null;
window.addEventListener('resize', ()=>{
  if(state.schermo === 'cliente') return;          // la pagina del cliente non ha l'app sotto
  clearTimeout(timerNav);

/* ---------- NON PERDERE IL SEGNO ----------
   render() ridisegna la pagina da capo, e senza questo ogni spunta
   riportava in cima: si perdeva il punto in cui si stava leggendo. */
const SCORRIBILI = '.scroller,.work,.subs,.feed,.mappa-lista,.reg,.nlist';
function segnaScorrimento(){
  const o = {};
  document.querySelectorAll(SCORRIBILI).forEach((n,i)=>{
    if(n.scrollTop > 0) o[i+'|'+n.className] = n.scrollTop;
  });
  return o;
}
function rimettiScorrimento(o){
  if(!o) return;
  document.querySelectorAll(SCORRIBILI).forEach((n,i)=>{
    const v = o[i+'|'+n.className];
    if(v) n.scrollTop = v;
  });
}

function render(){
  const a = document.activeElement, aid = a && a.id, sel = a && a.selectionStart;
  const dove = state.schermo+'/'+state.progettoId+'/'+state.vista;
  const scorrimento = (dove === ultimoPosto) ? segnaScorrimento() : null;
  if(ctxEl && schermoCtx !== state.schermo+'/'+state.progettoId) chiudiCtx();
  schermoCtx = state.schermo+'/'+state.progettoId;
  OGGI = mezzanotte();
  vistaValida();
  if(state.schermo==='gate'){ renderGate(); }
  else if(state.schermo==='spazi'){ renderSpazi(); }
  else if(state.schermo==='home'){ renderHome(); }
  else if(state.schermo==='profilo'){ renderProfilo(); }
  else if(state.schermo==='mie'){ renderMie(); }
  else if(state.schermo==='cerca'){ renderCerca(); }
  else if(state.schermo==='guida'){ renderGuida(); }
  else { renderProgetto(); }
  renderTop(); renderPhasebar(); renderTabbar(); renderDrawer();
  el('app').classList.toggle('con-nav', state.schermo==='home' || !el('tabbar').hidden);
  misuraNav();
  el('drawer').classList.toggle('on', state.drawer);
  el('scrim').classList.toggle('on', state.drawer);
  rimettiScorrimento(scorrimento);
  ultimoPosto = dove;

  if(aid){ const n = el(aid); if(n){ n.focus(); if(sel!=null && n.setSelectionRange) try{n.setSelectionRange(sel,sel);}catch(e){} } }
  save();
}

/* ============ SOLDI DEL LAVORO ============
   Preventivo, incassi e spese di ogni lavoro. Li vede solo chi ha il
   permesso «Vedere i soldi» (l'amministratore sempre). Non finiscono mai
   nel registro del lavoro: quello lo leggono tutti quelli che lo vedono. */
function contiDi(pid, crea){
  if(!state.conti) state.conti = {};
  let c = state.conti[pid];
  if(!c && crea) c = state.conti[pid] = {preventivo:null, incassi:[], spese:[]};
  if(c){ if(!Array.isArray(c.incassi)) c.incassi = []; if(!Array.isArray(c.spese)) c.spese = []; }
  return c || null;
}
const somma = a => (a||[]).reduce((n,x)=>n+(Number(x.importo)||0), 0);
function euro(n){
  if(n==null || !isFinite(n)) return '—';
  const neg = n < 0; n = Math.abs(n);
  const s = n.toLocaleString('it-IT', {minimumFractionDigits:(Math.round(n*100)%100 ? 2 : 0), maximumFractionDigits:2, useGrouping:true});
  return (neg? '− ' : '')+'€ '+s;
}
/* «€ 1.200,50», «1200.5», «1.200» → numero; vuoto → null */
function numeroDa(v){
  let s = String(v==null ? '' : v).replace(/[^0-9,.\-]/g,'');
  if(!s || s==='-') return null;
  const ic = s.lastIndexOf(','), ip = s.lastIndexOf('.');
  if(ic>=0 && ip>=0){
    /* ci sono tutti e due: l'ultimo e' quello dei decimali */
    s = ic > ip ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(ic>=0){
    /* «1,5» sono decimali; «1,200» o «1,200,000» sono migliaia scritte all'inglese */
    s = ((s.match(/,/g)||[]).length>1 || /^-?\d{1,3},\d{3}$/.test(s)) ? s.replace(/,/g,'') : s.replace(',','.');
  } else if(ip>=0){
    /* «1.500» o «1.500.000» sono migliaia; «1.5» sono decimali */
    if((s.match(/\./g)||[]).length>1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n*100)/100 : null;
}
function riassuntoConti(c){
  const prev = (c && c.preventivo!=null && c.preventivo!=='') ? Number(c.preventivo) : null;
  const inc = somma(c && c.incassi), sp = somma(c && c.spese);
  return {prev, inc, sp, resta: prev!=null ? Math.max(0, prev-inc) : null, margine: (prev!=null ? prev : inc) - sp};
}
function vedeSoldi(){ return puo('soldi') && !state.ospite; }
function scriveSoldi(){ return puo('soldi-scrive') && !state.ospite; }

  if(!vedeSoldi()) return '';

  const pc = r.prev ? Math.min(100, Math.round(r.inc / r.prev * 100)) : 0;

        (r.resta!=null ? '<div class="kv"><span>Da incassare</span><b class="mono'+(r.resta>0?' da-inc':'')+'">'+euro(r.resta)+'</b></div>' : '')+

      svg('euro')+(scrive? (vuoto? 'Aggiungi il preventivo' : 'Incassi e spese') : 'Vedi i conti')+'</button>'+

/* ============ DATE DEL LAVORO ============ */
const MESI_LUNGHI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function dataBreve(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
  if(!m) return esc(iso||'');
  return (+m[3])+' '+(MESI_BREVI[(+m[2])-1]||'')+((+m[1])!==OGGI.getFullYear()? ' '+m[1].slice(2) : '');
}
/* «aggiungi a Google Calendar» per una sola data: si apre gia' compilato */
function linkGoogleEvento(p, e){
  const g = String(e.d||'').replace(/-/g,'');
  let date;
  if(e.ora && /^\d{2}:\d{2}$/.test(e.ora)){
    const q = e.d.split('-').map(Number), o = e.ora.split(':').map(Number);
    const ini = new Date(q[0], q[1]-1, q[2], o[0], o[1]), fine = new Date(ini.getTime()+3600000);
    const f = d => isoDi(d).replace(/-/g,'')+'T'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2)+'00';
    date = f(ini)+'/'+f(fine)+'&ctz=Europe/Rome';
  } else {
    const d = new Date(e.d+'T12:00:00'); d.setDate(d.getDate()+1);
    date = g+'/'+isoDi(d).replace(/-/g,'');
  }
  const testo = e.t + (p.cliente? ' · '+p.cliente : '');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(testo)+
    '&dates='+date+'&details='+encodeURIComponent(p.nome)+(p.indirizzo? '&location='+encodeURIComponent(p.indirizzo) : '');
}
function dateHTML(p){
  const ev = (p.eventi||[]).map((e,i)=>({e,i})).filter(x=>x.e && x.e.d)
    .sort((a,b)=>(a.e.d+(a.e.ora||'')).localeCompare(b.e.d+(b.e.ora||'')));
  const mod = !isLock(p) && puo('modifica'), oggi = isoDi(OGGI);
  return '<div class="rail-sec"><div class="lbl">Date in calendario'+(ev.length? ' · '+ev.length : '')+'</div>'+

/* ============ SOLDI DI TUTTI I LAVORI ============ */
function cartaSoldi(){
  if(!vedeSoldi()) return '';
  const anno = OGGI.getFullYear(), ia = String(anno);
  let resta = 0, inc = 0, sp = 0, aperti = 0, n = 0;
  const daInc = [];
  state.progetti.forEach(p=>{
    const c = state.conti && state.conti[p.id]; if(!c) return;
    const r = riassuntoConti(contiDi(p.id));
    if(r.prev==null && !c.incassi.length && !c.spese.length) return;
    n++;
    if(r.resta) { resta += r.resta; daInc.push({p, v:r.resta}); }
    if(!p.completato && r.prev) aperti += r.prev;
    (c.incassi||[]).forEach(m=>{ if(String(m.d||'').slice(0,4)===ia) inc += Number(m.importo)||0; });
    (c.spese||[]).forEach(m=>{ if(String(m.d||'').slice(0,4)===ia) sp += Number(m.importo)||0; });
  });
  daInc.sort((a,b)=>b.v-a.v);
  let h = '<div class="card"><h3 style="display:flex;align-items:center;gap:7px">'+
    svg('euro',2.2).replace('<svg','<svg style="width:15px;height:15px;color:var(--amber-ink)"')+'Soldi dei lavori</h3>';
  if(!n) return h+'<div class="hint" style="margin:0">Quando aggiungi un preventivo a un lavoro, qui trovi quanto hai incassato e quanto ti devono.</div></div>';
  h += '<div class="conti-top">'+
      '<div><span>Da incassare</span><b class="mono'+(resta>0?' da-inc':'')+'">'+euro(resta)+'</b></div>'+
      '<div><span>Incassato nel '+anno+'</span><b class="mono">'+euro(inc)+'</b></div>'+
      '<div><span>Spese nel '+anno+'</span><b class="mono">'+euro(sp)+'</b></div>'+
      '<div><span>Lavori aperti</span><b class="mono">'+euro(aperti)+'</b></div>'+
    '</div>';
  if(daInc.length) h += '<div class="lbl" style="margin:14px 0 6px">Chi deve ancora pagare</div><div class="adm-lista">'+
    daInc.slice(0,8).map(x=>'<button class="adm-r" data-action="apri" data-id="'+x.p.id+'">'+
      '<span class="picona">'+svg(x.p.icona||TIPO(x.p.tipo).ic)+'</span>'+
      '<div class="tx"><b>'+esc(x.p.nome)+'</b><span>'+esc(x.p.cliente||'')+(x.p.completato? ' · consegnato' : '')+'</span></div>'+
      '<b class="mono da-inc">'+euro(x.v)+'</b></button>').join('')+'</div>';
  return h+'</div>';
}

/* ============ PRESET ============
   Il metodo con cui lavorate, pronto da riusare: fasi, task, subtask e
   checklist, tutte da spuntare. Niente date, persone o soldi. Nasce da zero
   (editor), da un lavoro riuscito («Salva come preset») o da un file
   importato; si sceglie quando crei un progetto o uno spazio. */
function modelloDa(p, nome, id){
  return {id: id || 'mod'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    nome, tipo:p.tipo, lavoro:p.lavoro||null,
    fasi:FZ(p).map(f=>({nome:f.nome, icon:f.icon, desc:f.desc||'', campi:(f.campi||[]).map(c=>c.slice())})),
    task:(p.subs||[]).map(s=>({fase:s.fase, titolo:s.titolo, items:(s.items||[]).map(v=>{
      const x = {t:v.t}; if(Array.isArray(v.lista)) x.lista = v.lista.map(c=>c.t); return x; })})),
    tags:(p.tags||[]).slice(), creato_da:state.utente, t:Date.now()};
}
function modaleSalvaModello(pid){

    '<div class="field"><label>Nome del preset</label><input id="mod_nome" value="'+esc(nomeBase)+'" maxlength="60"></div>'+
    '<div class="nota-box">Salvo le <b>'+FZ(p).length+' fasi</b> e le <b>'+(p.subs||[]).length+' task</b> con subtask e checklist, tutte da spuntare. '+
      'Niente date, niente persone, niente soldi. Lo ritrovi quando crei un nuovo progetto; con lo stesso nome aggiorni quello che c’è già.</div>'+
    '</div><div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+

function registraModello(m){
  state.modelli = state.modelli || [];
  const i = state.modelli.findIndex(x=>x.id===m.id);
  if(i>=0) state.modelli[i] = m; else state.modelli.push(m);

function togliModello(id){
