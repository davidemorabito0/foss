const CHIAVE = 'foss_v1', CHIAVE_BK = 'foss_backup';
let archivioLocale = false;   // true se in questo browser c'era già un archivio salvato
function save(){ try{
  const precedente = localStorage.getItem(CHIAVE);
  if(precedente && precedente.length>200) localStorage.setItem(CHIAVE_BK, precedente);
}catch(e){}
  let payload = null;

  me:state.me, cfg:state.cfg, azioni:state.azioni, spazi:state.spazi, spazioId:state.spazioId
}); }catch(e){ return; }
  if(utenteCloud) salvaCloud(false);

    localStorage.setItem(CHIAVE, payload);

  }catch(e){

       È la cosa peggiore che possa succedere in silenzio, quindi lo dico. */
    if(!spazioPieno){
      spazioPieno = true;
      try{ localStorage.removeItem(CHIAVE_BK); localStorage.setItem(CHIAVE, payload); spazioPieno = false; }catch(e2){}
    }

let spazioPieno = false, avvisoMostrato = false;
function avvisoArchivioPieno(){
  if(avvisoMostrato) return;
  avvisoMostrato = true;
  toast('Il browser non ha più spazio: da adesso le modifiche NON vengono salvate. '+
        'Vai nel profilo, esporta i dati, poi alleggerisci gli sfondi degli spazi.',

function load(){
  try{
    /* chi aveva già dati sotto il vecchio nome se li ritrova qui */
    let grezzo = localStorage.getItem(CHIAVE);
    if(!grezzo){
      const vecchio = localStorage.getItem('feedback_v3');
      if(vecchio){ localStorage.setItem(CHIAVE, vecchio); grezzo = vecchio;
        try{ localStorage.removeItem('feedback_v3'); localStorage.removeItem('feedback_backup'); }catch(e){} }
    }
    const r = JSON.parse(grezzo||'null');
    /* serve a distinguere «questo browser ha del lavoro vero» da «ci sono
       solo i progetti di esempio»: al primo accesso in cloud non si deve
       caricare la dimostrazione come se fosse roba dell'utente. */
    if(r && r.progetti && r.progetti.length) archivioLocale = true;
    if(r && r.progetti && r.progetti.length){
      state.progetti = r.progetti; state.notifiche = r.notifiche||state.notifiche;
      state.utenti = r.utenti||state.utenti; state.vista = r.vista||'tessere';
      state.filtri = r.filtri||state.filtri; state.ordina = r.ordina||'prio';
      state.filtroAttivo = r.filtroAttivo||null;
      state.raggruppa = r.raggruppa||'compiti';
      if(r.ordineViste && r.ordineViste.length) state.ordineViste = r.ordineViste;
      if(r.me) state.me = Object.assign(state.me, r.me);
      if(r.cfg) state.cfg = Object.assign(state.cfg, r.cfg);
      if(r.azioni) state.azioni = r.azioni;
      normalizza();
      if(r.spazi && r.spazi.length) state.spazi = r.spazi;
      if(r.spazioId) state.spazioId = r.spazioId;
      /* dati salvati prima degli spazi: li adotto nel primo spazio */
      const primo = state.spazi[0] ? state.spazi[0].id : 'sp1';
      state.progetti.forEach(p=>{ if(!p.spazio || !state.spazi.some(x=>x.id===p.spazio)) p.spazio = primo; });
      if(!state.spazi.some(x=>x.id===state.spazioId)) state.spazioId = primo;
      if(r.tema) document.documentElement.setAttribute('data-theme', r.tema);
    }
  }catch(e){}
  if(state.cfg.tema && state.cfg.tema!=='brand') document.documentElement.setAttribute('data-tema', state.cfg.tema);
  else document.documentElement.removeAttribute('data-tema');
}

/* ---------- identita' e mappe ----------
   Il lavoro non sta piu' in un blocco unico per persona: ogni progetto e ogni
   spazio hanno una riga sua sul database, con scritto a quale organizzazione
   appartengono. Chi puo' leggerli lo decide il database, non il browser. */
let orgMia = null;
const orgSpazio = {}, orgProg = {};
let ombraSp = {}, ombraPr = {};

function datiSpazio(sp){ const d = Object.assign({}, sp); delete d.id; return d; }
function datiProg(p){ const d = Object.assign({}, p); delete d.id; delete d.spazio; return d; }
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

/* chi deve poter aprire questo progetto: il team, i responsabili di fase,
   chi ha una subtask assegnata e chiunque sia taggato dentro */
function membriDi(p){
  const v = [];
  const add = x => { if(x && UUID.test(x) && v.indexOf(x)<0) v.push(x); };
  (p.team||[]).forEach(add);
  Object.keys(p.faseAss||{}).forEach(k=>add(p.faseAss[k]));
  (p.subs||[]).forEach(s=>{
    add(s.assegnato);
    (s.taggati||[]).forEach(t=>add(t && t.u));
    (s.items||[]).forEach(i=>add(i && i.ass));
  });
  return v;
}

async function caricaCloud(){
  if(!sb || !utenteCloud) return;
  try{
    state.utente = utenteCloud.id;
    const {data:prof} = await sb.from('profili').select('*').eq('id', utenteCloud.id).maybeSingle();
    if(prof){
      state.me = {nome:prof.nome||'', cognome:prof.cognome||'', nick:prof.nickname||'',
                  email:prof.email||utenteCloud.email, ruolo:prof.ruolo||'Collaboratore',
                  foto:prof.foto_url||null, link:(prof.cfg&&prof.cfg.link)||state.me.link||''};
      state.cfg = Object.assign(state.cfg, prof.cfg||{}, {tema:prof.tema||'brand'});
      if(state.cfg.tema && state.cfg.tema!=='brand') document.documentElement.setAttribute('data-tema', state.cfg.tema);
      else document.documentElement.removeAttribute('data-tema');
    }

    /* le organizzazioni di cui faccio parte: la mia e' quella dove sono titolare */
    const {data:mie, error:errOrg} = await sb.from('membri_org').select('org_id,ruolo').eq('utente_id', utenteCloud.id);
    if(errOrg) throw errOrg;
    const titolare = (mie||[]).find(m=>m.ruolo==='titolare');
    orgMia = titolare ? titolare.org_id : ((mie||[])[0]||{}).org_id || null;
    spazioMio = sp => (orgSpazio[sp.id] || orgMia) === orgMia;
    mioProgetto = p => (orgProg[p.id] || orgMia) === orgMia;

    /* le persone: solo quelle che condividono un'organizzazione con me */
    const {data:tutti} = await sb.from('profili').select('*');
    const io = {id:utenteCloud.id, nome:nomeVisibile(), ini:iniziali(),
                ruolo:state.me.ruolo, col:'#FFAD01', foto:state.me.foto};
    const altri = (tutti||[]).filter(u=>u.id!==utenteCloud.id).map((u,i)=>({
      id:u.id, nome:(u.nickname||((u.nome||'')+' '+(u.cognome||'')).trim()||u.email),
      ini:((u.nome||u.email||'?')[0]+(u.cognome?u.cognome[0]:'')).toUpperCase(),
      ruolo:u.ruolo||'Collaboratore', col:COL(i+1), foto:u.foto_url||null
    }));
    state.utenti = [io].concat(altri);

    /* spazi e progetti: arrivano gia' filtrati dal database */
    const {data:sps, error:e1} = await sb.from('spazi').select('org_id,id,dati,ordine').order('ordine');
    if(e1) throw e1;
    const {data:prs, error:e2} = await sb.from('progetti').select('org_id,id,spazio_id,dati');
    if(e2) throw e2;

    ombraSp = {}; ombraPr = {};
    state.spazi = (sps||[]).map(r=>{
      orgSpazio[r.id] = r.org_id;
      ombraSp[r.id] = JSON.stringify(r.dati)+'|'+r.ordine;
      return Object.assign({id:r.id}, r.dati);
    });
    state.progetti = (prs||[]).map(r=>{
      orgProg[r.id] = r.org_id;
      ombraPr[r.id] = JSON.stringify(r.dati)+'|'+r.spazio_id;
      return Object.assign({id:r.id, spazio:r.spazio_id}, r.dati);
    });

    /* Nei dati ci sono anche persone senza account (quelle messe in squadra
       prima che si registrassero): le tengo con nome e ruolo, segnate come
       "senza account", cosi' non diventano tutte me. */
    const noti = {}; state.utenti.forEach(u=>noti[u.id]=1);
    const citati = {};
    const cita = x => { if(x && !noti[x]) citati[x] = 1; };
    state.progetti.forEach(p=>{
      (p.team||[]).forEach(cita);
      Object.keys(p.faseAss||{}).forEach(k=>cita(p.faseAss[k]));
      (p.subs||[]).forEach(s=>{ cita(s.assegnato);
        (s.taggati||[]).forEach(t=>cita(t && t.u));
        (s.items||[]).forEach(i=>cita(i && i.ass)); });
    });
    state.spazi.forEach(sp=>(sp.membri||[]).forEach(cita));
    Object.keys(citati).forEach((id,i)=>{
      const d = UTENTI.find(u=>u.id===id);
      state.utenti.push(d ? Object.assign({}, d, {senzaAccount:true})
        : {id:id, nome:'Collaboratore', ini:'?', ruolo:'senza account', col:COL(i+3), senzaAccount:true});
    });

    /* preferenze personali: filtri, notifiche, registro, vista */
    const {data:mio} = await sb.from('spazio_lavoro').select('stato').eq('utente_id', utenteCloud.id).maybeSingle();
    const st = (mio && mio.stato) || {};
    state.filtri = st.filtri || state.filtri;
    state.notifiche = st.notifiche || [];
    state.azioni = st.azioni || [];
    state.vista = st.vista || 'tessere';
    /* mi apro sullo spazio dove ho davvero qualcosa: a un collaboratore non
       serve atterrare in uno spazio del titolare dove non ha nessun progetto */
    const visibili = state.spazi.filter(sp => (orgSpazio[sp.id]||orgMia)===orgMia
                     || (prs||[]).some(r=>r.spazio_id===sp.id));
    if(st.spazioId && visibili.some(x=>x.id===st.spazioId)) state.spazioId = st.spazioId;
    else state.spazioId = visibili.length ? visibili[0].id : (state.spazi[0]||{}).id || null;

    cloudPronto = true;
    if(!state.progetti.length && !state.spazi.length){
      nuovoArrivato = true;
      state.progettoId = null;
    } else {
      normalizza();
    }
  }catch(e){
    cloudPronto = false;
    toast('Non sono riuscito a leggere i dati dal cloud: lavoro solo in locale e non sovrascrivo niente. Ricarica la pagina quando torna la connessione.','warn','Sincronizzazione ferma');
  }
}

/* Scrivo solo quello che e' cambiato davvero, riga per riga: due persone che
   lavorano su progetti diversi non si cancellano piu' il lavoro a vicenda. */
let inCorso = false, daRifare = false;
async function sincronizza(){
  if(!sb || !utenteCloud || !cloudPronto) return;
  if(inCorso){ daRifare = true; return; }
  inCorso = true;
  const errori = [];
  try{
    for(let i=0;i<state.spazi.length;i++){
      const sp = state.spazi[i];
      const org = orgSpazio[sp.id] || orgMia;
      if(org !== orgMia) continue;                       // gli spazi altrui non li scrivo
      const d = datiSpazio(sp), j = JSON.stringify(d)+'|'+i;
      if(j === ombraSp[sp.id]) continue;
      const {error} = await sb.from('spazi').upsert({org_id:org, id:sp.id, dati:d, ordine:i}, {onConflict:'org_id,id'});
      if(error){ errori.push(error.message); continue; }
      ombraSp[sp.id] = j; orgSpazio[sp.id] = org;
    }
    for(const p of state.progetti){
      const org = orgProg[p.id] || orgSpazio[p.spazio] || orgMia;
      if(!org) continue;
      const d = datiProg(p), j = JSON.stringify(d)+'|'+p.spazio;
      if(j === ombraPr[p.id]) continue;
      const {error} = await sb.from('progetti').upsert({org_id:org, id:p.id, spazio_id:p.spazio, dati:d}, {onConflict:'org_id,id'});
      if(error){ errori.push(error.message); continue; }
      ombraPr[p.id] = j; orgProg[p.id] = org;
      const r = await sb.rpc('sincronizza_membri', {p_org:org, p_prog:p.id, p_utenti:membriDi(p)});
      if(r.error) console.warn(r.error.message);
    }
    for(const id in ombraPr){
      if(state.progetti.some(p=>p.id===id)) continue;
      await sb.from('progetti').delete().match({org_id:orgProg[id]||orgMia, id:id});
      delete ombraPr[id]; delete orgProg[id];
    }
    for(const id in ombraSp){
      if(state.spazi.some(x=>x.id===id)) continue;
      if((orgSpazio[id]||orgMia) !== orgMia) continue;
      await sb.from('spazi').delete().match({org_id:orgSpazio[id]||orgMia, id:id});
      delete ombraSp[id]; delete orgSpazio[id];
    }
    await sb.from('spazio_lavoro').upsert({
      utente_id: utenteCloud.id,
      stato:{filtri:state.filtri, notifiche:state.notifiche,
             azioni:(state.azioni||[]).slice(0,200), vista:state.vista, spazioId:state.spazioId}
    });
  }catch(e){ errori.push(e.message||'errore'); }
  inCorso = false;
  if(errori.length) console.warn('sincronizzazione:', errori.join(' / '));
  if(daRifare){ daRifare = false; sincronizza(); }
}
function salvaCloud(subito){
  if(!sb || !utenteCloud || !cloudPronto) return Promise.resolve();
  clearTimeout(timerSalva);
  if(subito) return sincronizza();
  timerSalva = setTimeout(sincronizza, 1500);
  return Promise.resolve();
}
