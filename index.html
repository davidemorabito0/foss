/* cambio di professione o di tipo di lavoro: i dettagli scritti a mano restano */
function nlCambia(tipo, lavoro, modello){
  const L0 = lavoroNL(), g0 = JSON.stringify(giorniNL().map(g=>g[0]));
  Object.keys(nl.dett).forEach(k=>{ if(!nl.dett[k] || (L0 && L0.dett && L0.dett[k]===nl.dett[k])) delete nl.dett[k]; });
  if(tipo!==nl.tipo){ const tieni = nl.dett.referente; nl.dett = {}; if(tieni) nl.dett.referente = tieni; }
  nl.tipo = tipo; nl.lavoro = lavoro || null; nl.modello = modello || null;
  if(JSON.stringify(giorniNL().map(g=>g[0])) !== g0) nl.giorni = [];
  nl.piano = null;
}

function nlLeggi(){
  if(!nl) return;
  const v = id => { const n = el(id); return n ? n.value : null; };
  let x;
  if((x = v('nl_cli'))!=null) nl.cliente = x.trim();
  if((x = v('nl_nome'))!=null) nl.nome = x.trim();
  if((x = v('nl_data'))!=null) nl.data = x;
  if((x = v('nl_prio'))!=null) nl.prio = x;
  if((x = v('nl_luogo'))!=null) nl.luogo = x.trim();
  giorniNL().forEach((g,i)=>{
    const d = v('nl_g'+i), o = v('nl_o'+i);
    if(d!=null || o!=null) nl.giorni[i] = {d:d||'', ora:o||''};
  });
  (TIPO(nl.tipo).dett||[]).forEach(d=>{ const y = v('nl_d_'+d[0]); if(y!=null) nl.dett[d[0]] = y.trim(); });
  if((x = v('nl_prev'))!=null) nl.prev = x;
  if((x = v('nl_acc'))!=null) nl.acconto = x;
  if((x = v('nl_nomemod'))!=null) nl.nomeModello = x.trim();
  const nt = el('np_nota'); if(nt) nl.nota = nt.innerHTML;
  const vis = el('np_vis');
  if(vis) nl.vis = [...vis.querySelectorAll('.vis-chip.on')].map(b=>b.dataset.id);
  /* una task scritta e non ancora aggiunta la aggiungo io */
  document.querySelectorAll('[data-nl-add]').forEach(i=>{ if(i.value.trim()) nlAggiungiTask(+i.dataset.nlAdd, i.value); i.value = ''; });
  nl.bozze = {};
}
/* ridisegno la stessa pagina: quello che stavi scrivendo resta dov'era */
function nlBozze(){
  if(!nl) return;
  document.querySelectorAll('[data-nl-add]').forEach(i=>{ nl.bozze[i.dataset.nlAdd] = i.value; });
}
function nlAggiungiTask(fi, testo){
  const f = pianoNL()[fi]; if(!f) return false;
  const t = String(testo||'').trim(); if(!t) return false;
  const tk = taskDa(t.indexOf('|')>=0 ? t : t+'|');
  tk.on = true;
  f.task.push(tk); f.on = true;
  return true;
}

function renderNuovoLavoro(){
  if(!nl) return;
  let n = el('nlLayer');
  if(!n){ n = document.createElement('div'); n.className = 'wz nl'; n.id = 'nlLayer'; document.body.appendChild(n); }
  const passi = passiNL();
  if(nl.passo > passi.length-1) nl.passo = passi.length-1;
  const k = passi[nl.passo], T = TIPO(nl.tipo), L = lavoroNL();
  const vecchio = el('nlCorpo'), scroll = (vecchio && nl._pagina===k) ? vecchio.scrollTop : 0;
  const TIT = {
    lavoro:['Che lavoro è?', 'Preparo fasi, task e campi adatti a quel tipo di incarico.'],
    dati:['Per chi è?', 'Cliente, date e i dettagli che contano nel tuo mestiere.'],
    fasi:['Fasi e task', 'Spegni quello che non ti serve e aggiungi quello che manca. Potrai cambiare tutto anche dopo.'],
    soldi:['Soldi', 'Preventivo e acconto. Incassi e spese li aggiungi dopo, quando arrivano.'],
    chi:['Chi lo vede', 'Le persone che ci lavorano, le note e gli allegati.']
  }[k];
  let b = '';
  if(k==='lavoro') b = nlPaginaLavoro(T);
  else if(k==='dati') b = nlPaginaDati(T, L);
  else if(k==='fasi') b = nlPaginaFasi();
  else if(k==='soldi') b = nlPaginaSoldi();
  else b = nlPaginaChi();
  n.innerHTML = '<div class="wz-card">'+
    '<div class="wz-top"><button class="iconbtn wz-x" data-action="nl-chiudi" title="Chiudi senza creare" aria-label="Chiudi">'+svg('x',2.4)+'</button>'+
      '<div class="wz-passi">'+passi.map((x,i)=>'<i class="'+(i<=nl.passo?'on':'')+'"></i>').join('')+'</div>'+
      '<div class="kicker">Nuovo progetto · '+(nl.passo+1)+' di '+passi.length+(k!=='lavoro'? ' · '+esc(L? L.n : T.prof) : '')+'</div>'+
      '<h2>'+TIT[0]+'</h2><p>'+TIT[1]+'</p></div>'+
    '<div class="wz-b" id="nlCorpo">'+b+'</div>'+
    '<div class="wz-f">'+
      (nl.passo>0 ? '<button class="btn ghost" data-action="nl-indietro">'+svg('left')+'Indietro</button>'
                  : '<button class="btn ghost" data-action="nl-chiudi">Annulla</button>')+
      '<div class="spacer"></div>'+
      (nl.passo<passi.length-1 ? '<button class="btn primary" data-action="nl-avanti">Avanti '+svg('right')+'</button>'
                               : '<button class="btn primary" data-action="nl-crea">'+svg('check')+'Crea il progetto</button>')+
    '</div></div>';
  const corpo = el('nlCorpo');
  if(corpo) corpo.scrollTop = scroll;
  nl._pagina = k;
  if(k==='chi') renderAllegati();
  if(k==='dati') setTimeout(()=>{ const i = el('nl_cli'); if(i && !i.value && !suTelefono()) i.focus(); }, 60);
}

      return '<button class="scelta'+(nl.tipo===k?' on':'')+'" data-action="nl-tipo" data-k="'+k+'">'+
        '<span class="picona">'+svg(X.ic)+'</span><span><span class="nm">'+esc(X.prof)+'</span>'+
        '<span class="ds">'+esc(X.fasi.map(f=>f.nome).join(' · '))+'</span></span></button>'; }).join('')+'</div>';
  } else {
    h += '<div class="nl-prof"><span class="picona">'+svg(T.ic)+'</span>'+
      '<span class="tx"><b>'+esc(T.prof)+'</b><span>'+esc(T.fasi.map(f=>f.nome).join(' · '))+'</span></span>'+

    lav.map(k=>'<button class="nl-chip'+(!nl.modello && nl.lavoro===k?' on':'')+'" data-action="nl-lavoro" data-k="'+k+'" aria-pressed="'+(!nl.modello && nl.lavoro===k)+'">'+esc(T.lavori[k].n)+'</button>').join('')+

  const ms = state.modelli||[];
  if(ms.length || puo('crea_lavori')) h += '<div class="field"><label>Oppure parti da un tuo preset</label><div class="nl-modelli">'+
    ms.map(m=>{
      return '<div class="nl-mod'+(nl.modello===m.id?' on':'')+'"><button class="nl-mod-b" data-action="nl-modello" data-id="'+esc(m.id)+'" aria-pressed="'+(nl.modello===m.id)+'">'+

        (nl.modello===m.id && m.descrizione ? '<i class="nl-metodo">'+esc(m.descrizione)+'</i>' : '')+'</span></button>'+
        (!mioModello(m)? '' : nl.togliere===m.id
          ? '<button class="btn sm danger" data-action="nl-togli-modello" data-id="'+esc(m.id)+'" data-ok="1">Elimina</button>'
          : '<button class="iconbtn" data-action="nl-togli-modello" data-id="'+esc(m.id)+'" title="Elimina il preset" aria-label="Elimina il preset">'+svg('x',2.4)+'</button>')+
      '</div>'; }).join('')+
    (puo('crea_lavori') ? '<div class="nl-mod-az"><button class="btn sm ghost" data-action="pe-nuovo">'+svg('plus')+'Nuovo preset</button>'+
      '<button class="btn sm ghost" data-action="pe-importa">'+svg('clip')+'Importa</button></div>' : '')+
    '</div></div>';

  h += '<div class="nl-anteprima">'+svg('list',2.2)+'<span>Parti con <b>'+piano.length+' fasi</b> e <b>'+nt+' task</b>: '+

function nlValida(k){
  if(k==='dati' && !nl.cliente && !nl.nome){
    toast('Scrivi almeno '+(TIPO(nl.tipo).chi||'il cliente').toLowerCase()+' o il titolo.','warn','Manca qualcosa');
    const i = el('nl_cli'); if(i) i.focus();
    return false;
  }
  if(k==='fasi' && !pianoNL().some(f=>f.on)){
    toast('Tieni almeno una fase.','warn','Nessuna fase');
    return false;
  }
  return true;
}

function nlCrea(){
  nlLeggi();
  if(!nlValida('dati')){ nl.passo = passiNL().indexOf('dati'); renderNuovoLavoro(); return; }
  if(!nlValida('fasi')){ nl.passo = passiNL().indexOf('fasi'); renderNuovoLavoro(); return; }
  const T = TIPO(nl.tipo), L = lavoroNL(), M = modelloNL();
  const cli = nl.cliente, nome = nl.nome || titoloDiBase();
  const piano = pianoNL().filter(f=>f.on);
  const fasi = piano.map(f=>({nome:f.nome, icon:f.icon||'list', desc:f.desc||'', campi:(f.campi||[]).map(c=>c.slice())}));
  const pid = 'p'+Date.now();
  let n = 0;
  const subs = [];
  piano.forEach((f,fi)=>f.task.forEach(t=>{
    if(!t.on) return;
    subs.push({id:'s'+(++n)+'_'+fi+'_'+pid.slice(-5), fase:fi, titolo:t.titolo, aperto:false, assegnato:state.utente, nota:'', taggati:[],
      items:t.items.map(v=>{ const x = {t:v.t, done:false}; if(v.lista) x.lista = v.lista.map(c=>({t:c.t, done:false})); return x; })});
  }));
  const prima = subs.find(s=>s.fase===0); if(prima) prima.aperto = true;
  const eventi = [];
  const dataEv = (L && L.dataEv) || T.dataEv || 'Consegna';
  if(nl.data) eventi.push({d:nl.data, t:dataEv+' '+nome, c:1});
  giorniNL().forEach((g,i)=>{
    const v = nl.giorni[i]; if(!v || !v.d) return;
    const e = {d:v.d, t:g[1]}; if(v.ora) e.ora = v.ora;
    eventi.push(e);
  });
  const team = [state.utente].concat(nl.vis.filter(id=>id!==state.utente));
  const faseAss = {}; fasi.forEach((f,i)=>{ faseAss[i] = state.utente; });
  const extra = {};
  Object.keys(nl.dett).forEach(k=>{ if(nl.dett[k]) extra[k] = nl.dett[k]; });
  if(L && L.dett) Object.keys(L.dett).forEach(k=>{ if(extra[k]==null && nl.dett[k]==null) extra[k] = L.dett[k]; });
  const q = nl.data ? nl.data.split('-') : null;
  const np = P(Object.assign(extra, {
    id:pid, spazio:state.spazioId, nome, cliente:cli, tipo:nl.tipo, prio:nl.prio,
    col:PALETTE_PROG[state.progetti.length % PALETTE_PROG.length], fase:0,
    fasi, subs, faseAss, team, eventi,
    indirizzo:nl.luogo, nota:String(nl.nota||'').replace(/<(?!\/?(b|strong|u|i|em|br|div)\b)[^>]*>/gi,''),
    allegati:tmpAllegati.slice(), tags:((M && M.tags) || (L && L.tags) || []).slice(),
    consegna: q ? q[2]+'/'+q[1]+'/'+q[0] : '', fattura:'Da emettere'
  }));
  if(nl.lavoro) np.lavoro = nl.lavoro;
  else if(M && M.lavoro && T.lavori && T.lavori[M.lavoro]) np.lavoro = M.lavoro;
  np.icona = T.ic;
  np.log = [{tx:'Progetto creato'+(M? ' dal preset <b>'+esc(M.nome)+'</b>' : L? ' · '+esc(L.n) : ''), ts:'oggi '+oraOra(), acc:true, u:state.utente, t:Date.now()}];
  if(np.allegati.length) np.log.unshift({tx:np.allegati.length+' allegati caricati', ts:'oggi '+oraOra(), acc:false, u:state.utente, t:Date.now()});
  np.visti = {commenti:0, chat:0, attivita:np.log.length};
  /* i soldi, se li posso vedere */
  if(vedeSoldi()){
    const prev = numeroDa(nl.prev), acc = numeroDa(nl.acconto);
    if(prev!=null || acc){
      const c = contiDi(np.id, true);
      c.preventivo = prev;
      if(acc) c.incassi.push({id:'i'+Date.now().toString(36), d:isoDi(OGGI), importo:acc, nota:'Acconto'});
    }
  }
  snap('Creazione di «'+nome+'»');
  azione('Creato il progetto <b>'+esc(nome)+'</b>'+(cli? ' per '+esc(cli) : ''));
  state.progetti.unshift(np);
  if(nl.comeModello && puo('crea_lavori')){
    const nm = nl.nomeModello || (L? L.n : T.n);
    const gia = (state.modelli||[]).find(x=>String(x.nome).toLowerCase()===nm.toLowerCase() && mioModello(x));
    registraModello(modelloDa(np, nm, gia && gia.id));
  }
  chiudiNuovoLavoro();
  notifica('Nuovo progetto <b>'+esc(nome)+'</b>'+(cli? ' per '+esc(cli) : ''), np.id, 0, 'plus');
  apriProgetto(np.id, true);
}

const CAMPI = {
  nome:{l:'Titolo del progetto'}, cliente:{l:'Cliente'}, budget:{l:'Budget'}, durata:{l:'Durata finale'},
  deliverable:{l:'Deliverable'}, referente:{l:'Referente'}, giornate:{l:'Giornate'}, call:{l:'Call time'},
  location:{l:'Location'}, troupe:{l:'Troupe'}, girato:{l:'Girato'}, schede:{l:'Schede'},
  backup:{l:'Backup'}, versione:{l:'Versione'}, note:{l:'Note aperte'}, tc:{l:'Ultimo timecode'},
  approv:{l:'Approvazione'}, formato:{l:'Formato'}, lufs:{l:'Loudness'}, fattura:{l:'Fattura'},
  consegna:{l:'Data di consegna', tipo:'data'}, indirizzo:{l:'Indirizzo del lavoro'},
  tipo:{l:'Tipo di lavoro', tipo:'opt', opt:()=>{ const p = Pdi(editCtx); return tipiVisibili(p && p.tipo).map(k=>[k,TIPI[k].prof+' · '+TIPI[k].n]); }},
  tags:{l:'Tag (separati da virgola)'},
  icona:{l:'Icona del progetto', tipo:'opt', opt:()=>ICONE_PROG.map(i=>[i,i])},
  prio:{l:'Priorità', tipo:'opt', opt:()=>Object.keys(PRIO).map(k=>[k,PRIO[k]])},
  nota:{l:'Note del progetto', tipo:'rte'}
};
/* i campi delle professioni che qui sopra non ci sono prendono l'etichetta dalla professione */
ORDINE_TIPI.forEach(k=>{
  TIPI[k].dett.forEach(d=>{ if(!CAMPI[d[0]]) CAMPI[d[0]] = {l:d[1]}; });
  TIPI[k].fasi.forEach(f=>(f.campi||[]).forEach(c=>{ if(!CAMPI[c[1]]) CAMPI[c[1]] = {l:c[0]}; }));
});
function lavoroDi(p){ const T = TIPO(p && p.tipo); return (p && p.lavoro && T.lavori && T.lavori[p.lavoro]) || null; }
function nomeLavoro(p){ const L = lavoroDi(p); return L ? L.n : TIPO(p.tipo).n; }
function etichettaData(p){ const L = lavoroDi(p); return (L && L.data) || TIPO(p.tipo).data || 'Consegna'; }
/* l'evento del calendario legato alla data principale del lavoro */
function eventoConsegna(p){
  const ev = p.eventi||[];
  return ev.find(e=>e.c===1) || ev.find(e=>/^consegna/i.test(e.t||'')) || null;
}
function etichettaDi(p, k){
  if(k==='consegna') return etichettaData(p);
  if(k==='cliente') return TIPO(p.tipo).chi || 'Cliente';
  if(k==='indirizzo') return TIPO(p.tipo).luogo || 'Indirizzo del lavoro';
  if(['nome','tipo','prio','tags','icona','nota'].indexOf(k)>=0) return (CAMPI[k]||{}).l || k;
  return etichettaCampo(p, k);
}
/* l'etichetta giusta per questo lavoro: quella della sua fase, poi della sua professione */
function etichettaCampo(p, k){
  const F = FZ(p), qui = (F[p.fase]||{}).campi||[];
  let c = qui.find(x=>x[1]===k);
  if(!c) for(const f of F){ c = (f.campi||[]).find(x=>x[1]===k); if(c) break; }
  if(c) return c[0];
  const d = TIPO(p.tipo).dett.find(x=>x[0]===k);
  if(d) return d[1];
  return (CAMPI[k]||{}).l || k;
}
const pen = (t,k,id,i,fisso) => '<button class="pen'+(fisso?' fisso':'')+'" data-action="edit" data-t="'+t+'"'+
  ' data-k="'+(k||'')+'" data-id="'+(id||'')+'" data-i="'+(i==null?'':i)+'" title="Modifica">'+svg('pen',2.2)+'</button>';

let editCtx = null, menzionatiOra = null;
const Pdi = ctx => (ctx && ctx.pid ? state.progetti.find(x=>x.id===ctx.pid) : PROJ());
function apriEdit(ctx){
  const p = Pdi(ctx); if(!p) return;
  editCtx = ctx; menzionatiOra = null;
  let etichetta = ctx.l, valore = '', tipo = ctx.tipo||'testo', opzioni = null;

  if(ctx.t==='proj'){
    const c = CAMPI[ctx.k]||{l:ctx.k};
    etichetta = etichettaDi(p, ctx.k); tipo = c.tipo||'testo'; valore = p[ctx.k]||'';
    if(c.opt) opzioni = c.opt();
    if(tipo==='data'){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(valore); valore = m? m[3]+'-'+m[2]+'-'+m[1]:''; }
  } else if(ctx.t==='sub'){
    const s = p.subs.find(x=>x.id===ctx.id);
    if(ctx.k==='assegnato'){ etichetta='Responsabile della task'; tipo='utente'; valore=s.assegnato; }
    else if(ctx.k==='nota'){ etichetta='Nota della task'; tipo='rte'; valore=s.nota||''; }
    else { etichetta='Nome della task'; valore = s.titolo; }
  } else if(ctx.t==='tag'){
    const s = p.subs.find(x=>x.id===ctx.id);
    const x = taggatiOk(s)[ctx.i];
    etichetta = 'Ruolo di '+U(x.u).nome+' su «'+s.titolo+'»';
    valore = x.ruolo;
  } else if(ctx.t==='item'){
    const s = p.subs.find(x=>x.id===ctx.id);
    etichetta = 'Subtask'; valore = s.items[ctx.i].t;
  } else if(ctx.t==='fase'){
    etichetta = 'Responsabile della fase '+FZ(p)[ctx.i].nome; tipo='utente'; valore = p.faseAss[ctx.i];
  } else if(ctx.t==='evento'){
    etichetta = 'Nome dell\'evento in calendario'; valore = p.eventi[ctx.i].t;
  }

  let campoHtml;
  if(tipo==='utente'){
    const scelti = (!sonoAdmin && p)? state.utenti.filter(u=>p.team.includes(u.id)) : state.utenti;
    campoHtml = '<select id="ed_val">'+scelti.map(u=>'<option value="'+u.id+'"'+(u.id===valore?' selected':'')+'>'+
      esc(u.nome)+' — '+esc(u.ruolo)+'</option>').join('')+'</select>';
  } else if(tipo==='opt'){
    campoHtml = '<select id="ed_val">'+opzioni.map(o=>'<option value="'+o[0]+'"'+(o[0]===valore?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  } else if(tipo==='data'){
    campoHtml = '<input id="ed_val" type="date" value="'+valore+'">';
  } else if(tipo==='rte'){
    /* Nella nota di una task si può anche taggare: l'avatar scrive @Nome nel
       testo e mette la persona fra quelle che lavorano alla task. */
    const conTag = (ctx.t==='sub' && ctx.k==='nota');
    campoHtml = '<div class="rte-bar"><button class="rte-b b" data-action="rte" data-c="bold">B</button>'+
      '<button class="rte-b u" data-action="rte" data-c="underline">U</button></div>'+
      '<div class="rte" id="ed_rte" contenteditable="true" data-ph="Scrivi qui…">'+sicuro(valore||'')+'</div>'+
      (conTag? '<div class="rte-tag"><span class="lb">Tagga chi ci lavora</span>'+
        taggabili().map(u=>'<button class="tag-av" data-action="menziona" data-u="'+u.id+'" '+
          'data-sid="'+ctx.id+'" title="'+esc(u.nome)+' — '+esc(u.ruolo)+'">'+av(u,'sm')+
          '<span>'+esc(u.nome.split(' ')[0])+'</span></button>').join('')+'</div>' : '');
  } else {
    campoHtml = '<input id="ed_val" value="'+esc(valore)+'">';
  }

  modale('<h3>Modifica</h3><div class="sub-t">'+esc(p.nome)+'</div><div class="modal-b">'+
    '<div class="field"><label>'+esc(etichetta)+'</label>'+campoHtml+'</div></div>'+
    '<div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+
    '<button class="btn primary" data-action="salva-campo">'+svg('check')+'Salva</button></div>');
  setTimeout(()=>{ const n = el('ed_val')||el('ed_rte'); if(n){ n.focus(); if(n.select) n.select(); } },40);
}

function applicaEdit(){
  const ctx = editCtx; if(!ctx) return;
  const p = Pdi(ctx); if(!p) return;
  const n = el('ed_val'), r = el('ed_rte');
  let v = r ? r.innerHTML.replace(/<(?!\/?(b|strong|u|i|em|br|div)\b)[^>]*>/gi,'') : (n? n.value : '');
  if(!r && !String(v).trim() && ctx.k!=='nota'){ toast('Il campo non può restare vuoto.','warn','Manca il valore'); return; }
  taskInProva = null;                 // salvata: la task nuova resta

  if(ctx.t==='proj'){
    const c = Object.assign({}, CAMPI[ctx.k]||{}, {l:etichettaDi(p, ctx.k)});
    if(c.tipo==='data'){ const q = v.split('-'); v = q[2]+'/'+q[1]+'/'+q[0]; }
    snap('Modifica di «'+c.l+'»');
    const prima = p[ctx.k]; p[ctx.k] = v;
    if(ctx.k==='tipo'){ p.col = TIPO(v).c; if(!lavoroDi(p)) delete p.lavoro; }
    if(ctx.k==='consegna'){
      const q2 = v.split('/'), iso = q2[2]+'-'+q2[1]+'-'+q2[0];
      const ev = eventoConsegna(p);
      if(ev) ev.d = iso;
      else { p.eventi = p.eventi||[]; p.eventi.push({d:iso, t:(TIPO(p.tipo).dataEv||'Consegna')+' '+p.nome, c:1}); }
    }
    azione('<b>'+esc(c.l)+'</b> di '+esc(p.nome)+': «'+esc(String(prima).replace(/<[^>]*>/g,'')).slice(0,40)+'» → «'+esc(String(v).replace(/<[^>]*>/g,'')).slice(0,40)+'»');
    logga(p, esc(c.l)+' aggiornato');
    toast(c.l+' aggiornato.','ok','Modificato');
  } else if(ctx.t==='sub'){
    const s = p.subs.find(x=>x.id===ctx.id);
    if(ctx.k==='nota'){
      snap('Nota di «'+s.titolo+'»');
      s.nota = v;
      if(String(v).replace(/<[^>]*>/g,'').trim()){ s.notaDi = state.utente; s.notaT = Date.now(); }
      else { delete s.notaDi; delete s.notaT; }
      (menzionatiOra||[]).forEach(id=>{
        if(taggatiOk(s).some(x=>x.u===id)) return;
        const u = U(id);
        s.taggati.push({u:id, ruolo:u.ruolo||'Collaboratore'});
        if(p.team.indexOf(id)<0) p.team.push(id);
        logga(p,'<b>'+esc(u.nome)+'</b> taggato nella nota di '+esc(s.titolo), true);
        notifica('Sei stato taggato nella nota di <b>'+esc(s.titolo)+'</b>', p.id, s.fase, 'user');
      });
      menzionatiOra = null;
      azione('Nota aggiornata su <b>'+esc(s.titolo)+'</b> — '+esc(p.nome));
      logga(p,'Nota aggiornata su '+esc(s.titolo));
      toast('Nota salvata.','ok','Modificato');
    } else if(ctx.k==='assegnato'){
      snap('Assegnazione di «'+s.titolo+'»');
      s.assegnato = v;
      azione('<b>'+esc(s.titolo)+'</b> assegnato a '+esc(U(v).nome)+' — '+esc(p.nome));
      logga(p, esc(s.titolo)+' assegnato a '+esc(U(v).nome), true);
      notifica('Ti è stato assegnato <b>'+esc(s.titolo)+'</b> su '+esc(p.nome), p.id, s.fase, 'users');
      toast(s.titolo+' → '+U(v).nome,'ok','Assegnato');
    } else {
      snap('Rinomina di «'+s.titolo+'»');
      azione('Task rinominata: «'+esc(s.titolo)+'» → «'+esc(v)+'» — '+esc(p.nome));
      s.titolo = v; logga(p, 'Task rinominata in '+esc(v));
      toast('Task rinominata.','ok','Modificato');
    }
  } else if(ctx.t==='tag'){
    const s = p.subs.find(x=>x.id===ctx.id);
    const x = taggatiOk(s)[ctx.i]; if(!x) return;
    snap('Ruolo di '+U(x.u).nome+' su «'+s.titolo+'»');
    x.ruolo = v || 'Collaboratore';
    azione('<b>'+esc(U(x.u).nome)+'</b> ora è <b>'+esc(x.ruolo)+'</b> su '+esc(s.titolo));
    logga(p,'<b>'+esc(U(x.u).nome)+'</b> ora è '+esc(x.ruolo)+' su '+esc(s.titolo));
  } else if(ctx.t==='item'){
    const s = p.subs.find(x=>x.id===ctx.id);
    snap('Modifica della subtask «'+s.items[ctx.i].t+'»');
    azione('Subtask modificata: «'+esc(s.items[ctx.i].t)+'» → «'+esc(v)+'» — '+esc(p.nome));
    s.items[ctx.i].t = v; logga(p, 'Subtask aggiornata: '+esc(v));
    toast('Subtask aggiornata.','ok','Modificato');
  } else if(ctx.t==='evento'){
    snap('Rinomina dell\'evento «'+p.eventi[ctx.i].t+'»');
    azione('Evento rinominato: «'+esc(p.eventi[ctx.i].t)+'» → «'+esc(v)+'» — '+esc(p.cliente));
    p.eventi[ctx.i].t = v;
    toast('Evento rinominato.','ok','Modificato');
  } else if(ctx.t==='fase'){
    snap('Responsabile della fase '+FZ(p)[ctx.i].nome);
    p.faseAss[ctx.i] = v;
    azione('Fase <b>'+FZ(p)[ctx.i].nome+'</b> assegnata a '+esc(U(v).nome)+' — '+esc(p.nome));
    logga(p, 'Fase '+FZ(p)[ctx.i].nome+' assegnata a '+esc(U(v).nome), true);
    notifica('Sei responsabile della fase <b>'+FZ(p)[ctx.i].nome+'</b> su '+esc(p.nome), p.id, ctx.i, FZ(p)[ctx.i].icon);
    toast(FZ(p)[ctx.i].nome+' → '+U(v).nome,'ok','Fase assegnata');
  }
  editCtx = null; chiudiModale(); render();
}

    modale('<h3>Sblocca il progetto</h3><div class="sub-t">'+esc(p.nome)+'</div>'+

      '<button class="btn primary" data-action="sblocca">'+svg('unlock')+'Sblocca</button></div>');
  }
  setTimeout(()=>{ const n=el('lk_pw'); if(n) n.focus(); },40);
}

const PROTETTE = ['check-lista','add-lista','togli-voce','nuova-lista','edit','salva-campo','check','fase','indietro','riprendi','add-user','assegna',
                  'elimina-progetto','conferma-elimina','sposta-ev','rinomina-ev','elimina-ev',
                  'add-compito','elimina-compito','elimina-task','tagga','tagga-chi','stagga',
                  'assegna-sub','assegna-sub-chi',
                  'sub-tutto','sub-azzera','annulla',
                  'nuova-task','sposta-spazio','completa','data-nuova','data-salva'];

document.addEventListener('click', function(e){
  if(appenaTenuto){ appenaTenuto = false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]'); if(!t) return;
  const a = t.dataset.action;
  const dentroCtx = !!t.closest('.ctx');
  const p = t.dataset.pid ? state.progetti.find(x=>x.id===t.dataset.pid) : (state.progettoId ? PROJ() : null);
  if(PROTETTE.indexOf(a)>=0 && bloccato(p)){ chiudiCtx(); return; }
  const no = state.schermo!=='gate' && negato(a);
  if(no){
    chiudiCtx();
    toast(no==='admin'? 'Questa cosa la decide l\u2019amministratore.'
                      : (mieiPermessi.sola_lettura? 'Il tuo profilo \u00e8 in sola lettura: puoi guardare ma non cambiare.'
                                                   : 'L\u2019amministratore ti ha tolto questo permesso.'),'warn','Profilo guest');
    return;
  }
  if(dentroCtx) chiudiCtx();

  switch(a){
    case 'lock': modaleLock(t.dataset.pid || (p&&p.id)); break;

    /* ---- spazi di lavoro ---- */
    case 'spazi':
      state.schermo='spazi'; state.progettoId=null; state.showFeed=false; render(); break;

    case 'apri-spazio':
      state.spazioId = t.dataset.id; state.schermo='home'; state.filtroAttivo=null;
      state.filtro=''; render();
      toast(SPZ().nome+' — '+listaProgetti().length+' progetti.','info','Spazio aperto'); break;

    case 'nuovo-spazio': apriWizard(false); break;

    case 'nuova-nota':
      nuovaNota(t.dataset.x? Number(t.dataset.x):null, t.dataset.y? Number(t.dataset.y):null); break;

    case 'colore-nota':{
      const sp = SPZ(), n = (sp.note||[]).find(x=>x.id===t.dataset.id); if(!n) break;
      n.col = PASTELLI[(PASTELLI.indexOf(n.col)+1) % PASTELLI.length];
      render(); break; }

    case 'ordina-note':{
      const sp = SPZ(); (sp.note||[]).forEach((n,i)=>{
        n.x = 26 + (i%5)*200; n.y = 24 + Math.floor(i/5)*170; n.w = 186; n.h = 150;
      });
      azione('Bacheca riordinata'); render(); break; }

    case 'elimina-nota':{
      const sp = SPZ(); const i = (sp.note||[]).findIndex(x=>x.id===t.dataset.id);
      if(i<0) break;
      const testo = (sp.note[i].tx||'').slice(0,28);
      sp.note.splice(i,1);
      azione('Nota eliminata'+(testo? ': «'+esc(testo)+'…»':''));
      render(); toast('Nota eliminata.','warn','Bacheca'); break; }

    case 'menu-sposta':{
      const r = t.getBoundingClientRect();
      apriCtx(r.left, r.bottom+6, 'Sposta «'+esc(p.nome)+'» in',
        state.spazi.filter(sp=>sp.id!==p.spazio).map(sp=>
          ({a:'sposta-spazio', l:esc(sp.nome), ic:sp.icona, d:D({pid:p.id, sp:sp.id})})), null);
      break; }

    case 'sposta-spazio':{
      const sid = t.dataset.sp;
      snap('Spostamento di «'+p.nome+'»');
      const vecchio = state.spazi.find(x=>x.id===p.spazio);
      p.spazio = sid;
      const nuovo = state.spazi.find(x=>x.id===sid);
      azione('<b>'+esc(p.nome)+'</b> spostato da '+esc(vecchio?vecchio.nome:'—')+' a <b>'+esc(nuovo.nome)+'</b>');
      logga(p,'Spostato nello spazio '+esc(nuovo.nome), true);
      render(); toast(p.nome+' ora è in «'+nuovo.nome+'».','ok','Spostato'); break; }

    case 'modifica-spazio':{
      const sp = state.spazi.find(x=>x.id===(t.dataset.id||state.spazioId)); if(!sp) break;
      spazioMod = sp.id;
      modale('<h3>Modifica lo spazio</h3><div class="sub-t">'+esc(sp.nome)+'</div><div class="modal-b">'+
        '<div class="field"><label>Nome</label><input id="sp_nome" value="'+esc(sp.nome)+'"></div>'+
        '<div class="field"><label>Descrizione</label><input id="sp_desc" value="'+esc(sp.desc||'')+'"></div>'+

    case 'noop': break;

    case 'fase':{

      if(i === p.fase) break;
      const avanza = i > p.avanz;
      if(avanza && !t.dataset.ok){
        /* avanzare chiude le fasi prima: un tocco per sbaglio sulla barra

        const aperte = p.subs.filter(s=>s.fase===p.fase).reduce((n,s)=>n+s.items.filter(x=>!x.done).length,0);

          {a:'noop', ic:'list', l:(aperte? aperte+(aperte===1?' cosa ancora aperta':' cose ancora aperte')+' in '+esc(FZ(p)[p.fase].nome) : 'Tutto spuntato in '+esc(FZ(p)[p.fase].nome)), off:1}
        ], t);

      }
      if(t.dataset.ok) chiudiCtx();
      snap(avanza? 'Avanzamento a '+FZ(p)[i].nome : 'Passaggio a '+FZ(p)[i].nome);
      if(avanza) azione('Fase avanzata a <b>'+FZ(p)[i].nome+'</b> — '+esc(p.nome));
      p.fase = i;
      if(avanza){ p.avanz = i; p.revisione=false;

    case 'indietro':{

      const r = t.getBoundingClientRect();

      if(p.revisione){
        voci.unshift({sep:1});

    case 'check-riga':

    case 'check':{

      snap('Voce di checklist'); it2.lista = it2.lista || [];
      it2.lista.push({t:tx, done:false});

      logga(p, 'In <b>'+esc(it2.t)+'</b> aggiunta la voce \u00ab'+esc(tx)+'\u00bb');

      snap((v.done?'Riapertura':'Spunta')+' di \u00ab'+v.t+'\u00bb');
      v.done = !v.done;
      const cambiata = allineaLista(it2);
      logga(p, (v.done?'\u2713 ':'\u21ba ')+esc(v.t)+' \u2014 checklist di '+esc(it2.t));
      if(cambiata && it2.done) logga(p, '\u2713 '+esc(it2.t)+' \u2014 '+esc(s2.titolo)+' (checklist completa)');

      if(cambiata && it2.done){

      } else if(cambiata) toast('\u00ab'+it2.t+'\u00bb torna da fare.','info','Riaperta');
      break; }

    case 'login':{
      if(!sb){ state.schermo='home'; chiudiModale(); render(); break; }
      const b = el('gateBtn'); b.disabled = true; b.textContent = 'Accedo\u2026';
      const mail = (el('g_mail').value||'').trim(), pw = el('g_pw').value;
      /* se un'uscita sta ancora finendo, aspetto: non deve chiudere l'accesso nuovo */
      (uscita || Promise.resolve()).then(()=>entraCloud(mail, pw)).then(ok=>{
        if(ok){ state.schermo = 'spazi'; chiudiModale(); render();       // si parte sempre dagli spazi
                if(applicaIndirizzo()) return;           // entrato da un link o da un avviso
                if(nuovoArrivato || !state.spazi.length) apriWizard(true);
                toast('Bentornato, '+nomeVisibile().split(' ')[0]+'.','ok','Accesso effettuato'); }
        else render();
      });
      break; }

    case 'me':
      if(state.schermo==='gate') break;
      if(state.schermo!=='profilo') state.push = null;       // rileggo gli avvisi: il permesso puo' essere cambiato
      state.schermo='profilo'; chiudiModale(); render(); break;

    case 'esci':
      chiudiWizard(); chiudiCtx();
      /* prima tolgo questo dispositivo dagli avvisi (serve ancora l'accesso), poi esco */
      /* esco solo da questo dispositivo: telefono e computer restano dentro */
      if(sb){ const fuori = () => sb.auth.signOut({scope:'local'}).catch(()=>{});
        uscita = pushEsci().then(fuori, fuori).then(()=>{ uscita = null; }); }
      state.push = null;
      try{ if(location.hash) history.replaceState(null, '', location.pathname + location.search); }catch(e){}
      if(canale && sb){ try{ sb.removeChannel(canale); }catch(e){} canale = null; }
      giaCollegato = false;
      utenteCloud = null; state.gateModo = 'login';
      cloudPronto = false; nuovoArrivato = false;
      state.schermo='gate'; chiudiModale(); render();
      toast('Sessione chiusa.','info'); break;

    case 'cfg':{
      const k = t.dataset.k, nuovo = !state.cfg[k];
      const et = k==='boxFull'?'Box a schermo intero':k==='toast'?'Avvisi in alto a destra':'Notifiche solo dei tuoi progetti';
      if(k==='toast' && !nuovo) toast(et+' disattivati.','info');   // ultimo avviso prima di spegnerli
      state.cfg[k] = nuovo; render();
      if(typeof salvaProfiloCloud === 'function') salvaProfiloCloud();
      if(nuovo || k!=='toast') toast(et+(nuovo?' attivi.':' disattivati.'),'info');
      break; }

    case 'tema-set':{
      const id = t.dataset.t; state.cfg.tema = id;
      document.documentElement.setAttribute('data-tema', id);
      render();
      const T = TEMI.find(x=>x.id===id);
      toast('«'+T.nome+'» applicato a tutta l\'app.','ok','Tema cambiato'); break; }

    case 'togli-foto':
      state.me.foto = null; U(state.utente).foto = null; render(); applicaProfilo();
      toast('Foto rimossa.','info'); break;

    case 'salva-profilo':{
      ['nome','cognome','nick','email','ruolo','link'].forEach(k=>{
        const n = el('pf_'+(k==='nick'?'nick':k)); if(n) state.me[k] = n.value.trim();
      });
      const s = el('pf_snooze'); if(s) state.cfg.snoozeMin = Number(s.value);
      const u = U(state.utente);
      u.nome = nomeVisibile(); u.ini = iniziali(); u.ruolo = state.me.ruolo || u.ruolo; u.foto = state.me.foto;
      render(); salvaProfiloCloud();
      toast('Profilo aggiornato — ora sei «'+nomeVisibile()+'».','ok','Salvato'); break; }

    case 'theme':{
      const nuovo = tema()==='light'?'dark':'light';
      document.documentElement.setAttribute('data-theme', nuovo);
      if(state.schermo==='profilo') render(); else renderTop();
      break; }
  }
});

function inviaMessaggio(){
  const p = PROJ(), c = el('composer'); if(!c) return;
  const tx = c.value.trim(); if(!tx){ toast('Scrivi qualcosa prima di inviare.','warn'); return; }
  const m = {u:state.utente, tx:esc(tx).replace(/\b(\d{2}:\d{2}:\d{2}:\d{2})\b/g,'<code>$1</code>'), t:Date.now()};
  p.chat.push(m);

/* Conferma discreta sul tasto stesso: niente riquadri che coprono la pagina. */

let staTrascinando = false;
const ultimoPunto = {x:120, y:140};

/* ---------- PRESSIONE PROLUNGATA: 2 secondi per modificare ----------
   Vale su tutto: titoli, clienti, campi della scheda, task, subtask, note,
   responsabili. Mouse, dito e Apple Pencil passano dagli stessi eventi.
   Durante l'attesa il campo si riempie, così si capisce che sta succedendo. */
const TENUTA = 1500;
const ZONE_TENUTA = '.spec, .kv, .proj-head .cli, .proj-head h1, .work-head .editabile, '+
                    '.sub-h, .chk, .riga, .task-nota, .sp-head h1, .rail-sec .kv';
let tenuta = null, appenaTenuto = false;

function fermaTenuta(){
  if(!tenuta) return;
  clearTimeout(tenuta.t);
  tenuta.zona.classList.remove('in-tenuta');
  tenuta.zona.style.removeProperty('--tenuta');
  tenuta = null;
}
document.addEventListener('pointerdown', function(e){
  if(e.button && e.button !== 0) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.target.closest('.ctx, .modal, .drawer, .postit')) return;
  const zona = e.target.closest(ZONE_TENUTA);
  if(!zona) return;
  /* Se qui esce gia' il menu tenendo premuto, la rinomina la fa il menu:
     la striscia deve misurare quella presa, non un'attesa piu' lunga
     che tanto non arriva mai. */
  const conMenu = !!e.target.closest(ZONE_MENU);
  const durata = conMenu ? ATTESA_PRESA : TENUTA;
  const matita = zona.querySelector('.pen');
  if(!matita || bloccato(state.progettoId?PROJ():null)) return;
  const x0 = e.clientX, y0 = e.clientY;
  zona.classList.add('in-tenuta');
  zona.style.setProperty('--tenuta', durata+'ms');
  if(conMenu){
    /* la striscia serve solo a far vedere che sto premendo: la presa
       apre il menu per conto suo */
    tenuta = {zona, matita, x0, y0, t:setTimeout(()=>{ fermaTenuta(); }, durata)};
    return;
  }
  tenuta = {zona, matita, x0, y0, t:setTimeout(()=>{
    const z = tenuta; fermaTenuta();
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(err){}
    z.matita.click();                 // prima apro, poi alzo la bandiera:
    appenaTenuto = true;              // così mangio solo il click dell'utente
    setTimeout(()=>{ appenaTenuto = false; }, 600);
  }, durata)};
}, true);
document.addEventListener('pointermove', function(e){
  if(!tenuta) return;
  if(Math.abs(e.clientX-tenuta.x0) > 8 || Math.abs(e.clientY-tenuta.y0) > 8) fermaTenuta();
}, true);
['pointerup','pointercancel','scroll','wheel'].forEach(ev=>
  document.addEventListener(ev, fermaTenuta, true));
let schermoCtx = '';
function chiudiCtx(){
  if(ctxEl){ ctxEl.remove(); ctxEl = null; }
  if(ctxMarked){ ctxMarked.classList.remove('ctx-target'); ctxMarked = null; }
}
/* il campo su cui ho premuto col tasto destro (o tenuto premuto): la sua
   modifica va in cima al menu, al posto della matita che non c'e' piu' */
let ctxModifica = null;
function vocePerCampo(t){
  const zona = t && t.closest && t.closest('.kv, .spec, .sub-h, .chk, .riga, .sub-note, .task-nota, .proj-head .cli, .proj-head h1, .work-head .editabile, .rail-sec');
  if(!zona || zona.closest('.ctx, .modal, #cmLayer')) return null;
  const soldi = zona.querySelector('.pen[data-action="conti"]');
  if(soldi && !zona.querySelector('.pen[data-action="edit"]')) return {a:'conti', l:'Soldi del lavoro', ic:'euro', d:D({pid:soldi.dataset.pid})};
  if(zona.classList.contains('rail-sec') && zona.querySelectorAll('.pen[data-action="edit"]').length !== 1) return null;
  const pn = zona.matches('[data-action="edit"]') ? zona : zona.querySelector('.pen[data-action="edit"]');
  if(!pn) return null;
  const q = pn.dataset, pr = Pdi({pid:q.pid||null});
  let l = 'Modifica';
  if(q.t==='proj' && pr) l = q.k==='nome' ? 'Rinomina il progetto' : 'Modifica \u00ab'+esc(etichettaDi(pr, q.k))+'\u00bb';
  else if(q.t==='sub') l = q.k==='titolo' ? 'Rinomina la task' : q.k==='assegnato' ? 'Cambia il responsabile' : q.k==='nota' ? 'Modifica la descrizione' : 'Modifica';
  else if(q.t==='item') l = 'Rinomina la subtask';
  else if(q.t==='fase') l = 'Cambia il responsabile della fase';
  const dd = ['t','k','id','i','pid'].filter(k=>q[k]!=null && q[k]!=='').map(k=>'data-'+k+'="'+esc(q[k])+'"').join(' ');
  return {a:'edit', l, ic:'pen', d:dd, off:isLock(pr)};
}
function apriCtx(x, y, titolo, voci, bersaglio){
  chiudiCtx();
  voci = voci.filter(Boolean);            // le voci che valgono solo in certi casi arrivano come null
  if(ctxModifica && Date.now() - ctxModifica.t < 80){
    const v = ctxModifica.v;
    const chiave = d => { const m = {}; String(d||'').replace(/data-(\w+)="([^"]*)"/g, (_,k,x)=>{ m[k] = x; }); return [m.t||'', m.k||'', m.i||'', m.id||''].join('|'); };
    const gia = voci.some(w=>w && w.a===v.a && (v.a!=='edit' || chiave(w.d)===chiave(v.d)));
    if(!gia) voci = [v, {sep:1}].concat(voci);
  }
  ctxModifica = null;
  if(!sonoAdmin){
    voci = voci.filter(v => !v || !v.a || !negato(v.a));
    /* niente separatori doppi o in cima/fondo dopo il filtro */
    voci = voci.filter((v,i,arr) => !(v && v.sep) || (i>0 && i<arr.length-1 && !(arr[i-1]&&arr[i-1].sep)));
  }
  const d = document.createElement('div');
  d.className = 'ctx';
  d.innerHTML = (titolo? '<div class="ctx-h">'+titolo+'</div>' : '')+
    voci.map(v => v.sep ? '<div class="ctx-sep"></div>' :
      '<button class="ctx-i'+(v.danger?' danger':'')+'" data-action="'+v.a+'" '+(v.d||'')+(v.off?' disabled':'')+'>'+
        (v.ic? svg(v.ic,2) : '<span style="width:14px"></span>')+'<span>'+v.l+'</span>'+
        (v.k? '<kbd>'+v.k+'</kbd>':'')+'</button>').join('');
  document.body.appendChild(d);
  /* misure senza l'animazione di entrata (che lo rimpicciolisce):
     cosi' il menu non finisce mai sotto il bordo dello schermo */
  d.style.maxHeight = (window.innerHeight - 16)+'px'; d.style.overflowY = 'auto';
  const r = {width:d.offsetWidth, height:d.offsetHeight};
  d.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 8))+'px';
  d.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8))+'px';
  ctxEl = d;
  if(bersaglio){ bersaglio.classList.add('ctx-target'); ctxMarked = bersaglio; }
}
const D = o => Object.keys(o).map(k=>'data-'+k+'="'+o[k]+'"').join(' ');

  const su = sotto && sotto.closest && sotto.closest('.vs');

/* ============ TRASCINAMENTO EVENTI ============ */
/* a puntatore, così funziona con mouse, dito e Apple Pencil allo stesso modo */
function itaData(iso){ const p = (iso||'').split('-'); return p.length===3? p[2]+'/'+p[1]:iso; }

let evTrascinato = null;
document.addEventListener('pointerdown', function(e){
  const ev = e.target.closest && e.target.closest('.ev');
  if(!ev || state.vista!=='calendario') return;
  const p = state.progetti.find(x=>x.id===ev.dataset.p);
  if(!p || isLock(p)) return;
  evTrascinato = {ev, p, i:Number(ev.dataset.i), x0:e.clientX, y0:e.clientY, partito:false, id:e.pointerId};
});
document.addEventListener('pointermove', function(e){
  if(!evTrascinato) return;
  const d = Math.abs(e.clientX-evTrascinato.x0) + Math.abs(e.clientY-evTrascinato.y0);
  if(!evTrascinato.partito){
    if(d < 8) return;                       /* sotto la soglia è un tocco, non un trascinamento */
    evTrascinato.partito = true;
    const r = evTrascinato.ev.getBoundingClientRect();
    evTrascinato.dx = evTrascinato.x0 - r.left;
    evTrascinato.dy = evTrascinato.y0 - r.top;
    evTrascinato.w = r.width;
    const fant = evTrascinato.ev.cloneNode(true);
    fant.classList.add('fantasma');
    fant.style.width = r.width+'px';
    document.body.appendChild(fant);
    evTrascinato.fant = fant;
    staTrascinando = true;
    evTrascinato.ev.classList.add('dragging');
    try{ evTrascinato.ev.setPointerCapture(e.pointerId); }catch(err){}
  }
  e.preventDefault();
  evTrascinato.fant.style.left = (e.clientX - evTrascinato.dx)+'px';
  evTrascinato.fant.style.top  = (e.clientY - evTrascinato.dy)+'px';
  const sotto = document.elementFromPoint(e.clientX, e.clientY);
  const giorno = sotto && sotto.closest && sotto.closest('.day[data-iso]');
  document.querySelectorAll('.day.over').forEach(n=>{ if(n!==giorno) n.classList.remove('over'); });
  if(giorno) giorno.classList.add('over');
  evTrascinato.giorno = giorno;
}, {passive:false});
document.addEventListener('pointerup', function(e){
  if(!evTrascinato) return;
  const {ev, p, i, partito, fant, giorno} = evTrascinato;
  evTrascinato = null;
  if(fant) fant.remove();
  ev.classList.remove('dragging');
  document.querySelectorAll('.day.over').forEach(n=>n.classList.remove('over'));
  if(!partito) return;                       /* tocco semplice: ci pensa il clic */
  if(!giorno) return;
  const nuova = giorno.dataset.iso, e2 = p.eventi[i];
  if(!e2 || e2.d === nuova) return;
  const vecchia = e2.d;
  snap('Spostamento di «'+e2.t+'»');
  e2.d = nuova;
  let extra = '';
  if(eventoConsegna(p)===e2){
    const q = nuova.split('-'); p.consegna = q[2]+'/'+q[1]+'/'+q[0];
    extra = ' — aggiornata anche la data di consegna in scheda';
  }
  azione('Spostato <b>'+esc(e2.t)+'</b> ('+esc(p.cliente)+') dal '+itaData(vecchia)+' al '+itaData(nuova)+esc(extra));
  logga(p, 'Evento <b>'+esc(e2.t)+'</b> spostato al '+itaData(nuova), true);
  render();
});

    }).catch(()=>toast('Immagine non leggibile.','warn','Errore'));
    return;

    const r = new FileReader();

  if(e.target.id==='ordinaSel'){
    const v = e.target.value;
    animaTessere(()=>{ state.ordina = v; renderHome(); });
    return;
  }
  if(e.target.id!=='np_file') return;
  const LIMITE = 10*1024*1024;
  let scartati = 0;

    if(f.size > LIMITE){ scartati++; return; }
    tmpAllegati.push({nome:f.name, size:f.size});

  if(scartati) toast(scartati+' file oltre 10 MB non caricati.','warn','Limite superato');

});

/* ============ TENUTA DEI DATI FRA GLI AGGIORNAMENTI ============ */
/* Ogni versione può aggiungere campi: qui i dati vecchi vengono completati,
   mai sostituiti. Nessun lavoro va perso quando l'app viene aggiornata. */
const SCHEMA = 4;
function normalizza(){
  if(!Array.isArray(state.spazi) || !state.spazi.length){
    state.spazi = [{id:'sp1', nome:'Il mio lavoro', desc:'', icona:'camera', col:'#FFAD01', tipo:'video'}];
  }
  state.spazi.forEach(sp=>{
    if(!sp.id) sp.id = 'sp'+Math.random().toString(36).slice(2,8);
    if(!sp.icona) sp.icona = TIPO(sp.tipo).ic;
    sp.col = coloreOk(sp.col, TIPO(sp.tipo).c);
    if(!sp.tipo) sp.tipo = 'video';
    if(!Array.isArray(sp.note)) sp.note = [];
    if(!Array.isArray(sp.membri)) sp.membri = [state.utente];
    const num = (v, d) => (v === '' || v == null || !isFinite(+v)) ? d : +v;
    sp.note = sp.note.filter(n=>n && typeof n === 'object');
    sp.note.forEach(n=>{
      if(!ID_OK.test(String(n.id||''))) n.id = 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      n.col = coloreOk(n.col, PASTELLI[0]);
      n.x = num(n.x, 24); n.y = num(n.y, 22); n.w = num(n.w, 186); n.h = num(n.h, 150); n.rot = num(n.rot, 0);
    });
  });
  const primo = state.spazi[0].id;
  if(!state.spazi.some(x=>x.id===state.spazioId)) state.spazioId = primo;

  (state.progetti||[]).forEach(p=>{
    if((!p.spazio || !state.spazi.some(x=>x.id===p.spazio)) && mioProgetto(p)) p.spazio = primo;
    if(!p.tipo) p.tipo = 'video';
    if(!Array.isArray(p.fasi) || !p.fasi.length) p.fasi = TIPO(p.tipo).fasi.map(f=>Object.assign({}, f, {campi:(f.campi||[]).map(c=>c.slice())}));
    if(!p.icona) p.icona = TIPO(p.tipo).ic;
    if(!Array.isArray(p.tags)) p.tags = [];
    if(!Array.isArray(p.allegati)) p.allegati = [];
    if(!Array.isArray(p.eventi)) p.eventi = [];
    if(!Array.isArray(p.team) || !p.team.length) p.team = [state.utente];
    if(!p.commenti || typeof p.commenti!=='object') p.commenti = {};
    if(!Array.isArray(p.chat)) p.chat = [];
    if(!Array.isArray(p.log)) p.log = [];
    if(!p.visti) p.visti = {commenti:0, chat:0, attivita:0};
    if(p.tab==='commenti') p.tab = 'chat';           // i commenti ora stanno dentro le task
    if(!p.faseAss) p.faseAss = {};
    if(!p.lock) p.lock = {on:false, pw:''};
    if(p.completato == null) p.completato = false;
    if(!PRIO[p.prio]) p.prio = 'media';
    if(p.col != null) p.col = coloreOk(p.col, TIPO(p.tipo).c);
    if(p.fase == null) p.fase = 0;
    if(p.avanz == null) p.avanz = p.fase;
    p.fase = Math.min(p.fase, p.fasi.length-1);
    p.avanz = Math.min(Math.max(p.avanz, p.fase), p.fasi.length-1);
    if(!Array.isArray(p.subs)) p.subs = [];
    p.subs.forEach(t=>{
      if(!Array.isArray(t.items)) t.items = [];
      t.items.forEach(idVoce);                           // ogni subtask ha il suo nome fisso: serve ai commenti
      if(t.fase == null) t.fase = 0;
      if(!t.assegnato) t.assegnato = p.team[0];
      if(t.nota == null) t.nota = '';
    });
    FZ(p).forEach((f,i)=>{ if(p.faseAss[i]==null) p.faseAss[i] = p.team[i % p.team.length]; });
    if(p.budget!=null){
      const b = numeroDa(p.budget);
      if(b && !(state.conti && state.conti[p.id])) contiDi(p.id, true).preventivo = b;
      delete p.budget;
    }
  });
  if(!state.conti || typeof state.conti!=='object') state.conti = {};
  if(!Array.isArray(state.modelli)) state.modelli = [];

  (state.filtri||[]).forEach(f=>{ if(f.tag===undefined) f.tag = null; });
  if(!Array.isArray(state.azioni)) state.azioni = [];
  if(!Array.isArray(state.notifiche)) state.notifiche = [];
  if(!state.cfg) state.cfg = {};
  if(!state.cfg.tema) state.cfg.tema = 'ardesia';

let orgMia = null;
const orgSpazio = {}, orgProg = {};
let ombraSp = {};

function datiSpazio(sp){ const d = Object.assign({}, sp); delete d.id; return d; }
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

/* chi deve poter aprire questo progetto: il team, i responsabili di fase,
   chi ha una subtask assegnata e chiunque sia taggato dentro */
function membriDi(p){
  const v = [];
  const add = x => { if(x && UUID.test(x) && v.indexOf(x)<0) v.push(x); };
  (p.team||[]).forEach(add);
  Object.keys(p.faseAss||{}).forEach(k=>add(p.faseAss[k]));
  (p.subs||[]).forEach(s=>{
    add(s.assegnato);
    (s.taggati||[]).forEach(t=>add(t && t.u));
    (s.items||[]).forEach(i=>add(i && i.ass));
  });
  return v;
}

/* ============ LAVORI A PEZZI ============
   Sul database un lavoro non e' piu' un blocco unico. Il nucleo (nome,
   cliente, fasi, team, date...) sta in «progetti»; ogni task, subtask, voce
   di checklist, commento, messaggio, voce del registro ed evento ha una riga
   sua in «elementi». Chi salva manda solo i pezzi che ha toccato, e del
   nucleo solo i campi cambiati: due persone sullo stesso lavoro non si
   cancellano piu' il lavoro a vicenda. Le modifiche degli altri arrivano da
   sole, in tempo reale. */
const PEZZI = ['subs','commenti','chat','log','eventi'];
const SOLO_MIEI = ['visti','tab','draft'];                 // di chi guarda, non del lavoro
const FUORI_NUCLEO = PEZZI.concat(SOLO_MIEI, ['id','spazio','budget']);
let ombraNucleo = {}, ombraEl = {}, ombraMembri = {}, ombraConti = {}, ombraMio = '';
let contaOrd = 0;
const vecchioFormato = new Set();       // lavori che il database non e' riuscito a dividere

/* JSON con le chiavi sempre nello stesso ordine: i confronti non sbagliano */
function canon(x){
  if(x === undefined) return 'null';
  if(x === null || typeof x !== 'object') return JSON.stringify(x);
  if(Array.isArray(x)) return '[' + x.map(canon).join(',') + ']';
  return '{' + Object.keys(x).filter(k=>x[k]!==undefined).sort()
    .map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',') + '}';
}
function pulito(o, via){
  const d = {};
  Object.keys(o).forEach(k=>{
    if(via && via.indexOf(k)>=0) return;
    const v = o[k];
    if(v !== undefined && v !== null) d[k] = v;
  });
  return d;
}
function nuovoId(pre){ return pre + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function canonRiga(r){ return canon([r.tipo, r.genitore||null, r.ordine, r.dati]); }
function nucleoDi(p){
  const d = {};
  Object.keys(p).forEach(k=>{ if(FUORI_NUCLEO.indexOf(k)<0 && p[k]!==undefined) d[k] = p[k]; });
  delete d._formato;
  return d;
}

/* il lavoro diviso nelle sue righe; dove manca un id lo assegno qui */
function pezziDi(p){
  const out = {};
  const metti = (id, tipo, genitore, ordine, dati) => { out[id] = {tipo, genitore:genitore||null, ordine, dati}; };
  (p.subs||[]).forEach((s,i)=>{
    if(!s.id) s.id = nuovoId('t');
    metti(s.id, 'task', null, i, pulito(s, ['items','aperto','id']));
    (s.items||[]).forEach((v,j)=>{
      if(!v.id) v.id = nuovoId('v');
      const d = pulito(v, ['lista','id','_o']);
      if(Array.isArray(v.lista)) d.haLista = true;
      metti(v.id, 'voce', s.id, j, d);
      (v.lista||[]).forEach((c,k)=>{
        if(!c.id) c.id = nuovoId('c');
        metti(c.id, 'check', v.id, k, pulito(c, ['id']));
      });
    });
  });
  /* commenti, chat e registro si aggiungono soltanto: il loro posto e' il
     momento in cui sono nati, non la posizione nella lista */
  const tempo = (m, verso) => {
    if(m._o == null) m._o = verso * ((m.t || Date.now()) + (contaOrd++ % 1000) / 1000);
    return m._o;
  };
  Object.keys(p.commenti||{}).forEach(f=>{
    (p.commenti[f]||[]).forEach(m=>{
      if(!m.id) m.id = nuovoId('m');
      metti(m.id, 'commento', null, tempo(m, 1), Object.assign(pulito(m, ['id','_o']), {fase:+f}));
    });
  });
  (p.chat||[]).forEach(m=>{
    if(!m.id) m.id = nuovoId('h');
    metti(m.id, 'chat', null, tempo(m, 1), pulito(m, ['id','_o']));
  });
  (p.log||[]).forEach(l=>{
    if(!l.id) l.id = nuovoId('l');
    metti(l.id, 'log', null, tempo(l, -1), pulito(l, ['id','_o']));
  });
  (p.eventi||[]).forEach((e,i)=>{
    if(!e.id) e.id = nuovoId('e');
    metti(e.id, 'evento', null, i, pulito(e, ['id']));
  });
  return out;
}

/* dalle righe al lavoro com'e' in memoria (l'inverso di pezziDi) */
function componi(p, righe, aperti){
  const per = {task:[], voce:[], check:[], commento:[], chat:[], log:[], evento:[]};
  righe.forEach(r=>{ if(per[r.tipo]) per[r.tipo].push(r); });
  const ord = (a,b)=> (a.ordine - b.ordine) || String(a.id).localeCompare(String(b.id));
  Object.keys(per).forEach(k=>per[k].sort(ord));
  const copia = d => JSON.parse(JSON.stringify(d||{}));
  const checkDi = {};
  per.check.forEach(r=>{ (checkDi[r.genitore] = checkDi[r.genitore]||[]).push(Object.assign({id:r.id}, copia(r.dati))); });
  const vociDi = {};
  per.voce.forEach(r=>{
    const v = Object.assign({id:r.id}, copia(r.dati));
    if(v.haLista || checkDi[r.id]) v.lista = checkDi[r.id] || [];
    delete v.haLista;
    (vociDi[r.genitore] = vociDi[r.genitore]||[]).push(v);
  });
  p.subs = per.task.map(r=>{
    const s = Object.assign({id:r.id}, copia(r.dati));
    s.items = vociDi[r.id] || [];
    s.aperto = aperti ? aperti.has(r.id) : false;
    return s;
  });
  p.commenti = {};
  per.commento.forEach(r=>{
    const m = Object.assign({id:r.id, _o:r.ordine}, copia(r.dati));
    const f = m.fase || 0; delete m.fase;
    (p.commenti[f] = p.commenti[f]||[]).push(m);
  });
  p.chat = per.chat.map(r=>Object.assign({id:r.id, _o:r.ordine}, copia(r.dati)));
  p.log = per.log.map(r=>Object.assign({id:r.id, _o:r.ordine}, copia(r.dati)));
  p.eventi = per.evento.map(r=>Object.assign({id:r.id}, copia(r.dati)));
}
function apertiDi(p){ return new Set((p.subs||[]).filter(s=>s.aperto).map(s=>s.id)); }

/* ---------- lettura a pagine: il database ne da' al massimo 1000 per volta ---------- */
async function tutteLeRighe(fai){
  const out = [];
  for(let da = 0; da < 200000; da += 1000){
    const {data, error} = await fai().range(da, da + 999);
    if(error) throw error;
    out.push.apply(out, data || []);
    if(!data || data.length < 1000) break;
  }
  return out;
}
const COLONNE_EL = 'org_id,progetto_id,id,tipo,genitore,ordine,dati';

function ombraDaNucleo(pid, dati, spazio){
  const o = {};
  Object.keys(dati||{}).forEach(k=>{ if(k!=='_formato' && FUORI_NUCLEO.indexOf(k)<0) o[k] = canon(dati[k]); });
  o.__spazio = spazio;
  ombraNucleo[pid] = o;
}
function lavoroDaRighe(r, righe, vecchio, statoMio){
  const p = Object.assign({id:r.id, spazio:r.spazio_id}, JSON.parse(JSON.stringify(r.dati||{})));
  delete p._formato;
  FUORI_NUCLEO.forEach(k=>{ if(k!=='id' && k!=='spazio') delete p[k]; });
  let aperti = vecchio ? apertiDi(vecchio) : null;
  if(!aperti && statoMio && Array.isArray(statoMio.aperti)) aperti = new Set(statoMio.aperti);
  componi(p, righe, aperti);
  if(vecchio) SOLO_MIEI.forEach(k=>{ if(vecchio[k]!==undefined) p[k] = vecchio[k]; });
  else if(statoMio && statoMio.visti && statoMio.visti[r.id]) p.visti = statoMio.visti[r.id];
  else if(statoMio && statoMio.visti) p.visti = {commenti:0, chat:0, attivita:0};  // nuovo per me: e' tutto da leggere
  else p.visti = {commenti:Object.values(p.commenti).reduce((n,a)=>n+a.filter(m=>!m.task).length,0), chat:p.chat.length, attivita:p.log.length};
  if(!aperti){   // prima volta: apro la prima task della fase in corso
    const prima = p.subs.find(s=>s.fase===(p.fase||0));
    if(prima) prima.aperto = true;
  }
  orgProg[r.id] = r.org_id;
  ombraDaNucleo(r.id, r.dati, r.spazio_id);
  const oe = ombraEl[r.id] = {};
  righe.forEach(x=>{ oe[x.id] = canonRiga(x); });
  ombraMembri[r.id] = canon(membriDi(p).slice().sort());
  return p;
}

    righe.forEach(r=>{ (perLavoro[r.progetto_id] = perLavoro[r.progetto_id]||[]).push(r); });

    ombraSp = {}; ombraNucleo = {}; ombraEl = {}; ombraMembri = {}; ombraConti = {};
    state.spazi = (sps||[]).map(r=>{
      orgSpazio[r.id] = r.org_id;
      ombraSp[r.id] = JSON.stringify(r.dati)+'|'+r.ordine;
      return Object.assign({id:r.id}, r.dati);
    });
    vecchioFormato.clear();
    state.progetti = (prs||[]).map(r=>{
      if(r.dati && String(r.dati._formato)==='2') return lavoroDaRighe(r, perLavoro[r.id]||[], null, st);
      /* non sono riuscito a dividerlo: lo mostro com'e', senza scriverci sopra */
      vecchioFormato.add(r.id); orgProg[r.id] = r.org_id;
      return Object.assign({id:r.id, spazio:r.spazio_id}, r.dati||{});
    });
    if(vecchioFormato.size) console.warn('lavori nel formato vecchio, in sola lettura:', Array.from(vecchioFormato).join(', '));

    /* soldi: arrivano solo a chi li puo' vedere */
    state.conti = {};
    if(puo('soldi')){
      const {data:cs} = await sb.from('conti').select('progetto_id,dati');
      (cs||[]).forEach(c=>{ state.conti[c.progetto_id] = c.dati || {}; ombraConti[c.progetto_id] = canon(c.dati||{}); });
    }
    /* i modelli salvati dell'archivio */
    state.modelli = [];
    if(orgMia){
      const {data:md} = await sb.from('modelli').select('id,nome,tipo,dati,creato_da,creato_il').eq('org_id', orgMia).order('creato_il');
      state.modelli = (md||[]).map(m=>Object.assign({id:m.id, nome:m.nome, tipo:m.tipo, creato_da:m.creato_da}, m.dati||{}));
    }

    /* Nei dati ci sono anche persone senza account (quelle messe in squadra
       prima che si registrassero): le tengo con nome e ruolo, segnate come
       "senza account", cosi' non diventano tutte me. */
    const noti = {}; state.utenti.forEach(u=>noti[u.id]=1);
    const citati = {};
    const cita = x => { if(x && !noti[x]) citati[x] = 1; };
    state.progetti.forEach(p=>{
      (p.team||[]).forEach(cita);
      Object.keys(p.faseAss||{}).forEach(k=>cita(p.faseAss[k]));
      (p.subs||[]).forEach(s=>{ cita(s.assegnato);
        (s.taggati||[]).forEach(t=>cita(t && t.u));
        (s.items||[]).forEach(i=>cita(i && i.ass)); });
    });
    state.spazi.forEach(sp=>(sp.membri||[]).forEach(cita));
    Object.keys(citati).forEach((id,i)=>{
      const d = UTENTI.find(u=>u.id===id);
      state.utenti.push(d ? Object.assign({}, d, {senzaAccount:true})
        : {id:id, nome:'Collaboratore', ini:'?', ruolo:'senza account', col:COL(i+3), senzaAccount:true});
    });

    /* i profili creati dall'amministratore che non si sono ancora registrati */
    state.inviti = [];
    if(sonoAdmin && orgMia){
      const {data:inv} = await sb.from('inviti').select('id,nome,cognome,nickname,email,ruolo,usato').eq('org_id', orgMia);
      state.inviti = inv || [];
    }

    state.filtri = st.filtri || state.filtri;
    state.notifiche = (st.notifiche || []).filter(n=>!n.db);
    await caricaNotifiche();
    state.azioni = st.azioni || [];
    state.vista = st.vista || 'tessere';
    /* mi apro sullo spazio dove ho davvero qualcosa: a un collaboratore non
       serve atterrare in uno spazio del titolare dove non ha nessun progetto */
    const visibili = state.spazi.filter(sp => (orgSpazio[sp.id]||orgMia)===orgMia
                     || state.progetti.some(p=>p.spazio===sp.id));
    if(st.spazioId && visibili.some(x=>x.id===st.spazioId)) state.spazioId = st.spazioId;
    else state.spazioId = visibili.length ? visibili[0].id : (state.spazi[0]||{}).id || null;

    cloudPronto = true;
    if(!state.progetti.length && !state.spazi.length){
      nuovoArrivato = true;
      state.progettoId = null;
    } else {
      normalizza();
    }
    ombraMio = '';
    giaCollegato = false;
    ascoltaCloud();
    risincronizzaPush();
  }catch(e){
    cloudPronto = false;
    console.warn('caricamento:', e && e.message);
    toast('Non sono riuscito a leggere i dati dal cloud: lavoro solo in locale e non sovrascrivo niente. Ricarica la pagina quando torna la connessione.','warn','Sincronizzazione ferma');
  }
}

/* ============ SALVATAGGIO ============ */
const NIENTE_PERMESSO = /42501|row-level security|violates|permission|23505|duplicate key/i;
let avvisoPermesso = 0;
function niente(error){ return error && NIENTE_PERMESSO.test((error.code||'')+' '+(error.message||'')); }
function avvisaPermesso(){
  if(Date.now() - avvisoPermesso < 20000) return;
  avvisoPermesso = Date.now();
  toast('Una modifica non \u00e8 stata salvata: su questo lavoro non hai il permesso di cambiarla.','warn','Non salvato');
}

async function salvaLavoro(p, org, errori){
  /* 1. il nucleo: solo i campi cambiati */
  const ora = nucleoDi(p), ombra = ombraNucleo[p.id];
  const patch = {}, via = [], canonOra = {};
  Object.keys(ora).forEach(k=>{ const c = canon(ora[k]); canonOra[k] = c; if(!ombra || ombra[k] !== c) patch[k] = ora[k]; });
  if(ombra) Object.keys(ombra).forEach(k=>{ if(k!=='__spazio' && !(k in ora)) via.push(k); });
  const spostato = !ombra || ombra.__spazio !== p.spazio;
  if(Object.keys(patch).length || via.length || spostato){
    const {error} = await sb.rpc('salva_progetto', {p_org:org, p_id:p.id, p_spazio:p.spazio||null, p_patch:patch, p_via:via});
    if(error && !niente(error)){ errori.push(error.message); return; }
    if(error) avvisaPermesso();
    if(!error || ombra){
      const o = ombraNucleo[p.id] = ombraNucleo[p.id] || {};
      Object.keys(patch).forEach(k=>{ o[k] = canonOra[k]; });
      via.forEach(k=>{ delete o[k]; });
      o.__spazio = p.spazio;
      orgProg[p.id] = org;
    }
    if(error && !ombra) return;           // il lavoro non esiste per me: inutile mandare i pezzi
  }
  /* 2. chi lo vede (prima dei pezzi: un guest deve poter scrivere nel lavoro che ha appena creato) */
  const mb = membriDi(p), cm = canon(mb.slice().sort());
  if(ombraMembri[p.id] !== cm){
    const r = await sb.rpc('sincronizza_membri', {p_org:org, p_prog:p.id, p_utenti:mb});
    if(r.error) console.warn(r.error.message); else ombraMembri[p.id] = cm;
  }
  /* 3. i pezzi: solo le righe cambiate, e via quelle tolte */
  const L = pezziDi(p), oe = ombraEl[p.id] = ombraEl[p.id] || {};
  const su = [], cs = {}, via2 = [];
  Object.keys(L).forEach(id=>{
    const c = canonRiga(L[id]);
    if(oe[id] !== c){
      su.push({org_id:org, progetto_id:p.id, id, tipo:L[id].tipo, genitore:L[id].genitore, ordine:L[id].ordine, dati:L[id].dati});
      cs[id] = c;
    }
  });
  Object.keys(oe).forEach(id=>{ if(!L[id]) via2.push(id); });
  for(let i=0; i<su.length; i+=400){
    const pezzo = su.slice(i, i+400);
    const {error} = await sb.from('elementi').upsert(pezzo, {onConflict:'org_id,progetto_id,id'});
    if(error && !niente(error)){ errori.push(error.message); break; }
    if(error) avvisaPermesso();
    pezzo.forEach(r=>{ oe[r.id] = cs[r.id]; });
  }
  for(let i=0; i<via2.length; i+=150){
    const pezzo = via2.slice(i, i+150);
    const {error} = await sb.from('elementi').delete().eq('org_id', org).eq('progetto_id', p.id).in('id', pezzo);
    if(error && !niente(error)){ errori.push(error.message); break; }
    pezzo.forEach(id=>{ delete oe[id]; });
  }
  /* 4. i soldi, se li posso toccare */
  const co = state.conti && state.conti[p.id];
  if(co && puo('soldi')){
    const c = canon(co);
    if(ombraConti[p.id] !== c){
      const {error} = await sb.from('conti').upsert({org_id:org, progetto_id:p.id, dati:co}, {onConflict:'org_id,progetto_id'});
      if(error && !niente(error)) errori.push(error.message);
      else { if(error) avvisaPermesso(); ombraConti[p.id] = c; }
    }
  }
}

/* Scrivo solo quello che e' cambiato davvero, pezzo per pezzo. */
let inCorso = false, daRifare = false;
async function sincronizza(){
  if(!sb || !utenteCloud || !cloudPronto) return;
  if(inCorso){ daRifare = true; return; }
  inCorso = true;
  const errori = [];
  try{
    for(let i=0;i<state.spazi.length;i++){
      const sp = state.spazi[i];
      const org = orgSpazio[sp.id] || orgMia;
      if(org !== orgMia || !puo('spazi')) continue;      // senza permesso gli spazi non li scrivo
      const d = datiSpazio(sp), j = JSON.stringify(d)+'|'+i;
      if(j === ombraSp[sp.id]) continue;
      const {error} = await sb.from('spazi').upsert({org_id:org, id:sp.id, dati:d, ordine:i}, {onConflict:'org_id,id'});
      if(error){ errori.push(error.message); continue; }
      ombraSp[sp.id] = j; orgSpazio[sp.id] = org;
    }
    for(const p of state.progetti){
      if(vecchioFormato.has(p.id)) continue;
      const org = orgProg[p.id] || orgSpazio[p.spazio] || orgMia;
      if(!org) continue;
      await salvaLavoro(p, org, errori);
    }
    for(const id in ombraNucleo){
      if(state.progetti.some(p=>p.id===id)) continue;
      const {error} = await sb.from('progetti').delete().match({org_id:orgProg[id]||orgMia, id:id});
      if(error && !niente(error)){ errori.push(error.message); continue; }
      delete ombraNucleo[id]; delete ombraEl[id]; delete ombraMembri[id]; delete ombraConti[id]; delete orgProg[id];
    }
    for(const id in ombraSp){
      if(state.spazi.some(x=>x.id===id)) continue;
      if((orgSpazio[id]||orgMia) !== orgMia) continue;
      await sb.from('spazi').delete().match({org_id:orgSpazio[id]||orgMia, id:id});
      delete ombraSp[id]; delete orgSpazio[id];
    }
    /* le cose solo mie: filtri, notifiche, vista, cosa ho letto, cosa tengo aperto */
    const visti = {}, aperti = [];
    state.progetti.forEach(p=>{
      if(p.visti) visti[p.id] = p.visti;
      (p.subs||[]).forEach(s=>{ if(s.aperto) aperti.push(s.id); });
    });
    const stato = {filtri:state.filtri, notifiche:(state.notifiche||[]).filter(n=>!n.db).slice(0,60),
                   azioni:(state.azioni||[]).slice(0,200), vista:state.vista, spazioId:state.spazioId,
                   visti, aperti};
    const cm = canon(stato);
    if(cm !== ombraMio){
      /* le discussioni lette: tengo la lettura piu' recente fra questo dispositivo e gli altri */
      try{
        const {data:ora} = await sb.from('spazio_lavoro').select('stato').eq('utente_id', utenteCloud.id).maybeSingle();
        const altri = (ora && ora.stato && ora.stato.visti) || {};
        Object.keys(altri).forEach(pid=>{
          const a = altri[pid] && altri[pid].thr, mio = visti[pid];
          if(!a || !mio) return;
          if(!mio.thr) mio.thr = {};
          Object.keys(a).forEach(k=>{ if(+a[k] > (+mio.thr[k] || 0)) mio.thr[k] = +a[k]; });
        });
      }catch(e){}
      const {error} = await sb.from('spazio_lavoro').upsert({utente_id: utenteCloud.id, stato});
      if(!error) ombraMio = canon(stato);
    }
  }catch(e){ errori.push(e.message||'errore'); }
  inCorso = false;
  if(errori.length) console.warn('sincronizzazione:', errori.join(' / '));
  if(daRifare){ daRifare = false; sincronizza(); }
}
function salvaCloud(subito){
  if(!sb || !utenteCloud || !cloudPronto) return Promise.resolve();
  clearTimeout(timerSalva);
  if(subito) return sincronizza();
  timerSalva = setTimeout(sincronizza, 700);
  return Promise.resolve();
}

/* ============ TEMPO REALE ============
   Le modifiche degli altri arrivano da sole. Un pezzo che ho toccato io e
   non ho ancora salvato non viene sovrascritto: lo mando io tra un attimo.
   Se sto scrivendo, trascinando o ho una finestra aperta, ridisegno dopo. */
let canale = null, coda = [], timerCoda = null, giaCollegato = false;
const sospesi = {};                    // pezzi arrivati per lavori che non ho ancora in memoria

function applicaNucleo(p, dati, spazio){
  const ora = nucleoDi(p), ombra = ombraNucleo[p.id] = ombraNucleo[p.id] || {};
  const chiavi = new Set(Object.keys(dati||{}).concat(Object.keys(ombra)));
  let cambiato = false;
  chiavi.forEach(k=>{
    if(k==='_formato' || k==='__spazio' || FUORI_NUCLEO.indexOf(k)>=0) return;
    const rem = (dati||{})[k], cr = rem===undefined ? undefined : canon(rem);
    if(ombra[k] === cr) return;
    const loc = ora[k]===undefined ? undefined : canon(ora[k]);
    if(loc !== ombra[k] && loc !== cr) return;        // campo che ho cambiato io: resta il mio
    if(rem === undefined){ delete p[k]; delete ombra[k]; }
    else { p[k] = JSON.parse(JSON.stringify(rem)); ombra[k] = cr; }
    cambiato = true;
  });
  if(spazio && spazio !== ombra.__spazio){
    if(p.spazio === ombra.__spazio || p.spazio === spazio){ p.spazio = spazio; cambiato = true; }
    ombra.__spazio = spazio;
  }
  return cambiato;
}

/* cambi: {su:[righe], via:[id]} */
function applicaPezzi(p, cambi){
  const L = pezziDi(p), oe = ombraEl[p.id] = ombraEl[p.id] || {};
  const sporco = id => {
    const c = L[id] ? canonRiga(L[id]) : undefined;
    return c !== oe[id];
  };
  let cambiato = false;
  (cambi.su||[]).forEach(r=>{
    const c = canonRiga(r);
    if(oe[r.id] === c) return;
    if(sporco(r.id) && !(L[r.id] && canonRiga(L[r.id]) === c)) return;
    L[r.id] = {tipo:r.tipo, genitore:r.genitore||null, ordine:r.ordine, dati:r.dati};
    oe[r.id] = c; cambiato = true;
  });
  (cambi.via||[]).forEach(id=>{
    if(!(id in oe) && !L[id]) return;
    if(sporco(id)) return;
    delete L[id]; delete oe[id]; cambiato = true;
  });
  if(cambiato){
    const righe = Object.keys(L).map(id=>Object.assign({id}, L[id]));
    componi(p, righe, apertiDi(p));
  }
  return cambiato;
}

function togliLavoroLocale(pid, perche){
  const i = state.progetti.findIndex(x=>x.id===pid);
  if(i < 0) return false;
  state.progetti.splice(i, 1);
  delete ombraNucleo[pid]; delete ombraEl[pid]; delete ombraMembri[pid]; delete ombraConti[pid];
  if(state.conti) delete state.conti[pid];
  if(state.progettoId === pid && state.schermo === 'progetto'){
    state.schermo = 'home'; state.progettoId = null; state.railOn = false; state.showFeed = false;
    toast(perche || 'Questo lavoro \u00e8 stato eliminato da un\u2019altra persona.','warn','Lavoro chiuso');
  }
  return true;
}

let caricoInCorso = {};
async function caricaLavoro(pid, org){
  if(caricoInCorso[pid]) return;
  caricoInCorso[pid] = true;
  try{
    const {data:r} = await sb.from('progetti').select('org_id,id,spazio_id,dati').eq('org_id', org||orgMia).eq('id', pid).maybeSingle();
    if(!r || !r.dati || String(r.dati._formato)!=='2') return;
    const righe = await tutteLeRighe(()=>sb.from('elementi').select(COLONNE_EL)
      .eq('org_id', r.org_id).eq('progetto_id', pid).order('id'));
    const esiste = state.progetti.find(x=>x.id===pid);
    if(esiste){
      applicaNucleo(esiste, r.dati, r.spazio_id);
      const via = Object.keys(ombraEl[pid]||{}).filter(id=>!righe.some(x=>x.id===id));
      applicaPezzi(esiste, {su:righe, via});
      normalizzaLavoro(esiste);
    } else {
      const p = lavoroDaRighe(r, righe, null, {visti:{}});
      state.progetti.push(p);
      if(puo('soldi')){
        const {data:c} = await sb.from('conti').select('dati').eq('org_id', r.org_id).eq('progetto_id', pid).maybeSingle();
        if(c){ state.conti[pid] = c.dati||{}; ombraConti[pid] = canon(c.dati||{}); }
      }
      normalizzaLavoro(p);
    }
    if(sospesi[pid]){
      const s = sospesi[pid]; delete sospesi[pid];
      const p = state.progetti.find(x=>x.id===pid);
      if(p) applicaPezzi(p, s);
    }
    ridisegnaDaRemoto();
  }catch(e){ console.warn('lavoro', pid, e && e.message); }
  finally{ delete caricoInCorso[pid]; }
}

function inCoda(tab, m){
  coda.push([tab, m]);
  clearTimeout(timerCoda);
  timerCoda = setTimeout(svuotaCoda, 90);
}
function svuotaCoda(){
  const lotto = coda; coda = [];
  const pezzi = {};                       // pid -> {su:Map, via:Set}
  const daCaricare = new Set();
  let tocca = false;
  const perLavoro = pid => pezzi[pid] = pezzi[pid] || {su:new Map(), via:new Set()};
  lotto.forEach(([tab, m])=>{
    const nuovo = m.new || {}, vecchio = m.old || {};
    const ev = m.eventType;
    if(tab==='el'){
      if(ev==='DELETE'){
        if(vecchio.org_id && vecchio.org_id !== orgMia) return;
        const x = perLavoro(vecchio.progetto_id); x.via.add(vecchio.id); x.su.delete(vecchio.id);
      } else if(nuovo.org_id === orgMia){
        const x = perLavoro(nuovo.progetto_id); x.su.set(nuovo.id, nuovo); x.via.delete(nuovo.id);
      }
    } else if(tab==='pr'){
      if(ev==='DELETE'){
        if(vecchio.org_id && vecchio.org_id !== orgMia) return;
        if(togliLavoroLocale(vecchio.id)) tocca = true;
      } else if(nuovo.org_id === orgMia && nuovo.dati && String(nuovo.dati._formato)==='2'){
        const p = state.progetti.find(x=>x.id===nuovo.id);
        if(p){ if(applicaNucleo(p, nuovo.dati, nuovo.spazio_id)){ normalizzaLavoro(p); tocca = true; } }
        else daCaricare.add(nuovo.id);
      }
    } else if(tab==='mb'){
      const r = ev==='DELETE' ? vecchio : nuovo;
      if(r.utente_id !== state.utente || sonoAdmin) return;
      if(r.org_id && r.org_id !== orgMia) return;
      if(ev==='DELETE'){ if(togliLavoroLocale(r.progetto_id, 'L\u2019amministratore ti ha chiuso questo lavoro.')) tocca = true; }
      else if(!state.progetti.some(x=>x.id===r.progetto_id)) daCaricare.add(r.progetto_id);
    } else if(tab==='co'){
      if(!puo('soldi')) return;
      if(ev==='DELETE'){
        if(vecchio.org_id && vecchio.org_id !== orgMia) return;
        if(state.conti[vecchio.progetto_id] && canon(state.conti[vecchio.progetto_id]) === ombraConti[vecchio.progetto_id]){
          delete state.conti[vecchio.progetto_id]; delete ombraConti[vecchio.progetto_id]; tocca = true;
        }
      } else if(nuovo.org_id === orgMia){
        const pid = nuovo.progetto_id, c = canon(nuovo.dati||{});
        if(ombraConti[pid] === c) return;
        const loc = state.conti[pid] ? canon(state.conti[pid]) : undefined;
        if(loc !== undefined && loc !== ombraConti[pid] && loc !== c) return;     // li sto cambiando io
        state.conti[pid] = nuovo.dati || {}; ombraConti[pid] = c; tocca = true;
      }
    } else if(tab==='nt'){
      if(nuovo.utente_id === utenteCloud.id) arrivaNotifica(nuovo, ev==='INSERT');
    } else if(tab==='sp'){
      if(ev==='DELETE'){
        if(vecchio.org_id && vecchio.org_id !== orgMia) return;
        const i = state.spazi.findIndex(x=>x.id===vecchio.id);
        if(i>=0 && state.spazi.length>1){ state.spazi.splice(i,1); delete ombraSp[vecchio.id];
          if(state.spazioId===vecchio.id) state.spazioId = state.spazi[0].id; tocca = true; }
      } else if(nuovo.org_id === orgMia){
        const i = state.spazi.findIndex(x=>x.id===nuovo.id);
        const j = JSON.stringify(nuovo.dati)+'|'+nuovo.ordine;
        if(ombraSp[nuovo.id] === j) return;
        if(i>=0){
          const loc = JSON.stringify(datiSpazio(state.spazi[i]))+'|'+i;
          if(loc !== ombraSp[nuovo.id]) return;              // lo sto cambiando io
          state.spazi[i] = Object.assign({id:nuovo.id}, nuovo.dati);
        } else state.spazi.push(Object.assign({id:nuovo.id}, nuovo.dati));
        ombraSp[nuovo.id] = j; orgSpazio[nuovo.id] = nuovo.org_id; tocca = true;
      }
    }
  });
  Object.keys(pezzi).forEach(pid=>{
    const x = pezzi[pid], cambi = {su:Array.from(x.su.values()), via:Array.from(x.via)};
    const p = state.progetti.find(q=>q.id===pid);
    if(!p){
      if(!cambi.su.length) return;
      /* un lavoro che non ho ancora: tengo da parte i pezzi e lo carico */
      const s = sospesi[pid] = sospesi[pid] || {su:[], via:[]};
      s.su = s.su.concat(cambi.su).slice(-3000); s.via = s.via.concat(cambi.via);
      daCaricare.add(pid);
      return;
    }
    if(applicaPezzi(p, cambi)){ normalizzaLavoro(p); tocca = true; }
  });
  daCaricare.forEach(pid=>setTimeout(()=>caricaLavoro(pid), 900));
  if(tocca) ridisegnaDaRemoto();
}

async function ascoltaCloud(){
  if(!sb || !sb.channel || !orgMia || !utenteCloud) return;
  try{
    const {data} = await sb.auth.getSession();
    if(data && data.session && sb.realtime && sb.realtime.setAuth) sb.realtime.setAuth(data.session.access_token);
  }catch(e){}
  if(canale){ try{ await sb.removeChannel(canale); }catch(e){} canale = null; }
  const filtro = 'org_id=eq.' + orgMia;
  const pc = (ev, tabella, f, tab) => ['postgres_changes', f ? {event:ev, schema:'public', table:tabella, filter:f}
                                                             : {event:ev, schema:'public', table:tabella}, m=>inCoda(tab, m)];
  const ascolti = [
    pc('INSERT','elementi',filtro,'el'), pc('UPDATE','elementi',filtro,'el'), pc('DELETE','elementi',null,'el'),
    pc('INSERT','progetti',filtro,'pr'), pc('UPDATE','progetti',filtro,'pr'), pc('DELETE','progetti',null,'pr'),
    pc('INSERT','conti',filtro,'co'),    pc('UPDATE','conti',filtro,'co'),    pc('DELETE','conti',null,'co'),
    pc('INSERT','spazi',filtro,'sp'),    pc('UPDATE','spazi',filtro,'sp'),    pc('DELETE','spazi',null,'sp'),
    pc('INSERT','membri_progetto','utente_id=eq.'+utenteCloud.id,'mb'), pc('DELETE','membri_progetto',null,'mb'),
    pc('INSERT','notifiche','utente_id=eq.'+utenteCloud.id,'nt'), pc('UPDATE','notifiche','utente_id=eq.'+utenteCloud.id,'nt')
  ];
  let ch = sb.channel('foss-' + orgMia + '-' + Math.random().toString(36).slice(2,7));
  ascolti.forEach(a=>{ ch = ch.on(a[0], a[1], a[2]); });
  canale = ch;
  ch.subscribe(stato=>{
    if(stato === 'SUBSCRIBED'){
      if(giaCollegato) aggiornaDaCloud();      // dopo un buco di connessione rileggo tutto
      giaCollegato = true;
    } else if(stato === 'CHANNEL_ERROR' || stato === 'TIMED_OUT'){
      setTimeout(()=>{ if(canale === ch) ascoltaCloud(); }, 5000);
    }
  });
}

/* Rilettura completa, senza perdere quello che non ho ancora salvato:
   quando riapro l'app dopo averla lasciata in secondo piano, o torna la rete. */
let rileggendo = false, ultimaRilettura = 0;
async function aggiornaDaCloud(){
  if(!sb || !utenteCloud || !cloudPronto || rileggendo) return;
  rileggendo = true;
  try{
    const {data:prs, error} = await sb.from('progetti').select('org_id,id,spazio_id,dati');
    if(error) throw error;
    const righe = await tutteLeRighe(()=>sb.from('elementi').select(COLONNE_EL).order('progetto_id').order('id'));
    const perLavoro = {};
    righe.forEach(r=>{ (perLavoro[r.progetto_id] = perLavoro[r.progetto_id]||[]).push(r); });
    let tocca = false;
    const remoti = new Set();
    (prs||[]).forEach(r=>{
      if(!r.dati || String(r.dati._formato)!=='2') return;
      remoti.add(r.id);
      const p = state.progetti.find(x=>x.id===r.id);
      const rr = perLavoro[r.id] || [];
      if(!p){
        state.progetti.push(normalizzaLavoro(lavoroDaRighe(r, rr, null, {visti:{}})));
        tocca = true; return;
      }
      let cambiato = applicaNucleo(p, r.dati, r.spazio_id);
      const ids = new Set(rr.map(x=>x.id));
      const via = Object.keys(ombraEl[r.id]||{}).filter(id=>!ids.has(id));
      if(applicaPezzi(p, {su:rr, via})) cambiato = true;
      if(cambiato){ normalizzaLavoro(p); tocca = true; }
    });
    state.progetti.slice().forEach(p=>{
      if(!remoti.has(p.id) && ombraNucleo[p.id]){ if(togliLavoroLocale(p.id)) tocca = true; }
    });
    if(puo('soldi')){
      const {data:cs} = await sb.from('conti').select('progetto_id,dati');
      (cs||[]).forEach(c=>{
        const cc = canon(c.dati||{});
        if(ombraConti[c.progetto_id] === cc) return;
        const loc = state.conti[c.progetto_id] ? canon(state.conti[c.progetto_id]) : undefined;
        if(loc !== undefined && loc !== ombraConti[c.progetto_id]) return;
        state.conti[c.progetto_id] = c.dati||{}; ombraConti[c.progetto_id] = cc; tocca = true;
      });
    }
    /* le notifiche arrivate mentre non guardavo */
    await caricaNotifiche();
    renderTop();
    /* i modelli salvati dagli altri */
    if(orgMia){
      const {data:md, error:em} = await sb.from('modelli').select('id,nome,tipo,dati,creato_da,creato_il').eq('org_id', orgMia).order('creato_il');
      if(!em){
        let nuovi = (md||[]).map(m=>Object.assign({id:m.id, nome:m.nome, tipo:m.tipo, creato_da:m.creato_da}, m.dati||{}));
        /* uno appena salvato da me potrebbe non essere ancora arrivato */
        nuovi = nuovi.concat((state.modelli||[]).filter(m=>!nuovi.some(x=>x.id===m.id) && m.t && Date.now()-m.t < 60000));
        if(canon(nuovi) !== canon(state.modelli||[])){ state.modelli = nuovi; tocca = true; }
      }
    }
    ultimaRilettura = Date.now();
    if(tocca) ridisegnaDaRemoto();
  }catch(e){ console.warn('rilettura:', e && e.message); }
  finally{ rileggendo = false; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || !cloudPronto) return;
  if(Date.now() - ultimaRilettura < 4000) return;
  aggiornaDaCloud();
});

/* un lavoro arrivato da fuori va completato come quelli caricati all'inizio */
function normalizzaLavoro(p){
  const tutti = state.progetti;
  const ok = tutti.indexOf(p) >= 0;
  if(!ok) state.progetti = tutti.concat([p]);
  try{ normalizza(); } finally { if(!ok) state.progetti = tutti; }
  return p;
}
