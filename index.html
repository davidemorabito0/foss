*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.d{font-family:Sora,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- SHELL ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

.topbar{
  display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;min-width:0;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;padding-right:6px}
.mark{width:22px;height:22px;border-radius:50%;background:
  conic-gradient(from 225deg,var(--amber) 0 50%,var(--navy) 50% 100%);
  box-shadow:0 0 0 1px var(--line);flex:none}
.brand b{font-family:Sora;font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:10px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}

.crumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--dim);font-size:12.5px}
.crumb b{font-family:Sora;color:var(--text);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}

.iconbtn{
  width:34px;height:34px;border-radius:var(--r-m);display:grid;place-items:center;
  color:var(--dim);position:relative;transition:background .15s,color .15s;flex:none;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.bell-dot{
  position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--amber);color:var(--on-amber);font-size:10px;font-weight:700;
  display:grid;place-items:center;font-family:"JetBrains Mono",monospace;
  box-shadow:0 0 0 2px var(--surface);
}
.bell-dot.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.av{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:Sora;font-size:10.5px;font-weight:700;color:#0D1926;letter-spacing:.02em;
}
.av.sm{width:22px;height:22px;font-size:9px}
.av.lg{width:38px;height:38px;font-size:13px}
.av-stack{display:flex}
.av-stack .av{margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.av-stack .av:first-child{margin-left:0}

/* ---------- STAGE ---------- */
.stage{min-height:0;position:relative;overflow:hidden}
.pane{height:100%;display:flex;flex-direction:column;min-height:0}

/* HOME */
.home-head{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-wrap:wrap}
.home-head h1{font-size:19px}
.count{font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-family:Sora}
.search{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:6px 10px;min-width:180px;color:var(--mute);
}
.search input{background:none;border:none;outline:none;width:100%;font-size:12.5px}
.search svg{width:14px;height:14px;flex:none}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-m);
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:var(--surface-3);border-color:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:11.5px}

.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:13px 14px 12px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .16s,transform .16s,box-shadow .16s;text-align:left;width:100%;
}
.tile:hover{border-color:var(--surface-3);transform:translateY(-2px);box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.tile-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.tile .cli{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.tile h3{font-size:14.5px;margin-top:2px;line-height:1.25}
.pips{display:flex;gap:4px;margin:11px 0 9px}
.pip{height:4px;flex:1;border-radius:2px;background:var(--surface-3)}
.pip.done{background:var(--navy)}
.pip.now{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.tile-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
.tile-meta .sep{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:600;font-family:Sora;letter-spacing:.02em;white-space:nowrap;
  background:var(--surface-2);color:var(--dim);border:1px solid var(--line);
}
.chip.now{background:var(--amber-soft);color:var(--amber-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.alert{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.chip svg{width:11px;height:11px}
.unread{display:inline-flex;align-items:center;gap:3px;color:var(--amber-ink);font-weight:700;font-size:11px;
  background:var(--amber-soft);padding:2px 7px;border-radius:20px;flex:none}
.unread svg{width:11px;height:11px}

/* VISTA LISTA */
.lista-wrap{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px}
.gruppo{margin-bottom:20px}
.gruppo-h{display:flex;align-items:center;gap:9px;margin:0 0 9px 2px}
.gruppo-h .pallo{width:11px;height:11px;border-radius:50%;background:var(--gc);flex:none}
.gruppo-h h3{font-size:15px;color:var(--gc)}
.gruppo-h .n{font-size:12px;color:var(--mute)}
.righe{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.rg{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);
  width:100%;text-align:left;transition:background .14s;cursor:pointer}
.rg:hover{background:var(--surface-2)}
.rg .cerchio{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;transition:all .16s}
.rg .cerchio svg{width:10px;height:10px;opacity:0;color:#04140F}
.rg.fatto .cerchio{background:var(--ok);border-color:var(--ok)}
.rg.fatto .cerchio svg{opacity:1}
.rg .col{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.rg .nome{flex:1;min-width:0}
.rg .nome b{display:block;font-family:Sora;font-size:13.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg.fatto .nome b{text-decoration:line-through;color:var(--mute)}
.rg .nome span{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
.rg .quando{width:104px;flex:none;font-size:12px;color:var(--dim);text-align:right}
.rg .quando.urg{color:var(--alert);font-weight:600}
.rg .barra{width:150px;flex:none;display:flex;align-items:center;gap:9px}
.rg .barra i{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:block}
.rg .barra i b{display:block;height:100%;background:var(--ok);border-radius:3px}
.rg .barra span{font-size:11.5px;color:var(--dim);width:34px;text-align:right;font-family:"JetBrains Mono",monospace}
@media (max-width:980px){ .rg .barra{display:none} }
@media (max-width:760px){ .rg .quando{width:auto} .rg .prio{display:none} }

/* raggruppamento delle tessere */
.gruppo-tiles{margin-bottom:18px}
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;font-family:Sora;color:var(--mute);transition:all .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--amber);color:var(--on-amber)}

/* CALENDARIO — riempie tutta la pagina */
.cal-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 20px 12px;gap:10px}
.cal-nav{display:flex;align-items:center;gap:14px;justify-self:center}
.cal-title{font-family:Sora;font-size:30px;font-weight:700;letter-spacing:-.03em;text-transform:capitalize;
  white-space:nowrap;min-width:260px;text-align:center}
.cal-title span{color:var(--mute);font-weight:400}
.cal-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 16px}
.cal{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);
  grid-template-rows:auto repeat(6,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;
}
.cal .dow{background:var(--surface-2);padding:5px 8px;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.cal .day{background:var(--surface);min-height:0;padding:4px 5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .day.out{background:var(--surface-2);opacity:.45}
.cal .day.wknd{background:var(--surface-2)}
.cal .day .n{font-size:11px;color:var(--mute);font-family:"JetBrains Mono",monospace;align-self:flex-start;padding:0 3px}
.cal .day.today .n{background:var(--amber);color:var(--on-amber);border-radius:5px;padding:0 6px;font-weight:700}
.cal .evs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.ev{
  display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:5px;font-size:10.5px;
  background:var(--surface-2);border-left:2px solid var(--acc);cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .14s;flex:none;
}
.ev:hover{background:var(--surface-3)}
.ev b{font-weight:600}

/* SWITCH VISTE — grande, in alto al centro */
.viewswitch[hidden],.search[hidden],.iconbtn[hidden]{display:none!important}
.viewswitch{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:3px;
}
.vs{display:flex;align-items:center;gap:8px;padding:7px 18px;border-radius:9px;
  font-family:Sora;font-size:14px;font-weight:600;color:var(--dim);transition:all .18s}
.vs svg{width:17px;height:17px}
.vs:hover{color:var(--text);background:var(--surface-3)}
.vs.on{background:var(--amber);color:var(--on-amber);box-shadow:0 2px 10px rgba(255,173,1,.28)}

/* PRIORITÀ E TIPO SULLE TESSERE */
.tipo{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;font-family:Sora;font-weight:600;color:var(--dim)}
.tipo i{width:7px;height:7px;border-radius:2px;background:var(--tc)}
.prio{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-family:Sora;font-weight:700;flex:none}
.prio.alta{background:var(--alert-soft);color:var(--alert)}
.prio.media{background:var(--amber-soft);color:var(--amber-ink)}
.prio.bassa{background:var(--surface-2);color:var(--mute)}
.tile.urg{border-color:var(--alert)}

/* BARRA FILTRI (in basso, in home) */
.filtri{display:flex;align-items:center;gap:7px;flex:1;min-width:0;overflow-x:auto;padding:2px 0}
.fchip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;
  font-family:Sora;color:var(--dim);white-space:nowrap;transition:all .16s;flex:none;
}
.fchip:hover{border-color:var(--amber);color:var(--text)}
.fchip.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.fchip .x{opacity:.6;width:13px;height:13px;display:grid;place-items:center}
.fchip .x:hover{opacity:1}
.fchip .x svg{width:11px;height:11px}
.fchip .cnt{font-family:"JetBrains Mono",monospace;font-size:10.5px;opacity:.7}
.ordina{display:flex;align-items:center;gap:6px;flex:none}
.ordina select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:7px 9px;font-size:12.5px;outline:none;font-family:Sora;font-weight:600}

/* NOTE RICCHE + ALLEGATI */
.rte-bar{display:flex;gap:4px;margin-bottom:-2px}
.rte-b{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
  font-size:12px;font-family:Sora;display:grid;place-items:center;transition:all .15s}
.rte-b:hover{border-color:var(--amber);color:var(--amber-ink)}
.rte-b.b{font-weight:700}
.rte-b.u{text-decoration:underline}
.rte{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);
  padding:8px 10px;font-size:13px;min-height:74px;max-height:150px;overflow-y:auto;outline:none}
.rte:focus{border-color:var(--amber)}
.rte:empty::before{content:attr(data-ph);color:var(--mute)}
.field label.drop,.drop{border:1px dashed var(--line);border-radius:var(--r-m);padding:12px;text-align:center;
  font-size:11.5px;color:var(--mute);transition:all .16s;cursor:pointer;display:block;
  text-transform:none;letter-spacing:0;font-family:"DM Sans",sans-serif;font-weight:400}
.drop:hover{border-color:var(--amber);color:var(--amber-ink)}
.drop b{font-family:Sora;color:var(--text);display:block;font-size:12.5px;font-weight:600;
  text-transform:none;letter-spacing:0;margin-bottom:3px}
.file{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-m);font-size:12px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .sz{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mute)}
.file .ic{width:24px;height:24px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;flex:none}
.file .ic svg{width:12px;height:12px}
.nota-box{font-size:12.5px;color:var(--dim);line-height:1.5}
.nota-box b{color:var(--text)}

/* ALERT A SCHERMO INTERO */
.alert-layer{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px;
  background:rgba(6,13,21,.82);backdrop-filter:blur(10px) saturate(.5);
}
.alert-layer.on{display:grid;animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.alert-box{
  width:min(480px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:30px 28px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);
  animation:rise .36s cubic-bezier(.2,1.2,.4,1);
}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
.alert-box .halo{
  width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;
  background:var(--amber-soft);color:var(--amber-ink);position:relative;
}
.alert-box .halo svg{width:28px;height:28px}
.alert-box .halo::after{content:"";position:absolute;width:64px;height:64px;border-radius:20px;
  box-shadow:0 0 0 0 var(--ring);animation:halo 2s ease-out infinite}
@keyframes halo{to{box-shadow:0 0 0 22px transparent}}
.alert-box .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber-ink);font-family:Sora;font-weight:700}
.alert-box h2{font-size:21px;margin:8px 0 6px;line-height:1.25}
.alert-box p{color:var(--dim);font-size:13.5px;margin:0 0 4px}
.alert-box .meta{font-size:11px;color:var(--mute);font-family:"JetBrains Mono",monospace;margin-top:10px}
.alert-actions{display:flex;gap:9px;margin-top:22px}
.btn-visto{
  flex:1;padding:14px;border-radius:12px;background:var(--ok);color:#04140F;
  font-family:Sora;font-weight:700;font-size:14px;letter-spacing:.06em;
  box-shadow:0 6px 20px rgba(63,191,143,.28);transition:filter .15s,transform .08s;
}
.btn-visto:hover{filter:brightness(1.08)}
.btn-visto:active{transform:translateY(1px)}
.btn-snooze{
  display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:12px;
  border:1px solid var(--line);color:var(--mute);font-size:11.5px;transition:all .15s;
}
.btn-snooze:hover{border-color:var(--alert);color:var(--alert)}
.btn-snooze svg{width:13px;height:13px;flex:none}
.snoozed{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:11px}

/* ---------- PROGETTO ---------- */
.proj-head{
  display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.proj-head .cli{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.proj-head h1{font-size:24px;letter-spacing:-.025em;line-height:1.15;margin-top:1px}
.proj-head .side{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.proj{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1;min-height:0;position:relative}
/* Commenti, chat e attivita' stanno in un cassetto: si aprono quando servono
   e per il resto del tempo lasciano respirare il lavoro. */
.proj > .rail-r{position:absolute;z-index:40;top:0;bottom:0;right:0;width:min(340px,92vw);
  display:flex;transform:translateX(103%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:-14px 0 46px rgba(0,0,0,.3)}
.proj.show-feed > .rail-r{transform:none}
.proj.show-feed > .feed-scrim{display:block;position:absolute;inset:0;z-index:35;
  background:rgba(8,12,20,.42);animation:fadein .18s ease-out}
.feed-scrim{display:none}
/* il tasto che lo apre: si deve vedere, e deve dire se c'e' roba da leggere */
.feed-btn{position:relative}
.feed-btn .n{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--alert);color:#fff;font-size:10px;font-weight:700;
  font-family:Sora;display:grid;place-items:center;border:2px solid var(--bg)}
.feed-btn.ha-nuovi{border-color:var(--alert)}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.rail-r{overflow:hidden}
.rail-r{border-right:none;border-left:1px solid var(--line)}
.rail-sec{padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.rail-sec:last-child{border-bottom:none}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600;margin-bottom:7px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px}
.kv span{color:var(--dim)}
.kv b{font-weight:600;text-align:right}
.ring-wrap{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--surface-3)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.3,1,.4,1)}
.ring-n{font-family:Sora;font-size:19px;font-weight:700}
.btn-completa{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 10px;
  border-radius:var(--r-m);background:var(--ok);color:#04140F;font-family:Sora;font-weight:700;
  font-size:13px;letter-spacing:.07em;box-shadow:0 6px 18px rgba(63,191,143,.25);
  transition:filter .15s,transform .08s;animation:pronto .5s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pronto{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.btn-completa svg{width:17px;height:17px}
.btn-completa:hover{filter:brightness(1.08)}
.btn-completa:active{transform:translateY(1px)}
.fatto-banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--ok-soft);
  color:var(--ok);font-size:12px;border-bottom:1px solid var(--line)}
.fatto-banner b{font-family:Sora}
.fatto-banner .spacer{flex:1}
.fatto-banner svg{width:14px;height:14px;flex:none}
.tile.fatto{opacity:.58;filter:saturate(.3)}
.tile.fatto::before{background:var(--ok)}
.tile.fatto:hover{opacity:1;filter:none;border-color:var(--ok)}
.chip.fatto{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.team-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.team-row .nm{font-size:12px;font-weight:500}
.team-row .rl{font-size:10.5px;color:var(--mute)}

/* centro */
.work{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.work-head{padding:14px 18px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.work-head h2{font-size:17px;display:flex;align-items:center;gap:9px}
.work-head p{margin:3px 0 0;color:var(--dim);font-size:12px}
.specs{display:none;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line-soft);
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.spec{background:var(--bg);padding:9px 18px}
.spec .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.spec .v{font-size:14px;font-family:Sora;font-weight:600;margin-top:2px}
.spec .v.mono{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600}

.subs{flex:1;min-height:0;overflow-y:auto;padding:12px 18px 18px;display:flex;flex-direction:column;gap:9px}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;transition:border-color .16s}
.sub.open{border-color:var(--surface-3)}
.sub-h{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;transition:background .14s;cursor:pointer}
.sub-h:hover{background:var(--surface-2)}
.caret{width:14px;height:14px;color:var(--mute);transition:transform .22s cubic-bezier(.3,1,.4,1);flex:none}
.sub.open .caret{transform:rotate(90deg);color:var(--amber-ink)}
.sub-h .t{font-family:Sora;font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibar{width:52px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;flex:none}
.minibar i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .4s cubic-bezier(.3,1,.4,1)}
.sub-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.3,1,.4,1)}
.sub.open .sub-b{grid-template-rows:1fr}
.sub-b > div{overflow:hidden;visibility:hidden;transition:visibility .26s}
.sub.open .sub-b > div{visibility:visible}
.sub-in{padding:2px 12px 12px 36px;border-top:1px solid var(--line-soft)}
.chk{display:flex;align-items:center;gap:9px;padding:6px 0;width:100%;text-align:left;font-size:12.5px;color:var(--dim);cursor:pointer}
.chk .pen{margin-left:auto}
.sub-note .pen{margin-left:4px}
.chk:hover{color:var(--text)}
.box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .16s}
.box svg{width:10px;height:10px;opacity:0;transform:scale(.5);transition:all .18s cubic-bezier(.2,1.4,.4,1)}
.chk.done .box{background:var(--ok);border-color:var(--ok)}
.chk.done .box svg{opacity:1;transform:scale(1);color:#04140F}
.chk.done .tx{text-decoration:line-through;color:var(--mute)}
.sub-note{font-size:11.5px;color:var(--mute);padding:7px 0 2px;border-top:1px dashed var(--line-soft);margin-top:6px;display:flex;gap:7px;align-items:center}
/* nota della task */
.task-nota{
  display:flex;gap:8px;align-items:flex-start;margin-top:9px;padding:9px 11px;border-radius:var(--r-m);
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s;
}
.task-nota:hover{border-color:var(--amber)}
.task-nota .ic{width:14px;height:14px;flex:none;color:var(--mute);margin-top:2px}
.task-nota .ic svg{width:14px;height:14px}
.task-nota:hover .ic{color:var(--amber-ink)}
.task-nota .tx{font-size:12.5px;line-height:1.5;color:var(--dim);min-width:0;word-wrap:break-word}
.task-nota .tx b{color:var(--text)}
.task-nota .tx a{color:var(--amber-ink);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.task-nota.vuota{border-style:dashed;background:transparent}
.task-nota.vuota .tx{color:var(--mute);font-style:italic}
.bloccato .task-nota{cursor:default}
.bloccato .task-nota.vuota{display:none}

/* ---------- PERSONE TAGGATE SU UNA TASK ---------- */
.taggati{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 0 2px;margin-top:2px}
.tag-p{
  display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 3px;border-radius:999px;
  background:var(--surface-3);border:1px solid var(--line);font-size:11.5px;cursor:pointer;
  transition:border-color .14s,background .14s;
}
.tag-p:hover{border-color:var(--amber)}
.tag-p .nm{font-family:Sora;font-weight:600;color:var(--text)}
.tag-p .rl{display:none}          /* il ruolo si legge passandoci sopra */
.tag-p .nm{padding-right:3px}
.tag-p .x{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:var(--mute);opacity:0;transition:opacity .14s,color .14s}
.tag-p .x svg{width:9px;height:9px}
.tag-p:hover .x{opacity:.75}
.tag-p .x:hover{color:var(--alert);opacity:1}
@media (hover:none){.tag-p .x{opacity:.6}}
.tag-piu{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  border:1px dashed var(--line);color:var(--mute);font-size:11px;font-family:Sora;font-weight:600;
  transition:color .14s,border-color .14s;
}
.tag-piu svg{width:11px;height:11px}
.tag-piu:hover{color:var(--amber-ink);border-color:var(--amber)}
.bloccato .tag-piu,.bloccato .tag-p .x{display:none}
/* @Nome dentro le note */
.menz{background:var(--amber-soft);color:var(--amber-ink);border-radius:5px;padding:0 4px;font-weight:600}
/* fila di avatar nell'editor della nota */
.rte-tag{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft)}
.rte-tag .lb{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600;width:100%}
.tag-av{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--text);
  transition:border-color .14s,background .14s;
}
.tag-av:hover{border-color:var(--amber);background:var(--surface-3)}
.tag-av.confermato{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

/* pannello destro: commenti / chat / attività */
.tabs{display:flex;gap:2px;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
.tab{flex:1;padding:6px 4px;border-radius:var(--r-s);font-size:11.5px;font-weight:600;font-family:Sora;
  color:var(--mute);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--surface-2);color:var(--amber-ink)}
.tab .n{
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#E8433C;color:#fff;
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;display:grid;place-items:center;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1);
}
.feed{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px}
.msg .bd{min-width:0;flex:1}
.msg .hd{display:flex;align-items:baseline;gap:6px}
.msg .nm{font-size:11.5px;font-weight:700;font-family:Sora}
.msg .ts{font-size:10px;color:var(--mute);font-family:"JetBrains Mono",monospace}
.msg .tx{font-size:12.5px;color:var(--dim);margin-top:1px;word-wrap:break-word}
.msg .tx code{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--amber-ink)}
.log{display:flex;gap:9px;font-size:11.5px;color:var(--dim);align-items:flex-start}
.log .dot{width:7px;height:7px;border-radius:50%;background:var(--surface-3);margin-top:5px;flex:none}
.log.acc .dot{background:var(--amber)}
.log .ts{font-size:10px;color:var(--mute);font-family:"JetBrains Mono",monospace}
.composer{border-top:1px solid var(--line-soft);padding:9px 10px;display:flex;gap:7px;align-items:flex-end}
.composer textarea{
  flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);
  padding:7px 9px;resize:none;font-size:12.5px;outline:none;min-height:34px;max-height:90px;
}
.composer textarea:focus{border-color:var(--amber)}
.send{width:34px;height:34px;border-radius:var(--r-m);background:var(--amber);color:var(--on-amber);display:grid;place-items:center;flex:none}
.send svg{width:15px;height:15px}
.send:disabled{opacity:.35;cursor:default}

/* ---------- BARRA FASI (stile Resolve) ---------- */
.phasebar{
  background:var(--surface);border-top:1px solid var(--line);min-width:0;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;position:relative;z-index:20;
}
.rewind{
  width:40px;height:40px;border-radius:var(--r-m);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);flex:none;transition:all .16s;
}
.rewind:hover:not(:disabled){border-color:var(--amber);color:var(--amber-ink);background:var(--amber-soft)}
.rewind:disabled{opacity:.3;cursor:default}
.rewind svg{width:19px;height:19px}
.rewind.armed{border-color:var(--amber);color:var(--amber-ink);background:var(--amber-soft);
  animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--ring)}50%{box-shadow:0 0 0 6px transparent}}

.steps{flex:1;display:flex;gap:6px;min-width:0}
.step{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:7px 10px;
  border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);
  transition:all .2s cubic-bezier(.3,1,.4,1);position:relative;overflow:hidden;
}
.step .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--dim);flex:none;transition:all .2s}
.step .ic svg{width:15px;height:15px}
.step .tx{min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.step .nm{display:block;font-family:Sora;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .st{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .idx{position:absolute;right:9px;top:6px;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--mute)}

.step.ready:hover{border-color:var(--amber);background:var(--surface-3);transform:translateY(-1px)}
.step.ready .ic{color:var(--text)}
.step.active{border-color:var(--amber);background:linear-gradient(180deg,var(--amber-soft),var(--surface-2));box-shadow:0 0 0 1px var(--amber) inset}
.step.active .ic{background:var(--amber);color:var(--on-amber)}
.step.active .nm{color:var(--amber-ink)}
.step.active .st{color:var(--amber-ink)}
.step.off{opacity:.42;filter:grayscale(1);cursor:default;border-style:dashed}
.step.off .ic{background:transparent;border:1px dashed var(--line)}
.step.editing{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.step.editing .ic{background:var(--ok);color:#04140F}
.step.editing .nm,.step.editing .st{color:var(--ok)}
.step.paused{opacity:.75;border-style:dashed}
.step.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.step.burn{animation:burn .5s ease-out}
@keyframes burn{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 14px transparent}}

.banner{
  display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;
  background:var(--ok-soft);color:var(--ok);border-top:1px solid var(--line);
}
.banner b{font-family:Sora}
.banner .spacer{flex:1}

/* ---------- NOTIFICHE (slide da destra) ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,22,.5);opacity:0;pointer-events:none;
  transition:opacity .24s;z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--surface);
  border-left:1px solid var(--line);z-index:50;transform:translateX(102%);
  transition:transform .3s cubic-bezier(.3,1,.4,1);display:flex;flex-direction:column;
  box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 14px 11px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:15px;flex:1}
.nlist{flex:1;min-height:0;overflow-y:auto;padding:8px}
.nitem{display:flex;gap:10px;padding:10px;border-radius:var(--r-m);width:100%;text-align:left;transition:background .15s;position:relative}
.nitem:hover{background:var(--surface-2)}
.nitem.new{background:var(--surface-2)}
.nitem.new::before{content:"";position:absolute;left:3px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--amber);transform:translateY(-50%)}
.nitem .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--dim)}
.nitem .ic svg{width:14px;height:14px}
.nitem.new .ic{background:var(--amber-soft);color:var(--amber-ink)}
.nitem .tx{font-size:12.5px;line-height:1.35}
.nitem .tx b{font-weight:700}
.nitem .mt{font-size:10.5px;color:var(--mute);margin-top:3px;font-family:"JetBrains Mono",monospace}
.empty{padding:34px 18px;text-align:center;color:var(--mute);font-size:12.5px}

/* ---------- TOAST ---------- */
.toasts{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:18px;
  z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;width:min(380px,92vw)}
.toast{
  display:flex;align-items:center;gap:10px;padding:9px 14px 9px 11px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:12.5px;max-width:100%;position:relative;overflow:hidden;pointer-events:auto;
  animation:drop .34s cubic-bezier(.2,1.2,.4,1);
}
.toast.out{animation:lift .26s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes lift{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.toast .ic svg{width:13px;height:13px}
.toast b{font-family:Sora;font-weight:600}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);animation:drain 3.4s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.toast.ok .ic{background:var(--ok-soft);color:var(--ok)} .toast.ok .bar{background:var(--ok)}
.toast.info .ic{background:var(--amber-soft);color:var(--amber-ink)}
.toast.warn .ic{background:var(--alert-soft);color:var(--alert)} .toast.warn .bar{background:var(--alert)}

/* ---------- MODALE ---------- */
.modal{
  position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(440px,92vw);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);animation:drop .3s cubic-bezier(.2,1.2,.4,1);
  max-height:86vh;display:flex;flex-direction:column;
}
.modal h3{font-size:16px;padding:15px 16px 0}
.modal .sub-t{padding:3px 16px 0;color:var(--dim);font-size:12px}
.modal-b{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.modal-f{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);
  padding:8px 10px;font-size:13px;outline:none;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.pickrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface-2);width:100%;text-align:left;transition:all .15s}
.pickrow:hover{border-color:var(--amber)}
.pickrow.in{opacity:.5;cursor:default}
.pickrow .nm{font-size:12.5px;font-weight:600;font-family:Sora;flex:1}

/* ---------- LOGIN ---------- */
.gate{height:100%;display:grid;place-items:center;padding:20px;overflow-y:auto}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);padding:26px 24px;box-shadow:var(--shadow)}
.gate-card .mark{width:34px;height:34px}
.gate-card h1{font-size:23px;margin:14px 0 4px;letter-spacing:-.03em}
.gate-card p{color:var(--dim);font-size:12.5px;margin:0 0 20px}
.gate-card .btn{width:100%;justify-content:center;padding:10px}
.switch{text-align:center;margin-top:14px;font-size:12px;color:var(--dim)}
.switch button{color:var(--amber-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---------- DISSOLVENZA DI APERTURA ---------- */
.fade-layer{
  position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .38s ease;
}
.fade-layer.on{opacity:1;pointer-events:auto}
.fade-in{text-align:center;max-width:min(420px,88vw)}
.fade-in .mark{width:42px;height:42px;margin:0 auto 18px;animation:spin 1.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in .cli{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.fade-in h2{font-size:23px;margin:5px 0 16px;letter-spacing:-.025em}
.fade-in .bar{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.fade-in .bar i{display:block;height:100%;background:var(--amber);width:0;animation:fill .85s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
.fade-in .st{font-size:11.5px;color:var(--mute);margin-top:10px;font-family:"JetBrains Mono",monospace}

.consegna-fine{text-align:center;max-width:min(460px,88vw)}
.consegna-fine .bollo{
  width:96px;height:96px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;
  background:var(--ok);color:#04140F;animation:bollo .7s cubic-bezier(.2,1.5,.4,1);position:relative;
}
.consegna-fine .bollo svg{width:46px;height:46px}
.consegna-fine .bollo::after{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 0 var(--ok);animation:onda 1.5s ease-out}
@keyframes bollo{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.12) rotate(4deg)}100%{transform:none;opacity:1}}
@keyframes onda{0%{box-shadow:0 0 0 0 rgba(63,191,143,.5)}100%{box-shadow:0 0 0 70px rgba(63,191,143,0)}}
.consegna-fine .cli{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
  font-family:Sora;font-weight:700;animation:salita .5s .2s backwards}
.consegna-fine h2{font-size:26px;margin:7px 0 10px;letter-spacing:-.03em;animation:salita .5s .28s backwards}
.consegna-fine .riga{font-size:12.5px;color:var(--dim);font-family:"JetBrains Mono",monospace;
  animation:salita .5s .36s backwards}
@keyframes salita{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.pulse-once{animation:pulseOnce 1.3s cubic-bezier(.3,1,.4,1) 1}
@keyframes pulseOnce{
  0%{box-shadow:0 0 0 0 var(--ring);transform:none}
  40%{box-shadow:0 0 0 10px transparent;transform:translateY(-3px)}
  70%{box-shadow:0 0 0 0 var(--ring);transform:none}
  100%{box-shadow:0 0 0 12px transparent}
}

/* ---------- PROFILO ---------- */
.prof{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.card h3{font-size:14px;margin-bottom:3px}
.card .hint{font-size:12px;color:var(--mute);margin-bottom:14px}
.ident{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.foto{
  width:76px;height:76px;border-radius:24px;background:var(--amber);color:var(--on-amber);
  display:grid;place-items:center;font-family:Sora;font-size:26px;font-weight:700;flex:none;
  background-size:cover;background-position:center;border:1px solid var(--line);
}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.riga{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.riga:last-child{border-bottom:none}
.riga .tx{flex:1;min-width:0}
.riga .tx b{font-family:Sora;font-size:13px;font-weight:600;display:block}
.riga .tx span{font-size:11.5px;color:var(--mute)}
.sw{width:42px;height:24px;border-radius:14px;background:var(--surface-3);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);transition:transform .2s cubic-bezier(.3,1.4,.4,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--amber)}
.sw.on::after{transform:translateX(18px)}
.temi{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.tema{border:1px solid var(--line);border-radius:var(--r-m);padding:10px;text-align:left;transition:all .16s;background:var(--surface-2)}
.tema:hover{border-color:var(--amber)}
.tema.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.tema .sw3{display:flex;gap:4px;margin-bottom:8px}
.tema .sw3 i{width:22px;height:22px;border-radius:7px;border:1px solid rgba(128,128,128,.25)}
.tema .nm{font-family:Sora;font-size:12.5px;font-weight:600}
.tema .ds{font-size:10.5px;color:var(--mute);line-height:1.3;margin-top:1px}

/* ---------- PRESSIONE PROLUNGATA ----------
   Mentre si tiene premuto, una banda ambra riempie il campo da sinistra a
   destra: quando arriva in fondo si apre la modifica. */
.in-tenuta{position:relative;background-color:var(--amber-soft)!important;
  box-shadow:0 0 0 1px var(--amber) inset;border-radius:8px;transition:background-color .1s}
.in-tenuta::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;z-index:6;pointer-events:none;
  background:var(--amber);border-radius:3px;
  transform-origin:left center;transform:scaleX(0);
  animation:tienipremuto var(--tenuta,2000ms) linear forwards;
}
@keyframes tienipremuto{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.in-tenuta::after{animation:none;transform:scaleX(1)}}

/* ---------- MATITE / EDITABILE ---------- */
.pen{
  width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;flex:none;
  color:var(--mute);opacity:0;transition:opacity .15s,background .15s,color .15s;
}
.pen svg{width:12px;height:12px}
.pen:hover{background:var(--surface-3);color:var(--amber-ink)}
.kv:hover .pen,.spec:hover .pen,.sub-h:hover .pen,.chk:hover .pen,.riga:hover .pen,
.editabile:hover .pen,.pen:focus-visible{opacity:1}
.pen.fisso{opacity:.55}
.pen.fisso:hover{opacity:1}
@media (hover:none){.pen{opacity:.5}}
.spec{position:relative}
.spec .pen{position:absolute;top:6px;right:8px}
.chk{position:relative}
/* chi fa questa singola subtask */
.chk-ass{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;
  margin-left:4px;transition:opacity .14s,color .14s}
.chk-ass .av{width:20px;height:20px;font-size:8.5px}
.chk-ass.vuoto{color:var(--mute);opacity:0;border:1px dashed var(--line);border-radius:50%}
.chk-ass.vuoto svg{width:11px;height:11px}
.chk:hover .chk-ass.vuoto,.chk-ass.vuoto:focus-visible{opacity:.7}
.chk-ass.vuoto:hover{opacity:1;color:var(--amber-ink);border-color:var(--amber)}
@media (hover:none){.chk-ass.vuoto{opacity:.45}}
.chk .pen{margin-left:auto}
.bloccato .chk-ass.vuoto{display:none}
.bloccato .pen{display:none}
#undoBtn.nulla{animation:shake .32s ease-out}
#lockBtn.appena{animation:halo .9s ease-out;color:var(--alert)}
.btn.confermato{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.confermato svg{color:var(--ok)}
.lockchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  background:var(--alert-soft);color:var(--alert);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;font-family:Sora;font-weight:700}
.lockchip svg{width:11px;height:11px}
.iconbtn.locked{color:var(--alert);background:var(--alert-soft)}

/* ---------- TAG ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--dim);
  font-size:10.5px;font-weight:600;font-family:Sora;white-space:nowrap}
.tag.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.tag-btn{cursor:pointer;transition:all .15s}
.tag-btn:hover{border-color:var(--amber);color:var(--text)}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.picona{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);color:var(--amber-ink)}
.picona svg{width:16px;height:16px}
.picona.big{width:42px;height:42px;border-radius:12px}
.picona.big svg{width:21px;height:21px}

@keyframes entraTessera{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.tile.esce{animation:esceTessera .22s ease-in forwards}
@keyframes esceTessera{to{opacity:0;transform:scale(.94)}}
.vs{position:relative}
.vs.trascino{opacity:.45;cursor:grabbing}
.vs.bersaglio{box-shadow:0 0 0 2px var(--amber) inset}
.viewswitch.riordino .vs{cursor:grab}

/* ---------- PROSSIMA COSA DA FARE ---------- */
.prossima{
  display:flex;align-items:center;gap:12px;margin:12px 18px 0;padding:11px 14px;
  border-radius:var(--r-m);background:var(--amber-soft);border:1px solid transparent;
  box-shadow:0 0 0 1px var(--amber) inset;
}
.prossima .ic{width:30px;height:30px;border-radius:9px;background:var(--amber);color:var(--on-amber);
  display:grid;place-items:center;flex:none;animation:battito 2.4s ease-in-out infinite}
@keyframes battito{0%,100%{box-shadow:0 0 0 0 var(--ring)}50%{box-shadow:0 0 0 7px transparent}}
.prossima .ic svg{width:16px;height:16px}
.prossima .tx{flex:1;min-width:0}
.prossima .tx .lb{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-family:Sora;font-weight:700;color:var(--amber-ink)}
.prossima .tx b{display:block;font-family:Sora;font-size:14px;font-weight:600;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prossima .tx span{font-size:11.5px;color:var(--dim)}
.prossima .az{display:flex;gap:7px;flex:none}
.prossima.calma{background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok) inset}
.prossima.calma .ic{background:var(--ok);color:#04140F;animation:none}
.prossima.calma .tx .lb{color:var(--ok)}

/* ---------- BENVENUTO ---------- */
.benvenuto{
  max-width:1100px;margin:18px auto 0;width:100%;padding:0 20px;
}
.benvenuto .benv{
  display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:18px;
  background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--line);flex-wrap:wrap;
}
.benvenuto h2{font-size:20px;letter-spacing:-.02em}
.benvenuto p{color:var(--dim);font-size:13px;margin:3px 0 0}
.benvenuto .campana{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;position:relative;
  background:var(--amber-soft);color:var(--amber-ink);
}
.benvenuto .campana svg{width:24px;height:24px}
.benvenuto .campana.zero{background:var(--ok-soft);color:var(--ok)}
.benvenuto .campana .n{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;padding:0 5px;
  border-radius:11px;background:#E8433C;color:#fff;font-family:"JetBrains Mono",monospace;font-size:11px;
  font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface)}
.benvenuto .az{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.benvenuto .benv-tx{flex:1 1 220px;min-width:0}
.benvenuto .mini{display:flex;gap:18px;margin-top:11px;flex-wrap:wrap}
.benvenuto .mini div{font-size:12px;color:var(--mute)}
.benvenuto .mini b{font-family:Sora;font-size:15px;color:var(--text);margin-right:4px}
.benvenuto .mini .urg b{color:var(--alert)}

/* la prima cosa da fare, in home */
.daffare{
  display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 18px;border-radius:16px;
  background:var(--ok-soft);border:1px solid var(--ok);
}
.daffare.urg{background:var(--alert-soft);border-color:var(--alert)}
.daffare .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--ok);color:#04140F}
.daffare.urg .ic{background:var(--alert);color:#fff}
.daffare .ic svg{width:20px;height:20px}
.daffare .tx{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 220px}
.daffare .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:Sora;font-weight:700;color:var(--ok)}
.daffare.urg .lb{color:var(--alert)}
.daffare b{font-family:Sora;font-size:15.5px;letter-spacing:-.01em;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daffare .tx > span:last-child{font-size:12px;color:var(--dim)}
.daffare .az{margin-left:auto;flex:none}

/* ---------- SPAZI DI LAVORO ---------- */
.spazi-head{padding:26px 20px 14px;max-width:1100px;margin:0 auto;width:100%}
.spazi-head h1{font-size:26px;letter-spacing:-.03em}
.spazi-head p{color:var(--dim);font-size:13px;margin:5px 0 0}
.spazi{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  max-width:1100px;margin:0 auto;width:100%;padding:0 20px 24px}
.spazio{
  position:relative;text-align:left;padding:18px;border-radius:18px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);transition:transform .18s,border-color .18s,box-shadow .18s;
}
.spazio:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:var(--shadow)}
.spazio::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.spazio .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:var(--acc);color:#0D1926;margin-bottom:13px}
.spazio .ic svg{width:22px;height:22px}
.spazio h3{font-size:17px;letter-spacing:-.02em}
.spazio .ds{font-size:12px;color:var(--mute);margin-top:3px;min-height:17px}
.spazio .nums{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.spazio .nums div{min-width:0}
.spazio .nums b{display:block;font-family:Sora;font-size:17px;font-weight:700}
.spazio .nums span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600}
.spazio.nuovo{border-style:dashed;background:transparent;display:grid;place-items:center;min-height:180px;text-align:center}
.spazio.nuovo .ic{background:var(--surface-2);color:var(--amber-ink);margin:0 auto 10px}
.sp-chip{
  display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);transition:all .15s;max-width:230px;
}
.sp-chip:hover{border-color:var(--amber)}
.sp-chip .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--acc);color:#0D1926;flex:none}
.sp-chip .ic svg{width:13px;height:13px}
.sp-chip .nm{font-family:Sora;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-chip .cv{width:12px;height:12px;color:var(--mute);flex:none}

/* ---------- INTESTAZIONE DELLO SPAZIO ---------- */
.pane{position:relative}
.pane.con-sfondo::before{
  content:"";position:absolute;inset:0;background-image:var(--bg-img);
  background-size:cover;background-position:center;opacity:.2;pointer-events:none;z-index:0;
}
.pane > *{position:relative;z-index:1}
.sp-head{padding:16px 20px 12px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sp-head .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:var(--acc);color:#0D1926;flex:none}
.sp-head .ic svg{width:25px;height:25px}
.sp-head h1{font-size:33px;letter-spacing:-.035em;line-height:1.05}
.sp-head .desc{color:var(--dim);font-size:13px;margin-top:4px}
.sp-head .riga2{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.sp-head .dato{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--mute)}
.sp-head .dato b{font-family:Sora;font-size:15px;font-weight:700;color:var(--text)}
.sp-head .dato.urg b{color:var(--alert)}
.sp-head .azioni{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){ .sp-head h1{font-size:25px} .sp-head{padding:12px 16px 10px} }

/* ---------- BACHECA NOTE ---------- */
.bacheca{flex:1;min-height:0;margin:0 20px 16px;border:1px solid var(--line);border-radius:var(--r-l);
  background:var(--surface);position:relative;overflow:hidden;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:26px 26px}
.piu-nota{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:74px;height:74px;border-radius:22px;display:grid;place-items:center;
  background:color-mix(in srgb, var(--surface) 82%, #000 18%);
  border:1px solid var(--line);color:var(--dim);transition:all .18s;z-index:1;
}
.piu-nota:hover{transform:translate(-50%,-50%) scale(1.08);color:var(--text);
  background:color-mix(in srgb, var(--surface) 72%, #000 28%)}
.piu-nota svg{width:28px;height:28px}
.postit{
  position:absolute;width:186px;height:150px;min-width:186px;min-height:150px;
  max-width:372px;max-height:300px;overflow:hidden;padding:12px 13px 30px;border-radius:3px;
  box-shadow:0 8px 18px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.2);
  display:flex;flex-direction:column;color:#20262E;cursor:grab;touch-action:none;
  transition:box-shadow .16s, transform .16s;
}
.postit:hover{box-shadow:0 14px 28px rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.2);z-index:5}
.postit.trascino{cursor:grabbing;box-shadow:0 22px 40px rgba(0,0,0,.3);z-index:20;transform:scale(1.03) rotate(0deg)!important}
.postit textarea{
  flex:1;background:none;border:none;outline:none;resize:none;font-family:"DM Sans",sans-serif;
  font-size:13.5px;line-height:1.45;color:#20262E;cursor:text;padding:0;min-height:0;
}
.postit::-webkit-resizer{background:transparent}
.postit textarea::placeholder{color:rgba(32,38,46,.45)}
.postit .pie{position:absolute;left:13px;right:22px;bottom:9px;display:flex;align-items:center;gap:6px;
  font-size:10px;color:rgba(32,38,46,.6);font-family:"JetBrains Mono",monospace;pointer-events:none}
.postit .pie .via{pointer-events:auto}
.postit .grip{
  position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;
  display:grid;place-items:end;padding:4px;
}
.postit .grip::after{content:"";width:9px;height:9px;
  border-right:2px solid rgba(32,38,46,.3);border-bottom:2px solid rgba(32,38,46,.3);border-radius:0 0 2px 0}
.postit:hover .grip::after{border-color:rgba(32,38,46,.6)}
.bloccato .postit .grip{display:none}
.postit .pie .sp{flex:1}
.postit .via{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  color:rgba(32,38,46,.5);opacity:0;transition:opacity .15s}
.postit:hover .via{opacity:1}
.postit .via:hover{background:rgba(32,38,46,.12);color:#20262E}
.postit .via svg{width:11px;height:11px}
.postit .presa{position:absolute;inset:0 0 auto 0;height:34px;border-radius:3px 3px 0 0}
.bacheca-vuota{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px;padding:20px}
.bloccato .postit{cursor:default}

/* ---------- WIZARD ---------- */
.wz{position:fixed;inset:0;z-index:88;background:var(--bg);display:grid;place-items:center;padding:20px;overflow-y:auto}
.wz-card{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:rise .4s cubic-bezier(.2,1.2,.4,1)}
.wz-top{padding:22px 26px 0}
.wz-passi{display:flex;gap:6px;margin-bottom:16px}
.wz-passi i{height:3px;flex:1;border-radius:2px;background:var(--surface-3)}
.wz-passi i.on{background:var(--amber)}
.wz-top .kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-ink);font-family:Sora;font-weight:700}
.wz-top h2{font-size:22px;margin:6px 0 5px;letter-spacing:-.02em}
.wz-top p{color:var(--dim);font-size:13px;margin:0}
.wz-b{padding:20px 26px;display:flex;flex-direction:column;gap:14px;max-height:56vh;overflow-y:auto}
.wz-f{padding:14px 26px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center}
.wz-f .spacer{flex:1}
.scelte{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.scelta{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface-2);text-align:left;transition:all .16s}
.scelta:hover{border-color:var(--amber)}
.scelta.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;background:var(--amber-soft)}
.scelta .nm{font-family:Sora;font-weight:600;font-size:13px;display:block}
.scelta .ds{font-size:11px;color:var(--mute);line-height:1.35;display:block;margin-top:2px}
.icone{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:8px}
.ico-b{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;color:var(--dim);transition:all .16s}
.ico-b svg{width:18px;height:18px}
.ico-b:hover{border-color:var(--amber);color:var(--text)}
.ico-b.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}

/* ---------- MAPPA ---------- */
.mappa-wrap{flex:1;min-height:0;display:flex;padding:0 20px 16px;gap:12px}
.mappa{flex:1;min-width:0;position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);overflow:hidden}
.mappa svg{width:100%;height:100%;display:block}
.pin{cursor:pointer}
.pin circle.alone{fill:var(--amber);opacity:.18}
.pin .corpo{fill:var(--acc);stroke:var(--surface);stroke-width:2}
.pin text{font-family:Sora;font-size:9px;font-weight:700;fill:var(--on-amber)}
.pin:hover circle.alone{opacity:.36}
.mappa-lista{width:250px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.luogo{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:all .15s}
.luogo:hover{border-color:var(--amber)}
.luogo .n{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#0D1926;flex:none;
  display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700}
.luogo .tx{min-width:0}
.luogo .tx b{display:block;font-family:Sora;font-size:12.5px;font-weight:600}
.luogo .tx span{display:block;font-size:11px;color:var(--mute);line-height:1.3}
.luogo .tx .tag{display:inline-flex;width:auto}
.mappa-vuota{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;
  text-align:center;padding:0 24px;line-height:1.5}
.mappa .leaflet-container{width:100%;height:100%;background:var(--surface-2);font-family:inherit}
.mappa.mappa-scura .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.segno span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--acc,#FFAD01);color:#0D1926;font-family:Sora;font-weight:700;font-size:12px;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
.leaflet-popup-content{font-family:inherit;font-size:12.5px;line-height:1.45}
.leaflet-popup-content a{color:var(--amber-ink);font-weight:600}
@media (max-width:820px){ .mappa-lista{display:none} .mappa-wrap{padding:0 12px 12px} }

/* ---------- CONDIVISIONE ---------- */
.link-box{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:9px 11px;font-family:"JetBrains Mono",monospace;font-size:11.5px;
  word-break:break-all;color:var(--dim)}
.ospite-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--amber-soft);
  color:var(--amber-ink);font-size:12px;border-bottom:1px solid var(--line)}
.ospite-bar b{font-family:Sora}
.ospite-bar svg{width:14px;height:14px;flex:none}

/* ---------- MENU TASTO DESTRO ---------- */
.ctx{
  position:fixed;z-index:85;min-width:228px;max-width:280px;padding:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);animation:ctxin .13s ease-out;
}
@keyframes ctxin{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.ctx-h{padding:7px 10px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);font-family:Sora;font-weight:600;border-bottom:1px solid var(--line-soft);
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-i{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;
  font-size:12.5px;text-align:left;transition:background .12s,color .12s;color:var(--text)}
.ctx-i svg{width:14px;height:14px;flex:none;color:var(--mute)}
.ctx-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-i kbd{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.ctx-i:hover{background:var(--surface-2)}
.ctx-i:hover svg{color:var(--amber-ink)}
.ctx-i.danger{color:var(--alert)}
.ctx-i.danger svg{color:var(--alert)}
.ctx-i.danger:hover{background:var(--alert-soft)}
.ctx-i:disabled{opacity:.35;cursor:default}
.ctx-i:disabled:hover{background:none}
.ctx-sep{height:1px;background:var(--line-soft);margin:4px 6px}
.ctx-target{box-shadow:0 0 0 2px var(--amber) inset;border-radius:6px}

/* ---------- DRAG CALENDARIO ---------- */
.ev{cursor:grab}
.ev:active{cursor:grabbing}
.ev.dragging{opacity:.3}
.ev.fantasma{position:fixed;z-index:95;pointer-events:none;box-shadow:0 12px 26px rgba(0,0,0,.35);
  opacity:.95;transform:scale(1.04)}
.ev{touch-action:none}
.vs{touch-action:none}
.cal .day.over{background:var(--amber-soft);box-shadow:0 0 0 2px var(--amber) inset}
.cal .day.over .n{color:var(--amber-ink)}

/* ---------- REGISTRO ---------- */
.reg{max-height:270px;overflow-y:auto;display:flex;flex-direction:column}
.reg .r{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.reg .r:last-child{border-bottom:none}
.reg .t{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mute);flex:none;padding-top:2px;width:86px}
.reg .w{color:var(--dim);flex:1;min-width:0}
.reg .w b{color:var(--text);font-weight:600}
.reg .chi{font-size:10.5px;color:var(--mute);flex:none}

.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--ring),0 0 0 1px var(--amber) inset}100%{box-shadow:0 0 0 12px transparent,0 0 0 1px transparent inset}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- TOCCO: l'app si comporta come un'app, non come una pagina ----------
   Su telefono e tablet la pressione prolungata non deve più far comparire il
   menu del browser, la lente, la selezione del testo o lo zoom a doppio tocco.
   Resta tutto dove serve davvero scrivere o copiare: campi, note, chat. */
@media (hover:none),(pointer:coarse){
  html{-webkit-text-size-adjust:100%}
  body{
    -webkit-touch-callout:none;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  img,svg,.picona,.av,.ic,.mark{-webkit-user-drag:none;user-drag:none;pointer-events:auto}
  input,textarea,select,[contenteditable="true"],
  .postit,.postit *,.nota,.ric,.chat-b,.msg,.task-nota .tx{
    -webkit-touch-callout:default;
    -webkit-user-select:text;-moz-user-select:text;user-select:text;
  }
  .postit,.nota{touch-action:none}
}

/* ---------- RESPONSIVE ---------- */
/* Sotto i 1100px la colonna di sinistra non ci sta: diventa un pannello «Scheda»
   che scorre da sinistra, e l'avanzamento di fase (cerchio / COMPLETATO) resta
   sempre visibile in testa alla fase. Su iPad e telefono non si perde nulla. */
.solo-stretto{display:none!important}
.solo-tel{display:none!important}

/* ---------- TASTO INDIETRO ---------- */
.indietro{
  display:inline-flex;align-items:center;gap:6px;flex:none;align-self:flex-start;
  padding:7px 12px 7px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:600;
  transition:background .14s,border-color .14s,transform .12s;
}
.indietro svg{width:15px;height:15px;color:var(--mute)}
.indietro:hover{background:var(--surface);border-color:var(--amber)}
.indietro:active{transform:scale(.96)}
.indietro span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riga-indietro{display:contents}
.rail-compatta{display:none}
.rail-scrim{display:none}
#statoProfilo{transition:color .2s,border-color .2s}
#statoProfilo.ok-flash{color:var(--ok);border-color:var(--ok)}
.chiudi-feed{flex:none;width:34px;padding:0;display:grid;place-items:center;color:var(--mute)}
.chiudi-feed svg{width:14px;height:14px}
.chiudi-feed:hover{color:var(--text)}
.chat-step{position:relative;flex:none!important;width:46px;justify-content:center;padding:7px!important}
.chat-step .n{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--alert);color:#fff;font-size:9.5px;font-weight:700;font-family:Sora;display:grid;place-items:center}
.chat-step.ha-nuovi{border-color:var(--alert)}
@media (max-width:1100px){
  .specs{display:grid}
  .proj{grid-template-columns:minmax(0,1fr);position:relative}
  .solo-stretto{display:inline-flex!important}
  .rail-compatta{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}
  .rail-compatta .ring-wrap{gap:10px}
  .rail-compatta .ring{width:42px;height:42px}
  .rail-compatta .ring-n{font-size:15px}
  .rail-compatta .btn-completa{width:auto;padding:10px 16px;font-size:12.5px;margin:0}
  .rail-compatta .nota-completa{display:none}
  .proj > .rail:not(.rail-r){
    position:absolute;z-index:40;top:0;bottom:0;left:0;width:min(302px,86vw);
    transform:translateX(-103%);transition:transform .22s cubic-bezier(.4,0,.2,1);
    box-shadow:14px 0 46px rgba(0,0,0,.3);border-right:1px solid var(--line);
  }
  .proj.rail-on > .rail:not(.rail-r){transform:none}
  .proj.rail-on > .rail-scrim{display:block;position:absolute;inset:0;z-index:35;
    background:rgba(8,12,20,.42);animation:fadein .18s ease-out}
}
@media (max-width:1000px){
  .crumb span{display:none}
  .search{min-width:120px}
  .viewswitch{position:static;transform:none}
  .vs{padding:7px 12px;font-size:13px}
}
@media (max-width:820px){
  .cal-title{font-size:20px;min-width:0}
  .cal-head{padding:6px 12px 8px}
  .cal-wrap{padding:0 12px 12px}
  .cal .day{padding:3px}
  .vs span{display:none}
  .vs{padding:7px 11px}
  .search{display:none}
  .griglia{grid-template-columns:1fr}
  .proj-head{padding:10px 14px}
  .proj-head h1{font-size:18px}
  .step .tx{display:none}
  .step{justify-content:center;padding:7px}
  .step .idx{display:none}
  .home-head{padding:12px 16px 8px}
  .scroller{padding:4px 16px 16px}
  .cal{margin:0 16px 16px}
  .cal .day{min-height:62px}
  .ev b{display:none}
}
.only-narrow{display:none}
@media (max-width:820px){.only-narrow{display:grid}}

/* ==========================================================================
   TOCCO, PENNINO E SCHERMI PICCOLI
   ========================================================================== */

/* Dove non c'è il passaggio del mouse (iPad, telefono, Apple Pencil)
   le matite restano visibili e i bersagli diventano più grandi. */
@media (hover:none), (pointer:coarse){
  .pen{opacity:.72}
  .pen:active{opacity:1;background:var(--surface-3)}
  .iconbtn{width:42px;height:42px}
  .btn{padding:10px 15px}
  .btn.sm{padding:8px 12px}
  .chk{padding:10px 0}
  .box{width:20px;height:20px}
  .tab{padding:10px 4px}
  .sub-h{padding:14px 12px}
  .ctx-i{padding:11px 10px;font-size:13.5px}
  .ev{padding:6px 7px;font-size:11.5px}
  .cal .day{padding:5px}
  .fchip{padding:9px 14px}
  .vs{padding:10px 16px}
  .seg button{padding:8px 14px}
  .tile{padding:15px 16px}
  .luogo{padding:12px}
  .riga{padding:14px 0}
  .postit .via{opacity:.8}
  .postit .grip{width:30px;height:30px}
  .rewind{width:46px;height:46px}
  .step{padding:9px 10px}
  input,select,textarea{font-size:16px}   /* evita lo zoom automatico su iOS */
}

/* iPad in verticale e orizzontale */
@media (min-width:821px) and (max-width:1180px){
  .proj{grid-template-columns:200px minmax(0,1fr) 270px}
  .sp-head h1{font-size:28px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
@media (min-width:821px) and (max-width:1024px){
  .proj{grid-template-columns:minmax(0,1fr) 288px}
  .cal-title{font-size:24px}
  .mappa-lista{width:210px}
}

/* Telefono */
@media (max-width:620px){
  body{font-size:14px}
  .topbar{height:54px;padding:0 10px;gap:8px}
  .brand b{display:none}
  .crumb{flex:1;min-width:0}
  .sp-chip{max-width:none;flex:1}
  .viewswitch{
    position:fixed;left:0;right:0;bottom:0;top:auto;transform:none;border-radius:0;
    border:none;border-top:1px solid var(--line);background:var(--surface);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:35;
    justify-content:space-around;
  }
  .viewswitch .vs{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10px;border-radius:10px}
  .viewswitch .vs span{display:block;font-size:10px}
  .viewswitch .vs svg{width:19px;height:19px}
  /* Telefono: barra in alto ridotta all'osso.
     Spazio, commenti, annulla e tema stanno nel menu ⋯ (vedi menuTelefono). */
  .no-tel{display:none!important}
  .solo-tel{display:inline-flex!important}
  .crumb .sp-chip{display:none}
  .topbar [data-action="toggle-feed"],
  .topbar #undoBtn,
  .topbar #themeBtn{display:none!important}
  .rail-compatta.e-anello{display:none}
  .work-head .editabile .pen{display:none}
  .sub-h .chip{display:none}
  .subs > .lbl [data-action="nuova-task"]{margin-left:0!important}
  /* Niente matite: si tocca il campo (vedi il gestore dei click). */
  .pen{display:none!important}
  /* Il tasto indietro sta da solo sulla sua riga, icona e titolo sotto. */
  .sp-head > .riga-indietro,
  .proj-head > .riga-indietro{display:block;flex:0 0 100%;margin-bottom:2px}
  .proj-head > .picona.big{display:none}
  .sp-head{gap:12px;align-items:center}
  .sp-head > div:not(.azioni):not(.riga-indietro){flex:1 1 0;min-width:0}
  .phasebar.vuota{display:none}
  .app{grid-template-rows:auto minmax(0,1fr) auto}
  .app.con-nav{padding-bottom:var(--nav-h,0px)}
  .stage{padding-bottom:0}
  /* Barra in basso compatta: una riga sola, scorre di lato, niente etichette */
  .phasebar{padding:6px 10px;gap:6px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
  .con-nav .phasebar{padding-bottom:6px}
  .phasebar .chip{white-space:nowrap;flex:none}
  .phasebar .lbl{display:none!important}
  .phasebar .btn{flex:none;padding:8px 12px}
  .filtri{overflow-x:auto;flex-wrap:nowrap;min-width:0}
  .filtri .fchip{white-space:nowrap;flex:none}
  .ordina{display:none}
  .snoozed{flex:none}
  /* ---------- LA HOME DEL TELEFONO ----------
     In alto rispondo a tre domande e basta: chi sei, ti hanno cercato,
     cosa fai adesso. Lo spazio di lavoro scende sotto, in una riga sola. */
  .tel-home{padding:14px 14px 4px}
  .tel-saluto{font-family:Sora;font-size:22px;font-weight:700;margin:0 0 11px;letter-spacing:-.01em}
  .tel-avviso{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:13px 13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);
    color:var(--text);font:inherit;cursor:pointer}
  .tel-avviso .ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
    background:var(--surface-2);color:var(--mute)}
  .tel-avviso .ic svg{width:17px;height:17px}
  .tel-avviso .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .tel-avviso .tx b{font-family:Sora;font-size:14.5px;font-weight:600;line-height:1.25}
  .tel-avviso .tx span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tel-avviso .fr{flex:none;color:var(--mute);display:grid;place-items:center}
  .tel-avviso .fr svg{width:16px;height:16px}
  .tel-avviso.tag{border-color:var(--amber);background:var(--amber-soft)}
  .tel-avviso.tag .ic{background:var(--amber);color:#0D1926}
  .tel-avviso.tag .tx span{color:var(--amber-ink)}
  .tel-avviso.calmo{background:transparent;border-style:dashed;cursor:default}
  .tel-prima{margin-top:10px;padding:14px;border-radius:15px;border:1px solid var(--line);
    background:var(--surface);display:flex;flex-direction:column;gap:3px}
  .tel-prima .lb{font-family:Sora;font-size:9.5px;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;color:var(--mute)}
  .tel-prima > b{font-family:Sora;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .tel-prima .tel-prima-sub{font-size:12px;color:var(--mute);line-height:1.4}
  .tel-prima .btn{margin-top:10px;width:100%;justify-content:center;padding:12px}
  .tel-prima.urg{border-color:var(--alert);background:var(--alert-soft)}
  .tel-prima.urg .lb{color:var(--alert)}
  /* lo spazio di lavoro: una riga, non mezza schermata */
  .sp-head{padding:8px 14px 8px;gap:10px;align-items:center}
  .sp-head > .riga-indietro{flex:none;margin:0}
  .sp-head > .riga-indietro .indietro{padding:8px 11px;font-size:12.5px}
  .sp-head > .ic{display:none}
  .sp-head .ic{width:34px;height:34px;border-radius:11px}
  .sp-head .ic svg{width:17px;height:17px}
  .sp-head h1{font-size:17px}
  .sp-head .desc{display:none}
  .sp-head .riga2 .dato{font-size:11px}
  .sp-head .riga2 .dato:not(.urg):nth-child(n+2){display:none}
  .sp-head .azioni{margin-left:auto;width:auto}
  .sp-head .azioni [data-action="modifica-spazio"]{display:none}
  .sp-head .azioni .btn{padding:9px 12px}
  .sp-head .azioni .btn span,.sp-head .azioni .btn{font-size:0}
  .sp-head .azioni .btn svg{width:18px;height:18px}
  .segmenti{margin-top:2px}
  .scroller{padding:4px 14px 14px}
  .tiles{grid-template-columns:1fr}
  .proj-head{padding:10px 12px;gap:10px}
  .proj-head h1{font-size:19px}
  .proj-head .side{width:100%;margin-left:0}
  .proj-head .picona.big{width:34px;height:34px;border-radius:11px}
  .work-head{padding:12px 14px 10px;flex-direction:column;align-items:flex-start;gap:8px}
  .work-head h2{font-size:16px}
  .rail-compatta{margin-left:0;width:100%}
  .rail-compatta .btn-completa{flex:1;justify-content:center}
  .proj > .rail:not(.rail-r){width:min(292px,88vw)}
  .sub-h{gap:8px}
  .sub-h .minibar{display:none}
  .sub-h .chip{font-size:9.5px;padding:2px 6px}
  .task-nota{margin-top:7px}
  .rail-r .tabs{position:sticky;top:0;background:var(--surface);z-index:2}
  .lista-wrap{padding:4px 14px 14px}
  .rg{padding:12px 10px;gap:9px}
  .rg .quando{width:auto;font-size:11px}
  .gruppo-h h3{font-size:14px}
  .specs{grid-template-columns:1fr 1fr}
  .spec{padding:8px 14px}
  .subs{padding:10px 14px 14px}
  .prossima{margin:10px 14px 0;flex-wrap:wrap}
  .prossima .az{width:100%;margin-top:8px}
  .prossima .az .btn{flex:1;justify-content:center}
  .benvenuto{padding:0 14px}
  .benvenuto .benv{padding:15px 16px;gap:12px}
  .benvenuto h2{font-size:18px}
  /* la campana è già nella barra in alto: qui ruba solo spazio */
  .benvenuto .campana{display:none}
  .benvenuto .benv-tx{flex:1 1 100%}
  .benvenuto .mini{gap:6px 14px;margin-top:8px;font-size:12px}
  .benvenuto h2{font-size:17px}
  .benvenuto p{font-size:12.5px}
  .benvenuto .az{width:100%;margin-left:0;flex:1 1 100%}
  .benvenuto .az .btn{flex:1;justify-content:center}
  .daffare{flex-wrap:wrap;gap:10px;padding:13px 15px}
  .daffare .ic{width:34px;height:34px;border-radius:11px}
  .daffare .az{width:100%;margin-left:0}
  .daffare .az .btn{width:100%;justify-content:center}
  .solo-largo{display:none!important}
  .spazi{grid-template-columns:1fr;padding:0 14px 20px}
  .spazi-head{padding:18px 14px 12px}
  .modal{width:min(440px,94vw);max-height:88vh}
  .griglia{grid-template-columns:1fr}
  .cal .day{min-height:0}
  .cal .evs{display:none}
  .cal .day.ha-eventi::after{content:"";width:5px;height:5px;border-radius:50%;
    background:var(--amber);margin:2px auto 0;display:block}
  .cal-title{font-size:19px}
  .mappa-wrap{flex-direction:column;padding:0 14px 14px}
  .mappa-lista{width:auto;max-height:190px}
  .drawer{width:100%}
  .alert-box{padding:24px 20px 18px}
  .alert-actions{flex-direction:column}
  .btn-snooze{justify-content:center;padding:11px}
  .toasts{left:10px;right:10px;width:auto}
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" data-action="spazi" title="Tutti gli spazi di lavoro">
      <div class="mark"></div>
      <div><b>FOSS</b></div>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="viewswitch" id="viewswitch" hidden></div>
    <div class="spacer"></div>
    <div class="search" id="searchWrap" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Cerca progetto o cliente…" autocomplete="off">
    </div>
    <button class="iconbtn solo-tel" data-action="condividi" id="shareBtn" title="Condividi progetto o task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <button class="iconbtn solo-tel" data-action="menu-telefono" title="Altro">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <button class="iconbtn only-narrow" data-action="toggle-feed" title="Commenti e chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.2 7.3L4 20l.8-5A8 8 0 1 1 21 12z"/></svg>
    </button>
    <button class="iconbtn" data-action="annulla" title="Annulla ultima azione (Ctrl+Z)" id="undoBtn"></button>
    <button class="iconbtn" data-action="lock" title="Blocca le modifiche" id="lockBtn"></button>
    <button class="iconbtn" data-action="theme" title="Tema chiaro / scuro" id="themeBtn"></button>
    <button class="iconbtn" data-action="notifiche" title="Notifiche" id="bellBtn"></button>
    <button class="iconbtn" data-action="me" title="Profilo" id="meBtn" style="width:auto;padding:0 4px"></button>
  </header>

  <main class="stage" id="stage"></main>
  <div id="bannerSlot"></div>
  <nav class="phasebar" id="phasebar"></nav>
</div>

<div class="scrim" id="scrim" data-action="close-all"></div>

<aside class="drawer" id="drawer" aria-label="Notifiche">
  <div class="drawer-h">
