function mioModello(m){ return sonoAdmin || !m.creato_da || m.creato_da===state.utente; }
const presetDi = id => (state.modelli||[]).find(m=>m.id===id) || null;
function riassuntoPreset(m){
  const X = TIPO(m.tipo), nt = (m.task||[]).length;
  return X.prof+' · '+(m.fasi||[]).length+((m.fasi||[]).length===1?' fase':' fasi')+' · '+nt+' task';
}

/* ---------- un preset che arriva da fuori (file, altro account): solo quello che serve ---------- */
function presetPulito(o){
  if(!o || typeof o !== 'object') return null;
  const str = (v, n) => String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, n);
  const nome = str(o.nome, 60); if(!nome) return null;
  const tipo = TIPI[o.tipo] ? o.tipo : 'generico';
  const lavoro = (o.lavoro && TIPI[tipo].lavori && TIPI[tipo].lavori[o.lavoro]) ? o.lavoro : null;
  const fasi = (Array.isArray(o.fasi) ? o.fasi : []).slice(0, 12).map((f,i)=>{
    f = f && typeof f === 'object' ? f : {};
    const x = {nome:str(f.nome, 40) || ('Fase '+(i+1)), icon:I[f.icon] ? f.icon : 'list', desc:str(f.desc, 120)};
    if(Array.isArray(f.campi)) x.campi = f.campi.slice(0, 12)
      .filter(c=>Array.isArray(c) && /^[a-z_]{1,30}$/.test(String(c[1]||'')))
      .map(c=>[str(c[0], 40) || c[1], String(c[1])]);
    return x;
  });
  if(!fasi.length) return null;
  const task = (Array.isArray(o.task) ? o.task : []).slice(0, 300).map(t=>{
    t = t && typeof t === 'object' ? t : {};
    const fase = Math.max(0, Math.min(fasi.length-1, parseInt(t.fase, 10) || 0));
    const items = (Array.isArray(t.items) ? t.items : []).slice(0, 80).map(v=>{
      v = v && typeof v === 'object' ? v : {t:v};
      const x = {t:str(v.t, 120)};
      if(Array.isArray(v.lista)) x.lista = v.lista.slice(0, 40).map(c=>str(c && typeof c === 'object' ? c.t : c, 120)).filter(Boolean);
      return x;
    }).filter(v=>v.t);
    return {fase, titolo:str(t.titolo, 80), items};
  }).filter(t=>t.titolo);
  const tags = (Array.isArray(o.tags) ? o.tags : []).slice(0, 20).map(t=>str(t, 30)).filter(Boolean);
  return {nome, tipo, lavoro, descrizione:str(o.descrizione, 600), fasi, task, tags};
}

/* ---------- esportare: un file .json che FOSS sa rileggere ---------- */
function nomeFile(s){ return String(s||'preset').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'preset'; }
function esportaPreset(ids){
  const ms = (state.modelli||[]).filter(m=>!ids || ids.indexOf(m.id)>=0);
  if(!ms.length){ toast('Non c’è nessun preset da esportare.','warn','Niente da esportare'); return; }
  const dati = {formato:'foss-preset', versione:1, esportato:new Date().toISOString(),
    preset: ms.map(m=>({nome:m.nome, tipo:m.tipo, lavoro:m.lavoro||null, descrizione:m.descrizione||'',
      fasi:(m.fasi||[]).map(f=>({nome:f.nome, icon:f.icon, desc:f.desc||'', campi:f.campi})), task:m.task||[], tags:m.tags||[]}))};
  const testo = JSON.stringify(dati, null, 1);
  const nome = 'preset-' + (ms.length===1 ? nomeFile(ms[0].nome) : 'foss-'+new Date().toISOString().slice(0,10)) + '.json';
  /* dal telefono apro la condivisione (File, AirDrop, WhatsApp, Mail); dal computer lo scarico */
  try{
    const f = new File([testo], nome, {type:'application/json'});
    const tocco = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    if(tocco && navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:ms.length===1 ? ms[0].nome : 'Preset di FOSS'}).catch(()=>{});
      return;
    }
  }catch(e){}
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([testo], {type:'application/json'}));
    a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }catch(e){ toast('Il file non è partito: riprova da un altro browser.','warn','Esportazione non riuscita'); }
}

/* ---------- importare: uno o piu' preset da un file ---------- */
function importaPreset(file, poi){
  if(!file) return;
  if(file.size > 2*1024*1024){ toast('Il file è troppo grande per essere un preset.','warn','File non valido'); return; }
  const r = new FileReader();
  r.onerror = ()=>toast('Non riesco a leggere il file.','warn','Importazione non riuscita');
  r.onload = ()=>{
    let dati;
    try{ dati = JSON.parse(r.result); }catch(e){ toast('Questo file non è un preset di FOSS.','warn','File non valido'); return; }
    const lista = Array.isArray(dati) ? dati : (dati && Array.isArray(dati.preset)) ? dati.preset : [dati];
    const presi = lista.slice(0, 50).map(presetPulito).filter(Boolean);
    if(!presi.length){ toast('Nel file non c’è nessun preset valido.','warn','File non valido'); return; }
    const nomi = new Set((state.modelli||[]).map(m=>m.nome.toLowerCase()));
    const nuovi = presi.map(p=>{
      let nome = p.nome, k = 2;
      while(nomi.has(nome.toLowerCase())) nome = p.nome.slice(0, 54)+' ('+(k++)+')';
      nomi.add(nome.toLowerCase());
      return Object.assign(p, {nome, id:'mod'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                                creato_da:state.utente, t:Date.now()});
    });
    Promise.all(nuovi.map(registraModello)).then(esiti=>{
      azione('Importat'+(nuovi.length===1?'o il preset ':'i i preset ')+nuovi.map(m=>'<b>'+esc(m.nome)+'</b>').join(', '));
      render();
      if(esiti.every(x=>x!==false)) modale('<h3>'+(nuovi.length===1?'Preset importato':'Preset importati')+'</h3><div class="modal-b">'+
        '<div class="adm-lista">'+nuovi.map(m=>'<div class="adm-r"><span class="picona">'+svg(TIPO(m.tipo).ic)+'</span>'+
          '<div class="tx"><b>'+esc(m.nome)+'</b><span>'+esc(riassuntoPreset(m))+'</span></div></div>').join('')+'</div>'+
        '<div class="nota-box">Li trovi tra i tuoi preset e quando crei un progetto o uno spazio.</div></div>'+
        '<div class="modal-f"><button class="btn primary" data-action="chiudi-modale">Fatto</button></div>');
      if(poi) poi(nuovi);
    });
  };
  r.readAsText(file);
}
/* il selettore di file, da qualunque tasto «Importa» */
function scegliFilePreset(poi){
  let i = el('pe_file');
  if(!i){ i = document.createElement('input'); i.type = 'file'; i.id = 'pe_file'; i.hidden = true;
    i.accept = '.json,application/json'; document.body.appendChild(i); }
  i.value = '';
  i.onchange = ()=>{ const f = i.files && i.files[0]; if(f) importaPreset(f, poi); };
  i.click();
}

/* ---------- l'editor: nome, professione, metodo, fasi e task ---------- */
let pe = null;
function vociDaTesto(t){
  return String(t||'').split('\n').map(r=>r.trim()).filter(Boolean).slice(0, 80).map(r=>{
    const i = r.indexOf(':');
    if(i > 0 && r.slice(i+1).trim()) return {t:r.slice(0, i).trim().slice(0, 120),
      lista:r.slice(i+1).split(/[,;]/).map(x=>x.trim()).filter(Boolean).slice(0, 40).map(x=>x.slice(0, 120))};
    return {t:r.slice(0, 120)};
  });
}
function testoDaVoci(items){ return (items||[]).map(v=>v.t+(v.lista && v.lista.length ? ': '+v.lista.join(', ') : '')).join('\n'); }
function taskPreset(testo){
  const t = String(testo||'').trim(); if(!t) return null;
  const tk = taskDa(t.indexOf('|')>=0 ? t : t+'|');
  return {titolo:tk.titolo.slice(0, 80), items:tk.items.map(v=>{ const x = {t:v.t}; if(v.lista) x.lista = v.lista.map(c=>c.t); return x; })};
}
function fasiDaPiano(tipo, lavoro){
  return pianoDi(tipo, lavoro).map(f=>({nome:f.nome, icon:f.icon, desc:f.desc||'', campi:f.campi,
    task:f.task.map(t=>({titolo:t.titolo, items:t.items.map(v=>{ const x = {t:v.t}; if(v.lista) x.lista = v.lista.map(c=>c.t); return x; })}))}));
}
function apriEditorPreset(id, opz){
  opz = opz || {};
  const M = id ? presetDi(id) : null;
  if(M){
    pe = {id:M.id, nome:M.nome, tipo:M.tipo||'generico', lavoro:M.lavoro||null, descrizione:M.descrizione||'', tags:(M.tags||[]).slice(),
          fasi:(M.fasi||[]).map((f,i)=>({nome:f.nome, icon:f.icon||'list', desc:f.desc||'', campi:f.campi,
            task:(M.task||[]).filter(t=>t.fase===i).map(t=>({titolo:t.titolo, items:(t.items||[]).map(v=>Object.assign({}, v, {lista:v.lista ? v.lista.slice() : undefined}))}))})),
          solaLettura: !(mioModello(M) && puo('crea_lavori')), creato_da:M.creato_da};
  } else {
    const sp = SPZ(), tipo = opz.tipo || (sp && TIPI[sp.tipo] ? sp.tipo : professioniMie()[0]);
    pe = {id:null, nome:'', tipo, lavoro:null, descrizione:'', tags:[], fasi:fasiDaPiano(tipo, null), solaLettura:false};
  }
  pe.apri = null; pe.bozze = {}; pe.ritorno = opz.ritorno || null; pe.togliere = false; pe.errore = '';
  chiudiCtx();
  renderEditorPreset();
}
function chiudiEditorPreset(){ pe = null; const n = el('peLayer'); if(n) n.remove(); }
function peLeggi(){
  if(!pe) return;
  const v = id => { const n = el(id); return n ? n.value : null; };
  let x;
  if((x = v('pe_nome'))!=null) pe.nome = x.trim().slice(0, 60);
  if((x = v('pe_desc'))!=null) pe.descrizione = x.slice(0, 600);
  document.querySelectorAll('[data-pe-fase]').forEach(i=>{ const f = pe.fasi[+i.dataset.peFase]; if(f) f.nome = i.value.trim().slice(0, 40) || f.nome; });
  document.querySelectorAll('[data-pe-add]').forEach(i=>{ pe.bozze[i.dataset.peAdd] = i.value; });
  if(pe.apri){
    const [fi, ti] = pe.apri.split(':').map(Number), t = pe.fasi[fi] && pe.fasi[fi].task[ti];
    if(t && el('pe_tt')){ t.titolo = (el('pe_tt').value.trim() || t.titolo).slice(0, 80); t.items = vociDaTesto(el('pe_ti').value); }
  }
}
function renderEditorPreset(){
  if(!pe) return;
  let n = el('peLayer');
  if(!n){ n = document.createElement('div'); n.className = 'wz nl pe'; n.id = 'peLayer'; document.body.appendChild(n); }
  const vecchio = el('peCorpo'), scroll = vecchio ? vecchio.scrollTop : 0;
  const ro = pe.solaLettura, T = TIPO(pe.tipo);
  const nt = pe.fasi.reduce((k,f)=>k+f.task.length, 0);
  let b = '<div class="griglia2">'+
      '<div class="field"><label>Nome del preset</label><input id="pe_nome" value="'+esc(pe.nome)+'" maxlength="60" placeholder="Es. Video YouTube settimanale"'+(ro?' readonly':'')+'></div>'+
      '<div class="field"><label>Professione</label><select id="pe_tipo"'+(ro?' disabled':'')+'>'+
        tipiVisibili(pe.tipo).map(k=>'<option value="'+k+'"'+(pe.tipo===k?' selected':'')+'>'+esc(TIPI[k].prof)+'</option>').join('')+'</select></div>'+
    '</div>';
  if(!ro){
    const lav = Object.keys(T.lavori||{});
    b += '<div class="field"><label>Parti da</label><div class="nl-chips">'+
      '<button class="nl-chip" data-action="pe-base" data-k="">Fasi di base: '+esc(T.fasi.map(f=>f.nome).join(' · '))+'</button>'+
      lav.map(k=>'<button class="nl-chip" data-action="pe-base" data-k="'+k+'">'+esc(T.lavori[k].n)+'</button>').join('')+
      '<button class="nl-chip" data-action="pe-vuoto">Da zero</button></div>'+
      '<div class="pe-hint">Riempie fasi e task qui sotto: poi li cambi come vuoi.</div></div>';
  }
  b += '<div class="field"><label>Il vostro metodo <i>(facoltativo)</i></label>'+
    '<textarea id="pe_desc" rows="3" maxlength="600" placeholder="Es. Un video a settimana: brief il lunedì, riprese il mercoledì, montaggio e pubblicazione il venerdì."'+(ro?' readonly':'')+'>'+esc(pe.descrizione)+'</textarea></div>';
  b += '<div class="pe-conta">'+pe.fasi.length+(pe.fasi.length===1?' fase':' fasi')+' · '+nt+' task</div>';
  pe.fasi.forEach((f,fi)=>{
    b += '<div class="nl-fase pe-fase"><div class="nl-fase-h"><span class="picona">'+svg(f.icon||'list')+'</span>'+
      (ro ? '<span class="tx"><b>'+esc(f.nome)+'</b></span>'
          : '<input class="pe-fnome" data-pe-fase="'+fi+'" value="'+esc(f.nome)+'" maxlength="40" aria-label="Nome della fase">'+
            '<span class="pe-az">'+
              '<button class="iconbtn" data-action="pe-sposta-fase" data-f="'+fi+'" data-d="-1" title="Sposta prima"'+(fi===0?' disabled':'')+'>'+svg('up',2.4)+'</button>'+
              '<button class="iconbtn" data-action="pe-sposta-fase" data-f="'+fi+'" data-d="1" title="Sposta dopo"'+(fi===pe.fasi.length-1?' disabled':'')+'>'+svg('down',2.4)+'</button>'+
              '<button class="iconbtn" data-action="pe-togli-fase" data-f="'+fi+'" title="Togli la fase"'+(pe.fasi.length<2?' disabled':'')+'>'+svg('x',2.4)+'</button>'+
            '</span>')+
      '</div><div class="nl-task">';
    f.task.forEach((t,ti)=>{
      const k = fi+':'+ti;
      if(pe.apri===k && !ro){
        b += '<div class="pe-edit"><div class="field"><label>Task</label><input id="pe_tt" value="'+esc(t.titolo)+'" maxlength="80"></div>'+
          '<div class="field"><label>Subtask, una per riga</label><textarea id="pe_ti" rows="5" placeholder="Scaletta\nLocation: sopralluogo, permessi\nMusica">'+esc(testoDaVoci(t.items))+'</textarea>'+
          '<div class="pe-hint">Per una checklist dentro la subtask: «Subtask: voce, voce».</div></div>'+
          '<div class="pe-edit-f"><button class="btn sm ghost danger" data-action="pe-togli-task" data-f="'+fi+'" data-i="'+ti+'">'+svg('x',2.4)+'Togli</button>'+
          '<span class="spacer"></span><button class="btn sm primary" data-action="pe-chiudi-task">'+svg('check')+'Fatto</button></div></div>';
        return;
      }
      const nc = t.items.filter(v=>v.lista && v.lista.length).length;
      b += '<div class="pe-t">'+
        '<button class="pe-t-b" data-action="pe-apri-task" data-f="'+fi+'" data-i="'+ti+'"'+(ro?' disabled':'')+'>'+
          '<span class="tx"><b>'+esc(t.titolo)+'</b><span>'+(t.items.length ? esc(t.items.map(v=>v.t).join(' · ')) : 'Senza subtask')+'</span></span>'+
          (nc ? '<span class="cl-badge">'+svg('list',2.2)+nc+'</span>' : '')+(ro ? '' : '<span class="pe-pen">'+svg('right',2.2)+'</span>')+'</button>'+
        (ro ? '' : '<span class="pe-az"><button class="iconbtn" data-action="pe-sposta-task" data-f="'+fi+'" data-i="'+ti+'" data-d="-1" title="Sposta su"'+(ti===0?' disabled':'')+'>'+svg('up',2.4)+'</button>'+
          '<button class="iconbtn" data-action="pe-sposta-task" data-f="'+fi+'" data-i="'+ti+'" data-d="1" title="Sposta giù"'+(ti===f.task.length-1?' disabled':'')+'>'+svg('down',2.4)+'</button></span>')+
      '</div>';
    });
    if(!f.task.length) b += '<div class="pe-vuota">Nessuna task in questa fase.</div>';
    if(!ro) b += '<div class="nl-add"><input data-pe-add="'+fi+'" value="'+esc(pe.bozze[fi]||'')+'" placeholder="Aggiungi una task a '+esc(f.nome)+'…" maxlength="200" enterkeyhint="done" aria-label="Nuova task in '+esc(f.nome)+'">'+
      '<button class="btn sm" data-action="pe-add-task" data-f="'+fi+'" aria-label="Aggiungi">'+svg('plus')+'</button></div>';
    b += '</div></div>';
  });
  if(!ro) b += '<button class="btn pe-nuova-fase" data-action="pe-add-fase">'+svg('plus')+'Aggiungi una fase</button>';
  if(pe.errore) b += '<div class="pe-err">'+esc(pe.errore)+'</div>';

  const piede = ro
    ? '<button class="btn ghost" data-action="pe-chiudi">Chiudi</button><div class="spacer"></div>'+
      '<button class="btn" data-action="pe-esporta">'+svg('deliver')+'Esporta</button>'
    : (pe.id ? (pe.togliere
        ? '<button class="btn danger" data-action="pe-elimina" data-ok="1">'+svg('x',2.4)+'Sì, elimina</button>'
        : '<button class="btn ghost" data-action="pe-elimina">'+svg('x',2.4)+'Elimina</button>') : '<button class="btn ghost" data-action="pe-chiudi">Annulla</button>')+
      '<div class="spacer"></div>'+
      (pe.id ? '<button class="btn ghost" data-action="pe-esporta" title="Salva un file da mandare o da tenere">'+svg('deliver')+'<span class="no-tel">Esporta</span></button>' : '')+
      '<button class="btn primary" data-action="pe-salva">'+svg('check')+'Salva il preset</button>';
  n.innerHTML = '<div class="wz-card">'+
    '<div class="wz-top"><button class="iconbtn wz-x" data-action="pe-chiudi" title="Chiudi" aria-label="Chiudi">'+svg('x',2.4)+'</button>'+
      '<div class="kicker">'+(ro ? 'Preset di un collega' : pe.id ? 'Modifica il preset' : 'Nuovo preset')+'</div>'+
      '<h2>'+(pe.id ? esc(pe.nome || 'Preset') : 'Il vostro metodo, pronto da riusare')+'</h2>'+
      '<p>Fasi, task, subtask e checklist che ritrovi ogni volta che crei un progetto o uno spazio. Niente date, persone o soldi.</p></div>'+
    '<div class="wz-b" id="peCorpo">'+b+'</div><div class="wz-f">'+piede+'</div></div>';
  const corpo = el('peCorpo'); if(corpo) corpo.scrollTop = scroll;
  if(pe.apri) setTimeout(()=>{ const i = el('pe_tt'); if(i && !suTelefono()) i.focus(); }, 40);
  else if(!pe.id && !pe.nome) setTimeout(()=>{ const i = el('pe_nome'); if(i && !suTelefono()) i.focus(); }, 60);
}
function peAzione(a, t){
  if(!pe) return;
  const fi = +t.dataset.f, ti = +t.dataset.i;
  peLeggi(); pe.errore = '';
  if(a!=='pe-elimina') pe.togliere = false;
  switch(a){
    case 'pe-chiudi':{
      const r = pe.ritorno; chiudiEditorPreset();
      if(r==='nl' && nl) renderNuovoLavoro();
      return; }
    case 'pe-base': pe.fasi = fasiDaPiano(pe.tipo, t.dataset.k || null); pe.lavoro = t.dataset.k || null; pe.apri = null; pe.bozze = {}; break;
    case 'pe-vuoto': pe.fasi = [{nome:'Da fare', icon:'list', desc:'', task:[]}, {nome:'In corso', icon:'spark', desc:'', task:[]}, {nome:'Consegna', icon:'deliver', desc:'', task:[]}];
      pe.lavoro = null; pe.apri = null; pe.bozze = {}; break;
    case 'pe-add-fase': if(pe.fasi.length >= 12){ pe.errore = 'Al massimo 12 fasi.'; break; }
      pe.fasi.push({nome:'Nuova fase', icon:'list', desc:'', task:[]}); pe.apri = null;
      setTimeout(()=>{ const i = document.querySelector('[data-pe-fase="'+(pe.fasi.length-1)+'"]'); if(i){ i.focus(); i.select(); i.scrollIntoView({block:'center'}); } }, 60);
      break;
    case 'pe-togli-fase': if(pe.fasi.length > 1){
      pe.fasi.splice(fi, 1); pe.apri = null;
      const bz = {}; Object.keys(pe.bozze).forEach(k=>{ const n = +k; if(n < fi) bz[n] = pe.bozze[k]; else if(n > fi) bz[n-1] = pe.bozze[k]; });
      pe.bozze = bz; } break;
    case 'pe-sposta-fase':{ const d = +t.dataset.d, j = fi + d; if(j < 0 || j >= pe.fasi.length) break;
      const x = pe.fasi[fi]; pe.fasi[fi] = pe.fasi[j]; pe.fasi[j] = x; pe.apri = null;
      const bx = pe.bozze[fi]; pe.bozze[fi] = pe.bozze[j]; pe.bozze[j] = bx; break; }
    case 'pe-add-task':{
      const i = document.querySelector('[data-pe-add="'+fi+'"]'), tk = taskPreset(i ? i.value : '');
      if(tk && pe.fasi[fi]){ pe.fasi[fi].task.push(tk); pe.bozze[fi] = ''; }
      setTimeout(()=>{ const j = document.querySelector('[data-pe-add="'+fi+'"]'); if(j) j.focus(); }, 40);
      break; }
    case 'pe-apri-task': pe.apri = fi+':'+ti; break;
    case 'pe-chiudi-task': pe.apri = null; break;
    case 'pe-togli-task': if(pe.fasi[fi]) pe.fasi[fi].task.splice(ti, 1); pe.apri = null; break;
    case 'pe-sposta-task':{ const f = pe.fasi[fi], j = ti + (+t.dataset.d); if(!f || j < 0 || j >= f.task.length) break;
      const x = f.task[ti]; f.task[ti] = f.task[j]; f.task[j] = x; pe.apri = null; break; }
    case 'pe-esporta': if(pe.id) esportaPreset([pe.id]); return;
    case 'pe-elimina':{
      if(!pe.id) break;
      if(!t.dataset.ok){ pe.togliere = true; break; }
      const M = presetDi(pe.id); togliModello(pe.id);
      if(M) azione('Eliminato il preset <b>'+esc(M.nome)+'</b>');
      const r = pe.ritorno; chiudiEditorPreset();
      if(r==='nl' && nl){ if(nl.modello===M.id) nlCambia(nl.tipo, null, null); renderNuovoLavoro(); } else render();
      return; }
    case 'pe-salva':{
      /* le task scritte e non ancora aggiunte le aggiungo io */
      Object.keys(pe.bozze).forEach(k=>{ const tk = taskPreset(pe.bozze[k]); if(tk && pe.fasi[k]) pe.fasi[k].task.push(tk); });
      pe.bozze = {};
      if(!pe.nome){ pe.errore = 'Dai un nome al preset.'; renderEditorPreset(); const i = el('pe_nome'); if(i) i.focus(); return; }
      const doppio = (state.modelli||[]).find(m=>m.id!==pe.id && m.nome.toLowerCase()===pe.nome.toLowerCase());
      if(doppio){ pe.errore = 'C’è già un preset che si chiama «'+pe.nome+'»: scegli un altro nome.'; break; }
      const M = pe.id ? presetDi(pe.id) : null;
      const m = {id: pe.id || 'mod'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        nome:pe.nome, tipo:pe.tipo, lavoro:pe.lavoro, descrizione:pe.descrizione.trim(),
        fasi:pe.fasi.map(f=>{ const x = {nome:f.nome, icon:f.icon||'list', desc:f.desc||''}; if(f.campi) x.campi = f.campi; return x; }),
        task:[].concat(...pe.fasi.map((f,i)=>f.task.map(t=>({fase:i, titolo:t.titolo, items:t.items})))),
        tags:pe.tags||[], creato_da:(M && M.creato_da) || state.utente, t:Date.now()};
      registraModello(m);
      azione((M? 'Aggiornato' : 'Creato')+' il preset <b>'+esc(m.nome)+'</b>');
      const r = pe.ritorno; chiudiEditorPreset();
      if(r==='nl' && nl){ nlCambia(m.tipo, null, m.id); renderNuovoLavoro(); }
      else render();
      return; }
  }
  renderEditorPreset();
}

/* ---------- dove si vedono: pagina iniziale e profilo ---------- */
function sezionePreset(){
  const ms = state.modelli||[], posso = puo('crea_lavori') && !state.ospite;
  if(!ms.length && !posso) return '';
  let h = '<div class="spazi-head preset-head"><h2>I tuoi preset</h2>'+
    '<p>Il metodo con cui lavorate: fasi, task e checklist pronti quando crei un progetto o uno spazio. Si esportano in un file e si importano su un altro account.</p></div>'+
    '<div class="preset-griglia">';
  ms.forEach(m=>{
    const X = TIPO(m.tipo);
    h += '<div class="preset-c" style="--acc:'+coloreOk(X.c, '#FFAD01')+'">'+
      '<button class="preset-b" data-action="pe-apri" data-id="'+esc(m.id)+'"><span class="picona">'+svg(X.ic)+'</span>'+
        '<span class="tx"><b>'+esc(m.nome)+'</b><span>'+esc(riassuntoPreset(m))+'</span>'+
        (m.descrizione ? '<i>'+esc(m.descrizione.slice(0, 110))+(m.descrizione.length>110?'…':'')+'</i>' : '')+'</span></button>'+
      '<div class="preset-az">'+
        (posso ? '<button class="btn sm" data-action="pe-usa" data-id="'+esc(m.id)+'">'+svg('plus')+'Nuovo progetto</button>' : '')+
        '<button class="btn sm ghost" data-action="pe-esporta-uno" data-id="'+esc(m.id)+'" title="Salva un file da mandare o da tenere">'+svg('deliver')+'Esporta</button>'+
      '</div></div>';
  });
  if(posso) h += '<button class="preset-c nuovo" data-action="pe-nuovo"><span class="ic">'+svg('plus')+'</span>'+
      '<b>Nuovo preset</b><span>Da zero o partendo da una professione</span></button>'+
    '<button class="preset-c nuovo" data-action="pe-importa"><span class="ic">'+svg('clip')+'</span>'+
      '<b>Importa un preset</b><span>Da un file esportato con FOSS</span></button>';
  h += '</div>';
  if(ms.length > 1) h += '<div class="preset-tutti"><button class="btn sm ghost" data-action="pe-esporta-tutti">'+svg('deliver')+'Esporta tutti i preset in un file</button></div>';
  return h;
}
function cartaModelli(){
  const ms = state.modelli||[], posso = puo('crea_lavori');
  return '<div class="card"><h3 style="display:flex;align-items:center;gap:7px">'+
    svg('salva',2.2).replace('<svg','<svg style="width:15px;height:15px;color:var(--amber-ink)"')+'I tuoi preset</h3>'+
    '<div class="hint">Li scegli quando crei un progetto o uno spazio. Li crei da zero, da un lavoro con «Salva come preset» o importando un file.</div>'+
    (ms.length ? '<div class="adm-lista">'+ms.map(m=>{ const X = TIPO(m.tipo);
      return '<button class="adm-r" data-action="pe-apri" data-id="'+esc(m.id)+'"><span class="picona">'+svg(X.ic)+'</span><div class="tx"><b>'+esc(m.nome)+'</b>'+
        '<span>'+esc(riassuntoPreset(m))+'</span></div>'+svg('right',2.2)+'</button>'; }).join('')+'</div>' : '')+
    '<div class="cal-az" style="margin-top:12px">'+
      (posso ? '<button class="btn sm primary" data-action="pe-nuovo">'+svg('plus')+'Nuovo preset</button>'+
               '<button class="btn sm" data-action="pe-importa">'+svg('clip')+'Importa</button>' : '')+
      (ms.length ? '<button class="btn sm ghost" data-action="pe-esporta-tutti">'+svg('deliver')+'Esporta tutti</button>' : '')+
    '</div></div>';
}

  ['A cosa servono', 'Uno spazio raccoglie i progetti di un ambito: un cliente fisso, una città, un tipo di attività. Ha una professione, che decide fasi, task e campi di partenza dei progetti che ci crei, e ha i suoi tag e filtri. Progetti, task e calendario di uno spazio restano separati dagli altri.'],
  ['Creare uno spazio', 'Nella pagina degli spazi premi <b>Nuovo spazio di lavoro</b> (sul telefono: <b>+</b> in alto → Nuovo spazio di lavoro). Quattro passi: la professione (oppure un tuo preset); nome, icona e colore; i tag; i filtri veloci.'],
  ['Le professioni pronte', 'Sono tredici: Video, Fotografia, Grafica, Social, Web e app, Eventi, Legale, Fiscale, Moda, Architettura, Consulenza, Testi e Generico. Ognuna ha le sue fasi e diversi tipi di lavoro (un matrimonio, uno spot, una causa…), ciascuno con le sue task.'],
  ['Passare da uno spazio all’altro', 'Tocca il nome dello spazio in alto: si apre l’elenco, con in fondo <b>Vedi tutti gli spazi</b> e <b>Nuovo spazio di lavoro</b>.'],
  ['Nome, colore, sfondo e preset', 'Dentro lo spazio, il tasto <b>Modifica spazio</b> (o tasto destro sulla tessera → <b>Collaboratori dello spazio…</b>) apre «Modifica lo spazio»: nome, descrizione, icona, colore, sfondo della pagina, chi ci lavora e il <b>preset dei nuovi progetti</b>, che verrà già scelto ogni volta che crei un progetto lì dentro.'],
  ['Condividere uno spazio', 'Dal menu della tessera: <b>Condividi con un link</b>. C’è un link per chi ci lavora (può modificare) e uno per chi guarda da fuori (solo lettura). Chi lo riceve deve avere un accesso a FOSS.'],
  ['Eliminare uno spazio', 'Dal menu della tessera: <b>Elimina lo spazio</b>. Attenzione: spariscono anche i progetti che contiene. FOSS chiede conferma e ti dice quanti sono; se hai dubbi, prima scarica un backup dal profilo.']
]},
{id:'progetti', liv:'base', ic:'file', t:'Progetti', s:'Creare un lavoro e portarlo alla consegna', v:[
  ['Creare un progetto', 'Dentro uno spazio premi <b>Nuovo progetto</b> (sul telefono il <b>+</b> in alto). Si parte dalla professione dello spazio; se fai più lavori puoi cambiarla con una di quelle scelte nel profilo. Cinque pagine: <b>che lavoro è</b>; <b>per chi è</b> (cliente, date, priorità e i dettagli del tuo mestiere); <b>fasi e task</b> (spegni quello che non serve, aggiungi quello che manca); <b>soldi</b> (preventivo e acconto); <b>chi lo vede</b>. Tutto si può cambiare anche dopo.'],
  ['Partire da un tuo preset', 'Nella prima pagina, sotto i tipi di lavoro, c’è <b>Oppure parti da un tuo preset</b>: fasi e task arrivano come le hai salvate. Se lo spazio ha un preset predefinito, è già scelto. Vedi il capitolo <b>Preset</b>.'],
  ['Le fasi', 'Ogni progetto avanza per fasi (per un video: preproduzione, riprese, montaggio, consegna…). Vedi le task della fase in cui sei; quando sono tutte spuntate compare il tasto <b>COMPLETATO</b>, che passa alla fase dopo. All’ultima fase il progetto si chiude; <b>Riapri il progetto</b> lo rimette in corsa.'],
  ['Andare avanti o tornare indietro', 'Nella barra delle fasi tocca una fase più avanti: FOSS chiede conferma e ti dice cosa resta aperto. Il tasto con la freccia all’indietro, a sinistra delle fasi, riapre una fase già chiusa per rivederla o correggerla; da lì <b>Torna avanti</b> ti riporta dov’eri.'],
  ['Cambiare nome, cliente e campi', 'Non ci sono matite: fai tasto destro sul campo (sul tablet e sul telefono tienilo premuto) e in cima al menu trovi <b>Modifica</b>. Sul titolo del progetto trovi Rinomina, Modifica note, Cambia indirizzo e Aggiungi una data.'],
  ['La scheda del lavoro', 'Sul computer è la colonna a lato; sul telefono tocca il nome del lavoro in alto. Dentro ci sono team, indirizzo, date, soldi, note e i dettagli del mestiere.'],
  ['Duplicare, spostare, eliminare', 'Tasto destro sulla tessera del progetto (sul telefono tienila premuta): <b>Duplica progetto</b>, <b>Salva come preset</b>, <b>Pagina del cliente</b>, <b>Sposta in un altro spazio</b> ed Elimina.'],
  ['Bloccare un progetto', 'Il lucchetto in alto lo blocca con una password di almeno 4 caratteri. Restano liberi lettura, commenti e chat; si bloccano modifiche, spunte, avanzamento delle fasi e spostamento delle date. Si sblocca con la stessa password.']
]},
{id:'task', liv:'base', ic:'check', t:'Task, subtask e checklist', s:'Le cose da fare, spuntate una a una', v:[
  ['Task e subtask', 'Le <b>task</b> sono i blocchi di lavoro di una fase (per esempio «Sopralluogo»). Dentro ci sono le <b>subtask</b>, le singole cose da fare: le spunti toccando il quadratino. La barra accanto alla task mostra a che punto sei.'],
  ['Aggiungere una task', 'Nella fase in cui sei premi <b>Nuova task</b>, in alto a destra dell’elenco.'],
  ['Aggiungere una subtask', 'Tasto destro sulla task (sul telefono tienila premuta) → <b>Aggiungi subtask</b>. Su una subtask che c’è già, <b>Aggiungi subtask sotto</b> la mette subito dopo.'],
  ['Le checklist', 'Una subtask può avere una lista di voci: l’attrezzatura, i documenti da chiedere… Tasto destro sulla subtask → <b>Aggiungi una checklist</b>, poi scrivi le voci. Quando le spunti tutte, la subtask si chiude da sola.'],
  ['Assegnare a qualcuno', 'Tocca l’omino a destra di una subtask e scegli la persona: le arriva una notifica e la trova nella sua sezione <b>Per te</b>. Il responsabile di tutta la task si cambia toccando «Assegnato a».'],
  ['Taggare le persone', 'Sotto la task, <b>Tagga</b> aggiunge chi deve seguirla senza esserne il responsabile: riceve un avviso. Anche nella nota della task puoi taggare chi ci lavora.'],
  ['La descrizione della task', 'Tocca <b>Aggiungi una descrizione</b> dentro la task: cosa va fatto, riferimenti, link (diventano cliccabili). Sotto si vede chi l’ha scritta e quando. Per discutere, invece, usa il fumetto dei commenti.'],
  ['Cambiare o eliminare', 'Tasto destro sulla subtask (o tienila premuta): <b>Rinomina la subtask</b>, i suoi commenti, la checklist, <b>Elimina subtask</b>. Lo stesso sulla task.'],
  ['Per te', 'Sul telefono la sezione <b>Per te</b> raccoglie tutto quello che è assegnato a te, lavoro per lavoro: puoi spuntare da lì senza aprire i progetti.']
]},
{id:'viste', liv:'medio', ic:'eye', t:'Viste, filtri e ricerca', s:'Guardare i lavori nel modo che ti serve', v:[
  ['Le viste', 'In alto scegli come vedere i progetti dello spazio: <b>Tessere</b>, <b>Lista</b>, <b>Calendario</b>, <b>Mappa</b> e <b>Note</b>. Sul telefono ci sono Tessere, Lista e Note: calendario e mappa stanno sugli schermi più grandi. Puoi trascinare i tasti delle viste per metterli nell’ordine che preferisci.'],
  ['Tessere e lista', 'Una scheda per progetto con fase, avanzamento e consegna. In alto scegli come raggrupparli: per <b>Compiti</b> (da fare, in corso, completati), per <b>Priorità</b> o per <b>Scadenza</b>. Tieni premuta una tessera e trascinala per cambiare l’ordine.'],
  ['Calendario', 'Il mese con riprese, consegne e le altre date dei lavori; le frecce cambiano mese. Tasto destro su una data per spostarla a domani o di una settimana, o per rinominarla.'],
  ['Mappa', 'I lavori che hanno un indirizzo, sulla mappa. L’indirizzo si mette nella scheda del lavoro.'],
  ['La bacheca delle note', 'Post-it dello spazio, al massimo 50 caratteri l’uno: <b>Nuova nota</b>, oppure doppio tocco sulla bacheca. Si trascinano col dito o col mouse; dal menu ne cambi il colore o la elimini.'],
  ['Filtri e ordine', 'Nella barra in basso: <b>Tutti</b> e i tuoi filtri salvati. <b>Nuovo filtro</b> li crea per tipo di progetto, tag e priorità. Accanto, <b>Ordina</b> per priorità, scadenza, cliente, fase o nel tuo ordine.'],
  ['Cercare', 'Sul computer usa il campo <b>Cerca</b> in alto: filtra i progetti dello spazio mentre scrivi. Sul telefono la sezione <b>Cerca</b> trova progetti, task, subtask e voci delle checklist in tutti gli spazi. Se non vedi più niente, controlla di non aver lasciato una parola nella ricerca.']
]},
{id:'commenti', liv:'medio', ic:'chat', t:'Commenti, chat e attività', s:'I commenti stanno nelle task, la chat è del lavoro', v:[
  ['Commenti dentro task e subtask', 'Ogni task e ogni subtask ha il suo fumetto '+svg('chat',2.2).replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')+'. Toccalo e si apre, al centro dello schermo, la sua discussione: tutti i commenti su quella cosa, dal primo all’ultimo, anche se arrivano a giorni di distanza. Il numero sul fumetto dice quanti sono.'],
  ['Il pallino rosso', 'Quando qualcuno scrive, il fumetto di quella task (o subtask) diventa rosso col pallino finché non apri la discussione. Il pallino compare anche sulla fase in basso, così sai dove guardare; dentro la discussione una riga «Nuovi» segna da dove riprendere.'],
  ['Chi ha scritto', 'Ogni commento ha la foto, il nome, il ruolo e l’ora di chi l’ha scritto: non si può scrivere a nome di un altro. Un tuo commento lo togli col tasto destro (o tenendolo premuto) → <b>Elimina il commento</b>.'],
  ['Link e file', 'Nella discussione, la graffetta allega un file fino a 25 MB (foto, PDF, video brevi, documenti): lo vede solo chi lavora al progetto. Per i file più grossi incolla un link di WeTransfer, Drive o Frame.io. La scheda <b>Link e file</b> li raccoglie tutti in un posto.'],
  ['Taggare qualcuno', 'Nei commenti e nella chat scrivi <b>@</b> (o tocca il tasto @ nella finestra dei commenti): compare chi lavora al progetto, scegli il nome. Gli arriva subito la notifica, col box a schermo intero se l’ha acceso (con <b>APRI</b> va dritto alla discussione), e l’avviso sul telefono.'],
  ['La chat del progetto', 'Il tasto <b>Chat</b> '+svg('pannello',2).replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')+', in alto a destra dentro il progetto (sul telefono il fumetto nella barra in basso), apre il pannello laterale: la <b>Chat del progetto</b> è la conversazione di tutto il lavoro, in tempo reale; <b>Attività</b> è il diario automatico di cosa è cambiato e chi l’ha fatto.'],
  ['Inviare', '<b>Invio</b> manda, <b>Maiusc+Invio</b> va a capo; sul telefono si manda col tasto giallo. Chi lavora al progetto riceve una notifica; più messaggi ravvicinati si sommano in una sola.'],
  ['Le risposte del cliente e i vecchi commenti', 'Le risposte che il cliente dà dalla sua pagina arrivano nella chat del progetto, con l’etichetta <b>Cliente</b> e l’esito. Lì trovi anche i commenti scritti prima di questa versione, con la fase a cui si riferivano.']
]},
{id:'notifiche', liv:'medio', ic:'bell', t:'Notifiche e avvisi sul telefono', s:'Sapere cosa succede senza controllare di continuo', v:[
  ['La campanella', 'In alto a destra. Il numero dice quante notifiche non hai letto; toccane una e ti porta dove è successo: la task, la discussione di una task o la chat del progetto. <b>Segna tutte</b> le segna come lette.'],
  ['Cosa ti arriva', 'Quando ti assegnano una cosa, ti aggiungono a una task o ti menzionano; quando qualcuno commenta una task o scrive nella chat dei tuoi lavori; quando un lavoro cambia fase o viene consegnato; quando ti aprono un lavoro nuovo; quando il cliente risponde.'],
  ['Il box a schermo intero', 'Menzioni e assegnazioni possono oscurare lo schermo finché non premi <b>VISUALIZZATO</b>. Lo accendi o lo spegni in Profilo → Notifiche; la <b>×</b> lo silenzia per 10, 30 o 60 minuti.'],
  ['Solo i miei progetti', 'In Profilo → Notifiche: niente notifiche dai progetti in cui non sei assegnato.'],
  ['Avvisi sul telefono', 'Profilo → Notifiche → <b>Avvisi sul telefono</b> → Attiva, poi accetta la richiesta del telefono. Con <b>Prova</b> ti arriva subito un avviso di controllo. Si attiva su ogni dispositivo che usi.'],
  ['Sull’iPhone', 'Prima aggiungi FOSS alla schermata Home (vedi <b>Primi passi</b>) e aprilo da quell’icona: da Safari l’iPhone non manda avvisi. Serve iOS 16.4 o successivo.'],
  ['Non arrivano', 'Se hai negato il permesso, va riacceso dalle impostazioni del telefono o del browser (Notifiche → FOSS), poi nel profilo premi di nuovo Attiva. Controlla anche che il telefono non sia in Full immersion o Non disturbare.']
]},
{id:'preset', liv:'medio', ic:'salva', t:'Preset', s:'Il tuo metodo di lavoro, pronto da riusare', v:[
  ['Cos’è un preset', 'È il tuo modo di lavorare salvato con un nome: le fasi, le task e le subtask (con le checklist) che usi sempre per un certo tipo di lavoro, per esempio «Video YouTube». Quando crei un progetto o uno spazio lo scegli e parti da lì. Prima si chiamavano «modelli».'],
  ['Dove li trovi', 'Nella pagina degli spazi, sezione <b>I tuoi preset</b>; nel <b>Profilo</b>; nel <b>+</b> del telefono (Nuovo preset, Importa un preset); nella prima pagina di Nuovo progetto e nel primo passo di Nuovo spazio.'],
  ['Crearne uno da zero', '<b>Nuovo preset</b>: dai un nome, scegli la professione, poi costruisci le fasi e, per ogni fase, le task. Nelle subtask scrivi una riga per ciascuna; se una riga ha i due punti, quello che segue diventa la sua checklist: «Attrezzatura: camera, microfoni, luci».'],
  ['Crearlo da un lavoro fatto', 'Dal progetto riuscito meglio: tasto destro sulla tessera → <b>Salva come preset</b>. Oppure, nell’ultima pagina di Nuovo progetto, accendi <b>Salva anche come preset</b>.'],
  ['Usarlo', 'In Nuovo progetto tocca il preset sotto <b>Oppure parti da un tuo preset</b>. Per non sceglierlo ogni volta, impostalo come preset dello spazio (Modifica lo spazio → Preset dei nuovi progetti): sarà già selezionato.'],
  ['Esportare e importare', 'Nell’editor del preset, <b>Esporta</b> crea un file che puoi mandare per email, WhatsApp o AirDrop; <b>Esporta tutti</b> li mette in un unico file. Chi lo riceve preme <b>Importa</b> e sceglie il file: vede cosa contiene e conferma. Se ha già un preset con lo stesso nome, quello nuovo diventa «(2)».'],
  ['Modificare o eliminare', 'Tocca il preset per aprire l’editor: sposti fasi e task con le frecce, le togli con la ×, poi salvi. <b>Elimina</b> chiede conferma; i progetti già creati con quel preset non cambiano.']
]},
{id:'soldi', liv:'medio', ic:'euro', t:'Soldi', s:'Preventivi, incassi e spese dei lavori', v:[
  ['Dove si segnano', 'Nella scheda del lavoro: <b>Aggiungi il preventivo</b>, poi <b>Incassi e spese</b> per acconto, saldo e costi. Preventivo e acconto puoi metterli già quando crei il progetto. La scheda ti mostra incassato, da incassare e margine.'],
  ['Il riepilogo', 'Profilo → <b>Soldi dei lavori</b>: quanto ti devono, quanto hai incassato e speso quest’anno, e i lavori con più da incassare.'],
  ['Chi li vede', 'L’amministratore e chi ha il permesso per i soldi. Di base un guest non vede nessuna cifra; si può dargli anche la sola lettura.']
]},
{id:'calendario', liv:'medio', ic:'calendar', t:'Date e calendario sul telefono', s:'Riprese, consegne e scadenze dove le guardi già', v:[
  ['Aggiungere una data', 'Nella scheda del lavoro, <b>Aggiungi una data</b>: riprese, consegne, udienze, incontri. Compaiono nella vista Calendario e, se lo decidi, nella pagina del cliente.'],
  ['Una data in Google Calendar', 'Accanto a ogni data c’è il tasto del calendario: apre Google Calendar con l’evento già compilato.'],
  ['Tutte le date sul telefono', 'Profilo → <b>Calendario sul telefono</b>, poi <b>Aggiungi a Google Calendar</b> o <b>Aggiungi all’iPhone</b>. Si aggiorna da solo: sposti una data qui, cambia anche lì. Google lo rilegge con i suoi tempi, a volte dopo qualche ora.'],
  ['Il link è personale', 'Chi ha quel link vede le date dei tuoi lavori. Se l’hai dato per sbaglio, <b>Cambia il link</b> disattiva quello vecchio e ne crea uno nuovo.']
]},
{id:'cliente', liv:'esperto', ic:'review', t:'Il cliente e la condivisione', s:'Far vedere il lavoro a chi è fuori da FOSS', v:[
  ['Condividere con un collega', 'Il tasto <b>Condividi</b> su un progetto o su una singola task dà due link: uno per chi ci lavora (può modificare) e uno di sola lettura, da incollare anche su WhatsApp. Chi li apre deve avere un accesso a FOSS.'],
  ['La pagina del cliente', 'Una pagina semplice, senza registrazione, dove il cliente vede a che punto è il lavoro e ti risponde. Dal menu del progetto → <b>Pagina del cliente</b> → <b>Crea la pagina</b>. Serve il database del team.'],
  ['Cosa vede e cosa no', 'Vede il lavoro, le fasi e dove siete arrivati, il tuo <b>messaggio</b>, il <b>link al materiale</b> (WeTransfer, Drive, Vimeo, YouTube…) e, se accendi <b>Mostra le date</b>, i prossimi appuntamenti e la consegna. Non vede task, chat, soldi e persone del team.'],
  ['Le risposte', 'Il cliente sceglie <b>Approvo</b> o <b>Vorrei modifiche</b> e può scrivere due righe. La risposta arriva nella chat del progetto e a te arriva una notifica.'],
  ['Mandarla e vederla come lui', '<b>Copia link</b>, <b>Invia…</b> o <b>WhatsApp</b> per mandarla. <b>Guarda come la vede</b> ti mostra la pagina esattamente come la vede lui.'],
  ['Cambiare link o spegnerla', '<b>Cambia link</b> fa smettere di funzionare quello vecchio (messaggio e impostazioni restano). Spegnendo <b>Pagina attiva</b>, chi apre il link vede «Pagina non attiva» finché non la riaccendi.']
]},
{id:'persone', liv:'esperto', ic:'users', t:'Persone e permessi', s:'Chi entra, cosa vede, cosa può fare', v:[
  ['Amministratore e guest', 'Chi crea l’archivio è l’<b>amministratore</b>: vede tutti i lavori, crea i profili e decide chi vede cosa. Gli altri sono <b>guest</b>: vedono solo i lavori che l’amministratore apre loro.'],
  ['Aggiungere una persona', 'Profilo → Amministrazione → <b>Nuovo profilo</b>: nome, cognome, email e ruolo. Poi dille di aprire FOSS e registrarsi con quella stessa email: entra già come guest del tuo archivio.'],
  ['Aprirle un lavoro', 'Nel progetto, <b>Aggiungi qualcuno al team</b> (dalla scheda del lavoro o col tasto destro sul titolo). Da quel momento lo vede e riceve le sue notifiche. Puoi farlo anche mentre crei il progetto, nella pagina «Chi lo vede».'],
  ['Cosa può fare', 'Profilo → Amministrazione → tocca la persona. Puoi spegnerle: creare lavori, creare e modificare task, spuntare, eliminare, decidere chi vede un lavoro, gestire gli spazi. A parte: vedere i soldi e la <b>sola lettura</b>, che lascia solo guardare.'],
  ['Togliere l’accesso', 'Dalla scheda della persona in Amministrazione: non entra più nel tuo archivio.']
]},
{id:'dati', liv:'esperto', ic:'deliver', t:'I tuoi dati', s:'Dove stanno, come si torna indietro', v:[
  ['Dove stanno', 'Nel database del team, con una copia su questo dispositivo. Gli aggiornamenti dell’app non toccano mai i contenuti: progetti, task, note e registro restano dove sono.'],
  ['Annullare', '<b>Ctrl+Z</b> (<b>Cmd+Z</b> sul Mac) o il tasto Annulla in alto annulla l’ultima azione; si può premere più volte. Commenti e messaggi non si annullano: un tuo commento lo togli col tasto destro.'],
  ['Il registro delle azioni', 'Profilo → <b>Registro delle azioni</b>: ogni modifica, con chi l’ha fatta e quando. Utile quando qualcosa è cambiato e non si sa come.'],
  ['Backup', 'Profilo → I tuoi dati → <b>Scarica un backup</b>: un file con spazi, progetti, task, note e registro. <b>Ripristina da backup</b> rimette i dati del file al posto di quelli di adesso, e Ctrl+Z annulla il ripristino.']
]},
{id:'trucchi', liv:'esperto', ic:'spark', t:'Scorciatoie e trucchi', s:'Fare prima le cose di tutti i giorni', v:[
  ['Il tasto destro', 'Quasi tutto ha un menu: tessere, spazi, task, subtask, campi, date, note, fasi, commenti. Con il mouse è il tasto destro; con il dito o la Apple Pencil tieni premuto mezzo secondo e lascia.'],
  ['Niente matite', 'Per cambiare qualcosa non servono matite: tasto destro (o tieni premuto) e scegli Modifica, Rinomina o Elimina. Sui campi della scheda e della fase, tenendo premuto, una banda gialla si riempie e quando arriva in fondo si apre direttamente la modifica.'],
  ['Trascinare', 'Tieni premuta una tessera o uno spazio e muovi il dito: lo sposti e gli altri si fanno da parte.'],
  ['Tastiera', '<b>Ctrl+Z</b> annulla, <b>Esc</b> chiude menu e finestre, <b>Invio</b> manda un messaggio, <b>Maiusc+Invio</b> va a capo.'],
  ['Temi', 'Profilo → <b>Tema dell’interfaccia</b>: diversi temi di colore e la modalità chiara, che cambi al volo anche dal sole e dalla luna in alto.'],
  ['Nascondere i riquadri di benvenuto', 'Hanno una <b>×</b>: li nasconde fino al prossimo accesso.']
]},
{id:'problemi', liv:'aiuto', ic:'help', t:'Problemi comuni', s:'Le cose che capitano più spesso', v:[
  ['Non vedo un lavoro che dovrei vedere', 'Chiedi all’amministratore di aggiungerti al team di quel lavoro. Se l’amministratore sei tu, controlla di essere nello spazio giusto, che la ricerca sia vuota e che in basso sia scelto <b>Tutti</b> e non un filtro.'],
  ['Non trovo una professione', 'Quando crei un progetto o uno spazio vedi solo i lavori scelti in <b>Profilo → I lavori che fai</b>: aggiungila lì.'],
  ['Non riesco a modificare', 'Il progetto può essere bloccato (lucchetto rosso in alto): serve la password. Oppure l’amministratore ti ha tolto quel permesso o ti ha messo in sola lettura.'],
  ['Non vedo gli ultimi aggiornamenti', 'Di solito arrivano da soli in pochi secondi. Se no, chiudi e riapri FOSS: rilegge tutto dal database.'],
  ['Gli avvisi non arrivano sul telefono', 'Vedi <b>Notifiche e avvisi sul telefono</b>: sull’iPhone serve l’icona sulla schermata Home, il permesso non deve essere negato e il tasto <b>Prova</b> nel profilo ti dice se funziona.'],
  ['Ho cancellato qualcosa per sbaglio', 'Subito: <b>Ctrl+Z</b> o Annulla. Più tardi: il registro delle azioni ti dice cosa è cambiato, e un backup ti riporta indietro.'],
  ['Il problema non è in questa guida', 'Usa il tasto <b>Segnala un problema</b> qui sotto: arriva a chi cura FOSS, con la pagina da cui scrivi e il tipo di dispositivo.']
]}
];

/* stato della pagina: fuori da state, non finisce nell'archivio */
const guida = {q:'', aperti:new Set(['primi-passi']), da:null, vai:null};
let segnRicevute = null, segnCarico = false;     // null = non so ancora, false = non sono l'amministratore di FOSS
let segnBozza = {tipo:'problema', testo:'', stato:'', errore:''};
const TIPI_SEGN = {
  problema:{l:'Qualcosa non funziona', corto:'Problema', ic:'bandiera', ph:'Cosa stavi facendo, cosa ti aspettavi e cosa è successo invece.'},
  domanda:{l:'Non trovo come si fa', corto:'Domanda', ic:'help', ph:'Cosa vorresti fare? Lo aggiungiamo alla guida.'},
  idea:{l:'Ho un’idea', corto:'Idea', ic:'spark', ph:'Cosa ti servirebbe, e in quale momento del lavoro.'}
};

function apriGuida(cap){
  if(state.schermo === 'gate' || state.schermo === 'cliente') return;
  if(state.schermo !== 'guida') guida.da = {schermo:state.schermo, pid:state.progettoId};
  chiudiCtx();
  const m = el('modal'); if(m && !m.classList.contains('sg-modale')) chiudiModale();
  state.schermo = 'guida'; state.drawer = false; state.showFeed = false;
  if(cap){ guida.q = ''; guida.vai = cap; if(cap !== 'segnalazioni') guida.aperti.add(cap); }
  render();
  /* se sono l'amministratore di FOSS rileggo l'elenco (quando non lo so ancora ci pensa renderGuida) */
  if(Array.isArray(segnRicevute)) caricaSegnalazioni();
}
function esciGuida(){
  const d = guida.da || {};
  if(d.schermo === 'progetto' && d.pid && state.progetti.some(p=>p.id===d.pid)){ state.progettoId = d.pid; state.schermo = 'progetto'; }
  else if(['home','spazi','profilo','mie','cerca'].indexOf(d.schermo) >= 0 && (d.schermo !== 'home' || SPZ())) state.schermo = d.schermo;
  else state.schermo = SPZ() ? 'home' : 'spazi';
  render();
}
function renderGuida(){
  const da = guida.da && guida.da.schermo;
  const torna = {profilo:'Profilo', progetto:'Il lavoro', home:'I progetti', spazi:'Gli spazi', mie:'Per te', cerca:'Cerca'}[da] || 'Indietro';
  let h = '<div class="pane"><div class="scroller"><div class="guida">'+
    tastoIndietro('guida-esci', torna)+
    '<div class="g-testa"><span class="g-logo">'+svg('libro',2)+'</span><div>'+
      '<h1>Guida di FOSS</h1><p>Come si fa tutto, dai primi passi alle funzioni per chi organizza un team. Cerca una parola o apri un capitolo.</p></div></div>'+
    '<label class="g-cerca">'+svg('cerca')+
      '<input id="gCerca" type="search" placeholder="Cerca: preset, cliente, avvisi…" aria-label="Cerca nella guida" autocomplete="off" enterkeyhint="search" value="'+esc(guida.q)+'"></label>'+
    '<div class="g-conta" id="gConta" aria-live="polite"></div>';
  h += '<nav class="g-indice" id="gIndice" aria-label="Capitoli">'+Object.keys(LIVELLI_GUIDA).map(l=>{
    const caps = GUIDA.filter(c=>c.liv===l); if(!caps.length) return '';
    return '<div class="g-liv"><span class="g-liv-t">'+LIVELLI_GUIDA[l]+'</span><div class="g-liv-l">'+
      caps.map(c=>'<button class="g-pill" data-action="guida-vai" data-id="'+c.id+'">'+svg(c.ic,2)+
        '<span>'+(GUIDA.indexOf(c)+1)+'. '+esc(c.t)+'</span></button>').join('')+'</div></div>';
  }).join('')+'</nav>';
  h += '<div class="g-capitoli" id="gCapitoli">'+GUIDA.map((c,i)=>
    '<details class="g-cap" id="g_'+c.id+'" data-cap="'+c.id+'"'+(guida.aperti.has(c.id)?' open':'')+'>'+
      '<summary><span class="g-n">'+(i+1)+'</span>'+
        '<span class="g-tit"><b>'+esc(c.t)+'</b><span>'+esc(c.s)+'</span></span>'+
        '<span class="chip g-chip">'+LIVELLI_GUIDA[c.liv]+'</span>'+
        '<span class="g-chev">'+svg('chev',2.4)+'</span></summary>'+
      '<div class="g-corpo">'+c.v.map(v=>'<div class="g-voce"><h4>'+v[0]+'</h4><p>'+v[1]+'</p></div>').join('')+'</div>'+
    '</details>').join('')+'</div>';
  h += '<div class="g-vuoto" id="gVuoto" hidden></div>';
  h += '<div class="card g-segnala"><span class="g-ic-big">'+svg('bandiera',2)+'</span>'+
    '<div class="tx"><b>Non hai trovato quello che cercavi?</b>'+
      '<span>Scrivilo qui: arriva a chi cura FOSS, che può sistemare il problema o aggiungere il capitolo che manca.</span></div>'+
    '<button class="btn primary" data-action="segnala" id="gSegnala">'+svg('bandiera')+'Segnala un problema non presente in questa guida</button></div>';
  h += '<div id="gSegn">'+htmlSegnalazioni()+'</div>';
  h += '</div></div></div>';
  el('stage').innerHTML = h;
  filtraGuida();
  if(cloudAttivo() && segnRicevute === null && !segnCarico) caricaSegnalazioni();
  if(guida.vai){ const id = guida.vai; guida.vai = null; setTimeout(()=>vaiCapitolo(id), 60); }
}
/* cerco senza badare ad accenti e maiuscole; tutte le parole devono esserci */
function normGuida(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u00ad/g,'').toLowerCase(); }
function filtraGuida(){
  const box = el('gCapitoli'); if(!box) return;
  const parole = normGuida(guida.q).split(/\s+/).filter(Boolean);
  let voci = 0, caps = 0;
  box.querySelectorAll('.g-cap').forEach(c=>{
    const titolo = normGuida(c.querySelector('summary .g-tit').textContent);
    let dentro = 0;
    c.querySelectorAll('.g-voce').forEach(v=>{
      const tx = titolo+' '+normGuida(v.textContent);
      const ok = parole.every(p=>tx.indexOf(p) >= 0);
      v.hidden = !ok; if(ok) dentro++;
    });
    if(parole.length){ c.hidden = !dentro; if(dentro){ c.open = true; caps++; voci += dentro; } }
    else { c.hidden = false; c.open = guida.aperti.has(c.dataset.cap); }
  });
  const ind = el('gIndice'); if(ind) ind.hidden = parole.length > 0;
  const conta = el('gConta');
  if(conta) conta.textContent = !parole.length ? '' : voci ? voci+(voci===1?' risposta':' risposte')+' in '+caps+(caps===1?' capitolo':' capitoli') : '';
  const vuoto = el('gVuoto');
  if(vuoto){
    vuoto.hidden = !(parole.length && !voci);
    if(!vuoto.hidden) vuoto.innerHTML = '<b>Nessuna risposta per «'+esc(guida.q.trim())+'».</b>'+
      '<span>Prova con un’altra parola, oppure segnalalo qui sotto: così il capitolo che manca arriva.</span>';
  }
}
function vaiCapitolo(id){
  const n = id === 'segnalazioni' ? el('segnalazioni') : el('g_'+id);
  if(!n){ if(id === 'segnalazioni') guida.vai = 'segnalazioni'; return; }
  if(n.tagName === 'DETAILS'){ n.open = true; guida.aperti.add(id); }
  n.scrollIntoView({block:'start', behavior:'smooth'});
  n.classList.remove('g-lampo'); void n.offsetWidth; n.classList.add('g-lampo');
}
/* dall'indice: se sto cercando, prima svuoto la ricerca, se no il capitolo e' nascosto */
function vaiDaIndice(id){
  if(guida.q){ guida.q = ''; const i = el('gCerca'); if(i) i.value = ''; filtraGuida(); }
  vaiCapitolo(id);
}
document.addEventListener('toggle', function(e){
  const d = e.target;
  if(!d || !d.classList || !d.classList.contains('g-cap') || guida.q.trim()) return;
  if(d.open) guida.aperti.add(d.dataset.cap); else guida.aperti.delete(d.dataset.cap);
}, true);

/* ---------- SEGNALA UN PROBLEMA ---------- */
function modaleSegnala(){
  if(segnBozza.stato === 'ok') segnBozza = {tipo:'problema', testo:'', stato:'', errore:''};
  segnBozza.errore = '';
  const b = segnBozza, T = TIPI_SEGN[b.tipo] || TIPI_SEGN.problema, locale = !cloudAttivo();
  modale('<h3 style="display:flex;align-items:center;gap:8px">'+svg('bandiera',2.2).replace('<svg','<svg style="width:16px;height:16px;color:var(--alert)"')+
      'Segnala un problema</h3>'+
    '<div class="sub-t">Quello che non trovi nella guida, o che non funziona come dovrebbe</div>'+
    '<div class="modal-b">'+
      '<div class="field"><label>Di cosa si tratta</label><div class="sg-tipi" role="radiogroup">'+Object.keys(TIPI_SEGN).map(k=>
        '<button class="sg-tipo'+(b.tipo===k?' on':'')+'" data-action="seg-tipo" data-k="'+k+'" role="radio" aria-checked="'+(b.tipo===k)+'">'+
          svg(TIPI_SEGN[k].ic,2.2)+'<span>'+TIPI_SEGN[k].l+'</span></button>').join('')+'</div></div>'+
      '<div class="field"><label for="sg_testo">Raccontalo</label>'+
        '<textarea id="sg_testo" rows="5" maxlength="4000" placeholder="'+esc(T.ph)+'">'+esc(b.testo)+'</textarea></div>'+
      '<div class="nota-box">Insieme al testo arrivano il tuo nome, la pagina da cui scrivi, il tipo di dispositivo e la versione di FOSS: '+
        'servono a capire il problema. Niente dei tuoi lavori.</div>'+
      (locale ? '<div class="sg-err">Per mandarla serve il database del team: in modalità locale non può partire.</div>' : '')+
      '<div class="sg-err" id="sgErr" hidden></div>'+
    '</div>'+
    '<div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+
      '<button class="btn primary" data-action="seg-invia" id="sgInvia"'+(locale?' disabled':'')+'>'+svg('send')+'Invia</button></div>', 'sg-modale');
  const t = el('sg_testo');
  if(t && !suTelefono()){ t.focus(); try{ t.setSelectionRange(t.value.length, t.value.length); }catch(e){} }
}
function sceltaTipoSegn(k){
  if(!TIPI_SEGN[k]) return;
  segnBozza.tipo = k;
  document.querySelectorAll('.sg-tipo').forEach(b=>{ const on = b.dataset.k === k; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  const t = el('sg_testo'); if(t) t.placeholder = TIPI_SEGN[k].ph;
}
function doveSegnalazione(){
  const qui = state.schermo === 'guida' ? 'guida' : state.schermo;
  const da = state.schermo === 'guida' && guida.da && guida.da.schermo ? ' (aperta da '+guida.da.schermo+')' : '';
  const cerca = state.schermo === 'guida' && guida.q.trim() ? ' · cercava «'+guida.q.trim()+'»' : '';
  return (qui+da+cerca).slice(0, 200);
}
function dispositivoSegnalazione(){
  const ua = navigator.userAgent || '';
  const tocco = (navigator.maxTouchPoints || 0) > 1;
  const sis = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (/Macintosh/.test(ua) && tocco)) ? 'iPad' :
              /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'altro';
  const br = /Edg\//.test(ua) ? 'Edge' : /(CriOS|Chrome)\//.test(ua) ? 'Chrome' : /(FxiOS|Firefox)\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'browser';
  const app = (typeof aTuttoSchermo === 'function' && aTuttoSchermo()) ? 'app dalla Home' : 'nel browser';
  return (sis+' · '+br+' · '+window.innerWidth+'×'+window.innerHeight+' · '+app+' · '+ua).slice(0, 300);
}
async function inviaSegnalazioneUI(tasto){
  const b = segnBozza, t = el('sg_testo');
  if(t) b.testo = t.value;
  const testo = b.testo.trim(), err = el('sgErr');
  const mostra = m => { b.errore = m; if(err){ err.textContent = m; err.hidden = !m; } };
  const rimetti = () => { if(tasto && tasto.isConnected){ clearTimeout(tasto.__t); if(tasto.__orig != null) tasto.innerHTML = tasto.__orig; tasto.__orig = null; tasto.disabled = false; } };
  if(testo.length < 3){ mostra('Scrivi almeno qualche parola su cosa succede.'); if(t) t.focus(); return; }
  if(!cloudAttivo() || typeof inviaSegnalazione !== 'function'){ mostra('Per mandarla serve il database del team.'); return; }
  mostra('');
  if(typeof tastoDice === 'function') tastoDice(tasto, 'Invio…', 20000);
  try{
    await inviaSegnalazione({tipo:b.tipo, testo, dove:doveSegnalazione(), dispositivo:dispositivoSegnalazione(), versione:VERSIONE});
    segnBozza = {tipo:'problema', testo:'', stato:'ok', errore:''};
    if(el('sgInvia') === tasto || !tasto){
      modale('<h3>Segnalazione inviata</h3><div class="modal-b"><div class="sg-ok">'+svg('check',2.6)+
        '<div><b>Grazie, è arrivata.</b><span>La legge chi cura FOSS. Se serve un chiarimento, ti scrive all’email con cui sei entrato.</span></div></div></div>'+
        '<div class="modal-f"><button class="btn primary" data-action="chiudi-modale">Chiudi</button></div>', 'sg-modale');
    }
    if(segnRicevute !== false) caricaSegnalazioni();      // se sono io l'amministratore, la vedo subito in lista
  } catch(e){
    const m = String((e && e.message) || '');
    rimetti();
    mostra(/troppe/.test(m) ? 'Hai mandato molte segnalazioni nell’ultima ora: riprova tra un po’.'
         : /scrivi/.test(m) ? 'Scrivi almeno qualche parola su cosa succede.'
         : 'Non è partita: controlla la connessione e riprova. Il testo resta qui.');
  }
}

/* ---------- SEGNALAZIONI RICEVUTE (solo chi amministra FOSS) ---------- */
function caricaSegnalazioni(){
  if(!cloudAttivo() || typeof leggiSegnalazioni !== 'function' || segnCarico) return;
  segnCarico = true;
  leggiSegnalazioni().then(l=>{
    segnCarico = false;
    segnRicevute = Array.isArray(l) ? l : false;
    aggiornaSegnalazioni();
  }).catch(()=>{ segnCarico = false; });       // resta «non so»: riprovo la prossima volta
}
function aggiornaSegnalazioni(){
  const n = el('gSegn');
  if(n && state.schermo === 'guida'){
    n.innerHTML = htmlSegnalazioni();
    if(guida.vai === 'segnalazioni' && el('segnalazioni')){ guida.vai = null; vaiCapitolo('segnalazioni'); }
  }
  const c = el('cartaGuida');
  if(c && state.schermo === 'profilo') c.outerHTML = cartaGuida();
}
const emailOk = e => typeof e === 'string' && /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(e) && e.length <= 200;
function rigaSegnalazione(s){
  const T = TIPI_SEGN[s.tipo] || {corto:s.tipo || '?'}, fatta = s.stato === 'risolta';
  return '<div class="sg-r'+(fatta?' fatta':'')+'">'+
    '<div class="sg-h"><span class="chip '+(s.tipo==='problema'?'alert':s.tipo==='idea'?'ok':'now')+'">'+esc(T.corto)+'</span>'+
      '<b>'+esc(s.chi || '')+'</b>'+(s.archivio ? '<span class="sg-m">· '+esc(s.archivio)+'</span>' : '')+
      '<span class="sg-t">'+esc(quandoCliente(s.creata_il))+'</span></div>'+
    '<div class="sg-tx">'+esc(s.testo || '')+'</div>'+
    '<div class="sg-meta">'+[s.dove, s.versione, s.dispositivo].filter(Boolean).map(esc).join(' · ')+'</div>'+
    '<div class="sg-az">'+
      (emailOk(s.email) ? '<a class="btn sm" href="mailto:'+esc(s.email)+'?subject='+encodeURIComponent('La tua segnalazione su FOSS')+'">'+svg('send')+'Rispondi</a>' : '')+
      '<button class="btn sm'+(fatta?' ghost':'')+'" data-action="seg-stato" data-id="'+esc(s.id)+'" data-s="'+(fatta?'aperta':'risolta')+'">'+
        svg(fatta?'undo':'check')+(fatta?'Riapri':'Segna risolta')+'</button></div></div>';
}
function htmlSegnalazioni(){
  const l = segnRicevute; if(!Array.isArray(l)) return '';
  const aperte = l.filter(s=>s.stato!=='risolta'), risolte = l.filter(s=>s.stato==='risolta');
  return '<div class="card g-admin" id="segnalazioni"><h3 style="display:flex;align-items:center;gap:8px">'+
      svg('bandiera',2.2).replace('<svg','<svg style="width:15px;height:15px;color:var(--amber-ink)"')+'Segnalazioni ricevute'+
      '<span class="chip'+(aperte.length?' now':'')+'" style="margin-left:auto">'+aperte.length+(aperte.length===1?' aperta':' aperte')+'</span></h3>'+
    '<div class="hint">Le vedi solo tu, come amministratore di FOSS. Ogni nuova segnalazione ti arriva anche come notifica.</div>'+
    (aperte.length ? aperte.map(rigaSegnalazione).join('') : '<div class="empty" style="padding:14px 0">Nessuna segnalazione aperta.</div>')+
    (risolte.length ? '<details class="sg-risolte"><summary>Risolte ('+risolte.length+')</summary>'+risolte.map(rigaSegnalazione).join('')+'</details>' : '')+
  '</div>';
}
function cambiaStatoSegnalazione(t){
  const id = t.dataset.id, s = t.dataset.s;
  if(typeof segnaSegnalazione !== 'function' || !id) return;
  if(typeof tastoDice === 'function') tastoDice(t, '…', 15000);
  segnaSegnalazione(id, s).then(()=>{
    const x = (Array.isArray(segnRicevute) ? segnRicevute : []).find(r=>r.id===id); if(x) x.stato = s;
    aggiornaSegnalazioni();
  }).catch(()=>{ if(typeof tastoDice === 'function') tastoDice(t, 'Non riuscito', 2500); });
}
/* nel profilo: la porta per la guida (e per l'amministratore, le segnalazioni) */
function cartaGuida(){
  const adm = Array.isArray(segnRicevute), aperte = adm ? segnRicevute.filter(s=>s.stato!=='risolta').length : 0;
  if(cloudAttivo() && segnRicevute === null && !segnCarico) setTimeout(caricaSegnalazioni, 0);
  return '<div class="card" id="cartaGuida"><h3 style="display:flex;align-items:center;gap:7px">'+
      svg('libro',2.2).replace('<svg','<svg style="width:15px;height:15px;color:var(--amber-ink)"')+'Guida e aiuto</h3>'+
    '<div class="hint">Come si fa tutto, capitolo per capitolo: dai primi passi alle funzioni avanzate. Se qualcosa manca o non funziona, lo segnali da lì.</div>'+
    '<div class="cal-az">'+
      '<button class="btn sm primary" data-action="apri-guida">'+svg('help')+'Apri la guida</button>'+
      '<button class="btn sm" data-action="segnala">'+svg('bandiera')+'Segnala un problema</button>'+
      (adm ? '<button class="btn sm ghost" data-action="apri-guida" data-cap="segnalazioni">'+svg('list')+'Segnalazioni ricevute'+(aperte ? ' ('+aperte+')' : '')+'</button>' : '')+
    '</div></div>';
}

/* ============ @ PER TAGGARE ============
   Nei commenti e nella chat: scrivendo @ compare chi lavora al progetto;
   scelto il nome, la persona riceve la notifica (col box a schermo intero,
   se l'ha acceso) e l'avviso sul telefono. */
let menz = null;            // {ta, da, q, lista, i}
const CAMPI_MENZ = ['cm_tx', 'composer'];
function taggabiliQui(){
  const p = (cm && state.progetti.find(x=>x.id===cm.pid)) || (state.progettoId ? PROJ() : null);
  if(!p) return [];
  return (p.team || []).filter(id=>id !== state.utente && state.utenti.some(u=>u.id===id)).map(id=>U(id));
}
function primoNome(u){ return String(u.nome || '').trim().split(/\s+/)[0] || ''; }
function chiudiMenz(){ menz = null; const b = el('menzPop'); if(b) b.remove(); }
function aggiornaMenz(ta){
  if(!ta || CAMPI_MENZ.indexOf(ta.id) < 0){ chiudiMenz(); return; }
  const i = ta.selectionStart, prima = ta.value.slice(0, i);
  const m = /(^|\s)@([\wÀ-ÿ'.-]{0,30})$/.exec(prima);
  if(!m){ chiudiMenz(); return; }
  const q = m[2].toLowerCase(), tutti = taggabiliQui();
  const lista = tutti.filter(u=>!q || u.nome.toLowerCase().split(/\s+/).some(w=>w.indexOf(q) === 0)).slice(0, 8);
  menz = {ta, da:i - m[2].length - 1, q, lista, i:0};
  let b = el('menzPop');
  if(!b){ b = document.createElement('div'); b.id = 'menzPop'; b.className = 'menz-pop'; document.body.appendChild(b); }
  b.innerHTML = '<div class="menz-h">Tagga qualcuno</div>' + (lista.length ? lista.map((u, k)=>
    '<button class="menz-r' + (k === 0 ? ' on' : '') + '" data-action="menz-scegli" data-u="' + esc(u.id) + '">' + av(u, 'sm') +
      '<span class="nm">' + esc(u.nome) + '</span>' + (u.ruolo ? '<span class="ru">' + esc(u.ruolo) + '</span>' : '') + '</button>').join('')
    : '<div class="menz-vuoto">' + (tutti.length ? 'Nessuno si chiama così nel team di questo progetto.' : 'Nel team di questo progetto non c\u2019è ancora nessun altro.') + '</div>');
  const r = ta.getBoundingClientRect(), w = Math.min(320, Math.max(220, r.width));
  b.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  b.style.width = w + 'px';
  b.style.bottom = (innerHeight - r.top + 6) + 'px';
}
function scegliMenz(id){
  if(!menz) return;
  const u = state.utenti.find(x=>x.id === id), ta = menz.ta; if(!u || !ta){ chiudiMenz(); return; }
  const fine = ta.selectionStart, prima = ta.value.slice(0, menz.da), dopo = ta.value.slice(fine);
  const ins = '@' + primoNome(u) + ' ';
  ta.value = prima + ins + dopo.replace(/^\s+/, '');
  const c = prima.length + ins.length;
  chiudiMenz();
  ta.focus(); try{ ta.setSelectionRange(c, c); }catch(e){}
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}
document.addEventListener('keydown', function(e){
  if(!menz || e.target !== menz.ta) return;
  const bs = [...document.querySelectorAll('#menzPop .menz-r')];
  if(e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); chiudiMenz(); return; }
  if(!bs.length) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); e.stopImmediatePropagation();
    menz.i = (menz.i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length;
    bs.forEach((b, k)=>b.classList.toggle('on', k === menz.i));
  } else if(e.key === 'Enter' || e.key === 'Tab'){
    e.preventDefault(); e.stopImmediatePropagation();

/* ============ COMMENTI DELLE TASK E DELLE SUBTASK ============
   Ogni task e ogni subtask ha la sua discussione: si apre dal tasto a forma
   di fumetto, in una finestra tutta sua. Dentro: i commenti con chi li ha
   scritti, e a parte i link e i file condivisi. Un pallino dice dove ci sono
   commenti che non hai ancora letto. La chat invece e' del lavoro intero.
   I commenti stanno in p.commenti[fase] con task (e voce, se sono di una
   subtask); quelli senza task sono i vecchi commenti di fase e le risposte
   del cliente, che ora si leggono nella chat. */
let cm = null;              // {pid, task, voce, tab, file, letto0}
const tempoMsg = m => +(m && (m.t || Math.abs(m._o || 0))) || 0;
const chiaveThr = (task, voce) => voce ? task + '|' + voce : task;
function idVoce(i){
  if(!i.id) i.id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return i.id;
}
function lettoThr(p, k){ return ((p.visti && p.visti.thr) || {})[k] || 0; }
function segnaLettoThr(p, k, t){
  if(!p.visti) p.visti = {commenti:0, chat:0, attivita:0};
  if(!p.visti.thr) p.visti.thr = {};
  if(t > (p.visti.thr[k] || 0)) p.visti.thr[k] = t;
}
/* i commenti di una discussione, dal piu' vecchio */
function commentiThr(p, task, voce){
  const out = [];
  Object.keys(p.commenti || {}).forEach(f=>(p.commenti[f] || []).forEach(m=>{
    if(m && m.task === task && (m.voce || null) === (voce || null)) out.push(m);
  }));
  return out.sort((a, b)=>tempoMsg(a) - tempoMsg(b));
}
/* quanti commenti e quanti da leggere, per ogni discussione del lavoro */
function statoThr(p){
  const mappa = {}, io = state.utente;
  Object.keys(p.commenti || {}).forEach(f=>(p.commenti[f] || []).forEach(m=>{
    if(!m || !m.task) return;
    const k = chiaveThr(m.task, m.voce), x = mappa[k] || (mappa[k] = {n:0, nuovi:0});
    x.n++;
    if(m.u !== io && tempoMsg(m) > lettoThr(p, k)) x.nuovi++;
  }));
  return mappa;
}
/* da leggere in una task, contando anche le sue subtask */
function nuoviInTask(st, s){
  let n = (st[s.id] || {}).nuovi || 0;
  (s.items || []).forEach(i=>{ if(i.id) n += (st[chiaveThr(s.id, i.id)] || {}).nuovi || 0; });
  return n;
}
function nuoviCommentiTask(p){
  const st = statoThr(p); let n = 0;
  Object.keys(st).forEach(k=>{ n += st[k].nuovi; });
  return n;
}
/* il tasto a forma di fumetto: numero dei commenti, pallino se ce ne sono di nuovi */
function tastoCommenti(p, st, s, i){
  const k = i ? chiaveThr(s.id, idVoce(i)) : s.id, x = st[k] || {n:0, nuovi:0};
  const nuovi = i ? x.nuovi : nuoviInTask(st, s);
  const titolo = x.n ? x.n + (x.n === 1 ? ' commento' : ' commenti') + (nuovi ? ', ' + nuovi + ' da leggere' : '') : 'Commenti, link e file';
  return '<button class="cm-btn' + (x.n ? ' ha' : '') + (nuovi ? ' nuovi' : '') + (i ? ' su-voce' : '') + '" data-action="cm-apri" ' +
    'data-pid="' + esc(p.id) + '" data-task="' + esc(s.id) + '"' + (i ? ' data-voce="' + esc(i.id) + '"' : '') +
    ' title="' + titolo + '" aria-label="' + titolo + '">' + svg('chat', 2.2) +
    (x.n ? '<span class="cm-n">' + (x.n > 99 ? '99+' : x.n) + '</span>' : '') + (nuovi ? '<i class="cm-dot"></i>' : '') + '</button>';
}

function apriCommenti(pid, task, voce){
  const p = state.progetti.find(x=>x.id === pid); if(!p) return;
  const s = (p.subs || []).find(x=>x.id === task); if(!s) return;
  if(voce && !(s.items || []).some(i=>i.id === voce)) voce = null;
  chiudiCtx();
  cm = {pid, task, voce:voce || null, tab:'commenti', file:null, letto0:lettoThr(p, chiaveThr(task, voce))};

function chiudiCommenti(){

function thrCorrente(){
  if(!cm) return null;
  const p = state.progetti.find(x=>x.id === cm.pid);
  const s = p && (p.subs || []).find(x=>x.id === cm.task);
  if(!p || !s){ return null; }
  const i = cm.voce ? (s.items || []).find(x=>x.id === cm.voce) : null;
  if(cm.voce && !i) return null;
  return {p, s, i, k:chiaveThr(s.id, cm.voce), lista:commentiThr(p, s.id, cm.voce)};
}
const RE_LINK = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]]/g;
function linkDelCommento(m){
  const tx = String(m.tx || '').replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&');

function pesoFile(n){

function icFile(tipo){

function fileHTML(m){

/* chi ha scritto: se non e' piu' nel team resta un segnaposto, non diventa qualcun altro */
function autoreCommento(id){

function msgCommento(m, primoNuovo){

function corpoCommenti(x){
  if(cm.tab === 'file'){
    const voci = [];
    x.lista.forEach(m=>{
      linkDelCommento(m).forEach(l=>voci.push({m, l}));

    return voci.reverse().map(v=>{

        '<span class="ic">' + svg('link', 2) + '</span><span class="nm">' + esc(host || v.l) + '</span><span class="url">' + esc(v.l) + '</span></a>' +

    }).join('');
  }

    '<span>Scrivi il primo: chi lavora al progetto riceve una notifica. Con @nome avvisi una persona in particolare.</span></div>';
  let giaSegnato = false;
  return x.lista.map(m=>{
    const nuovo = !giaSegnato && m.u !== state.utente && tempoMsg(m) > cm.letto0;

function puoCommentare(p){ return !state.ospite && puo('modifica') && !p.completato; }
function disegnaCommenti(tutto){
  const x = thrCorrente();
  if(!x){ const n = el('cmLayer'); if(n) n.remove(); cm = null; document.documentElement.classList.remove('cm-aperto'); return; }
  const {p, s, i} = x, F = FZ(p)[s.fase] || {};

  const tabs = '<button class="cm-tab' + (cm.tab === 'commenti' ? ' on' : '') + '" data-action="cm-tab" data-t="commenti">Commenti' +
      (x.lista.length ? '<span>' + x.lista.length + '</span>' : '') + '</button>' +
    '<button class="cm-tab' + (cm.tab === 'file' ? ' on' : '') + '" data-action="cm-tab" data-t="file">Link e file' +
      (nLf ? '<span>' + nLf + '</span>' : '') + '</button>';
  let n = el('cmLayer');
  if(tutto || !n){
    if(n) n.remove();

    n.innerHTML = '<div class="cm-scrim" data-action="cm-chiudi"></div>' +

        (scrive ? '<div class="cm-scrivi">' +

          : '<div class="cm-sola">' + (p.completato ? 'Il lavoro è completato: i commenti restano da leggere.' : 'Puoi leggere i commenti, ma non scriverne.') + '</div>') +

  el('cmDove').textContent = p.nome + ' · ' + (F.nome || '') + (i ? ' · ' + s.titolo : '');
  el('cmTit').textContent = i ? i.t : s.titolo;
  el('cmTabs').innerHTML = tabs;
  const corpo = el('cmCorpo'), inFondo = corpo.scrollHeight - corpo.scrollTop - corpo.clientHeight < 60;

  if(tutto || firma !== cm.firma){

    if(ultimo > lettoThr(p, x.k)){ segnaLettoThr(p, x.k, ultimo); save(); }

/* le foto allegate si vedono in piccolo (il link dura un'ora, lo tengo da parte) */

let inviaCommentoInCorso = false;
async function inviaCommento(tasto){
  const x = thrCorrente(); if(!x || inviaCommentoInCorso) return;
  const t = el('cm_tx'), testo = t ? t.value.trim() : '', f = cm.file, mio = cm;
  if(!testo && !f){ erroreCommenti('Scrivi qualcosa o allega un file.'); if(t) t.focus(); return; }
  if(!puoCommentare(x.p)){ erroreCommenti('Non puoi scrivere commenti su questo lavoro.'); return; }
  erroreCommenti('');
  inviaCommentoInCorso = true;
  const rimetti = () => {
    if(t) t.disabled = false;
    if(tasto && tasto.isConnected){ clearTimeout(tasto.__t); if(tasto.__orig != null) tasto.innerHTML = tasto.__orig; tasto.__orig = null; tasto.disabled = false; }
  };
  let file = null;
  if(f){
    if(t) t.disabled = true;                    // mentre il file sale non si scrive: niente va perso
    if(typeof tastoDice === 'function') tastoDice(tasto, '…', 60000);
    try{ file = await caricaAllegato(x.p.id, f); }
    catch(e){
      inviaCommentoInCorso = false; rimetti();
      const m = String((e && e.message) || '');
      if(cm === mio) erroreCommenti(/grand|size|413/i.test(m) ? 'Il file è troppo grande: il limite è 25 MB.' : 'Il file non è partito: controlla la connessione e riprova.');
      return;
    }
  }
  /* il commento va nella discussione da cui l'ho mandato, anche se nel frattempo ho chiuso la finestra */
  const m = {id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), u:state.utente, tx:esc(testo), t:Date.now(), task:x.s.id};
  if(mio.voce) m.voce = mio.voce;
  if(file) m.file = file;
  (x.p.commenti[x.s.fase] = x.p.commenti[x.s.fase] || []).push(m);
  segnaLettoThr(x.p, x.k, m.t);
  inviaCommentoInCorso = false;
  rimetti();
  if(cm === mio){
    cm.file = null; cm.letto0 = m.t;
    if(t){ t.value = ''; t.style.height = ''; t.focus(); }
    if(cm.tab !== 'commenti') cm.tab = 'commenti';
    disegnaCommenti(false);
    const c = el('cmCorpo'); if(c) c.scrollTop = c.scrollHeight;
  }
  save();
}
async function apriFileCommento(b){

  /* la finestra la apro subito, dentro al tocco: dopo l'attesa il telefono la bloccherebbe */

  } catch(e){

/* ============ NUOVO PROGETTO, PASSO PER PASSO ============

let nl = null;

function passiNL(){ return ['lavoro','dati','fasi'].concat(vedeSoldi()? ['soldi'] : []).concat(['chi']); }
function lavoroNL(){ const T = TIPO(nl.tipo); return (nl.lavoro && T.lavori && T.lavori[nl.lavoro]) || null; }
function giorniNL(){ const T = TIPO(nl.tipo), L = lavoroNL(); return (L && L.giorni) || T.giorni || []; }
function modelloNL(){ return nl.modello ? (state.modelli||[]).find(m=>m.id===nl.modello) || null : null; }
function titoloDiBase(){

/* fasi e task proposte, con l'interruttore di ognuna */
function pianoNL(){
  const M = modelloNL();
  const chiave = M ? 'm:'+M.id : 't:'+nl.tipo+'/'+(nl.lavoro||'');
  if(nl.piano && nl.chiavePiano===chiave) return nl.piano;
  let piano;
  if(M){
    piano = (M.fasi||[]).map((f,i)=>({nome:f.nome, icon:f.icon||'list', desc:f.desc||'', campi:(f.campi||[]).map(c=>c.slice()), on:true,
      task:(M.task||[]).filter(t=>t.fase===i).map(t=>({titolo:t.titolo, on:true, items:(t.items||[]).map(v=>{
        const x = {t:v.t, done:false};

        return x; })}))}));

    piano = pianoDi(nl.tipo, nl.lavoro).map(f=>Object.assign(f, {on:true, task:f.task.map(t=>Object.assign(t, {on:true}))}));
