/* ============ AVVISI SUL TELEFONO (WEB PUSH) ============ */
/* Il telefono si iscrive al servizio push del suo sistema (Apple, Google,
   Mozilla) con la chiave pubblica di FOSS; l'iscrizione finisce nel database.
   Quando nasce una notifica per me, il database chiama la funzione «push»,
   che la cifra e la manda a tutti i miei dispositivi iscritti. */
const VAPID_PUBBLICA = 'BNlGbW4nZrXmx8DioKxnl7ubULVOr5_6CAKvpuQYoiXeObmxYAzGU6UrkExx2zu1hACmtRNDcpoMh_ARQ0GSmlw';
function chiaveServer(){
  const b = atob(VAPID_PUBBLICA.replace(/-/g,'+').replace(/_/g,'/'));
  const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i);
  return u;
}
function b64uDi(buf){
  const b = new Uint8Array(buf); let s = '';
  for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function pushPossibile(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
/* il service worker attivo; se non c'e' (o non si attiva) non resto appeso */
function registrazioneSW(){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  return Promise.race([navigator.serviceWorker.ready, new Promise(ok=>setTimeout(()=>ok(null), 5000))]);
}
function nomeDispositivo(){
  const ua = navigator.userAgent || '';
  const cosa = /iPhone/.test(ua) ? 'iPhone' : (/iPad/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)) ? 'iPad'
    : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'Dispositivo';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return cosa + (br ? ' \u00b7 ' + br : '');
}
async function statoPush(){
  if(!sb || !utenteCloud) return 'no-supporto';
  if(suIOS() && !aTuttoSchermo()) return 'ios-home';
  if(!pushPossibile()) return 'no-supporto';
  if(Notification.permission === 'denied') return 'bloccati';
  const reg = await registrazioneSW();
  if(!reg || !reg.pushManager) return 'no-supporto';
  const iscr = await reg.pushManager.getSubscription();
  return iscr && Notification.permission === 'granted' ? 'si' : 'no';
}
function stessaChiave(iscr){
  try{ const k = iscr.options && iscr.options.applicationServerKey; return !k || b64uDi(k) === VAPID_PUBBLICA; }
  catch(e){ return true; }
}
async function mandaIscrizione(iscr){
  const j = typeof iscr.toJSON === 'function' ? iscr.toJSON() : iscr;
  const {error} = await sb.rpc('iscrivi_push', {p_endpoint:j.endpoint, p_p256dh:(j.keys||{}).p256dh,
                                                  p_auth:(j.keys||{}).auth, p_dispositivo:nomeDispositivo()});
  if(error) throw error;
}
/* deve partire dal tocco sul tasto: il permesso lo chiedo subito, prima di
   qualsiasi attesa, altrimenti Safari lo rifiuta senza chiedere niente */
function attivaPush(){
  if(!sb || !utenteCloud || !pushPossibile()) return;
  state.push = {stato:'lavoro'}; aggiornaRigaPush();
  let chiesta;
  try{
    chiesta = Notification.permission === 'granted' ? Promise.resolve('granted')
      : new Promise(ok=>{ const r = Notification.requestPermission(ok); if(r && typeof r.then === 'function') r.then(ok, ()=>ok('default')); });
  }catch(e){ chiesta = Promise.resolve(Notification.permission); }
  chiesta.then(async perm=>{
    if(perm !== 'granted'){
      state.push = {stato: perm === 'denied' ? 'bloccati' : 'no'}; aggiornaRigaPush();
      if(perm === 'denied') toast('Hai detto di no: se cambi idea si riattivano dalle impostazioni.','warn','Avvisi bloccati');
      return;
    }
    const reg = await registrazioneSW();
    if(!reg || !reg.pushManager) throw new Error('il service worker non \u00e8 pronto: ricarica la pagina e riprova');
    let iscr = await reg.pushManager.getSubscription();
    if(iscr && !stessaChiave(iscr)){ await iscr.unsubscribe().catch(()=>{}); iscr = null; }
    if(!iscr) iscr = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:chiaveServer()});
    await mandaIscrizione(iscr);
    state.push = {stato:'si'}; aggiornaRigaPush();
    toast('Da adesso gli avvisi arrivano anche qui. Premi \u00abProva\u00bb per vederne uno.','ok','Avvisi attivi');
  }).catch(e=>{
    console.warn('avvisi:', e);
    state.push = {stato:'no'}; aggiornaRigaPush();
    toast('Non sono riuscito ad attivarli'+(e && e.message ? ': '+e.message : '')+'.','warn','Avvisi non attivi');
  });
}
async function disattivaPush(){
  if(!sb || !utenteCloud) return;
  state.push = {stato:'lavoro'}; aggiornaRigaPush();
  try{
    const reg = await registrazioneSW();
    const iscr = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
    if(iscr){
      const {error} = await sb.rpc('disiscrivi_push', {p_endpoint:iscr.endpoint});
      if(error) throw error;
      await iscr.unsubscribe().catch(()=>{});
    }
    state.push = {stato:'no'}; aggiornaRigaPush();
    toast('Su questo dispositivo non arrivano pi\u00f9 avvisi.','ok','Avvisi spenti');
  }catch(e){
    state.push = null; aggiornaRigaPush();
    toast('Non sono riuscito a spegnerli'+(e && e.message ? ': '+e.message : '')+'.','warn','Riprova');
  }
}
/* le conferme a comparsa in FOSS sono spente: la risposta la da' il tasto stesso */
function tastoDice(tasto, html, ms){
  if(!tasto) return;
  if(tasto.__orig == null) tasto.__orig = tasto.innerHTML;
  tasto.innerHTML = html; tasto.disabled = true;
  clearTimeout(tasto.__t);
  tasto.__t = setTimeout(()=>{ if(tasto.isConnected){ tasto.innerHTML = tasto.__orig; tasto.disabled = false; } tasto.__orig = null; }, ms || 3500);
}
async function provaPush(tasto, giro){
  if(!sb || !utenteCloud) return;
  if(tasto && !giro) tastoDice(tasto, 'Mando…', 15000);
  try{
    const {data, error} = await sb.rpc('prova_push');
    if(error) throw error;
    if(data === 'ok') tastoDice(tasto, svg('check')+'Mandato', 4000);
    else if(data === 'aspetta') tastoDice(tasto, 'Aspetta qualche secondo', 3500);
    else if(data === 'nessun dispositivo' && !giro){
      /* il database non ha il mio dispositivo (tolto o mai arrivato): lo rimando e riprovo una volta */
      const reg = await registrazioneSW();
      const iscr = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
      if(!iscr){ state.push = {stato:'no'}; aggiornaRigaPush();
        toast('Questo dispositivo non è più iscritto: premi «Attiva».','warn','Avvisi spenti'); return; }
      await mandaIscrizione(iscr);
      return provaPush(tasto, true);
    }
    else { tastoDice(tasto, 'Non partito', 3500); toast('Non ho trovato dove mandarlo ('+data+').','warn','Prova non riuscita'); }
  }catch(e){
    tastoDice(tasto, 'Non partito', 3500);
    toast('La prova non è partita'+(e && e.message ? ': '+e.message : '')+'.','warn','Riprova');
  }
}
/* a ogni apertura rimando l'iscrizione di questo dispositivo: se il sistema
   ha cambiato le chiavi, o se su questo telefono ora entra un'altra persona,
   il database resta giusto */
async function risincronizzaPush(){
  try{
    if(!sb || !utenteCloud || !pushPossibile() || Notification.permission !== 'granted') return;
    const reg = await registrazioneSW(); if(!reg || !reg.pushManager) return;
    const iscr = await reg.pushManager.getSubscription(); if(!iscr) return;
    if(!stessaChiave(iscr)) return;
    await mandaIscrizione(iscr);
  }catch(e){ console.warn('avvisi:', e && e.message); }
}
/* all'uscita il dispositivo smette di ricevere gli avvisi di questa persona */
function pushEsci(){
  const lavoro = (async ()=>{
    if(!sb || !utenteCloud || !pushPossibile()) return;
    const reg = await navigator.serviceWorker.getRegistration(); if(!reg || !reg.pushManager) return;
    const iscr = await reg.pushManager.getSubscription(); if(!iscr) return;
    await sb.rpc('disiscrivi_push', {p_endpoint:iscr.endpoint});
    await iscr.unsubscribe().catch(()=>{});
  })().catch(()=>{});
  return Promise.race([lavoro, new Promise(ok=>setTimeout(ok, 2500))]);
}
/* torno su FOSS dopo aver cambiato il permesso nelle impostazioni */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || state.schermo !== 'profilo' || !state.push) return;
  if(['lavoro','controllo'].indexOf(state.push.stato) >= 0) return;
  statoPush().then(x=>{ if(!state.push || x !== state.push.stato){ state.push = {stato:x}; aggiornaRigaPush(); } }).catch(()=>{});
});

/* ============ FILE ALLEGATI AI COMMENTI ============ */
/* Stanno nell'archivio «allegati» del database, in una cartella per lavoro:
   li vede solo chi ci lavora. Si aprono con un link che dura un'ora. */
const TIPI_ALLEGATO = ['image/jpeg','image/png','image/webp','image/gif','image/heic','image/heif','video/mp4','video/quicktime','video/webm',
  'audio/mpeg','audio/mp4','audio/aac','audio/wav','audio/x-wav','application/pdf','application/zip','application/x-zip-compressed',
  'text/plain','text/csv','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  'application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint',
  'application/vnd.openxmlformats-officedocument.presentationml.presentation'];
const MAX_ALLEGATO = 25 * 1024 * 1024;
async function caricaAllegato(pid, file){
  if(!sb || !utenteCloud) throw new Error("serve l'accesso");
  if(file.size > MAX_ALLEGATO) throw new Error('troppo grande');
  const org = orgProg[pid] || orgMia;
  const pulito = String(file.name || 'file').normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^[-.]+/, '').slice(-80) || 'file';
  const percorso = org + '/' + pid + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '-' + pulito;
  /* un tipo che l'archivio non conosce (un progetto di Premiere, un .drp...) parte come file generico: si scarica e basta */
  const tipo = TIPI_ALLEGATO.indexOf(file.type) >= 0 ? file.type : 'application/octet-stream';
  const {error} = await sb.storage.from('allegati').upload(percorso, file, {contentType:tipo, upsert:false});
  if(error) throw error;
  return {path:percorso, nome:String(file.name || pulito).slice(0, 120), dim:file.size, tipo};
}
const linkAllegati = {};
async function linkAllegato(percorso){
  const c = linkAllegati[percorso];
  if(c && c.scade > Date.now()) return c.url;
  const {data, error} = await sb.storage.from('allegati').createSignedUrl(percorso, 3600);
  if(error || !data || !data.signedUrl) throw (error || new Error('file non trovato'));
  linkAllegati[percorso] = {url:data.signedUrl, scade:Date.now() + 50 * 60000};
  return data.signedUrl;
}
async function togliAllegato(percorso, pid){
  if(!sb || !utenteCloud || !percorso) return;
  /* solo i file di questo lavoro: una copia di un commento non toglie il file dell'originale */
  if(!pid || String(percorso).indexOf((orgProg[pid] || orgMia) + '/' + pid + '/') !== 0) return;
  const {error} = await sb.storage.from('allegati').remove([percorso]);
  if(error) console.warn('allegato:', error.message);
}

function nomeClienteSalvato(){ try{ return localStorage.getItem('foss_cliente_nome') || ''; }catch(e){ return ''; } }
function ricordaNomeCliente(n){ try{ localStorage.setItem('foss_cliente_nome', n); }catch(e){} }
async function apriPaginaCliente(token){
  state.schermo = 'cliente';
  { const l = el('fadeLayer'); if(l){ l.classList.remove('on','avvio'); l.innerHTML = ''; } }
  const app = el('app'); if(app) app.hidden = true;
  let box = el('paginaCliente');
  if(!box){
    box = document.createElement('div'); box.id = 'paginaCliente'; box.className = 'pc';
    document.body.appendChild(box);
    /* i tocchi qui dentro non devono arrivare all'app che sta sotto */
    box.addEventListener('click', e=>{ e.stopPropagation(); cliccaPaginaCliente(e); });
    ['keydown','contextmenu','input','change'].forEach(t=>box.addEventListener(t, e=>{
      e.stopPropagation();
      if(t==='input' && statoPC){ if(e.target.id==='pcNome') statoPC.nome = e.target.value; if(e.target.id==='pcTesto') statoPC.testo = e.target.value; }
    }));
  }
  statoPC = {token, d:null, scelta:null, nome:nomeClienteSalvato(), testo:'', inviata:false, invio:false, errore:'',
             anteprima:/[?&]anteprima=1/.test(location.hash || '')};
  box.innerHTML = '<div class="pc-carico">Carico…</div>';
  await ricaricaPaginaCliente();
}
async function ricaricaPaginaCliente(){
  const box = el('paginaCliente'); if(!box || !statoPC) return;
  try{
    const {data, error} = await sb.rpc('pagina_cliente', {p_token: statoPC.token});
    if(error) throw error;
    statoPC.d = data || {attivo:false};
    disegnaPaginaCliente();
    if(statoPC.d.attivo) document.title = (statoPC.d.nome || 'Lavoro') + ' · ' + ((statoPC.d.studio||{}).nome || 'FOSS');
  }catch(e){
    box.innerHTML = '<div class="pc-in"><div class="pc-card pc-centro"><div class="pc-logo">FOSS</div><h1>Non riesco a caricarla</h1>'+
      '<p class="pc-sub">Controlla la connessione e riprova.</p><button class="pc-invia" style="padding:0 22px" data-cl="riprova">Riprova</button></div></div>';
  }
}
function disegnaPaginaCliente(){
  const box = el('paginaCliente'); if(!box || !statoPC) return;
  const y = box.scrollTop;
  box.innerHTML = renderPaginaCliente(statoPC);
  box.scrollTop = y;
}
function cliccaPaginaCliente(e){
  const t = e.target.closest('[data-cl]'); if(!t || !statoPC) return;
  const az = t.dataset.cl;
  if(az==='riprova'){ ricaricaPaginaCliente(); return; }
  if(az==='scegli'){
    statoPC.scelta = t.dataset.v; statoPC.errore = '';
    disegnaPaginaCliente();
    const f = el(statoPC.scelta==='modifiche' || statoPC.nome ? 'pcTesto' : 'pcNome');
    if(f) setTimeout(()=>{ try{ f.focus({preventScroll:true}); }catch(err){ f.focus(); } f.scrollIntoView({block:'center', behavior:'smooth'}); }, 30);
    return;
  }
  if(az==='ancora'){ statoPC.inviata = false; statoPC.scelta = null; statoPC.testo = ''; disegnaPaginaCliente(); return; }
  if(az==='invia') inviaRispostaCliente();
}
async function inviaRispostaCliente(){
  const st = statoPC; if(!st || st.invio || !st.scelta) return;
  const nome = (st.nome||'').trim(), testo = (st.testo||'').trim();
  if(st.scelta==='modifiche' && testo.length < 2){ st.errore = 'Scrivi cosa vorresti cambiare.'; disegnaPaginaCliente(); return; }
  if(st.anteprima){ st.errore = 'In anteprima la risposta non parte: cos\u00ec la vede il cliente.'; disegnaPaginaCliente(); return; }
  st.invio = true; st.errore = ''; disegnaPaginaCliente();
  try{
    const {error} = await sb.rpc('risposta_cliente', {p_token:st.token, p_esito:st.scelta, p_testo:testo, p_nome:nome});
    if(error) throw error;
    if(nome) ricordaNomeCliente(nome);
    st.inviata = true; st.invio = false; st.testo = '';
    await ricaricaPaginaCliente();
    const r = el('pcRisposta'); if(r) r.scrollIntoView({block:'center', behavior:'smooth'});
  }catch(e){
    st.invio = false;
    const m = String((e && e.message) || '');
    st.errore = /troppe/.test(m) ? 'Oggi sono arrivate già molte risposte: riprova domani.'
              : /attiva/.test(m) ? 'Questa pagina non è più attiva.'
              : /cambiare/.test(m) ? 'Scrivi cosa vorresti cambiare.'
              : 'Non è partita: controlla la connessione e riprova.';
    disegnaPaginaCliente();
  }
}

/* ============ PROFILO, INVITI, PERMESSI ============ */
async function salvaProfiloCloud(){
  if(!sb || !utenteCloud) return;
  const {error} = await sb.from('profili').upsert({
    id: utenteCloud.id, nome:state.me.nome, cognome:state.me.cognome, nickname:state.me.nick,
    email:state.me.email, ruolo:state.me.ruolo, foto_url:state.me.foto,
    tema:state.cfg.tema, cfg:{boxFull:state.cfg.boxFull, toast:state.cfg.toast,
                              soloMiei:state.cfg.soloMiei, snoozeMin:state.cfg.snoozeMin,
                              link:state.me.link||'', professioni:state.cfg.professioni}
  });
  if(error) toast(error.message,'warn','Profilo non salvato');
}
async function invitiAperti(){
  if(!sb) return [];
  const {data, error} = await sb.rpc('inviti_aperti');
  if(error){ console.warn(error.message); return []; }
  return data || [];
}
async function primoAccesso(invito, email, pw){
  const {data, error} = await sb.auth.signUp({
    email, password:pw,
    options:{ data:{nome:invito.nome, cognome:invito.cognome, nickname:'', ruolo:invito.ruolo, invito:invito.id} }
  });
  if(error){ toast(error.message,'warn','Non riuscito'); return false; }
  try{ await sb.rpc('usa_invito', {p_id:invito.id, p_email:email}); }catch(e){}
  if(!data.session){
    toast('Conferma la mail che ti ho mandato, poi accedi con la password che hai scelto.','ok','Account creato');
    return false;
  }
  utenteCloud = data.user; await caricaCloud(); return true;
}
/* L'amministratore crea un profilo: nome, cognome, nickname, email.
   Quando quella persona si registra con la stessa email, il database la
   mette da sola nell'archivio come guest. */
async function creaProfiloCloud(d){
  if(!sb || !utenteCloud || !orgMia){ toast('Serve la connessione al database.','warn','Non creato'); return false; }
  const {data, error} = await sb.from('inviti').insert({org_id:orgMia, nome:d.nome, cognome:d.cognome,
    nickname:d.nickname, email:d.email, ruolo:d.ruolo||'Collaboratore', usato:false})
    .select('id,nome,cognome,nickname,email,ruolo,usato').single();
  if(error){ toast(error.message,'warn','Profilo non creato'); return false; }
  state.inviti = (state.inviti||[]).concat([data]);
  return true;
}
async function salvaPermessiCloud(uid, pm){
  if(!sb || !utenteCloud || !orgMia) return false;
  const {error} = await sb.from('membri_org').update({permessi:pm}).match({org_id:orgMia, utente_id:uid});
  if(error){ toast(error.message,'warn','Permessi non salvati'); return false; }
  return true;
}
async function togliAccessoCloud(uid){
  if(!sb || !utenteCloud || !orgMia) return false;
  const {error} = await sb.rpc('togli_accesso', {p_org:orgMia, p_utente:uid});
  if(error){ toast(error.message,'warn','Accesso non tolto'); return false; }
  return true;
}
async function togliProfiloCloud(id){
  if(!sb || !utenteCloud) return false;
  const {error} = await sb.from('inviti').delete().eq('id', id);
  if(error){ toast(error.message,'warn','Non eliminato'); return false; }
  return true;
}
async function caricaAvatar(file){
  if(!sb || !utenteCloud) return null;
  let est = (file.name.split('.').pop()||'jpg').toLowerCase();
  if(!/^[a-z0-9]{1,5}$/.test(est)) est = 'jpg';
  const percorso = utenteCloud.id+'/avatar.'+est;
  const {error} = await sb.storage.from('avatar').upload(percorso, file, {upsert:true});
  if(error){ toast(error.message,'warn','Foto non caricata'); return null; }
  const {data} = sb.storage.from('avatar').getPublicUrl(percorso);
  return data.publicUrl + '?v=' + Date.now();
}

/* ============ MODELLI SALVATI ============ */
async function salvaModelloCloud(m){
  if(!sb || !utenteCloud || !orgMia){ toast('Serve la connessione al database.','warn','Modello non salvato'); return false; }
  const dati = Object.assign({}, m); delete dati.id; delete dati.nome; delete dati.tipo; delete dati.creato_da;
  const {error} = await sb.from('modelli').upsert({org_id:orgMia, id:m.id, nome:m.nome, tipo:m.tipo||null, dati},
                                                   {onConflict:'org_id,id'});
  if(error){ toast(error.message,'warn','Modello non salvato'); return false; }
  return true;
}
async function togliModelloCloud(id){
  if(!sb || !utenteCloud || !orgMia) return false;
  const {error} = await sb.from('modelli').delete().match({org_id:orgMia, id});
  if(error){ toast(error.message,'warn','Modello non eliminato'); return false; }
  return true;
}

/* ============ CALENDARIO ABBONABILE ============
   Un link segreto e personale: Google Calendar o il Calendario di iPhone lo
   leggono da soli e mostrano riprese, consegne e scadenze dei miei lavori. */
function linkDelCalendario(token){ return SUPA_URL + '/functions/v1/calendario?t=' + encodeURIComponent(token); }
/* il link se esiste gia': non ne crea uno nuovo */
async function leggiLinkCalendario(){
  if(!sb || !utenteCloud) return null;
  const {data, error} = await sb.from('calendari').select('token').eq('utente_id', utenteCloud.id).maybeSingle();
  if(error) throw error;
  return data && data.token ? linkDelCalendario(data.token) : null;
}
async function linkCalendarioCloud(rinnova){
  if(!sb || !utenteCloud) return null;
  if(!rinnova){
    const {data} = await sb.from('calendari').select('token').eq('utente_id', utenteCloud.id).maybeSingle();
    if(data && data.token) return linkDelCalendario(data.token);
  }
  const a = new Uint8Array(18); (window.crypto||window.msCrypto).getRandomValues(a);
  const token = Array.from(a, b=>b.toString(16).padStart(2,'0')).join('');
  const {error} = await sb.from('calendari').upsert({utente_id:utenteCloud.id, token}, {onConflict:'utente_id'});
  if(error){ toast(error.message,'warn','Calendario'); return null; }
  return linkDelCalendario(token);
}

/* ============ BOOT ============ */
function start(dati){
  /* il link del cliente: la sua pagina, senza accesso e senza app */
  const cli = /^#\/c\/([A-Za-z0-9_-]{20,64})/.exec(location.hash || '');
  if(cli && sb){ apriPaginaCliente(cli[1]); return; }
  if(dati && dati.state){ try{ Object.assign(state, dati.state); }catch(e){} }
  else load();
  if(!sb){
    { const l = el('fadeLayer'); if(l){ l.classList.remove('on','avvio'); l.innerHTML = ''; } }
    if(state.schermo !== 'gate') state.schermo = 'spazi';      // all'apertura: la pagina degli spazi
    normalizza();
    render();
    if(applicaIndirizzo()) return;
    if(!state.spazi.length) apriWizard(true);
    return;
  }
  /* Come Instagram: mentre controllo in sottofondo se sei gia' dentro, vedi
     solo la schermata di caricamento. Email e password compaiono soltanto se
     su questo dispositivo non hai ancora fatto l'accesso. */
  state.schermo = 'gate'; state.gateModo = 'login';
  let deciso = false;
  const togliAvvio = () => {
    const l = el('fadeLayer'); if(!l) return;
    l.classList.remove('on');
    setTimeout(()=>{ l.classList.remove('avvio'); l.innerHTML = ''; }, 400);
  };
  const chiedi = () => { if(deciso) return; deciso = true; state.schermo = 'gate'; render(); togliAvvio(); };
  const scorta = setTimeout(chiedi, 10000);      // se la rete non risponde, non resto appeso
  sb.auth.getSession().then(({data})=>{
    if(!(data && data.session)){ clearTimeout(scorta); chiedi(); return; }
    utenteCloud = data.session.user;
    caricaCloud().then(()=>{
      if(deciso) return;
      deciso = true; clearTimeout(scorta);
      state.schermo = 'spazi';                   // all'apertura: la pagina degli spazi
      render(); togliAvvio();
      if(applicaIndirizzo()) return;
      if(nuovoArrivato || !state.spazi.length) apriWizard(true);
    });
  }).catch(()=>{ clearTimeout(scorta); chiedi(); });
}
/* Niente zoom con le dita: la pagina e' gia' disegnata per lo schermo
   che ha, e uno zoom accidentale la manda fuori squadra. */
['gesturestart','gesturechange','gestureend'].forEach(ev=>{
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false});
});
document.addEventListener('dblclick', e=>{
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  e.preventDefault();
}, {passive:false});
window.addEventListener('hashchange', ()=>{ applicaIndirizzo(); });
/* installabile: si aggiunge alla schermata Home e si apre a tutto schermo */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
  /* tocco su un avviso con FOSS gia' aperto: il service worker mi dice dove andare */
  navigator.serviceWorker.addEventListener('message', e=>{
    const d = e.data || {};
    if(d.tipo !== 'apri' || !d.url || state.schermo === 'cliente') return;
    let h = ''; try{ h = new URL(d.url, location.href).hash; }catch(_){ h = ''; }
    if(!h) return;
    /* ancora da entrare: lo tengo nell'indirizzo, dopo l'accesso ci vado */
    if(state.schermo === 'gate'){ try{ history.replaceState(null, '', location.pathname + location.search + h); }catch(_){} return; }
    if(location.hash === h) applicaIndirizzo(); else location.hash = h;
  });
}
try{
  if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({state}));
  if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(null);
}catch(e){ start(null); }
})();
