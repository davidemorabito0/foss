    <h3>Notifiche</h3>
    <button class="btn sm ghost" data-action="read-all">Segna tutte</button>
    <button class="iconbtn" data-action="close-all" title="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="nlist" id="nlist"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalSlot"></div>
<div class="alert-layer" id="alertLayer" role="alertdialog" aria-live="assertive"></div>
<div class="fade-layer" id="fadeLayer" aria-hidden="true"></div>

<script>

function mkSubs(faseCorrente, nFasi, tipo){
  const out=[]; let n=0;
  const base = TASK_TPL[tipo] || TASK_TPL.video;
  const tpl = base.slice(0, nFasi||base.length);
  tpl.forEach((coppia,f)=>{
    coppia.forEach(([titolo,items],j)=>{
      const passata = f < faseCorrente, attuale = f === faseCorrente;
      const quanti = passata ? items.length : attuale ? (j===0? Math.max(1,items.length-2) : 0) : 0;
      out.push({
        id:'s'+(++n)+'_'+f, fase:f, titolo, aperto: attuale && j===0,
        items: items.map((t,i)=>({t, done: i < quanti}))
      });
    });
  });
  return out;
}

function P(o){
  const p = Object.assign({
    fase:0, avanz:0, revisione:false, tab:'commenti', draft:'',
    tipo:'video', prio:'media', indirizzo:'', nota:'', allegati:[], tags:[], icona:null, coord:null,
    spazio:'sp1',
    commenti:{}, chat:[], log:[], visti:{commenti:0, chat:0, attivita:0}, faseAss:{},
    lock:{on:false, pw:''}, completato:false
  }, o);
  const TP = TIPI[p.tipo] || TIPI.video;
  if(!p.fasi) p.fasi = TP.fasi.map(f=>Object.assign({}, f));
  if(!p.icona) p.icona = TP.ic;
  p.avanz = p.fase;
  p.subs = (o.preset===false) ? [] : mkSubs(p.fase, p.fasi.length, p.tipo);
  /* ogni fase e ogni task hanno un responsabile */
  const t = p.team || [state.utente];
  FZ(p).forEach((f,i)=>{ if(p.faseAss[i]==null) p.faseAss[i] = t[i % t.length]; });
  p.subs.forEach((s,i)=>{ if(!s.assegnato) s.assegnato = t[(i+1) % t.length]; });
  /* Un progetto già avviato non può avere il registro vuoto: le fasi che ha
     alle spalle sono successe, e il registro deve raccontarle. */
  if(!p.log.length && p.fase > 0){
    const F = FZ(p);
    for(let i = p.fase; i > 0; i--){
      p.log.push({tx:'Fase <b>'+F[i-1].nome+'</b> chiusa, si passa a <b>'+F[i].nome+'</b>', ts:'fase '+i, acc:true});
    }
    p.log.push({tx:'Progetto aperto su <b>'+F[0].nome+'</b>', ts:'inizio', acc:false});
  }
  return p;
}

function giorniA(dmy){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dmy||''); if(!m) return null;
  return Math.round((new Date(+m[3],+m[2]-1,+m[1]) - OGGI)/86400000);

const GIORNI_SETT = ['domenica','luned\u00ec','marted\u00ec','mercoled\u00ec','gioved\u00ec','venerd\u00ec','sabato'];
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function dataDi(dmy){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dmy||''); if(!m) return null;
  return new Date(+m[3],+m[2]-1,+m[1]);
}
/* La scadenza detta come la direbbe una persona: "domani", "gioved\u00ec",
   e solo da lontano la data. Il rosso lo uso solo quando serve davvero. */
function scadenza(p){
  const g = giorniA(p.consegna), d = dataDi(p.consegna);
  if(g===null) return {t:'\u2014', c:''};
  /* un lavoro chiuso non \u00e8 in ritardo: \u00e8 consegnato */
  if(p.completato) return {t: d? 'Consegnato il '+d.getDate()+' '+MESI_BREVI[d.getMonth()] : 'Consegnato', c:'fatto'};
  if(g<0){
    const n = -g;
    return {t: n===1? 'Scaduto ieri' : n<7? 'Scaduto '+n+' giorni fa'
              : n<14? 'Scaduto una settimana fa' : 'Scaduto il '+d.getDate()+' '+MESI_BREVI[d.getMonth()], c:'alert'};
  }
  if(g===0) return {t:'Oggi', c:'alert'};
  if(g===1) return {t:'Domani', c:'alert'};
  if(g===2) return {t:'Dopodomani', c:'alert'};
  if(g<=6) return {t:GIORNI_SETT[d.getDay()][0].toUpperCase()+GIORNI_SETT[d.getDay()].slice(1), c:'now'};
  if(g<=13) return {t:'Tra una settimana', c:'now'};
  return {t: d.getDate()+' '+MESI_BREVI[d.getMonth()] + (d.getFullYear()!==OGGI.getFullYear()? ' '+d.getFullYear():''), c:''};
}

function passaFiltro(p, f){
  if(!f) return true;
  if(f.prio && p.prio!==f.prio) return false;
  if(f.tipo && p.tipo!==f.tipo) return false;
  if(f.tag && !(p.tags||[]).some(t=>t.toLowerCase()===f.tag.toLowerCase())) return false;
  if(f.fase!=null && p.avanz!==f.fase) return false;
  if(f.cliente && !p.cliente.toLowerCase().includes(f.cliente.toLowerCase())) return false;
  return true;
}

function listaProgetti(){
  const q = state.filtro.toLowerCase();
  const f = filtriDiSpazio().find(x=>x.id===state.filtroAttivo);

        (!q || (p.nome+' '+p.cliente).toLowerCase().includes(q)) && passaFiltro(p,f));
  const o = state.ordina;
  return l.sort((a,b)=>{
    if(!!a.completato !== !!b.completato) return a.completato? 1 : -1;
    if(o==='scadenza') return (giorniA(a.consegna)??999)-(giorniA(b.consegna)??999);
    if(o==='cliente') return a.cliente.localeCompare(b.cliente);
    if(o==='fase') return b.avanz-a.avanz;

    c.innerHTML = sp? '<button class="sp-chip" style="--acc:'+sp.col+'" data-action="menu-spazi" title="Cambia spazio di lavoro">'+
      '<span class="ic">'+svg(sp.icona)+'</span><span class="nm">'+esc(sp.nome)+'</span>'+
      '<span class="cv">'+svg('chev',2.6)+'</span></button>' : '';
  } else if(state.schermo==='profilo'){
    c.innerHTML = '<b>Profilo</b>';
  } else c.innerHTML = '';
  el('searchWrap').hidden = state.schermo!=='home';
  const gate = state.schermo==='gate';
  ['undoBtn','bellBtn','meBtn','themeBtn'].forEach(id=>{ const n = el(id); if(n) n.hidden = gate; });
  if(gate) el('lockBtn').hidden = true;
  const vsw = el('viewswitch');
  vsw.hidden = state.schermo!=='home';
  if(state.schermo==='home'){
    const VISTE = {
      tessere:{n:'Tessere', ic:'grid'}, lista:{n:'Lista', ic:'list'},
      calendario:{n:'Calendario', ic:'calendar'}, mappa:{n:'Mappa', ic:'pin'},
      note:{n:'Note', ic:'pen'}
    };
    const ordine = (state.ordineViste||[]).filter(k=>VISTE[k]);
    Object.keys(VISTE).forEach(k=>{ if(ordine.indexOf(k)<0) ordine.push(k); });
    state.ordineViste = ordine;
    const mostrate = suTelefono() ? ordine.filter(k=>VISTE_FUORI_TELEFONO.indexOf(k)<0) : ordine;
    vsw.innerHTML = mostrate.map(k=>
      '<button class="vs'+(state.vista===k?' on':'')+'" data-vs="'+k+'" '+
      'data-action="vista" data-v="'+k+'" title="'+VISTE[k].n+' — trascina per spostarlo">'+
      svg(VISTE[k].ic)+'<span>'+VISTE[k].n+'</span></button>').join('');
  }
}
function tema(){
  const a = document.documentElement.getAttribute('data-theme');
  if(a) return a;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark';
}

/* ============ HOME ============ */
/* Il tasto indietro deve essere sempre lì e sempre riconoscibile:
   freccia + parola, non una virgoletta grigia. */
function tastoIndietro(azione, etichetta, extra){
  return '<div class="riga-indietro"><button class="indietro" data-action="'+azione+'"'+(extra||'')+
    ' title="Torna a '+etichetta+'">'+svg('left',2.4)+'<span>'+etichetta+'</span></button></div>';
}

function intestazioneSpazio(lista){
  const sp = SPZ(); if(!sp) return '';
  const fatti = lista.filter(x=>x.completato).length;
  const task = lista.reduce((n,p)=>n+p.subs.length,0);
  const urg = lista.filter(p=>{ const g = giorniA(p.consegna); return !p.completato && g!=null && g<=7; }).length;
  const membri = (sp.membri||[]).filter(id=>state.utenti.some(u=>u.id===id));
  return '<div class="sp-head" style="--acc:'+sp.col+'">'+
    tastoIndietro('spazi','Spazi')+
    '<span class="ic">'+svg(sp.icona)+'</span>'+
    '<div style="min-width:0">'+
      '<h1>'+esc(sp.nome)+'</h1>'+
      (sp.desc? '<div class="desc">'+esc(sp.desc)+'</div>':'')+
      '<div class="riga2">'+
        '<span class="dato"><b>'+(lista.length-fatti)+'</b> '+(state.filtroAttivo?'filtrati':'progetti attivi')+'</span>'+
        (fatti? '<span class="dato"><b>'+fatti+'</b> completati</span>':'')+
        '<span class="dato"><b>'+task+'</b> task</span>'+
        (urg? '<span class="dato urg"><b>'+urg+'</b> in scadenza</span>':'')+
        (membri.length? '<span class="dato" style="gap:7px">'+
          '<span class="av-stack">'+membri.map(id=>av(U(id),'sm')).join('')+'</span>'+membri.length+' nel team</span>':'')+
      '</div>'+
    '</div>'+
    (state.ospite? '' : '<div class="azioni">'+
      '<button class="btn sm ghost" data-action="modifica-spazio" data-id="'+sp.id+'">'+svg('pen')+'Modifica spazio</button>'+
      '<button class="btn primary" data-action="nuovo">'+svg('plus')+'Nuovo progetto</button>'+
    '</div>')+'</div>';
}

/* barra per chi apre un link in sola lettura, sopra la lista dei progetti */
function barraOspite(){
  if(!state.ospite) return '';
  const sp = SPZ();
  return '<div class="ospite-bar">'+svg('eye')+'<span>Stai guardando <b>'+esc(sp?sp.nome:'questo spazio')+
    '</b> come visualizzatore esterno: puoi leggere tutto, non puoi modificare nulla.</span>'+
    '<span class="spacer" style="flex:1"></span>'+
    '<button class="btn sm" data-action="esci-ospite">'+svg('undo')+'Torna al mio archivio</button></div>';
}

/* in quale colonna vive un progetto */
function statoDi(p){
  if(p.completato) return 'fatto';
  const pc = prog(p);
  return (p.avanz>0 || pc>0) ? 'corso' : 'dafare';
}
const GRUPPI = [
  {id:'dafare', nome:'Da fare',   c:'var(--dim)',  ds:'non ancora iniziati'},
  {id:'corso',  nome:'In corso',  c:'var(--amber-ink)', ds:'lavorazione aperta'},
  {id:'fatto',  nome:'Completati',c:'var(--ok)',   ds:'chiusi'}
];

function rigaLista(p){
  const s = scadenza(p), T = TIPI[p.tipo]||TIPI.video, pc = prog(p);
  const resp = U(p.faseAss? (p.faseAss[p.fase]||p.team[0]) : p.team[0]);
  return '<div class="rg'+(p.completato?' fatto':'')+'" style="--acc:'+p.col+'" role="button" tabindex="0" '+
    'data-action="apri" data-id="'+p.id+'">'+
    '<span class="cerchio">'+svg('check',3)+'</span>'+
    '<span class="col"></span>'+
    '<span class="nome"><b>'+esc(p.nome)+'</b><span>'+esc(T.n)+
      ((p.tags&&p.tags.length)? ' · '+esc(p.tags[0]) : '')+' · '+esc(p.cliente)+'</span></span>'+
    '<span class="prio '+p.prio+'">'+PRIO[p.prio]+'</span>'+
    av(resp,'sm')+
    '<span class="quando'+(s.c==='alert'?' urg':'')+'">'+(p.consegna==='—'?'—':s.t)+'</span>'+
    '<span class="barra"><i><b style="width:'+pc+'%"></b></i><span>'+pc+'%</span></span>'+
    '</div>';
}

function gruppiDi(lista){
  if(state.raggruppa==='scadenza'){
    const b = (n,c,f)=>({id:n, nome:n, c:c, ps:lista.filter(f)});
    return [
      b('Scadenza oggi','var(--alert)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g<=0;}),
      b('Questa settimana','var(--amber-ink)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g>0 && g<=7;}),
      b('Prossime scadenze','var(--dim)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g>7;}),
      b('Senza scadenza','var(--mute)', p=>!p.completato && giorniA(p.consegna)==null),
      b('Completati','var(--ok)', p=>!!p.completato)
    ];
  }
  if(state.raggruppa==='priorita'){
    return Object.keys(PRIO).map(k=>({id:k, nome:'Priorità '+PRIO[k].toLowerCase(),
      c: k==='alta'?'var(--alert)':k==='media'?'var(--amber-ink)':'var(--mute)',
      ps: lista.filter(p=>p.prio===k)}));
  }
  return GRUPPI.map(g=>Object.assign({}, g, {ps:lista.filter(p=>statoDi(p)===g.id)}));
}
function segmenti(){
  const V = [['compiti','Compiti','Divisi per stato: da fare, in corso, completati'],
             ['priorita','Priorità','Dal più urgente al meno urgente'],
             ['scadenza','Scadenza','Oggi, questa settimana, più avanti']];
  const att = V.find(v=>v[0]===state.raggruppa) || V[0];
  return '<div style="display:flex;align-items:center;gap:10px;margin:0 0 14px"><div class="seg">'+
    V.map(v=>'<button class="'+(state.raggruppa===v[0]?'on':'')+'" data-action="raggruppa" data-k="'+v[0]+'">'+v[1]+'</button>').join('')+
    '</div><span class="solo-largo" style="font-size:11.5px;color:var(--mute)">'+att[2]+'</span></div>';
}

function renderLista(lista){
  let h = '<div class="lista-wrap">'+segmenti();
  if(!lista.length) return h + vuotoPerche() + '</div>';
  const gruppi = gruppiDi(lista);
  gruppi.forEach(g=>{
    if(!g.ps.length) return;
    h += '<div class="gruppo" style="--gc:'+g.c+'"><div class="gruppo-h">'+
      '<span class="pallo"></span><h3>'+g.nome+'</h3>'+
      '<span class="n">'+g.ps.length+(g.ps.length===1?' progetto':' progetti')+'</span></div>'+
      '<div class="righe">'+g.ps.map(rigaLista).join('')+'</div></div>';
  });
  return h + '</div>';
}

function tessera(p){
  const nuoveN = state.notifiche.filter(n=>n.p===p.id && n.nuova).length;
  const s = scadenza(p), T = TIPI[p.tipo]||TIPI.video;
  return '<button class="tile'+(p.completato?' fatto':(s.c==='alert'?' urg':''))+'" style="--acc:'+p.col+'" data-action="apri" data-id="'+p.id+'">'+
        '<div class="tile-meta" style="margin-bottom:8px">'+
          '<span class="picona" style="width:22px;height:22px;border-radius:7px">'+
            svg(p.icona||T.ic).replace('<svg','<svg style="width:12px;height:12px"')+'</span>'+
          '<span class="sep"></span>'+
          (isLock(p)? '<span class="lockchip">'+svg('lock')+'</span>':'')+
          (nuoveN? '<span class="unread">'+svg('bell')+nuoveN+'</span>':'')+
          '<span class="prio '+p.prio+'">'+PRIO[p.prio]+'</span></div>'+
        '<div class="tile-top"><div style="flex:1;min-width:0"><div class="cli">'+esc(p.cliente)+'</div><h3>'+esc(p.nome)+'</h3></div></div>'+
        '<div class="pips">'+FZ(p).map((f,i)=>'<i class="pip '+(i<p.avanz?'done':i===p.avanz?'now':'')+'"></i>').join('')+'</div>'+
        '<div class="tile-meta">'+(p.completato
          ? '<span class="chip fatto">'+svg('check')+'Completato</span>'
          : '<span class="chip '+(p.avanz===FZ(p).length-1?'ok':'now')+'">'+FZ(p)[p.avanz].nome+'</span>')+
        '<span class="sep"></span>'+
        '<span class="av-stack">'+p.team.slice(0,4).map(id=>av(U(id),'sm')).join('')+'</span></div>'+
        '<div class="tile-meta" style="margin-top:9px">'+
          '<span class="chip '+s.c+'">'+svg('clock')+s.t+'</span>'+
          '<span class="sep"></span>'+
          (p.allegati && p.allegati.length? '<span style="font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:3px">'+
            svg('clip').replace('<svg','<svg style="width:11px;height:11px"')+p.allegati.length+'</span>':'')+
        '</div></button>';
}

function renderHome(){
  const lista = listaProgetti(), sp = SPZ();
  let h = '<div class="pane'+(sp && sp.sfondo?' con-sfondo':'')+'"'+
          (sp && sp.sfondo? ' style="--bg-img:url(\''+sp.sfondo+'\')"':'')+'>';
  h += barraOspite();
  if(suTelefono()) h += testataTelefono();
  h += intestazioneSpazio(lista);

  if(state.vista==='note'){
    h += renderBacheca();
  } else if(state.vista==='lista'){
    h += renderLista(lista);
  } else if(state.vista==='tessere'){
    h += '<div class="scroller">';
    h += segmenti();
    if(!lista.length) h += vuotoPerche();
    gruppiDi(lista).forEach(g=>{
      if(!g.ps.length) return;
      h += '<div class="gruppo-tiles" style="--gc:'+g.c+'"><div class="gruppo-h">'+
        '<span class="pallo"></span><h3>'+g.nome+'</h3>'+
        '<span class="n">'+g.ps.length+(g.ds? ' · '+g.ds:'')+'</span></div><div class="tiles">'+
        g.ps.map(tessera).join('')+'</div></div>';
    });
    h += '</div>';
  } else if(state.vista==='calendario'){
    h += renderCal(lista);
  } else {
    h += renderMappa();
  }
  h += '</div>';
  el('stage').innerHTML = h;
  const qi = el('q'); if(qi && qi.value!==state.filtro) qi.value = state.filtro;
  if(state.vista==='mappa') montaMappa();
  else if(mappaLeaflet){ try{ mappaLeaflet.remove(); }catch(e){} mappaLeaflet = null; }
}

function renderCal(lista){
  const m = state.meseCal, anno = m.getFullYear(), mese = m.getMonth();
  const nomeMese = m.toLocaleDateString('it-IT',{month:'long'});
  const primo = new Date(anno,mese,1);
  let start = new Date(primo); start.setDate(1 - ((primo.getDay()+6)%7));
  const oggi = '2026-09-22';
  let h = '<div class="cal-head" style="padding-top:0">'+
    '<span class="count">Consegne e giornate di ripresa</span>'+
    '<div class="cal-nav"><button class="iconbtn" data-action="mese" data-d="-1" title="Mese precedente">'+svg('left')+'</button>'+
      '<h2 class="cal-title">'+nomeMese+' <span>'+anno+'</span></h2>'+
      '<button class="iconbtn" data-action="mese" data-d="1" title="Mese successivo">'+svg('right')+'</button></div>'+
    '<div style="justify-self:end"><button class="btn sm" data-action="oggi">Oggi</button></div></div>';
  h += '<div class="cal-wrap"><div class="cal">';
  ['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'].forEach(d=> h+='<div class="dow">'+d+'</div>');
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    const fuori = d.getMonth()!==mese, wk = d.getDay()===0||d.getDay()===6;
    const quanti = lista.reduce((n,p)=>n+(p.eventi||[]).filter(e=>e.d===iso).length,0);
    h += '<div class="day'+(fuori?' out':'')+(wk&&!fuori?' wknd':'')+(iso===oggi?' today':'')+
      (quanti?' ha-eventi':'')+'" data-iso="'+iso+'">'+
      '<span class="n">'+d.getDate()+'</span><div class="evs">';
    lista.forEach(p=> (p.eventi||[]).forEach((e,ix)=>{
      if(e.d===iso) h += '<div class="ev" role="button" tabindex="0"'+
        ' style="--acc:'+p.col+'" data-action="apri" data-id="'+p.id+'" data-p="'+p.id+'" data-i="'+ix+'"'+
        ' title="'+esc(p.cliente+' — '+e.t)+(isLock(p)?' (bloccato)':' — trascinabile, tasto destro per le opzioni')+'">'+
        (isLock(p)? svg('lock').replace('<svg','<svg style="width:9px;height:9px;flex:none"') : '')+
        '<b>'+esc(p.cliente)+'</b> '+esc(e.t)+'</div>';
    }));
    h += '</div></div>';
  }
  h += '</div></div>';
  return h;
}

/* ============ PROGETTO ============ */
/* Avanzamento fase: cerchio o tasto COMPLETATO.
   compatto = versione inline per tablet e telefono, dove la colonna di sinistra non c'è. */
function avanzamentoHTML(p,pct,F,R,C,compatto){
  if(p.completato){
    return (compatto?'':'<div class="lbl">Progetto</div>')+
      '<div class="chip fatto" style="font-size:12px;padding:6px 12px">'+svg('check')+'COMPLETATO</div>'+
      '<button class="btn sm ghost" style="'+(compatto?'':'margin-top:10px;width:100%;')+'justify-content:center" data-action="riapri-progetto" data-pid="'+p.id+'">'+
        svg('undo')+'Riapri il progetto</button>';
  }
  if(pct===100){
    const ultima = p.fase >= FZ(p).length-1;
    const nota = ultima? 'Chiude il progetto e ti riporta ai progetti. Si riapre quando vuoi.'
                       : 'Passa alla fase <b>'+esc(FZ(p)[p.fase+1].nome)+'</b>.';
    return (compatto?'':'<div class="lbl">'+esc(F.nome)+' al 100%</div>')+
      '<button class="btn-completa" data-action="completa" data-pid="'+p.id+'" title="'+(ultima?'Chiude il progetto':'Passa alla fase successiva')+'">'+
        svg('check',3)+'COMPLETATO</button>'+
      '<div class="nota-completa" style="font-size:11px;color:var(--mute);margin-top:8px;line-height:1.4">'+nota+'</div>';
  }
  return (compatto?'':'<div class="lbl">Avanzamento fase</div>')+
    '<div class="ring-wrap"><svg class="ring" viewBox="0 0 56 56"><circle class="bgc" cx="28" cy="28" r="'+R+'"/>'+
    '<circle class="fg" cx="28" cy="28" r="'+R+'" stroke-dasharray="'+(C*pct/100)+' '+C+'" transform="rotate(-90 28 28)"/></svg>'+
    '<div><div class="ring-n mono">'+pct+'%</div><div style="font-size:11px;color:var(--mute)">'+esc(F.nome)+'</div></div></div>';
}

function renderProgetto(){

      '<button class="btn sm" data-action="riapri-progetto" data-pid="'+p.id+'">'+svg('undo')+'Riapri</button></div>';

      '<button class="btn sm" data-action="esci-ospite">'+svg('undo')+'Torna al mio archivio</button></div>';

      '<span class="prio '+p.prio+'">'+PRIO[p.prio]+'</span>'+

    '</div></div>';

  h += '<div class="proj'+(state.showFeed?' show-feed':'')+(state.railOn?' rail-on':'')+'">'+

  /* rail sinistra */

      pen('proj','tipo')+'</div>'+
    '<div class="kv"><span>Priorità</span><span class="prio '+p.prio+'">'+PRIO[p.prio]+'</span>'+

    kv('Consegna',p.consegna,'consegna')+kv('Fattura',p.fattura,'fattura')+
    '<div class="chip '+sc.c+'" style="margin-top:8px">'+svg('clock')+sc.t+'</div>'+
    '<div style="margin-top:10px" class="editabile"><div class="lbl" style="display:flex;align-items:center;gap:4px">Indirizzo'+pen('proj','indirizzo')+'</div>'+
      '<div class="nota-box">'+svg('pin').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-1px;margin-right:4px;color:var(--amber-ink)"')+
      (p.indirizzo? esc(p.indirizzo) : '<span style="color:var(--mute)">da definire</span>')+'</div></div>'+
    '</div>';
  {
    h += '<div class="rail-sec editabile"><div class="lbl" style="display:flex;align-items:center;gap:4px">Note e allegati'+pen('proj','nota')+'</div>'+
      (p.nota? '<div class="nota-box" style="margin-bottom:9px">'+p.nota+'</div>'
             : '<div class="nota-box" style="margin-bottom:9px;color:var(--mute)">Nessuna nota.</div>')+
      (p.allegati||[]).map(a=>'<div class="file" style="margin-bottom:6px"><span class="ic">'+svg('file')+'</span>'+
        '<span class="nm">'+esc(a.nome)+'</span><span class="sz">'+fmtSize(a.size)+'</span></div>').join('')+
      '</div>';

/* la prossima subtask aperta: prima le mie, poi quelle di chiunque */
function prossimaCosa(p){
  const mie = [], altre = [];
  p.subs.forEach(t=>{
    if(t.fase < p.fase) return;               // fasi gia chiuse
    t.items.forEach((it,i)=>{
      if(it.done) return;
      const voce = {t, it, i, fase:t.fase, mia:(t.assegnato===state.utente)};
      (voce.mia? mie : altre).push(voce);
    });
  });
  const ordina = a => (a.fase!==p.fase? 1:0);
  mie.sort((a,b)=>ordina(a)-ordina(b)||a.fase-b.fase);
  altre.sort((a,b)=>ordina(a)-ordina(b)||a.fase-b.fase);
  return {voce: mie[0] || altre[0] || null, mie: mie.length, tutte: mie.length+altre.length};
}

function barraProssima(p){
  if(p.completato) return '';
  const {voce, mie, tutte} = prossimaCosa(p);
  if(!voce){
    return '<div class="prossima calma"><span class="ic">'+svg('check',3)+'</span>'+
      '<span class="tx"><span class="lb">Tutto spuntato</span>'+
      '<b>Non resta niente da fare in questo progetto</b>'+
      '<span>Puoi avanzare di fase o chiuderlo.</span></span></div>';
  }
  const dove = FZ(p)[voce.fase] ? FZ(p)[voce.fase].nome : '';
  return '<div class="prossima"><span class="ic">'+svg('spark',2.4)+'</span>'+
    '<span class="tx"><span class="lb">'+(voce.mia? 'Tocca a te' : 'Prossima cosa da fare')+'</span>'+
    '<b>'+esc(voce.it.t)+'</b>'+
    '<span>in <b style="display:inline;font-size:11.5px">'+esc(voce.t.titolo)+'</b> · fase '+esc(dove)+
      ' · '+esc(U(voce.t.assegnato||p.team[0]).nome.split(' ')[0])+
      (mie? ' · '+mie+' assegnate a te' : '')+' · '+tutte+' aperte in tutto</span></span>'+
    '<span class="az">'+
      (voce.fase!==p.fase? '<button class="btn sm" data-action="fase" data-i="'+voce.fase+'">Vai alla fase</button>':'')+
      '<button class="btn sm" data-action="mostra-task" data-id="'+voce.t.id+'">Mostrala</button>'+
      '<button class="btn sm primary" data-action="check" data-id="'+voce.t.id+'" data-i="'+voce.i+'">'+svg('check')+'Fatto</button>'+
    '</span></div>';
}

function msg(u,c){
  return '<div class="msg">'+av(u,'sm')+'<div class="bd"><div class="hd"><span class="nm">'+esc(u.nome.split(' ')[0])+'</span><span class="ts">'+c.ts+'</span></div>'+
    '<div class="tx">'+c.tx+'</div></div></div>';
}
function kv(k,v,campo){
  const val = (v==null || v==='') ? '\u2014' : v;
  return '<div class="kv"><span>'+k+'</span><b>'+esc(val)+'</b>'+(campo? pen('proj',campo):'')+'</div>';
}
const MONO = {call:1,girato:1,schede:1,versione:1,note:1,tc:1,lufs:1,consegna:1};
function specs(p,f){
  const fase = FZ(p)[f] || {};
  const campi = fase.campi || [['Consegna','consegna'],['Budget','budget'],['Referente','referente'],['Note aperte','note']];
  return campi.map(c => [c[0], (p[c[1]]==null||p[c[1]]==='')?'—':p[c[1]], MONO[c[1]]?1:0, c[1]]);
}

/* Il tasto del cassetto: dice a colpo d'occhio se c'e' qualcosa da leggere,
   cosi' si capisce se vale la pena aprirlo. */
function totaleNonLetti(p){
  const nl = nonLetti(p);
  return (nl.commenti||0) + (nl.chat||0) + (nl.attivita||0);

function tastoFeed(p){

/* ============ SPAZI DI LAVORO ============ */
const SPZ = () => state.spazi.find(x=>x.id===state.spazioId) || state.spazi[0];
/* In locale l'archivio e' mio e vedo tutto. In cloud lo strato Supabase
   mette a false questa variabile quando entro come collaboratore di un altro. */
let sonoTitolare = true;
/* Nel cloud e' il database a decidere cosa mi arriva: qui resta solo la
   domanda "questo spazio e' mio?", per non mostrare scatole vuote altrui. */
let spazioMio = () => true;
/* un progetto di un altro non lo riorganizzo: lo lascio dov'e' */
let mioProgetto = () => true;
const IO = () => state.utente;
/* Chi non è il titolare dell'archivio vede solo i progetti in cui è nel team
   o è taggato su una task: gli altri lavori non lo riguardano. */
function vedeProgetto(p){
  if(sonoTitolare) return true;                             // il titolare vede tutto
  if((p.team||[]).indexOf(state.utente) >= 0) return true;
  return (p.subs||[]).some(s => (s.taggati||[]).some(x => x.u === state.utente));
}
function progettiDi(sid){ return state.progetti.filter(p=>p.spazio===sid && vedeProgetto(p)); }
/* Al collaboratore non mostro gli spazi in cui non ha nessun progetto:
   sarebbero scatole vuote di lavori che non lo riguardano. */
function spaziVisibili(){
  return state.spazi.filter(sp => spazioMio(sp) || progettiDi(sp.id).length > 0);
}

function saluto(){
  const o = new Date().getHours();
  if(o<5) return 'Buonanotte';
  if(o<12) return 'Buongiorno';
  if(o<18) return 'Buon pomeriggio';
  return 'Buonasera';
}
/* ---------- LA PRIMA COSA DA FARE ----------
   In home non basta dire quante notifiche ci sono: deve dire da dove partire,
   e portarci con un tocco. L'ordine è quello che userebbe una persona:
   prima quello che è già scaduto, poi quello che si chiude con un clic,
   poi quello che tocca a te, e solo alla fine il resto. */
function primaCosa(){
  const attivi = state.progetti.filter(p=>!p.completato && vedeProgetto(p));
  if(!attivi.length) return null;
  const g = p => { const q = giorniA(p.consegna); return q==null? 9999 : q; };
  const ord = attivi.slice().sort((a,b)=> g(a)-g(b) || (PESO[a.prio]-PESO[b.prio]));
  const dove = p => (state.spazi.find(x=>x.id===p.spazio)||{}).nome || '';
  const quando = p => { const q = g(p); if(q===9999) return 'senza data';
    if(q<0) return 'scaduto da '+(-q)+(q===-1?' giorno':' giorni');
    if(q===0) return 'consegna oggi'; if(q===1) return 'consegna domani';
    return 'tra '+q+' giorni'; };

  /* 1 — una fase è al 100%: è a un clic dalla chiusura */
  for(const p of ord){
    if(prog(p, p.fase) === 100){
      const ultima = p.fase >= FZ(p).length-1;
      return {urg: g(p)<=1, lb: ultima? 'Pronto da consegnare' : 'Pronto ad avanzare',
        tx: esc(p.nome), sub: FZ(p)[p.fase].nome+' è al 100% — '+(ultima?'premi COMPLETATO e il lavoro è chiuso':'la fase successiva è '+FZ(p)[p.fase+1].nome)+' · '+dove(p)+' · '+quando(p),
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'">'+svg('right')+'Aprilo</button>'};
    }
  }
  /* 2 — qualcosa assegnato a me, nel progetto più urgente */
  for(const p of ord){
    const {voce, mie} = prossimaCosa(p);
    if(voce && voce.mia){
      return {urg: g(p)<=1, lb:'Tocca a te',
        tx: esc(voce.it.t), sub:'in '+esc(voce.t.titolo)+' · '+esc(p.nome)+' · '+dove(p)+' · '+quando(p)+(mie>1? ' · altre '+(mie-1)+' assegnate a te':''),
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'" data-sid="'+voce.t.id+'">'+svg('right')+'Portami lì</button>'};
    }
  }
  /* 3 — il lavoro più vicino alla consegna, chiunque lo stia facendo */
  for(const p of ord){
    const {voce, tutte} = prossimaCosa(p);
    if(voce){
      return {urg: g(p)<=1, lb: g(p)<0? 'In ritardo' : 'Il più urgente',
        tx: esc(p.nome), sub:'prossima: '+esc(voce.it.t)+' · '+esc(U(voce.t.assegnato||p.team[0]).nome.split(' ')[0])+' · '+dove(p)+' · '+quando(p)+' · '+tutte+' cose aperte',
        az:'<button class="btn primary" data-action="vai-primo" data-pid="'+p.id+'" data-sid="'+voce.t.id+'">'+svg('right')+'Portami lì</button>'};
    }
  }
  return null;
}

/* ---------- DOVE MI HANNO TAGGATO ----------
   La prima domanda di chi apre l'app dal telefono \u00e8 sempre la stessa:
   qualcuno mi ha cercato? Rispondo prima di tutto il resto. */
function taggatoSu(){
  const out = [];
  state.progetti.forEach(p=>{
    if(p.completato || !vedeProgetto(p)) return;
    (p.subs||[]).forEach(s=>{
      if((s.taggati||[]).some(x=>x && x.u===state.utente)) out.push({p, s, tipo:'tag'});
      (s.items||[]).forEach(i=>{ if(i && i.ass===state.utente && !i.done) out.push({p, s, i, tipo:'sub'}); });
    });
  });
  return out;
}

function benvenuto(){

  const attivi = state.progetti.filter(p=>!p.completato).length;
  let mie = 0;
  state.progetti.forEach(p=>{ if(p.completato) return;
    p.subs.forEach(t=>{ if(t.assegnato===state.utente) t.items.forEach(i=>{ if(!i.done) mie++; }); }); });

  return '<div class="benvenuto"><div class="benv">'+
    '<span class="campana'+(nuove?'':' zero')+'">'+svg(nuove?'bell':'check')+

function riduciImmagine(file, maxLato, qualita){
  return new Promise((ok, ko)=>{
    const r = new FileReader();
    r.onerror = ko;
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ko;
      img.onload = ()=>{
        const sc = Math.min(1, maxLato/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', qualita));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function copiaVecchioModo(testo, ok){
  try{
    const a = document.createElement('textarea');
    a.value = testo; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); ok();
  }catch(e){ toast('Copialo a mano dal riquadro.','warn','Copia non riuscita'); }
}
function leggiIndirizzo(){
  const h = location.hash || '';
  const sp = /^#\/s\/([^\/?]+)/.exec(h);
  if(sp) return {spid:sp[1], ospite:/[?&]v=1/.test(h)};
  const m = /^#\/p\/([^\/?]+)(?:\/t\/([^?]+))?/.exec(h);
  if(!m) return null;
  return {pid:m[1], sid:m[2]||null, ospite:/[?&]v=1/.test(h)};
}
function applicaIndirizzo(){
  const a = leggiIndirizzo(); if(!a) return false;
  if(a.spid){
    const sp = state.spazi.find(x=>x.id===a.spid);
    if(!sp){ toast('Il link punta a uno spazio che non è in questo archivio.','warn','Non trovato'); return false; }
    state.ospite = !!a.ospite;
    state.spazioId = sp.id; state.schermo = 'home'; state.progettoId = null;
    state.filtro = ''; state.filtroAttivo = null;
    render(); return true;
  }
  const p = state.progetti.find(x=>x.id===a.pid);
  if(!p){ toast('Il link punta a un progetto che non è in questo archivio.','warn','Non trovato'); return false; }
  state.ospite = !!a.ospite;
  if(p.spazio) state.spazioId = p.spazio;
  state.progettoId = p.id; state.schermo = 'progetto';
  if(a.sid){
    const s = p.subs.find(x=>x.id===a.sid);
    if(s){ p.fase = Math.min(s.fase, p.avanz); s.aperto = true; state.taskEvidenziata = s.id; }
  }
  render(); introProgetto();
  if(state.taskEvidenziata) setTimeout(()=>flash('#sub_'+state.taskEvidenziata), 200);
  return true;
}

/* trascinamento e ridimensionamento dei post-it */
let notaTrascinata = null, notaRidim = null;
const NOTA_W = 186, NOTA_H = 150;   /* il massimo è il doppio, non di più */
document.addEventListener('pointerdown', function(e){
  const g = e.target.closest && e.target.closest('.grip');
  if(g && !state.ospite){
    const box = g.closest('.postit');
    const n = (SPZ().note||[]).find(x=>x.id===g.dataset.grip);
    if(n){
      notaRidim = {n, box, x0:e.clientX, y0:e.clientY, w0:box.offsetWidth, h0:box.offsetHeight};
      staTrascinando = true;
      box.classList.add('trascino');
      g.setPointerCapture && g.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    return;
  }
  const pit = e.target.closest && e.target.closest('.postit');
  if(!pit || state.ospite) return;
  if(e.target.closest('textarea') || e.target.closest('.via')) return;
  const rr = pit.getBoundingClientRect();          // angolo in basso a destra: lo lascio al ridimensionamento
  if(e.clientX > rr.right-20 && e.clientY > rr.bottom-20) return;
  const sp = SPZ(); const n = (sp.note||[]).find(x=>x.id===pit.dataset.nota); if(!n) return;
  notaTrascinata = {n, pit, dx:e.clientX - pit.offsetLeft, dy:e.clientY - pit.offsetTop};
  staTrascinando = true;
  pit.classList.add('trascino');
  pit.setPointerCapture && pit.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', function(e){
  if(notaRidim){
    const w = Math.max(NOTA_W, Math.min(NOTA_W*2, notaRidim.w0 + (e.clientX - notaRidim.x0)));
    const hh = Math.max(NOTA_H, Math.min(NOTA_H*2, notaRidim.h0 + (e.clientY - notaRidim.y0)));
    notaRidim.box.style.width = w+'px';
    notaRidim.box.style.height = hh+'px';
    notaRidim.ultimo = {w, hh};
    return;
  }
  if(!notaTrascinata) return;
  const b = el('bacheca'); if(!b) return;
  const r = b.getBoundingClientRect(), w = notaTrascinata.pit.offsetWidth, hh = notaTrascinata.pit.offsetHeight;
  let x = e.clientX - notaTrascinata.dx, y = e.clientY - notaTrascinata.dy;
  x = Math.max(0, Math.min(r.width - w, x));
  y = Math.max(0, Math.min(Math.max(0, r.height - hh), y));
  notaTrascinata.pit.style.left = x+'px';
  notaTrascinata.pit.style.top  = y+'px';
  notaTrascinata.ultimo = {x, y};
});
document.addEventListener('pointerup', function(){
  if(notaRidim){
    const {n, box, ultimo} = notaRidim;
    box.classList.remove('trascino');
    if(ultimo){ n.w = Math.round(ultimo.w); n.h = Math.round(ultimo.hh); save(); }
    notaRidim = null;
    return;
  }
  if(!notaTrascinata) return;
  const {n, pit, ultimo} = notaTrascinata;
  pit.classList.remove('trascino');
  if(ultimo){ n.x = Math.round(ultimo.x); n.y = Math.round(ultimo.y); }
  n.w = Math.round(pit.offsetWidth); n.h = Math.round(pit.offsetHeight);
  save();
  notaTrascinata = null;
});
/* il ridimensionamento nativo va salvato anche senza trascinamento */
if(window.ResizeObserver){
  var osservaNote = new ResizeObserver(entries=>{
    if(state.vista!=='note') return;
    let cambiato = false;
    entries.forEach(e=>{
      const id = e.target.dataset.nota, sp = SPZ();
      const n = sp && (sp.note||[]).find(x=>x.id===id);
      if(!n) return;
      const w = Math.round(e.contentRect.width)+26, h = Math.round(e.contentRect.height)+42;
      if(n.w!==w || n.h!==h){ n.w = w; n.h = h; cambiato = true; }
    });
    if(cambiato){ clearTimeout(window.__tRes); window.__tRes = setTimeout(()=>save(), 500); }
  });
}
document.addEventListener('dblclick', function(e){
  if(state.vista!=='note' || state.ospite) return;
  const b = e.target.closest && e.target.closest('.bacheca');
  if(!b || e.target.closest('.postit')) return;
  const r = b.getBoundingClientRect();
  nuovaNota(Math.max(0, e.clientX - r.left - 98), Math.max(0, e.clientY - r.top - 40));
});

const px = (c,w,h) => ({
  x: ((c[1]-BOX.lng0)/(BOX.lng1-BOX.lng0))*w,

    (p.subs||[]).forEach(s=>{ if(s.coord) out.push({p, s, coord:s.coord, nome:s.titolo, sotto:s.luogo||p.cliente, tipo:'task'}); });

}

/* ---------- LA MAPPA VERA ----------
   Se la libreria della mappa è arrivata disegno Milano com'è, con le strade.
   Se non è arrivata (offline, o rete lenta) resta lo schema: meglio qualcosa
   che una scatola vuota. */
let mappaLeaflet = null, mappaSegni = [];
function montaMappa(){
  const box = el('mappaBox'); if(!box) return;
  const L = luoghi();
  avviaGeocodifica();
  if(!window.L){ box.innerHTML = mappaSchema(L); return; }

  if(mappaLeaflet){ try{ mappaLeaflet.remove(); }catch(e){} mappaLeaflet = null; }
  box.innerHTML = '';
  const scuro = tema()==='dark';
  mappaLeaflet = window.L.map(box, {zoomControl:true, attributionControl:true, scrollWheelZoom:true})
    .setView([45.4642, 9.1900], 11);
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(mappaLeaflet);
  box.classList.toggle('mappa-scura', scuro);

  mappaSegni = [];
  L.forEach((l,i)=>{
    const ic = window.L.divIcon({className:'segno', html:'<span style="--acc:'+l.p.col+'">'+(i+1)+'</span>',
                                 iconSize:[26,26], iconAnchor:[13,13]});
    const m = window.L.marker(l.coord, {icon:ic}).addTo(mappaLeaflet);
    m.bindPopup('<b>'+esc(l.nome)+'</b><br>'+esc(l.sotto||'')+

      (l.s?' data-sid="'+l.s.id+'"':'')+'>Apri il progetto</a>');
    mappaSegni.push(m);
  });
  if(L.length === 1) mappaLeaflet.setView(L[0].coord, 14);
  else if(L.length) mappaLeaflet.fitBounds(L.map(l=>l.coord), {padding:[40,40], maxZoom:14});
  setTimeout(()=>{ if(mappaLeaflet) mappaLeaflet.invalidateSize(); }, 80);
}
function vaiAlSegno(i){
  const L = luoghi(); if(!L[i]) return;
  if(mappaLeaflet){ mappaLeaflet.setView(L[i].coord, 15); if(mappaSegni[i]) mappaSegni[i].openPopup(); }
}

/* ---------- DALL'INDIRIZZO AL PUNTO SULLA MAPPA ----------
   Chiedo le coordinate una volta sola e me le tengo nel progetto: dalla
   seconda volta la mappa si disegna senza chiedere niente a nessuno. */
function daGeocodificare(){
  return state.progetti.filter(p => p.indirizzo && p.indirizzo.trim() && !p.coord && !p.senzaCoord);
}
let geoInCorso = false;
function avviaGeocodifica(){
  if(geoInCorso || !window.fetch) return;
  const da = daGeocodificare(); if(!da.length) return;
  geoInCorso = true;
  const passo = (k)=>{
    if(k >= da.length){ geoInCorso = false; save(); if(state.vista==='mappa') render(); return; }
    const p = da[k];
    const q = /milan|\(mi\)|italia/i.test(p.indirizzo) ? p.indirizzo : p.indirizzo+', Milano, Italia';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))
      .then(r=>r.json())
      .then(d=>{
        if(d && d[0]) p.coord = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
        else p.senzaCoord = true;
      })
      .catch(()=>{ p.senzaCoord = true; })
      .then(()=>{ setTimeout(()=>passo(k+1), 1100); });   // una richiesta al secondo: sono le loro regole
  };
  passo(0);
}

/* lo schema di riserva, quando la mappa vera non è disponibile */
function mappaSchema(L){
  const W = 1000, H = 640;
  const px = (c)=>({ x:(c[1]-9.19)*1000/0.30*1 + W/2, y:H/2 - (c[0]-45.4642)*640/0.16 });
  let h = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+
    '<rect width="'+W+'" height="'+H+'" fill="var(--surface-2)"/>'+
    '<ellipse cx="500" cy="330" rx="330" ry="250" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 6"/>'+
    '<ellipse cx="500" cy="330" rx="150" ry="115" fill="none" stroke="var(--line)" stroke-width="2"/>'+
    '<text x="500" y="334" text-anchor="middle" font-family="Sora" font-size="13" font-weight="700" fill="var(--mute)">DUOMO</text>';
  L.forEach((l,i)=>{
    const q = px(l.coord);
    const x = Math.max(24, Math.min(W-24, q.x)), y = Math.max(24, Math.min(H-24, q.y));
    h += '<g class="pin" style="--acc:'+l.p.col+'" data-action="'+(l.s?'vai-task':'apri')+'" data-id="'+l.p.id+'"'+
         (l.s?' data-sid="'+l.s.id+'"':'')+'>'+
      '<title>'+esc(l.nome+' — '+(l.sotto||''))+'</title>'+
      '<circle class="alone" cx="'+x+'" cy="'+y+'" r="26"/>'+
      '<path class="corpo" d="M'+x+' '+(y+16)+' c-9-11-14-17-14-24 a14 14 0 1 1 28 0 c0 7-5 13-14 24 z"/>'+
      '<text x="'+x+'" y="'+(y-3)+'" text-anchor="middle">'+(i+1)+'</text></g>';
  });
  return h+'</svg>';
}

function apriProgetto(id, conDissolvenza){

  if(p.spazio && p.spazio!==state.spazioId) state.spazioId = p.spazio;   // segue il progetto nel suo spazio

    state.progettoId = p.id; state.schermo='progetto'; state.showFeed=false; state.railOn=false; state.drawer=false;
    render(); introProgetto();
  };

    '<div class="cli">'+esc(p.cliente)+'</div><h2>'+esc(p.nome)+'</h2>'+

}

function introProgetto(){
  const p = PROJ(); if(!p) return;
  const c = document.querySelector('.ring .fg'), n = document.querySelector('.ring-n');
  if(c){
    const fin = c.getAttribute('stroke-dasharray'), C = fin.split(' ')[1];
    c.style.transition = 'none'; c.setAttribute('stroke-dasharray','0 '+C);
    requestAnimationFrame(()=>{ c.style.transition=''; c.setAttribute('stroke-dasharray',fin); });
  }
  if(n){
    const target = prog(p,p.fase); let t0 = null;
    n.textContent = '0%';
    const step = ts => { if(!t0) t0 = ts;
      const k = Math.min(1,(ts-t0)/950);
      n.textContent = Math.round(target*(1-Math.pow(1-k,3)))+'%';
      if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const st = el('step'+p.fase);
  if(st){ st.classList.remove('pulse-once'); void st.offsetWidth; st.classList.add('pulse-once');
    setTimeout(()=>st.classList.remove('pulse-once'), 1500); }
}

/* usata dagli eventi reali quando il team sarà collegato al database */
function scattaEvento(manuale){
  if(state.schermo==='gate') return;
  const e = EVENTI_RT[rtIdx++ % EVENTI_RT.length];
  const pr = state.progetti.find(x=>x.id===e.p);
  if(pr && state.cfg.soloMiei && !pr.team.includes(state.utente) && !manuale) return;

  /* l'evento lascia un segno vero nel progetto: i pallini rossi crescono */
  if(pr){
    const ts = 'oggi '+oraOra();
    if(e.dove==='commenti'){ (pr.commenti[e.f] = pr.commenti[e.f]||[]).push({u:e.u, tx:e.msg, ts}); }
    else if(e.dove==='chat'){ pr.chat.push({u:e.u, tx:e.msg, ts}); }
    else { logga(pr, e.msg, true); }
  }
  notifica('<b>'+e.tit+'</b> — '+e.tx, e.p, e.f, e.ic);
  if(state.schermo==='progetto') render();

  if(!state.cfg.boxFull){ toast(e.tit,'info','Nuova notifica'); return; }
  if(Date.now() < state.snoozeFino){
    const min = Math.ceil((state.snoozeFino-Date.now())/60000);
    toast(e.tit+' — box riattivi tra '+min+' min.','info','Notifica silenziata');
    return;
  }
  alertGrande(Object.assign({prog: pr? pr.cliente+' · '+pr.nome : ''}, e));
}

/* ============ ANIMAZIONE DELLE TESSERE ============ */
/* prendo le posizioni prima, ridisegno, e le riporto indietro per farle scivolare al posto nuovo */
function animaTessere(cambia){
  const ridotto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(ridotto || state.vista!=='tessere'){ cambia(); return; }
  const prima = {};
  document.querySelectorAll('.tile[data-id]').forEach(n=>{ prima[n.dataset.id] = n.getBoundingClientRect(); });
  cambia();
  const nuove = document.querySelectorAll('.tile[data-id]');
  if(!nuove.length) return;
  requestAnimationFrame(()=>{
    nuove.forEach((n,i)=>{
      const p0 = prima[n.dataset.id];
      if(p0){
        const p1 = n.getBoundingClientRect();
        const dx = p0.left - p1.left, dy = p0.top - p1.top;
        if(Math.abs(dx)>1 || Math.abs(dy)>1){
          n.style.transition = 'none';
          n.style.transform = 'translate('+dx+'px,'+dy+'px)';
          requestAnimationFrame(()=>{
            n.style.transition = 'transform .46s cubic-bezier(.2,.85,.25,1)';
            n.style.transform = '';
            setTimeout(()=>{ n.style.transition=''; }, 500);
          });
        }
      } else {
        n.style.animation = 'entraTessera .42s cubic-bezier(.2,.9,.3,1) backwards';
        n.style.animationDelay = Math.min(i*26, 260)+'ms';
        setTimeout(()=>{ n.style.animation=''; n.style.animationDelay=''; }, 800);
      }
    });
  });
}

/* ============ TUTTO EDITABILE ============ */
const CAMPI = {
  nome:{l:'Titolo del progetto'}, cliente:{l:'Cliente'}, budget:{l:'Budget'}, durata:{l:'Durata finale'},
  deliverable:{l:'Deliverable'}, referente:{l:'Referente'}, giornate:{l:'Giornate'}, call:{l:'Call time'},
  location:{l:'Location'}, troupe:{l:'Troupe'}, girato:{l:'Girato'}, schede:{l:'Schede'},
  backup:{l:'Backup'}, versione:{l:'Versione'}, note:{l:'Note aperte'}, tc:{l:'Ultimo timecode'},
  approv:{l:'Approvazione'}, formato:{l:'Formato'}, lufs:{l:'Loudness'}, fattura:{l:'Fattura'},
  consegna:{l:'Data di consegna', tipo:'data'}, indirizzo:{l:'Indirizzo del lavoro'},
  tipo:{l:'Tipo di progetto', tipo:'opt', opt:()=>Object.keys(TIPI).map(k=>[k,TIPI[k].n])},
  tags:{l:'Tag (separati da virgola)'},
  icona:{l:'Icona del progetto', tipo:'opt', opt:()=>ICONE_PROG.map(i=>[i,i])},
  prio:{l:'Priorità', tipo:'opt', opt:()=>Object.keys(PRIO).map(k=>[k,PRIO[k]])},
  nota:{l:'Note del progetto', tipo:'rte'}
};
const pen = (t,k,id,i,fisso) => '<button class="pen'+(fisso?' fisso':'')+'" data-action="edit" data-t="'+t+'"'+
  ' data-k="'+(k||'')+'" data-id="'+(id||'')+'" data-i="'+(i==null?'':i)+'" title="Modifica">'+svg('pen',2.2)+'</button>';

let editCtx = null, menzionatiOra = null;
const Pdi = ctx => (ctx && ctx.pid ? state.progetti.find(x=>x.id===ctx.pid) : PROJ());
function apriEdit(ctx){
  const p = Pdi(ctx); if(!p) return;
  editCtx = ctx; menzionatiOra = null;
  let etichetta = ctx.l, valore = '', tipo = ctx.tipo||'testo', opzioni = null;

  if(ctx.t==='proj'){
    const c = CAMPI[ctx.k]||{l:ctx.k};
    etichetta = c.l; tipo = c.tipo||'testo'; valore = p[ctx.k]||'';
    if(c.opt) opzioni = c.opt();
    if(tipo==='data'){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(valore); valore = m? m[3]+'-'+m[2]+'-'+m[1]:''; }
  } else if(ctx.t==='sub'){
    const s = p.subs.find(x=>x.id===ctx.id);
    if(ctx.k==='assegnato'){ etichetta='Responsabile della task'; tipo='utente'; valore=s.assegnato; }
    else if(ctx.k==='nota'){ etichetta='Nota della task'; tipo='rte'; valore=s.nota||''; }
    else { etichetta='Nome della task'; valore = s.titolo; }
  } else if(ctx.t==='tag'){
    const s = p.subs.find(x=>x.id===ctx.id);
    const x = taggatiOk(s)[ctx.i];
    etichetta = 'Ruolo di '+U(x.u).nome+' su «'+s.titolo+'»';
    valore = x.ruolo;
  } else if(ctx.t==='item'){
    const s = p.subs.find(x=>x.id===ctx.id);
    etichetta = 'Subtask'; valore = s.items[ctx.i].t;
  } else if(ctx.t==='fase'){
    etichetta = 'Responsabile della fase '+FZ(p)[ctx.i].nome; tipo='utente'; valore = p.faseAss[ctx.i];
  } else if(ctx.t==='evento'){
    etichetta = 'Nome dell\'evento in calendario'; valore = p.eventi[ctx.i].t;
  }

  let campoHtml;
  if(tipo==='utente'){
    campoHtml = '<select id="ed_val">'+state.utenti.map(u=>'<option value="'+u.id+'"'+(u.id===valore?' selected':'')+'>'+
      esc(u.nome)+' — '+esc(u.ruolo)+'</option>').join('')+'</select>';
  } else if(tipo==='opt'){
    campoHtml = '<select id="ed_val">'+opzioni.map(o=>'<option value="'+o[0]+'"'+(o[0]===valore?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  } else if(tipo==='data'){
    campoHtml = '<input id="ed_val" type="date" value="'+valore+'">';
  } else if(tipo==='rte'){
    /* Nella nota di una task si può anche taggare: l'avatar scrive @Nome nel
       testo e mette la persona fra quelle che lavorano alla task. */
    const conTag = (ctx.t==='sub' && ctx.k==='nota');
    campoHtml = '<div class="rte-bar"><button class="rte-b b" data-action="rte" data-c="bold">B</button>'+
      '<button class="rte-b u" data-action="rte" data-c="underline">U</button></div>'+
      '<div class="rte" id="ed_rte" contenteditable="true" data-ph="Scrivi qui…">'+(valore||'')+'</div>'+
      (conTag? '<div class="rte-tag"><span class="lb">Tagga chi ci lavora</span>'+
        taggabili().map(u=>'<button class="tag-av" data-action="menziona" data-u="'+u.id+'" '+
          'data-sid="'+ctx.id+'" title="'+esc(u.nome)+' — '+esc(u.ruolo)+'">'+av(u,'sm')+
          '<span>'+esc(u.nome.split(' ')[0])+'</span></button>').join('')+'</div>' : '');
  } else {
    campoHtml = '<input id="ed_val" value="'+esc(valore)+'">';
  }

  modale('<h3>Modifica</h3><div class="sub-t">'+esc(p.nome)+'</div><div class="modal-b">'+
    '<div class="field"><label>'+esc(etichetta)+'</label>'+campoHtml+'</div></div>'+
    '<div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+
    '<button class="btn primary" data-action="salva-campo">'+svg('check')+'Salva</button></div>');
  setTimeout(()=>{ const n = el('ed_val')||el('ed_rte'); if(n){ n.focus(); if(n.select) n.select(); } },40);
}

function applicaEdit(){
  const ctx = editCtx; if(!ctx) return;
  const p = Pdi(ctx); if(!p) return;
  const n = el('ed_val'), r = el('ed_rte');
  let v = r ? r.innerHTML.replace(/<(?!\/?(b|strong|u|i|em|br|div)\b)[^>]*>/gi,'') : (n? n.value : '');
  if(!r && !String(v).trim() && ctx.k!=='nota'){ toast('Il campo non può restare vuoto.','warn','Manca il valore'); return; }

  if(ctx.t==='proj'){
    const c = CAMPI[ctx.k]||{l:ctx.k};
    if(c.tipo==='data'){ const q = v.split('-'); v = q[2]+'/'+q[1]+'/'+q[0]; }
    snap('Modifica di «'+c.l+'»');
    const prima = p[ctx.k]; p[ctx.k] = v;
    if(ctx.k==='tipo') p.col = TIPI[v].c;
    if(ctx.k==='consegna'){
      const ev = (p.eventi||[]).find(e=>/^consegna/i.test(e.t));
      if(ev){ const q2 = v.split('/'); ev.d = q2[2]+'-'+q2[1]+'-'+q2[0]; }
    }
    azione('<b>'+esc(c.l)+'</b> di '+esc(p.nome)+': «'+esc(String(prima).replace(/<[^>]*>/g,'')).slice(0,40)+'» → «'+esc(String(v).replace(/<[^>]*>/g,'')).slice(0,40)+'»');
    logga(p, esc(c.l)+' aggiornato');
    toast(c.l+' aggiornato.','ok','Modificato');
  } else if(ctx.t==='sub'){
    const s = p.subs.find(x=>x.id===ctx.id);
    if(ctx.k==='nota'){
      snap('Nota di «'+s.titolo+'»');
      s.nota = v;
      (menzionatiOra||[]).forEach(id=>{
        if(taggatiOk(s).some(x=>x.u===id)) return;
        const u = U(id);
        s.taggati.push({u:id, ruolo:u.ruolo||'Collaboratore'});
        if(p.team.indexOf(id)<0) p.team.push(id);
        logga(p,'<b>'+esc(u.nome)+'</b> taggato nella nota di '+esc(s.titolo), true);
        notifica('Sei stato taggato nella nota di <b>'+esc(s.titolo)+'</b>', p.id, s.fase, 'user');
      });
      menzionatiOra = null;
      azione('Nota aggiornata su <b>'+esc(s.titolo)+'</b> — '+esc(p.nome));
      logga(p,'Nota aggiornata su '+esc(s.titolo));
      toast('Nota salvata.','ok','Modificato');
    } else if(ctx.k==='assegnato'){
      snap('Assegnazione di «'+s.titolo+'»');
      s.assegnato = v;
      azione('<b>'+esc(s.titolo)+'</b> assegnato a '+esc(U(v).nome)+' — '+esc(p.nome));
      logga(p, esc(s.titolo)+' assegnato a '+esc(U(v).nome), true);
      notifica('Ti è stato assegnato <b>'+esc(s.titolo)+'</b> su '+esc(p.nome), p.id, s.fase, 'users');
      toast(s.titolo+' → '+U(v).nome,'ok','Assegnato');
    } else {
      snap('Rinomina di «'+s.titolo+'»');
      azione('Task rinominata: «'+esc(s.titolo)+'» → «'+esc(v)+'» — '+esc(p.nome));
      s.titolo = v; logga(p, 'Task rinominata in '+esc(v));
      toast('Task rinominata.','ok','Modificato');
    }
  } else if(ctx.t==='tag'){
    const s = p.subs.find(x=>x.id===ctx.id);
    const x = taggatiOk(s)[ctx.i]; if(!x) return;
    snap('Ruolo di '+U(x.u).nome+' su «'+s.titolo+'»');
    x.ruolo = v || 'Collaboratore';
    azione('<b>'+esc(U(x.u).nome)+'</b> ora è <b>'+esc(x.ruolo)+'</b> su '+esc(s.titolo));
    logga(p,'<b>'+esc(U(x.u).nome)+'</b> ora è '+esc(x.ruolo)+' su '+esc(s.titolo));
  } else if(ctx.t==='item'){
    const s = p.subs.find(x=>x.id===ctx.id);
    snap('Modifica della subtask «'+s.items[ctx.i].t+'»');
    azione('Subtask modificata: «'+esc(s.items[ctx.i].t)+'» → «'+esc(v)+'» — '+esc(p.nome));
    s.items[ctx.i].t = v; logga(p, 'Subtask aggiornata: '+esc(v));
    toast('Subtask aggiornata.','ok','Modificato');
  } else if(ctx.t==='evento'){
    snap('Rinomina dell\'evento «'+p.eventi[ctx.i].t+'»');
    azione('Evento rinominato: «'+esc(p.eventi[ctx.i].t)+'» → «'+esc(v)+'» — '+esc(p.cliente));
    p.eventi[ctx.i].t = v;
    toast('Evento rinominato.','ok','Modificato');
  } else if(ctx.t==='fase'){
    snap('Responsabile della fase '+FZ(p)[ctx.i].nome);
    p.faseAss[ctx.i] = v;
    azione('Fase <b>'+FZ(p)[ctx.i].nome+'</b> assegnata a '+esc(U(v).nome)+' — '+esc(p.nome));
    logga(p, 'Fase '+FZ(p)[ctx.i].nome+' assegnata a '+esc(U(v).nome), true);
    notifica('Sei responsabile della fase <b>'+FZ(p)[ctx.i].nome+'</b> su '+esc(p.nome), p.id, ctx.i, FZ(p)[ctx.i].icon);
    toast(FZ(p)[ctx.i].nome+' → '+U(v).nome,'ok','Fase assegnata');
  }
  editCtx = null; chiudiModale(); render();
}

/* ============ AZIONI ============ */
const PROTETTE = ['edit','salva-campo','check','fase','indietro','riprendi','add-user','assegna',
                  'elimina-progetto','conferma-elimina','sposta-ev','rinomina-ev','elimina-ev',
                  'add-compito','elimina-compito','elimina-task','tagga','tagga-chi','stagga',
                  'assegna-sub','assegna-sub-chi',
                  'sub-tutto','sub-azzera','annulla',
                  'nuova-task','sposta-spazio','completa'];

document.addEventListener('click', function(e){
  if(appenaTenuto){ appenaTenuto = false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest('[data-action]'); if(!t) return;
  const a = t.dataset.action;
  const dentroCtx = !!t.closest('.ctx');
  const p = t.dataset.pid ? state.progetti.find(x=>x.id===t.dataset.pid) : (state.progettoId ? PROJ() : null);
  if(PROTETTE.indexOf(a)>=0 && bloccato(p)){ chiudiCtx(); return; }
  if(dentroCtx) chiudiCtx();

  switch(a){
    case 'lock': modaleLock(t.dataset.pid || (p&&p.id)); break;

    /* ---- spazi di lavoro ---- */
    case 'spazi':
      state.schermo='spazi'; state.progettoId=null; state.showFeed=false; render(); break;

    case 'apri-spazio':
      state.spazioId = t.dataset.id; state.schermo='home'; state.filtroAttivo=null;
      state.filtro=''; render();
      toast(SPZ().nome+' — '+listaProgetti().length+' progetti.','info','Spazio aperto'); break;

    case 'nuovo-spazio': apriWizard(false); break;

    case 'nuova-nota':
      nuovaNota(t.dataset.x? Number(t.dataset.x):null, t.dataset.y? Number(t.dataset.y):null); break;

    case 'colore-nota':{
      const sp = SPZ(), n = (sp.note||[]).find(x=>x.id===t.dataset.id); if(!n) break;
      n.col = PASTELLI[(PASTELLI.indexOf(n.col)+1) % PASTELLI.length];
      render(); break; }

    case 'ordina-note':{
      const sp = SPZ(); (sp.note||[]).forEach((n,i)=>{
        n.x = 26 + (i%5)*200; n.y = 24 + Math.floor(i/5)*170; n.w = 186; n.h = 150;
      });
      azione('Bacheca riordinata'); render(); break; }

    case 'elimina-nota':{
      const sp = SPZ(); const i = (sp.note||[]).findIndex(x=>x.id===t.dataset.id);
      if(i<0) break;
      const testo = (sp.note[i].tx||'').slice(0,28);
      sp.note.splice(i,1);
      azione('Nota eliminata'+(testo? ': «'+esc(testo)+'…»':''));
      render(); toast('Nota eliminata.','warn','Bacheca'); break; }

    case 'menu-sposta':{
      const r = t.getBoundingClientRect();
      apriCtx(r.left, r.bottom+6, 'Sposta «'+esc(p.nome)+'» in',
        state.spazi.filter(sp=>sp.id!==p.spazio).map(sp=>
          ({a:'sposta-spazio', l:esc(sp.nome), ic:sp.icona, d:D({pid:p.id, sp:sp.id})})), null);
      break; }

    case 'sposta-spazio':{
      const sid = t.dataset.sp;
      snap('Spostamento di «'+p.nome+'»');
      const vecchio = state.spazi.find(x=>x.id===p.spazio);
      p.spazio = sid;
      const nuovo = state.spazi.find(x=>x.id===sid);
      azione('<b>'+esc(p.nome)+'</b> spostato da '+esc(vecchio?vecchio.nome:'—')+' a <b>'+esc(nuovo.nome)+'</b>');
      logga(p,'Spostato nello spazio '+esc(nuovo.nome), true);
      render(); toast(p.nome+' ora è in «'+nuovo.nome+'».','ok','Spostato'); break; }

    case 'modifica-spazio':{
      const sp = state.spazi.find(x=>x.id===(t.dataset.id||state.spazioId)); if(!sp) break;
      spazioMod = sp.id;
      modale('<h3>Modifica lo spazio</h3><div class="sub-t">'+esc(sp.nome)+'</div><div class="modal-b">'+
        '<div class="field"><label>Nome</label><input id="sp_nome" value="'+esc(sp.nome)+'"></div>'+
        '<div class="field"><label>Descrizione</label><input id="sp_desc" value="'+esc(sp.desc||'')+'"></div>'+
        '<div class="field"><label>Icona (facoltativa)</label><div class="icone">'+
          ICONE_PROG.map(i=>'<button class="ico-b'+(sp.icona===i?' on':'')+'" data-action="sp-icona" data-k="'+i+'">'+svg(i)+'</button>').join('')+
        '</div></div>'+
        '<div class="field"><label>Colore</label><div class="icone">'+
          ['#FFAD01','#7FC8F8','#9AE6B4','#F6A8C0','#C3B1F0','#FFD79A','#8FD3C4','#F2B3A0'].map(c=>
            '<button class="ico-b'+(sp.col===c?' on':'')+'" data-action="sp-col" data-k="'+encodeURIComponent(c)+'" style="background:'+c+';border-color:'+c+'"></button>').join('')+
        '</div></div>'+
        '<div class="field"><label>Sfondo della pagina (facoltativo)</label>'+
          '<input type="file" id="sp_file" accept="image/*" hidden>'+
          '<label class="drop" for="sp_file"><b>'+svg('clip').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:5px"')+
            'Scegli un\'immagine</b>Resta dietro ai progetti al 20% di opacità, senza disturbare la lettura</label>'+
          (sp.sfondo? '<div class="file" style="margin-top:8px"><span class="ic">'+svg('file')+'</span>'+
            '<span class="nm">Sfondo impostato</span>'+
            '<button class="btn sm ghost" data-action="togli-sfondo">Rimuovi</button></div>':'')+
        '</div>'+
        '<div class="field"><label>Chi lavora in questo spazio</label>'+
          state.utenti.map(u=>'<button class="pickrow" style="margin-bottom:6px" data-action="sp-membro" data-k="'+u.id+'">'+
            av(u)+'<span class="nm">'+esc(u.nome)+'<div style="font-weight:400;color:var(--mute);font-size:11px">'+esc(u.ruolo)+'</div></span>'+
            ((sp.membri||[]).indexOf(u.id)>=0? '<span class="chip ok">nel team</span>':'<span class="chip">aggiungi</span>')+
            '</button>').join('')+
        '</div>'+
        '</div><div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Chiudi</button>'+
        '<button class="btn primary" data-action="salva-spazio" data-id="'+sp.id+'">'+svg('check')+'Salva</button></div>');
      break; }

    case 'sp-icona':{
      const sp = state.spazi.find(x=>x.id===spazioMod); if(!sp) break;
      leggiCampiSpazio(sp); sp.icona = t.dataset.k;
      riapriModificaSpazio(); break; }

    case 'sp-col':{
      const sp = state.spazi.find(x=>x.id===spazioMod); if(!sp) break;
      leggiCampiSpazio(sp); sp.col = decodeURIComponent(t.dataset.k);
      riapriModificaSpazio(); break; }

    case 'sp-membro':{
      const sp = state.spazi.find(x=>x.id===spazioMod); if(!sp) break;
      leggiCampiSpazio(sp);
      if(!sp.membri) sp.membri = [];
      const i = sp.membri.indexOf(t.dataset.k);
      if(i<0){ sp.membri.push(t.dataset.k); toast(U(t.dataset.k).nome+' aggiunto allo spazio.','ok','Team'); }
      else { sp.membri.splice(i,1); toast(U(t.dataset.k).nome+' rimosso dallo spazio.','info','Team'); }
      riapriModificaSpazio(); break; }

    case 'togli-sfondo':{
      const sp = state.spazi.find(x=>x.id===spazioMod); if(!sp) break;
      leggiCampiSpazio(sp); sp.sfondo = null;
      riapriModificaSpazio(); toast('Sfondo rimosso.','info'); break; }

    case 'rinomina-spazio':{
      const sp = state.spazi.find(x=>x.id===t.dataset.id); if(!sp) break;
      lockPid = null;
      modale('<h3>Rinomina lo spazio</h3><div class="sub-t">'+esc(sp.nome)+'</div><div class="modal-b">'+
        '<div class="field"><label>Nome</label><input id="sp_nome" value="'+esc(sp.nome)+'"></div>'+
        '<div class="field"><label>Descrizione</label><input id="sp_desc" value="'+esc(sp.desc||'')+'"></div>'+
        '</div><div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+
        '<button class="btn primary" data-action="salva-spazio" data-id="'+sp.id+'">Salva</button></div>');
      break; }

    case 'salva-spazio':{
      const sp = state.spazi.find(x=>x.id===t.dataset.id);
      const n = (el('sp_nome').value||'').trim();
      if(!n){ toast('Serve un nome.','warn','Campo vuoto'); break; }
      const prima = sp.nome;
      sp.nome = n; sp.desc = (el('sp_desc').value||'').trim();
      azione(prima!==n? 'Spazio rinominato: «'+esc(prima)+'» → «'+esc(n)+'»' : 'Spazio <b>'+esc(n)+'</b> aggiornato');
      spazioMod = null; chiudiModale(); render(); toast('Spazio aggiornato.','ok','Salvato'); break; }

    case 'elimina-spazio':{
      const sp = state.spazi.find(x=>x.id===t.dataset.id); if(!sp) break;
      const n = progettiDi(sp.id).length;
      modale('<h3>Eliminare lo spazio?</h3><div class="sub-t">'+esc(sp.nome)+'</div><div class="modal-b">'+
        '<div class="nota-box">'+(n? 'Dentro ci sono <b>'+n+' progetti</b>: spariscono anche loro. ' : 'È vuoto. ')+
        'Con <b>Ctrl+Z</b> recuperi i progetti, non lo spazio.</div></div>'+
        '<div class="modal-f"><button class="btn ghost" data-action="chiudi-modale">Annulla</button>'+
        '<button class="btn" style="background:var(--alert);border-color:var(--alert);color:#fff" '+
        'data-action="conferma-elimina-spazio" data-id="'+sp.id+'">Elimina</button></div>');
      break; }

    case 'conferma-elimina-spazio':{
      const sp = state.spazi.find(x=>x.id===t.dataset.id);
      snap('Eliminazione dello spazio «'+sp.nome+'»');
      azione('Eliminato lo spazio <b>'+esc(sp.nome)+'</b> con '+progettiDi(sp.id).length+' progetti');
      state.progetti = state.progetti.filter(x=>x.spazio!==sp.id);
      state.spazi = state.spazi.filter(x=>x.id!==sp.id);
      if(state.spazioId===sp.id) state.spazioId = state.spazi[0] ? state.spazi[0].id : null;
      state.schermo = 'spazi'; chiudiModale(); render();
      toast(sp.nome+' eliminato.','warn','Eliminato'); break; }

    /* ---- wizard ---- */

function inviaMessaggio(){
  const p = PROJ(), c = el('composer'); if(!c) return;
  const tx = c.value.trim(); if(!tx){ toast('Scrivi qualcosa prima di inviare.','warn'); return; }
  snap(p.tab==='commenti'?'Invio di un commento':'Invio di un messaggio');
  const m = {u:state.utente, tx:esc(tx).replace(/\b(\d{2}:\d{2}:\d{2}:\d{2})\b/g,'<code>$1</code>'), ts:'oggi '+oraOra()};
  if(p.tab==='commenti'){
    (p.commenti[p.fase] = p.commenti[p.fase]||[]).push(m);
    logga(p,'Nuovo commento su <b>'+FZ(p)[p.fase].nome+'</b>');
    notifica('<b>'+esc(U(state.utente).nome)+'</b> ha commentato la fase <b>'+FZ(p)[p.fase].nome+'</b> di '+esc(p.nome), p.id, p.fase, 'chat');
    toast('Commento pubblicato su '+FZ(p)[p.fase].nome+'.','ok','Inviato');
  } else {
    p.chat.push(m); logga(p,'Nuovo messaggio in chat');
    toast('Messaggio inviato al team.','ok','Inviato');
  }
  p.draft=''; c.value='';
  render();
  const f = el('feed'); if(f) f.scrollTop = f.scrollHeight;
}

/* ============ MENU TASTO DESTRO ============ */
let ctxEl = null, ctxMarked = null;
/* Conferma discreta sul tasto stesso: niente riquadri che coprono la pagina. */
function confermaBottone(b, testo){
  if(!b || b.dataset.confermando) return;
  const prima = b.innerHTML;
  b.dataset.confermando = '1';
  b.classList.add('confermato');
  b.innerHTML = svg('check',3) + '<span>' + esc(testo) + '</span>';
  setTimeout(()=>{ b.innerHTML = prima; b.classList.remove('confermato'); delete b.dataset.confermando; }, 1600);
}
let staTrascinando = false;
const ultimoPunto = {x:120, y:140};
document.addEventListener('pointerdown', e=>{ ultimoPunto.x = e.clientX; ultimoPunto.y = e.clientY; }, true);

/* ---------- PRESSIONE PROLUNGATA: 2 secondi per modificare ----------
   Vale su tutto: titoli, clienti, campi della scheda, task, subtask, note,
   responsabili. Mouse, dito e Apple Pencil passano dagli stessi eventi.
   Durante l'attesa il campo si riempie, così si capisce che sta succedendo. */
const TENUTA = 2000;
const ZONE_TENUTA = '.spec, .kv, .proj-head .cli, .proj-head h1, .work-head .editabile, '+
                    '.sub-h, .chk, .riga, .task-nota, .sp-head h1, .rail-sec .kv';
let tenuta = null, appenaTenuto = false;

function fermaTenuta(){
  if(!tenuta) return;
  clearTimeout(tenuta.t);
  tenuta.zona.classList.remove('in-tenuta');
  tenuta.zona.style.removeProperty('--tenuta');
  tenuta = null;
}
document.addEventListener('pointerdown', function(e){
  if(e.button && e.button !== 0) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.target.closest('.ctx, .modal, .drawer, .postit')) return;
  const zona = e.target.closest(ZONE_TENUTA);
  if(!zona) return;
  const matita = zona.querySelector('.pen');
  if(!matita || bloccato(state.progettoId?PROJ():null)) return;
  const x0 = e.clientX, y0 = e.clientY;
  zona.classList.add('in-tenuta');
  zona.style.setProperty('--tenuta', TENUTA+'ms');
  tenuta = {zona, matita, x0, y0, t:setTimeout(()=>{
    const z = tenuta; fermaTenuta();
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(err){}
    z.matita.click();                 // prima apro, poi alzo la bandiera:
    appenaTenuto = true;              // così mangio solo il click dell'utente
    setTimeout(()=>{ appenaTenuto = false; }, 600);
  }, TENUTA)};
}, true);
document.addEventListener('pointermove', function(e){
  if(!tenuta) return;
  if(Math.abs(e.clientX-tenuta.x0) > 8 || Math.abs(e.clientY-tenuta.y0) > 8) fermaTenuta();
}, true);
['pointerup','pointercancel','scroll','wheel'].forEach(ev=>
  document.addEventListener(ev, fermaTenuta, true));
let schermoCtx = '';
function chiudiCtx(){
  if(ctxEl){ ctxEl.remove(); ctxEl = null; }
  if(ctxMarked){ ctxMarked.classList.remove('ctx-target'); ctxMarked = null; }
}
function apriCtx(x, y, titolo, voci, bersaglio){
  chiudiCtx();
  const d = document.createElement('div');
  d.className = 'ctx';
  d.innerHTML = (titolo? '<div class="ctx-h">'+titolo+'</div>' : '')+
    voci.map(v => v.sep ? '<div class="ctx-sep"></div>' :
      '<button class="ctx-i'+(v.danger?' danger':'')+'" data-action="'+v.a+'" '+(v.d||'')+(v.off?' disabled':'')+'>'+
        (v.ic? svg(v.ic,2) : '<span style="width:14px"></span>')+'<span>'+v.l+'</span>'+
        (v.k? '<kbd>'+v.k+'</kbd>':'')+'</button>').join('');
  document.body.appendChild(d);
  const r = d.getBoundingClientRect();
  d.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 8))+'px';
  d.style.top  = Math.max(6, Math.min(y, window.innerHeight - r.height - 8))+'px';
  ctxEl = d;
  if(bersaglio){ bersaglio.classList.add('ctx-target'); ctxMarked = bersaglio; }
}
const D = o => Object.keys(o).map(k=>'data-'+k+'="'+o[k]+'"').join(' ');

/* Sul telefono la barra in alto è quasi vuota: quello che ho tolto da lì
   (scheda, commenti, filtri, annulla, tema) sta tutto in questo menu. */
function menuTelefono(bottone){
  const r = bottone.getBoundingClientRect();
  const voci = [];
  const p = state.schermo==='progetto' ? PROJ() : null;
  if(p){
    voci.push({a:'toggle-rail', l:'Scheda progetto', ic:'file'});
    voci.push({a:'toggle-feed', l:'Commenti e chat', ic:'chat'});
    voci.push({sep:1});
  }
  if(state.schermo==='home'){
    const tot = progettiDi(state.spazioId).length;
    voci.push({a:'filtro', d:'data-id=""', l:'Tutti i progetti ('+tot+')', ic:'grid'});
    filtriDiSpazio().forEach(f=>{
      const n = progettiDi(state.spazioId).filter(x=>passaFiltro(x,f)).length;
      voci.push({a:'filtro', d:'data-id="'+f.id+'"', l:esc(f.nome)+' ('+n+')', ic:'filter'});
    });
    voci.push({a:'nuovo-filtro', l:'Nuovo filtro', ic:'plus'});
    voci.push({sep:1});
  }
  voci.push({a:'annulla', l:'Annulla ultima azione', ic:'undo', off:!undoStack.length});
  voci.push({a:'theme', l:tema()==='light'?'Tema scuro':'Tema chiaro', ic:tema()==='light'?'moon':'sun'});
  voci.push({a:'me', l:'Profilo e impostazioni', ic:'user'});
  apriCtx(Math.min(r.left, window.innerWidth-250), r.bottom+6, 'Altro', voci, null);
}

     !(dentroNota && !conSelezione)) return;

  const voci = [];
  const undoV = {a:'annulla', l:'Annulla ultima azione', ic:'undo', k:'Ctrl+Z', off:!undoStack.length};

  /* 1 — evento del calendario */
  const ev = e.target.closest('.ev');
  if(ev){
    const pr = state.progetti.find(z=>z.id===ev.dataset.p), i = Number(ev.dataset.i);

/* ============ ORDINE DEI TASTI VISTA ============ */
/* tieni premuto un tasto e spostalo: funziona con mouse, dito e pennino */
let vsPremuto = null;
document.addEventListener('pointerdown', function(e){
  const v = e.target.closest && e.target.closest('.vs'); if(!v) return;
  vsPremuto = {v, k:v.dataset.vs, x0:e.clientX, partito:false};
});
document.addEventListener('pointermove', function(e){
  if(!vsPremuto) return;
  if(!vsPremuto.partito){
    if(Math.abs(e.clientX - vsPremuto.x0) < 10) return;
    vsPremuto.partito = true; staTrascinando = true;
    vsPremuto.v.classList.add('trascino');
    el('viewswitch').classList.add('riordino');
    try{ vsPremuto.v.setPointerCapture(e.pointerId); }catch(err){}
  }
  e.preventDefault();
  const sotto = document.elementFromPoint(e.clientX, e.clientY);
  const su = sotto && sotto.closest && sotto.closest('.vs');
  document.querySelectorAll('.vs.bersaglio').forEach(n=>{ if(n!==su) n.classList.remove('bersaglio'); });
  if(su && su.dataset.vs !== vsPremuto.k){ su.classList.add('bersaglio'); vsPremuto.su = su; }
  else vsPremuto.su = null;
}, {passive:false});
document.addEventListener('pointerup', function(){
  if(!vsPremuto) return;
  const {k, su, partito} = vsPremuto;
  document.querySelectorAll('.vs').forEach(n=>n.classList.remove('bersaglio','trascino'));
  const sw = el('viewswitch'); if(sw) sw.classList.remove('riordino');
  vsPremuto = null;
  if(!partito || !su) return;
  const o = state.ordineViste.slice();
  const da = o.indexOf(k), a = o.indexOf(su.dataset.vs);
  if(da<0 || a<0) return;
  o.splice(da,1); o.splice(a,0,k);
  state.ordineViste = o;
  azione('Ordine delle viste: '+o.join(' · '));
  render(); save();
});

/* ============ TRASCINAMENTO EVENTI ============ */
/* a puntatore, così funziona con mouse, dito e Apple Pencil allo stesso modo */
function itaData(iso){ const p = (iso||'').split('-'); return p.length===3? p[2]+'/'+p[1]:iso; }

let evTrascinato = null;
document.addEventListener('pointerdown', function(e){
  const ev = e.target.closest && e.target.closest('.ev');
  if(!ev || state.vista!=='calendario') return;
  const p = state.progetti.find(x=>x.id===ev.dataset.p);
  if(!p || isLock(p)) return;
  evTrascinato = {ev, p, i:Number(ev.dataset.i), x0:e.clientX, y0:e.clientY, partito:false, id:e.pointerId};
});
document.addEventListener('pointermove', function(e){
  if(!evTrascinato) return;
  const d = Math.abs(e.clientX-evTrascinato.x0) + Math.abs(e.clientY-evTrascinato.y0);
  if(!evTrascinato.partito){
    if(d < 8) return;                       /* sotto la soglia è un tocco, non un trascinamento */
    evTrascinato.partito = true;
    const r = evTrascinato.ev.getBoundingClientRect();
    evTrascinato.dx = evTrascinato.x0 - r.left;
    evTrascinato.dy = evTrascinato.y0 - r.top;
    evTrascinato.w = r.width;
    const fant = evTrascinato.ev.cloneNode(true);
    fant.classList.add('fantasma');
    fant.style.width = r.width+'px';
    document.body.appendChild(fant);
    evTrascinato.fant = fant;
    staTrascinando = true;
    evTrascinato.ev.classList.add('dragging');
    try{ evTrascinato.ev.setPointerCapture(e.pointerId); }catch(err){}
  }
  e.preventDefault();
  evTrascinato.fant.style.left = (e.clientX - evTrascinato.dx)+'px';
  evTrascinato.fant.style.top  = (e.clientY - evTrascinato.dy)+'px';
  const sotto = document.elementFromPoint(e.clientX, e.clientY);
  const giorno = sotto && sotto.closest && sotto.closest('.day[data-iso]');
  document.querySelectorAll('.day.over').forEach(n=>{ if(n!==giorno) n.classList.remove('over'); });
  if(giorno) giorno.classList.add('over');
  evTrascinato.giorno = giorno;
}, {passive:false});
document.addEventListener('pointerup', function(e){
  if(!evTrascinato) return;
  const {ev, p, i, partito, fant, giorno} = evTrascinato;
  evTrascinato = null;
  if(fant) fant.remove();
  ev.classList.remove('dragging');
  document.querySelectorAll('.day.over').forEach(n=>n.classList.remove('over'));
  if(!partito) return;                       /* tocco semplice: ci pensa il clic */
  if(!giorno) return;
  const nuova = giorno.dataset.iso, e2 = p.eventi[i];
  if(!e2 || e2.d === nuova) return;
  const vecchia = e2.d;
  snap('Spostamento di «'+e2.t+'»');
  e2.d = nuova;
  let extra = '';
  if(/^consegna/i.test(e2.t)){
    const q = nuova.split('-'); p.consegna = q[2]+'/'+q[1]+'/'+q[0];
    extra = ' — aggiornata anche la data di consegna in scheda';
  }
  azione('Spostato <b>'+esc(e2.t)+'</b> ('+esc(p.cliente)+') dal '+itaData(vecchia)+' al '+itaData(nuova)+esc(extra));
  logga(p, 'Evento <b>'+esc(e2.t)+'</b> spostato al '+itaData(nuova), true);
  render();
});

/* allegati — limite 10 MB per file */
document.addEventListener('change', function(e){
  if(e.target.id==='pf_foto'){
    const f = (e.target.files||[])[0]; if(!f) return;
    if(f.size > 8*1024*1024){ toast('Foto oltre 8 MB, usane una più leggera.','warn','Troppo pesante'); return; }
    /* la riduco a 512px: una foto da 4 MB messa intera nell'archivio lo fa
       esplodere, e il browser tiene solo pochi MB in tutto */
    if(sb && utenteCloud){
      caricaAvatar(f).then(url=>{
        if(!url) return;
        state.me.foto = url; U(state.utente).foto = url; render(); salvaProfiloCloud();
      });
      return;
    }
    riduciImmagine(f, 512, 0.82).then(url=>{
      state.me.foto = url; U(state.utente).foto = url; render();
    }).catch(()=>toast('Immagine non leggibile.','warn','Errore'));
    return;
  }
  if(e.target.id==='pf_import'){
    const f = (e.target.files||[])[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=> importaDati(String(r.result));
    r.readAsText(f); e.target.value=''; return;
  }
  if(e.target.id==='sp_file'){
    const f = (e.target.files||[])[0]; if(!f) return;
    const sp = state.spazi.find(x=>x.id===spazioMod); if(!sp) return;
    leggiCampiSpazio(sp);
    riduciImmagine(f, 1600, 0.72).then(url=>{
      sp.sfondo = url; riapriModificaSpazio();
      toast('Sfondo impostato al 20% di opacità.','ok','Fatto');
    }).catch(()=>toast('Immagine non leggibile.','warn','Errore'));
    e.target.value=''; return;
  }
  if(e.target.id==='pf_snooze'){ state.cfg.snoozeMin = Number(e.target.value); applicaProfilo(); return; }
  if(e.target.id==='ordinaSel'){
    const v = e.target.value;
    animaTessere(()=>{ state.ordina = v; renderHome(); });
    return;
  }
  if(e.target.id!=='np_file') return;
  const LIMITE = 10*1024*1024;
  let scartati = 0;
  Array.from(e.target.files||[]).forEach(f=>{
    if(f.size > LIMITE){ scartati++; return; }
    tmpAllegati.push({nome:f.name, size:f.size});
  });
  renderAllegati();
  if(scartati) toast(scartati+' file oltre 10 MB non caricati.','warn','Limite superato');
  else if(tmpAllegati.length) toast(tmpAllegati.length+' allegati pronti.','ok','Caricati');
  e.target.value = '';
});

/* ============ TENUTA DEI DATI FRA GLI AGGIORNAMENTI ============ */
/* Ogni versione può aggiungere campi: qui i dati vecchi vengono completati,
   mai sostituiti. Nessun lavoro va perso quando l'app viene aggiornata. */
const SCHEMA = 4;
function normalizza(){
  if(!Array.isArray(state.spazi) || !state.spazi.length){
    state.spazi = [{id:'sp1', nome:'Il mio lavoro', desc:'', icona:'camera', col:'#FFAD01', tipo:'video'}];
  }
  state.spazi.forEach(sp=>{
    if(!sp.id) sp.id = 'sp'+Math.random().toString(36).slice(2,8);
    if(!sp.icona) sp.icona = (TIPI[sp.tipo]||TIPI.video).ic;
    if(!sp.col) sp.col = (TIPI[sp.tipo]||TIPI.video).c;
    if(!sp.tipo) sp.tipo = 'video';
    if(!Array.isArray(sp.note)) sp.note = [];
    if(!Array.isArray(sp.membri)) sp.membri = [state.utente];
    sp.note.forEach(n=>{ if(!n.col) n.col = PASTELLI[0]; if(n.w==null) n.w = 186; if(n.h==null) n.h = 150; });
  });
  const primo = state.spazi[0].id;
  if(!state.spazi.some(x=>x.id===state.spazioId)) state.spazioId = primo;

  (state.progetti||[]).forEach(p=>{
    if((!p.spazio || !state.spazi.some(x=>x.id===p.spazio)) && mioProgetto(p)) p.spazio = primo;
    if(!p.tipo || !TIPI[p.tipo]) p.tipo = 'video';
    if(!Array.isArray(p.fasi) || !p.fasi.length) p.fasi = TIPI[p.tipo].fasi.map(f=>Object.assign({}, f));
    if(!p.icona) p.icona = TIPI[p.tipo].ic;
    if(!Array.isArray(p.tags)) p.tags = [];
    if(!Array.isArray(p.allegati)) p.allegati = [];
    if(!Array.isArray(p.eventi)) p.eventi = [];
    if(!Array.isArray(p.team) || !p.team.length) p.team = [state.utente];
    if(!p.commenti || typeof p.commenti!=='object') p.commenti = {};
    if(!Array.isArray(p.chat)) p.chat = [];
    if(!Array.isArray(p.log)) p.log = [];
    if(!p.visti) p.visti = {commenti:0, chat:0, attivita:0};
    if(!p.faseAss) p.faseAss = {};
    if(!p.lock) p.lock = {on:false, pw:''};
    if(p.completato == null) p.completato = false;
    if(p.prio == null) p.prio = 'media';
    if(p.fase == null) p.fase = 0;
    if(p.avanz == null) p.avanz = p.fase;
    p.fase = Math.min(p.fase, p.fasi.length-1);
    p.avanz = Math.min(Math.max(p.avanz, p.fase), p.fasi.length-1);
    if(!Array.isArray(p.subs)) p.subs = [];
    p.subs.forEach(t=>{
      if(!Array.isArray(t.items)) t.items = [];
      if(t.fase == null) t.fase = 0;
      if(!t.assegnato) t.assegnato = p.team[0];
      if(t.nota == null) t.nota = '';
    });
    FZ(p).forEach((f,i)=>{ if(p.faseAss[i]==null) p.faseAss[i] = p.team[i % p.team.length]; });
  });

  (state.filtri||[]).forEach(f=>{ if(f.tag===undefined) f.tag = null; });
  if(!Array.isArray(state.azioni)) state.azioni = [];
  if(!Array.isArray(state.notifiche)) state.notifiche = [];
  if(!state.cfg) state.cfg = {};
  if(!state.cfg.tema) state.cfg.tema = 'ardesia';
  if(!Array.isArray(state.ordineViste) || !state.ordineViste.length)
    state.ordineViste = ['tessere','lista','calendario','mappa','note'];
  state.schema = SCHEMA;
}

function esportaDati(){
  const dati = {schema:SCHEMA, salvato:new Date().toISOString(),
    spazi:state.spazi, progetti:state.progetti, filtri:state.filtri,
    notifiche:state.notifiche, azioni:state.azioni, me:state.me, cfg:state.cfg, utenti:state.utenti};
  const testo = JSON.stringify(dati, null, 1);
  /* nell'anteprima qui dentro il download non è permesso: mostro il testo da copiare */
  const anteprima = !!(window.claude || window.location.protocol === 'blob:');
  try{
    if(anteprima) throw new Error('anteprima');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([testo], {type:'application/json'}));
    a.download = 'foss-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    azione('Backup dei dati scaricato');
  }catch(e){
    modale('<h3>Copia il backup</h3><div class="sub-t">Il download non è disponibile qui: seleziona e copia.</div>'+
      '<div class="modal-b"><textarea class="rte" style="height:240px;font-family:monospace;font-size:11px">'+
      esc(testo)+'</textarea></div><div class="modal-f"><button class="btn" data-action="chiudi-modale">Chiudi</button></div>');
  }
}
function importaDati(testo){
