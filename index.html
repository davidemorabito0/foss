.btn.esci-rosso svg{width:16px;height:16px}
#statoProfilo.ok-flash{color:var(--ok);border-color:var(--ok)}
.chiudi-feed{flex:none;width:34px;padding:0;display:grid;place-items:center;color:var(--mute)}
.chiudi-feed svg{width:14px;height:14px}
.chiudi-feed:hover{color:var(--text)}
.chat-step{position:relative;flex:none!important;width:46px;justify-content:center;padding:7px!important}
.chat-step .n{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--alert);color:#fff;font-size:9.5px;font-weight:700;font-family:Sora;display:grid;place-items:center}
.chat-step.ha-nuovi{border-color:var(--alert)}
/* Col dito, o sotto i 1100px, dentro a un progetto scorre tutta la
   colonna di lavoro e non solo la lista: sul tablet la lista restava
   una finestrella di poche righe sotto intestazione e riquadri. */
@media (hover:none),(pointer:coarse),(max-width:1100px){
  .work{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .work > .work-head{position:sticky;top:0;z-index:3;background:var(--bg)}
  .work > .subs{flex:none;min-height:0;overflow:visible}
}
@media (max-width:1100px){
  .specs{display:grid}
  .proj{grid-template-columns:minmax(0,1fr);position:relative}
  .solo-stretto{display:inline-flex!important}
  .rail-compatta{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}
  .rail-compatta .ring-wrap{gap:10px}
  .rail-compatta .ring{width:42px;height:42px}
  .rail-compatta .ring-n{font-size:15px}
  .rail-compatta .btn-completa{width:auto;padding:10px 16px;font-size:12.5px;margin:0}
  .rail-compatta .nota-completa{display:none}
  .proj > .rail:not(.rail-r){
    position:absolute;z-index:40;top:0;bottom:0;left:0;width:min(302px,86vw);
    transform:translateX(-103%);transition:transform .22s cubic-bezier(.4,0,.2,1);
    box-shadow:14px 0 46px rgba(0,0,0,.3);border-right:1px solid var(--line);
  }
  .proj.rail-on > .rail:not(.rail-r){transform:none}
  .proj.rail-on > .rail-scrim{display:block;position:absolute;inset:0;z-index:35;
    background:rgba(8,12,20,.42);animation:fadein .18s ease-out}
}
@media (max-width:1000px){
  .crumb span{display:none}
  .search{min-width:120px}
  .viewswitch{position:static;transform:none}
  .vs{padding:7px 12px;font-size:13px}
}
@media (max-width:820px){
  .cal-title{font-size:20px;min-width:0}
  .cal-head{padding:6px 12px 8px}
  .cal-wrap{padding:0 12px 12px}
  .cal .day{padding:3px}
  .vs span{display:none}
  .vs{padding:7px 11px}
  .search{display:none}
  .griglia{grid-template-columns:1fr}
  .proj-head{padding:10px 14px}
  .proj-head h1{font-size:18px}
  .step .tx{display:none}
  .step{justify-content:center;padding:7px}
  .step .idx{display:none}
  .home-head{padding:12px 16px 8px}
  .scroller{padding:4px 16px 16px}
  .cal{margin:0 16px 16px}
  .cal .day{min-height:62px}
  .ev b{display:none}
}
.only-narrow{display:none}
@media (max-width:820px){.only-narrow{display:grid}}

  /* ---------- LA BARRA IN ALTO DEL TELEFONO ----------

  .spazi-head{display:none}

  .tel-tutto{padding:0 0 16px}

  /* dentro a un lavoro il nome sta in alto: qui sotto non serve ripeterlo,

.nl-fase-h .tx span{font-size:11.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-task{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line-soft);padding:6px}
.nl-t{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:9px;text-align:left;width:100%}
.nl-t:hover{background:var(--surface-3)}
.nl-t .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;
  flex:none;margin-top:1px;color:transparent;transition:all .15s}
.nl-t .box svg{width:11px;height:11px}
.nl-t.on .box{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.nl-t.on .box svg{opacity:1;transform:scale(1)}
.nl-t .tx{flex:1;min-width:0}
.nl-t .tx b{font-size:13px;font-weight:600;display:block}
.nl-t .tx span{font-size:11.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-t:not(.on) .tx{opacity:.5}
.nl-t:not(.on) .tx b{text-decoration:line-through}
.nl-add{display:flex;gap:6px;padding:6px 2px 2px}
.nl-add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:13px;outline:none}
.nl-add input:focus{border-color:var(--amber)}
@media (hover:none){ .nl-t:hover{background:none} .nl-chip:not(.on):hover{border-color:var(--line);color:var(--dim)} }

/* ---------- PRESET ---------- */
.nl-mod-b .tx .nl-metodo{font-style:normal;font-size:11.5px;color:var(--dim);margin-top:3px;white-space:normal;line-height:1.4}
.nl-mod-az{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.pe .wz-b{max-height:62vh}
.pe-hint{font-size:11.5px;color:var(--mute);margin-top:6px;line-height:1.4}
.pe-conta{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:700;margin-top:4px}
.pe-fase .nl-fase-h{gap:8px}
.pe-fnome{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font:600 13.5px Sora,sans-serif;color:var(--text);outline:none}
.pe-fnome:focus{border-color:var(--amber)}
.pe-az{display:flex;gap:2px;flex:none}
.pe-az .iconbtn{width:30px;height:30px}
.pe-az .iconbtn svg{width:14px;height:14px}
.pe-az .iconbtn:disabled{opacity:.3;pointer-events:none}
/* ---------- COMMENTI DENTRO TASK E SUBTASK ---------- */
.cm-btn{position:relative;display:inline-flex;align-items:center;gap:3px;height:24px;min-width:26px;padding:0 6px;border-radius:7px;flex:none;
  color:var(--mute);background:transparent;border:1px solid transparent;font-size:11px;font-weight:700;font-family:Sora;transition:background .14s,color .14s,border-color .14s}
.cm-btn svg{width:14px;height:14px}
.cm-btn:hover{background:var(--surface-3);color:var(--text)}
.cm-btn.su-voce:not(.ha){opacity:.45}
.cm-btn.su-voce:not(.ha):hover{opacity:1}
.cm-btn.ha{color:var(--dim);border-color:var(--line);background:var(--surface-2)}
.cm-btn.nuovi{color:var(--alert);border-color:var(--alert)}
.cm-n{line-height:1}
.cm-dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--alert);border:2px solid var(--surface)}
.chk .tx{flex:1;min-width:0}
.chk .cm-btn{margin-left:2px}
.step .cm-dot{top:5px;right:auto;left:5px}
@media (hover:none){ .cm-btn{height:30px;min-width:32px} .cm-btn.su-voce:not(.ha){opacity:.55} }

.cm-lay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px}
.cm-scrim{position:absolute;inset:0;background:rgba(6,12,24,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.cm-box{position:relative;width:min(760px,100%);height:min(86vh,900px);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:dropModale .28s cubic-bezier(.2,1.2,.4,1)}
.cm-top{display:flex;align-items:center;gap:12px;padding:14px 14px 10px 16px}
.cm-ic{width:38px;height:38px;border-radius:11px;background:var(--amber-soft);color:var(--amber-ink);display:grid;place-items:center;flex:none}
.cm-ic svg{width:18px;height:18px}
.cm-tit{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cm-dove{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-tit b{font-family:Sora;font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.cm-tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line-soft)}
.cm-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.cm-tab span{font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--surface-2);color:var(--mute)}
.cm-tab.on{color:var(--text);border-bottom-color:var(--amber)}
.cm-tab.on span{background:var(--amber-soft);color:var(--amber-ink)}
.cm-corpo{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.cm-msg{display:flex;gap:10px;align-items:flex-start;border-radius:10px}
.cm-msg .av{flex:none}
.cm-msg .bd{flex:1;min-width:0}
.cm-msg .hd{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cm-msg .hd b{font-family:Sora;font-size:13px;font-weight:700}
.cm-msg .ru{font-size:11px;color:var(--mute)}
.cm-msg .ts{font-size:10.5px;color:var(--mute);font-family:"JetBrains Mono",monospace;margin-left:auto}
.cm-msg .tx{font-size:13.5px;line-height:1.5;color:var(--text);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-msg .tx a{color:var(--amber-ink);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.cm-msg.mio .hd b{color:var(--amber-ink)}
.cm-sep{display:flex;align-items:center;gap:10px;color:var(--alert);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-family:Sora}
.cm-sep::before,.cm-sep::after{content:"";flex:1;height:1px;background:var(--alert);opacity:.4}
.cm-file{display:flex;flex-direction:column;gap:6px;margin-top:7px;max-width:340px;padding:8px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.cm-file:hover{border-color:var(--amber)}
.cm-img{width:100%;aspect-ratio:4/3;height:auto;max-height:220px;object-fit:cover;border-radius:7px;background:var(--surface-3)}
.cm-file-r{display:flex;align-items:center;gap:8px;min-width:0}
.cm-file-r .ic,.cm-pronto .ic,.cm-link .ic{width:28px;height:28px;border-radius:8px;background:var(--surface-3);color:var(--amber-ink);display:grid;place-items:center;flex:none}
.cm-file-r .ic svg,.cm-pronto .ic svg,.cm-link .ic svg{width:14px;height:14px}
.cm-file-r .nm,.cm-pronto .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-file-r .dim,.cm-pronto .dim{font-size:11px;color:var(--mute);flex:none}
.cm-vuoto{margin:auto;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);font-size:13px;line-height:1.5}
.cm-vuoto svg{width:28px;height:28px;color:var(--mute);margin-bottom:4px}
.cm-vuoto b{font-family:Sora;color:var(--text)}
.cm-lf{display:flex;flex-direction:column;gap:4px}
.cm-lf .cm-file{margin-top:0}
.cm-lf .chi{font-size:11px;color:var(--mute);padding-left:2px}
.cm-link{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;padding:9px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);text-decoration:none;color:var(--text)}
.cm-link:hover{border-color:var(--amber)}
.cm-link .ic{grid-row:1 / span 2}
.cm-link .nm{font-size:13px;font-weight:600}
.cm-link .url{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm-scrivi{border-top:1px solid var(--line-soft);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cm-pronto{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line)}
.cm-pronto[hidden],.cm-err[hidden]{display:none!important}
.cm-pronto .iconbtn{width:28px;height:28px}
.cm-err{font-size:12.5px;color:var(--alert);background:var(--alert-soft);border-radius:var(--r-m);padding:7px 10px;line-height:1.4}
.cm-riga{display:flex;align-items:flex-end;gap:8px}
.cm-clip{width:38px;height:38px;flex:none;cursor:pointer;border:1px solid var(--line);border-radius:var(--r-m)}
#cm_tx{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;resize:none;
  font-size:13.5px;line-height:1.4;outline:none;min-height:38px;max-height:160px}
#cm_tx:focus{border-color:var(--amber)}
.cm-riga .send{width:38px;height:38px}
.cm-sola{padding:12px 16px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--mute);text-align:center}
@media (max-width:620px){
  .cm-lay{padding:0}
  .cm-box{width:100%;height:100%;height:100dvh;border-radius:0;border:none}
  .cm-top{padding-top:calc(12px + env(safe-area-inset-top))}
  .cm-scrivi{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  #cm_tx{font-size:16px}
}
@media (hover:none),(pointer:coarse){ #cm_tx{font-size:16px} }

/* la descrizione della task: dice chi l'ha scritta */
.task-nota{flex-wrap:wrap}
.task-nota .tx{flex:1}
.editabile.tocca,.sub-note.tocca{cursor:pointer}
.sub-note.tocca:hover b{color:var(--amber-ink)!important}
.nota-di{flex-basis:100%;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);padding-left:22px}
/* nella chat: i vecchi commenti di fase e le risposte del cliente dicono su quale fase sono */
.msg-su{font-size:10.5px;color:var(--mute);margin-top:1px}
.msg-su b{color:var(--dim);font-weight:600}
.msg .tx a{color:var(--amber-ink);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
/* il tasto del pannello a destra: dice che apre una finestra laterale */
.feed-btn{border-color:var(--amber)}
.feed-btn .apre{display:inline-grid;margin-left:2px;opacity:.75}
.topbar [data-action="toggle-feed"]{display:none!important}   /* la chat si apre dal tasto nell'intestazione del progetto */
.feed-btn .apre svg{width:14px;height:14px}
/* ---------- @ PER TAGGARE ---------- */
.menz-pop{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:5px;max-height:300px;overflow-y:auto}
.menz-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:Sora;font-weight:600;padding:5px 8px}
.menz-r{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.menz-r .nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menz-r .ru{font-size:11px;color:var(--mute);flex:none}
.menz-r.on,.menz-r:hover{background:var(--amber-soft)}
.menz-vuoto{font-size:12.5px;color:var(--mute);padding:8px}
.cm-at{font-family:Sora;font-weight:700;font-size:16px;color:var(--amber-ink)}
.btn-visto.apri{display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-visto.apri svg{width:15px;height:15px}
/* ---------- LE PROFESSIONI CHE FACCIO ---------- */
.prof-scelte{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.prof-b{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%;transition:border-color .15s,background .15s}
.prof-b:hover{border-color:var(--amber)}
.prof-b .ic{width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--dim);display:grid;place-items:center;flex:none}
.prof-b .ic svg{width:15px;height:15px}
.prof-b .nm{flex:1;min-width:0;font-size:13px;font-weight:600}
.prof-b .sp{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.prof-b .sp svg{width:11px;height:11px;opacity:0}
.prof-b.on{border-color:var(--amber);background:var(--amber-soft)}
.prof-b.on .ic{background:var(--amber);color:var(--on-amber)}
.prof-b.on .sp{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.prof-b.on .sp svg{opacity:1}
.prof-scelte.grande .prof-b{padding:12px}
.prof-b .nm{overflow-wrap:anywhere}
.wz-f .btn:disabled{opacity:.45;cursor:default}
@media (max-width:620px){ .prof-scelte{grid-template-columns:repeat(2,minmax(0,1fr))} .prof-b{gap:8px;padding:9px 8px} .prof-b .ic{width:26px;height:26px} .prof-b .nm{font-size:12px} .prof-scelte.grande .prof-b{padding:10px 8px} }
/* ---------- GUIDA ---------- */
.guida{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:14px 0 30px}
.guida .riga-indietro{margin:-4px 0 -2px}
.g-testa{display:flex;gap:14px;align-items:flex-start}
.g-logo{width:44px;height:44px;border-radius:14px;background:var(--amber-soft);color:var(--amber-ink);display:grid;place-items:center;flex:none}
.g-logo svg{width:22px;height:22px}
.g-testa h1{font-size:21px;margin:2px 0 4px}
.g-testa p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.g-cerca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:10px 12px;color:var(--mute);cursor:text}
.g-cerca:focus-within{border-color:var(--amber)}
.g-cerca svg{width:15px;height:15px;flex:none}
.g-cerca input{background:none;border:none;outline:none;width:100%;min-width:0;font-size:14px;color:var(--text)}
@media (hover:none),(pointer:coarse){ .g-cerca input,.modal.sg-modale textarea{font-size:16px} }
.g-conta{font-size:12px;color:var(--mute);margin:-6px 2px 0}
.g-conta:empty{display:none}
.g-indice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g-indice[hidden],.g-vuoto[hidden],.sg-err[hidden],.g-voce[hidden],.g-cap[hidden]{display:none!important}
.g-liv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:11px 10px 8px}
.g-liv-t{display:block;font-family:Sora;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px 6px}
.g-liv-l{display:flex;flex-direction:column;gap:1px}
.g-pill{display:flex;align-items:center;gap:9px;padding:7px 7px;border-radius:9px;text-align:left;font-size:13px;color:var(--text);background:none;width:100%}
.g-pill:hover{background:var(--surface-2)}
.g-pill svg{width:15px;height:15px;color:var(--amber-ink);flex:none}
.g-capitoli{display:flex;flex-direction:column;gap:8px}
.g-cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;scroll-margin-top:12px;transition:box-shadow .3s}
.g-cap>summary{list-style:none;display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.g-cap>summary::-webkit-details-marker{display:none}
.g-cap>summary:hover{background:var(--surface-2)}
.g-n{width:28px;height:28px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:Sora;font-size:12px;font-weight:700;color:var(--dim);flex:none}
.g-cap[open] .g-n{background:var(--amber);color:var(--on-amber)}
.g-tit{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.g-tit b{font-family:Sora;font-size:14px;font-weight:600}
.g-tit span{font-size:12px;color:var(--mute)}
.g-chip{flex:none}
.g-chev{flex:none;color:var(--mute);display:grid;transition:transform .2s}

.g-cap[open] .g-chev{transform:rotate(90deg)}
.g-corpo{padding:12px 18px 16px 53px;display:flex;flex-direction:column;gap:13px;border-top:1px solid var(--line-soft)}
.g-voce h4{font-family:Sora;font-size:13px;font-weight:600;margin:0 0 3px}
.g-voce p{margin:0;font-size:13px;line-height:1.55;color:var(--dim)}
.g-voce p b{color:var(--text);font-weight:600}
.g-lampo{box-shadow:0 0 0 2px var(--amber)}
.g-vuoto{display:flex;flex-direction:column;gap:4px;padding:18px;border:1px dashed var(--line);border-radius:var(--r-l);text-align:center;font-size:13px}
.g-vuoto span{color:var(--dim)}
.g-segnala{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.g-segnala .tx{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}
.g-segnala .tx b{font-family:Sora;font-size:14px}
.g-segnala .tx span{font-size:12.5px;color:var(--dim);line-height:1.45}
.g-segnala .btn{white-space:normal;text-align:left;line-height:1.3}
.g-ic-big{width:40px;height:40px;border-radius:12px;background:var(--alert-soft);color:var(--alert);display:grid;place-items:center;flex:none}

.sg-r{padding:12px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.sg-r.fatta{opacity:.72}
.sg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.sg-h b{font-family:Sora;font-weight:600}
.sg-m{color:var(--mute)}
.sg-t{margin-left:auto;color:var(--mute);font-size:11.5px}
.sg-tx{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.sg-meta{font-size:11px;color:var(--mute);overflow-wrap:anywhere;line-height:1.4}
.sg-az{display:flex;gap:8px;flex-wrap:wrap}
.sg-risolte>summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:12px 0 4px;border-top:1px solid var(--line-soft)}
.sg-tipi{display:flex;flex-direction:column;gap:6px}
.sg-tipo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);text-align:left;font-size:13px;width:100%}

.sg-tipo.on svg{color:var(--amber-ink)}
.sg-err{font-size:12.5px;color:var(--alert);background:var(--alert-soft);border-radius:var(--r-m);padding:8px 10px;line-height:1.45}
.sg-ok{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.sg-ok>svg{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--ok-soft);color:var(--ok);flex:none}
.sg-ok div{display:flex;flex-direction:column;gap:4px}
.sg-ok b{font-family:Sora;font-size:14px}
.sg-ok span{font-size:13px;color:var(--dim);line-height:1.5}
.modal.sg-modale textarea{resize:vertical;min-height:110px;line-height:1.45}
#guidaBtn.on{color:var(--amber-ink);background:var(--amber-soft)}
@media (max-width:760px){
  .g-indice{grid-template-columns:1fr}
  .g-corpo{padding-left:16px}
}
@media (max-width:620px){
  .guida{padding-top:4px}
  .g-chip{display:none}
  .g-testa h1{font-size:19px}
  .g-segnala .btn{width:100%;justify-content:center;text-align:center}
}
.pe-t{display:flex;align-items:center;gap:4px;border-radius:9px}
.pe-t:hover{background:var(--surface-3)}
.pe-t-b{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px;text-align:left}
.pe-t-b .tx{flex:1;min-width:0}
.pe-t-b .tx b{font-size:13px;font-weight:600;display:block}
.pe-t-b .tx span{font-size:11.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pe-pen{color:var(--mute);flex:none}
.pe-pen svg{width:13px;height:13px}
.pe-vuota{font-size:12px;color:var(--mute);padding:8px}
.pe-edit{border:1px solid var(--amber);border-radius:10px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:10px;margin:2px 0}
.pe-edit textarea{min-height:110px}
.pe-edit-f{display:flex;align-items:center;gap:8px}
.pe-edit-f .spacer{flex:1}
.pe-nuova-fase{justify-content:center;border-style:dashed}
.pe-err{color:var(--alert);font-size:13px;font-weight:600}
.field label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute)}
.preset-head{padding-top:6px}
.preset-head h2{font-size:20px;letter-spacing:-.02em}
.preset-griglia{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  max-width:1100px;margin:0 auto;width:100%;padding:0 20px 14px}
.preset-c{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);text-align:left;overflow:hidden}
.preset-c::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--acc)}
.preset-b{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%}
.preset-b .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.preset-b .tx b{font:600 14.5px Sora,sans-serif;letter-spacing:-.01em}
.preset-b .tx span{font-size:11.5px;color:var(--mute)}
.preset-b .tx i{font-style:normal;font-size:12px;color:var(--dim);line-height:1.4;margin-top:3px}
.preset-az{display:flex;gap:7px;flex-wrap:wrap}
.preset-c.nuovo{border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;min-height:118px;gap:3px}
.preset-c.nuovo::before{display:none}
.preset-c.nuovo .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--amber-ink);margin-bottom:6px}
.preset-c.nuovo .ic svg{width:18px;height:18px}
.preset-c.nuovo b{font:600 13.5px Sora,sans-serif}
.preset-c.nuovo span{font-size:11.5px;color:var(--mute)}
.preset-tutti{max-width:1100px;margin:0 auto;padding:0 20px 28px}
@media (max-width:620px){
  .preset-griglia{grid-template-columns:1fr;padding:0 14px 12px}
  .preset-tutti{padding:0 14px 24px}
  .pe .wz-b{max-height:none}
}

/* ---------- SOLDI ---------- */
.soldi-barra{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:4px 0 5px}
.soldi-barra i{display:block;height:100%;background:var(--ok);border-radius:3px}
.da-inc{color:var(--amber-ink)}
.conti-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.conti-top > div{padding:10px 11px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);min-width:0}
.conti-top span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  font-family:Sora;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conti-top b{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conti-prev{display:flex;gap:8px}
.conti-prev input{flex:1;min-width:0}
.modal.conti-m{width:min(560px,94vw)}
.mov{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.mov .d{width:64px;flex:none;color:var(--mute);font-size:11.5px}
.mov .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov b{font-weight:600;white-space:nowrap}
.mov .iconbtn{width:28px;height:28px}
.mov .iconbtn svg{width:14px;height:14px}
.mov.vuoto{color:var(--mute);border-bottom:0}
.mov-add{display:grid;grid-template-columns:136px 96px 1fr auto;gap:6px;margin-top:8px}
.mov-add input{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;
  font-size:12.5px;outline:none;min-width:0;width:100%}
.mov-add input:focus{border-color:var(--amber)}

/* ---------- DATE DEL LAVORO ---------- */
.date-l{display:flex;flex-direction:column}
.data-r{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.data-r:last-child{border-bottom:0}
.data-r .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.data-r .tx b{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-r .tx span{font-size:11px;color:var(--mute)}
.data-r .iconbtn{width:28px;height:28px;flex:none}
.data-r .iconbtn svg{width:14px;height:14px}
.data-r.passata{opacity:.55}
.ev .ora{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:9.5px;opacity:.85;margin-right:4px}
.cal-az{display:flex;gap:8px;flex-wrap:wrap}
/* pagina del cliente: la finestra di gestione */
.cl-spiega{display:flex;flex-direction:column;gap:10px}
.cl-spiega>div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px}
.cl-spiega b{display:block;font-family:Sora,sans-serif;font-size:12.5px;margin-bottom:2px}
.cl-spiega span{font-size:12.5px;color:var(--dim);line-height:1.45}
.link-box.spento{opacity:.5;text-decoration:line-through}
/* pagina del cliente: quella che vede lui (fuori dall'app, scorre) */
.pc{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--text);z-index:60;
  font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
.pc-in{max-width:620px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.pc-top{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.pc-top div b{display:block;font:600 14.5px Sora,sans-serif}
.pc-top div span{font-size:12.5px;color:var(--mute)}
.pc-av{width:40px;height:40px;border-radius:50%;background:var(--navy) center/cover no-repeat;display:grid;place-items:center;
  font:600 13px Sora,sans-serif;color:#fff;flex:none}
.pc-av.sm{width:30px;height:30px;font-size:11px}
.pc-kick{font:700 11.5px Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink)}
.pc h1{font:700 clamp(25px,6.4vw,34px)/1.12 Sora,sans-serif;margin:5px 0 10px;letter-spacing:-.015em;overflow-wrap:anywhere}
.pc h2{font:600 15.5px Sora,sans-serif;margin:0 0 10px}
.pc-stato{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--dim);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.pc-stato i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--ring)}
.pc-stato.fatto{color:var(--ok)} .pc-stato svg{width:14px;height:14px}
.pc-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.pc-prog{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pc-num{font:700 38px/1 Sora,sans-serif;letter-spacing:-.02em;min-width:92px}
.pc-num small{font-size:18px;color:var(--mute);margin-left:2px}
.pc-bar{flex:1;height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:6px;background:var(--amber);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pc-fasi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pc-fasi li{display:flex;align-items:center;gap:11px;padding:8px 0;position:relative;color:var(--mute)}
.pc-fasi li:not(:last-child)::after{content:"";position:absolute;left:11px;top:31px;bottom:-7px;width:2px;background:var(--line)}
.pc-fasi li.fatta:not(:last-child)::after{background:var(--ok)}
.pc-fasi li>i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.pc-fasi li.fatta{color:var(--text)} .pc-fasi li.fatta>i{background:var(--ok);border-color:var(--ok);color:#fff}
.pc-fasi li.fatta>i svg{width:13px;height:13px}
.pc-fasi li.corso{color:var(--text);font-weight:700}
.pc-fasi li.corso>i{border-color:var(--amber);box-shadow:0 0 0 4px var(--ring)}
.pc-fasi li.corso>i::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber)}
.pc-fasi em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-amber);
  background:var(--amber);border-radius:6px;padding:1px 7px}
.pc-msg{display:flex;gap:11px}
.pc-msg b{font-family:Sora,sans-serif;font-size:13px}
.pc-msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.pc-msg+.pc-link{margin-top:14px}
.pc-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--on-amber);background:var(--amber);border-radius:14px;padding:13px 15px}
.pc-link span{flex:1;min-width:0} .pc-link b{display:block;font:700 15px Sora,sans-serif}
.pc-link small{display:block;font-size:12.5px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-link svg{width:20px;height:20px;flex:none}
.pc-date>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.pc-date>div:last-child{border-bottom:none}
.pc-date span{color:var(--dim);font-size:13.5px;white-space:nowrap}
.pc-date b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.pc-date .cons b{color:var(--amber-ink)}
.pc-sub{margin:-4px 0 14px;color:var(--dim);font-size:13.5px}
.pc-scelte{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc-scelta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface-2);color:var(--text);font:600 15px Sora,sans-serif;cursor:pointer;padding:10px}
.pc-scelta svg{width:17px;height:17px}
.pc-scelta.ok.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.pc-scelta.mod.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber-ink)}
.pc-form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pc-form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--dim)}
.pc-form label i{font-style:normal;font-weight:400;color:var(--mute)}
.pc-form input,.pc-form textarea{font:16px "DM Sans",system-ui,sans-serif;color:var(--text);background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;resize:vertical;width:100%}
.pc-form input:focus,.pc-form textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--ring)}
.pc-invia{min-height:50px;border:none;border-radius:14px;background:var(--amber);color:var(--on-amber);font:700 15.5px Sora,sans-serif;cursor:pointer}
.pc-invia:disabled{opacity:.6}
.pc-err{color:var(--alert);font-size:13.5px;font-weight:600}
.pc-grazie{display:flex;align-items:center;gap:13px}
.pc-grazie>svg{width:34px;height:34px;padding:7px;border-radius:50%;background:var(--ok-soft);color:var(--ok);flex:none}
.pc-grazie b{font:700 17px Sora,sans-serif} .pc-grazie p{margin:0;color:var(--dim)}
.pc-ancora{margin-top:12px;background:none;border:none;color:var(--amber-ink);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px}
.pc-r{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.pc-r:last-child{border-bottom:none}
.pc-r>div{min-width:0;flex:1}
.pc-r-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-r-h b{font-family:Sora,sans-serif;font-size:13.5px}
.pc-es{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 7px}
.pc-es.ok{color:var(--ok);background:var(--ok-soft)} .pc-es.mod{color:var(--amber-ink);background:var(--amber-soft)}
.pc-q{font-size:12px;color:var(--mute)}
.pc-r p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.pc-piede{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}
.pc-anteprima{display:flex;align-items:center;gap:9px;background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber);
  border-radius:12px;padding:9px 12px;margin-bottom:16px;font-size:13px}
.pc-anteprima svg{width:16px;height:16px;flex:none}
.pc-centro{text-align:center;padding:34px 20px;margin-top:12vh}
.pc-logo{font:700 13px Sora,sans-serif;letter-spacing:.3em;color:var(--amber-ink);margin-bottom:10px}
.pc-carico{text-align:center;color:var(--mute);padding-top:30vh}
@media (min-width:700px){ .pc-in{padding-top:48px} .pc-card{padding:22px} }

@media (max-width:620px){
  /* le procedure guidate sul telefono prendono tutto lo schermo */
  .wz{padding:0;place-items:stretch;overflow:hidden}
  .wz-card,.nl .wz-card{width:100%;height:100%;border-radius:0;border:0;display:flex;flex-direction:column;animation:none}
  .wz-top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
  .nl .wz-top{padding-right:52px}
  .wz-top h2{font-size:20px}
  .wz-top p{font-size:12.5px}
  .wz-b{max-height:none;flex:1;min-height:0;padding:14px 16px 18px}
  .wz-f{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .wz-x{top:calc(8px + env(safe-area-inset-top,0px));right:6px}
  .griglia2{grid-template-columns:1fr}
  .griglia2.stretta{grid-template-columns:1fr 1fr}
  .scelte.prof{grid-template-columns:1fr}
  .nl-add input,.mov-add input,.conti-prev input{font-size:16px}
  .conti-top{grid-template-columns:1fr 1fr}
  .mov-add{grid-template-columns:1fr 1fr}
  .mov-add input[id$="_n"]{grid-column:1 / 2}
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" data-action="spazi" title="Tutti gli spazi di lavoro">
      <div class="mark"></div>
      <div><b>FOSS</b></div>
    </div>
    <button class="iconbtn solo-tel" data-action="nuovo-da-tel" id="piuBtn" title="Nuovo progetto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="iconbtn solo-tel" data-action="home" id="indietroBtn" title="Torna ai progetti" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="crumb" id="crumb"></div>
    <div class="viewswitch" id="viewswitch" hidden></div>
    <div class="spacer"></div>
    <div class="search" id="searchWrap" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Cerca progetto o cliente…" autocomplete="off">
    </div>
    <button class="iconbtn solo-tel" data-action="condividi" id="shareBtn" title="Condividi progetto o task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <button class="iconbtn solo-tel" data-action="menu-telefono" title="Altro">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <button class="iconbtn only-narrow" data-action="toggle-feed" title="Chat del progetto e attività">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.2 7.3L4 20l.8-5A8 8 0 1 1 21 12z"/></svg>
    </button>
    <button class="iconbtn" data-action="annulla" title="Annulla ultima azione (Ctrl+Z)" id="undoBtn"></button>
    <button class="iconbtn" data-action="lock" title="Blocca le modifiche" id="lockBtn"></button>
    <button class="iconbtn" data-action="theme" title="Tema chiaro / scuro" id="themeBtn"></button>
    <button class="iconbtn" data-action="apri-guida" title="Guida: come si fa" id="guidaBtn" aria-label="Guida"></button>
    <button class="iconbtn" data-action="notifiche" title="Notifiche" id="bellBtn"></button>
    <button class="iconbtn" data-action="me" title="Profilo" id="meBtn" style="width:auto;padding:0 4px"></button>
  </header>

  <main class="stage" id="stage"></main>
  <div id="bannerSlot"></div>
  <nav class="phasebar" id="phasebar"></nav>
  <nav class="tabbar" id="tabbar" hidden aria-label="Sezioni"></nav>
</div>

<div class="scrim" id="scrim" data-action="close-all"></div>

<aside class="drawer" id="drawer" aria-label="Notifiche">
  <div class="drawer-h">
    <h3>Notifiche</h3>
    <button class="btn sm ghost" data-action="read-all">Segna tutte</button>
    <button class="iconbtn" data-action="close-all" title="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="nlist" id="nlist"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalSlot"></div>
<div class="alert-layer" id="alertLayer" role="alertdialog" aria-live="assertive"></div>
<div class="fade-layer on avvio" id="fadeLayer" aria-hidden="true"><div class="fade-in"><div class="mark"></div><h2>FOSS</h2><div class="bar"><i></i></div></div></div>

<script>
(function(){
"use strict";

/* ============ ICONE ============ */
const I = {
  brief:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',

  deliver:'<path d="M21 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M1 4h22v4H1zM10 12h4"/>',
  bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  rewind:'<circle cx="13.5" cy="13.5" r="7.5"/><path d="M13.5 9.5v4l2.5 1.5"/><path d="M11 2.5h5"/><path d="M6 13.5H2.5m0 0L5 11m-2.5 2.5L5 16"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  cerca:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  check:'<path d="m4 12 5 5L20 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  send:'<path d="m3 11 18-8-8 18-2-7z"/>',

}

/* «Titolo|voce;voce [a, b];voce» → {titolo, items} */
function taskDa(s){
  const i = s.indexOf('|');
  const titolo = (i<0? s : s.slice(0,i)).trim();
  const items = (i<0? '' : s.slice(i+1)).split(';').map(v=>v.trim()).filter(Boolean).map(v=>{
    const m = /^(.*?)\s*\[(.*)\]\s*$/.exec(v);
    if(!m) return {t:v, done:false};
    return {t:m[1].trim(), done:false,
            lista:m[2].split(',').map(c=>c.trim()).filter(Boolean).map(c=>({t:c, done:false}))};
  });
  return {titolo, items};
}
/* le task di partenza, fase per fase, per una professione e un tipo di lavoro */
function pianoDi(tipo, lavoro){
  const T = TIPO(tipo), L = (lavoro && T.lavori && T.lavori[lavoro]) || null;
  const via = (L && L.via) || [];
  return T.fasi.map((f,i)=>{
    const base = (T.task[i]||[]).map(taskDa).filter(t=>via.indexOf(t.titolo)<0);
    const extra = ((L && L.task && L.task[i]) || []).map(taskDa);
    return {nome:f.nome, icon:f.icon, desc:f.desc, campi:(f.campi||[]).map(c=>c.slice()), task:base.concat(extra)};
  });
}

/* Le task di partenza di un progetto. Negli esempi le fasi già passate
   risultano fatte e quella in corso a metà; un lavoro nuovo parte pulito. */
function mkSubs(faseCorrente, nFasi, tipo, lavoro){
  const out=[]; let n=0;
  pianoDi(tipo, lavoro).slice(0, nFasi||99).forEach((f,fi)=>{
    f.task.forEach((t,j)=>{
      const passata = fi < faseCorrente, attuale = fi === faseCorrente && faseCorrente > 0;
      const quanti = passata ? t.items.length : attuale ? (j===0? Math.max(1,t.items.length-2) : 0) : 0;
      t.items.forEach((v,i)=>{ v.done = i < quanti; if(v.lista) v.lista.forEach(c=>{ c.done = v.done; }); });
      out.push({id:'s'+(++n)+'_'+fi, fase:fi, titolo:t.titolo, aperto:fi===faseCorrente && j===0, items:t.items});
    });
  });
  return out;
}

function P(o){
  const p = Object.assign({
    fase:0, avanz:0, revisione:false, tab:'commenti', draft:'',
    tipo:'video', prio:'media', indirizzo:'', nota:'', allegati:[], tags:[], icona:null, coord:null,
    ord:-1,   /* con l'ordine a mano, un progetto nuovo si mette davanti */
    spazio:'sp1',
    commenti:{}, chat:[], log:[], visti:{commenti:0, chat:0, attivita:0}, faseAss:{},
    lock:{on:false, pw:''}, completato:false
  }, o);
  const TP = TIPI[p.tipo] || TIPI.video;
  if(!p.fasi) p.fasi = TP.fasi.map(f=>Object.assign({}, f, {campi:(f.campi||[]).map(c=>c.slice())}));
  if(!p.icona) p.icona = TP.ic;
  p.avanz = p.fase;
  delete p.preset;
  /* le task arrivano gia' pronte dalla procedura guidata; per gli esempi le preparo qui */
  if(!Array.isArray(o.subs)) p.subs = (o.preset===false) ? [] : mkSubs(p.fase, p.fasi.length, p.tipo, p.lavoro);
  /* ogni fase e ogni task hanno un responsabile */
  const t = p.team || [state.utente];
  FZ(p).forEach((f,i)=>{ if(p.faseAss[i]==null) p.faseAss[i] = t[i % t.length]; });
  p.subs.forEach((s,i)=>{ if(!s.assegnato) s.assegnato = t[(i+1) % t.length]; });
  /* Un progetto già avviato non può avere il registro vuoto: le fasi che ha
     alle spalle sono successe, e il registro deve raccontarle. */
  if(!p.log.length && p.fase > 0){
    const F = FZ(p);
    for(let i = p.fase; i > 0; i--){
      p.log.push({tx:'Fase <b>'+F[i-1].nome+'</b> chiusa, si passa a <b>'+F[i].nome+'</b>', ts:'fase '+i, acc:true});
    }
    p.log.push({tx:'Progetto aperto su <b>'+F[0].nome+'</b>', ts:'inizio', acc:false});
  }
  return p;
}

const TAG_OK = /^(b|strong|u|i|em|br|div|code)$/i;
function sicuro(h){
  const s = String(h==null ? '' : h), re = /<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/g;
  const testo = t => t.replace(/[<>"]/g, c=>({'<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let out = '', i = 0, m;
  while((m = re.exec(s))){
    out += testo(s.slice(i, m.index));
    if(TAG_OK.test(m[2])) out += '<'+m[1]+m[2].toLowerCase()+'>';
    i = re.lastIndex;
  }
  return out + testo(s.slice(i));
}

function menzioni(html){
  let inLink = 0;
  return String(html).split(/(<[^>]*>)/).map(pz=>{
    if(pz.charAt(0)==='<'){ if(/^<a[\s>]/i.test(pz)) inLink++; else if(/^<\/a>/i.test(pz)) inLink = Math.max(0, inLink-1); return pz; }
    if(inLink) return pz;                        // dentro un link (o nei suoi attributi) la @ non e' una menzione
    return pz.replace(/@([A-Za-zÀ-ÿ][\wÀ-ÿ'.-]*(?:\s[A-ZÀ-Ý][\wÀ-ÿ'.-]*)?)/g, (m, nome)=>{
      const u = state.utenti.find(z=> z.nome.toLowerCase().startsWith(nome.toLowerCase().trim()) ||
                                      nome.toLowerCase().trim().startsWith(z.nome.split(' ')[0].toLowerCase()));
      if(!u) return m;
      return '<span class="menz">@'+esc(u.nome.split(' ')[0])+'</span>';
    });
  }).join('');
}

function linkifica(html){

function mezzanotte(d){ const x = new Date(d||Date.now()); x.setHours(0,0,0,0); return x; }
let OGGI = mezzanotte();
function isoDi(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function giorniA(dmy){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dmy||''); if(!m) return null;
  return Math.round((new Date(+m[3],+m[2]-1,+m[1]) - OGGI)/86400000);
}
const GIORNI_SETT = ['domenica','luned\u00ec','marted\u00ec','mercoled\u00ec','gioved\u00ec','venerd\u00ec','sabato'];
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function dataDi(dmy){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dmy||''); if(!m) return null;
  return new Date(+m[3],+m[2]-1,+m[1]);
}
/* La scadenza detta come la direbbe una persona: "domani", "gioved\u00ec",
   e solo da lontano la data. Il rosso lo uso solo quando serve davvero. */
function scadenza(p){
  const g = giorniA(p.consegna), d = dataDi(p.consegna);
  if(g===null) return {t:'\u2014', c:''};
  /* un lavoro chiuso non \u00e8 in ritardo: \u00e8 consegnato */
  if(p.completato) return {t: d? 'Consegnato il '+d.getDate()+' '+MESI_BREVI[d.getMonth()] : 'Consegnato', c:'fatto'};
  if(g<0){
    const n = -g;
    return {t: n===1? 'Scaduto ieri' : n<7? 'Scaduto '+n+' giorni fa'
              : n<14? 'Scaduto una settimana fa' : 'Scaduto il '+d.getDate()+' '+MESI_BREVI[d.getMonth()], c:'alert'};
  }
  if(g===0) return {t:'Oggi', c:'alert'};
  if(g===1) return {t:'Domani', c:'alert'};
  if(g===2) return {t:'Dopodomani', c:'alert'};
  if(g<=6) return {t:GIORNI_SETT[d.getDay()][0].toUpperCase()+GIORNI_SETT[d.getDay()].slice(1), c:'now'};
  if(g<=13) return {t:'Tra una settimana', c:'now'};
  return {t: d.getDate()+' '+MESI_BREVI[d.getMonth()] + (d.getFullYear()!==OGGI.getFullYear()? ' '+d.getFullYear():''), c:''};
}

  if(f.tag && !(p.tags||[]).some(t=>t.toLowerCase()===f.tag.toLowerCase())) return false;
  if(f.fase!=null && p.avanz!==f.fase) return false;
  if(f.cliente && !p.cliente.toLowerCase().includes(f.cliente.toLowerCase())) return false;
  return true;
}

function listaProgetti(){
  const q = state.filtro.toLowerCase();
  const f = filtriDiSpazio().find(x=>x.id===state.filtroAttivo);
  const l = state.progetti.filter(p=> p.spazio===state.spazioId && vedeProgetto(p) &&
        (!q || testoCercabile(p).includes(q)) && passaFiltro(p,f));
  const o = state.ordina;
  return l.sort((a,b)=>{
    if(!!a.completato !== !!b.completato) return a.completato? 1 : -1;
    /* ordine deciso a mano: chi l'ha spostato vince su tutto il resto */
    if(o==='manuale') return (a.ord??9999)-(b.ord??9999);
    if(o==='scadenza') return (giorniA(a.consegna)??999)-(giorniA(b.consegna)??999);
    if(o==='cliente') return a.cliente.localeCompare(b.cliente);
    if(o==='fase') return b.avanz-a.avanz;
    return (PESO[a.prio]-PESO[b.prio]) || ((giorniA(a.consegna)??999)-(giorniA(b.consegna)??999));
  });
}
function prog(p, fase){
  const s = p.subs.filter(x=>fase==null || x.fase===fase);
  let t=0,d=0; s.forEach(x=>x.items.forEach(i=>{t++; if(i.done)d++;}));
  return t? Math.round(d/t*100) : 0;
}

/* ============ REGISTRO + ANNULLA ============ */
let undoStack = [];
function dataOra(){
  const d = new Date();
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+
         ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function azione(tx){
  state.azioni.unshift({ts:dataOra(), tx, chi:nomeVisibile()});
  if(state.azioni.length>200) state.azioni.pop();
}
function snap(desc){
  try{
    undoStack.push({desc, progetti:JSON.parse(JSON.stringify(state.progetti))});
    if(undoStack.length>40) undoStack.shift();
  }catch(e){}
}
function annulla(){
  const u = undoStack.pop();
  /* pila vuota: lo dice il tasto stesso con una scrollata di spalle */
  if(!u){ const b = el('undoBtn'); if(b){ b.classList.remove('nulla'); void b.offsetWidth; b.classList.add('nulla'); } return; }
  /* commenti, chat e «letti» non si annullano: sono di chi li ha scritti e arrivano anche dagli altri */
  const adesso = {}; state.progetti.forEach(x=>{ adesso[x.id] = x; });
  u.progetti.forEach(x=>{ const q = adesso[x.id]; if(q){ x.commenti = q.commenti; x.chat = q.chat; x.visti = q.visti; } });
  state.progetti = u.progetti;
  if(state.progettoId && !PROJ()) state.progettoId = state.progetti[0] && state.progetti[0].id;
  azione('Annullata l\'azione: <b>'+u.desc+'</b>');
  render();
  toast(u.desc,'ok','Annullato');
}
function isLock(p){ return !!(p && (p.completato || (p.lock && p.lock.on))) || !!state.ospite; }
function bloccato(p){
  if(state.ospite){ toast('Stai guardando in sola lettura.','warn','Visualizzatore esterno'); return true; }
  if(p && p.completato){
    toast('«'+p.nome+'» è completato. Riaprilo per poterlo modificare.','warn','Progetto chiuso');
    return true;
  }
  if(!(p && p.lock && p.lock.on)) return false;
  toast('«'+p.nome+'» è bloccato. Serve la password per modificarlo.','warn','Progetto bloccato');
  return true;
}

/* ============ FEEDBACK ============ */
let toastN = 0;
function toast(testo, tipo, titolo){
  /* niente conferme: passano solo gli avvisi che bloccano davvero qualcosa */
  if(tipo!=='warn') return;
  const n = el('toasts'); const id = 'tst'+(++toastN);
  const ic = tipo==='ok'?'check':tipo==='warn'?'bell':'spark';
  const d = document.createElement('div');
  d.className = 'toast '+(tipo||'info'); d.id = id;
  d.innerHTML = '<div class="ic">'+svg(ic,2.4)+'</div><div>'+(titolo?'<b>'+esc(titolo)+'</b> ':'')+esc(testo)+'</div><i class="bar"></i>';
  n.appendChild(d);
  setTimeout(()=>{ const x=el(id); if(x){ x.classList.add('out'); setTimeout(()=>x.remove(),260);} }, 3400);
  while(n.children.length>3) n.firstChild.remove();
}
function logga(p, tx, acc, daAltri){
  p.log.unshift({tx, ts:'oggi '+oraOra(), acc:!!acc, u:state.utente, t:Date.now()});
  /* quello che faccio io l'ho gia' visto: non accende il pallino rosso */
  if(!daAltri && p.visti) p.visti.attivita = (p.visti.attivita||0) + 1;
  if(p.log.length>40) p.log.pop();
  if(p.visti && p.visti.attivita > p.log.length) p.visti.attivita = p.log.length;
}
/* Quello che faccio io resta nello storico della campanella ma non la
   accende: il pallino e' solo per le cose fatte dagli altri. */
function notifica(tx, pid, f, ic, daAltri){
  state.notifiche.unshift({id:'n'+Date.now(), tx, p:pid, f, ts:'ora', t:Date.now(), nuova:!!daAltri, ic:ic||'spark'});
  renderTop(); const b = el('bellBtn').querySelector('.bell-dot');
  if(b){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
}
function flash(sel){
  const n = typeof sel === 'string' ? $(sel) : sel;
  if(!n) return; n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
}

/* in quale colonna vive un progetto */
function statoDi(p){
  if(p.completato) return 'fatto';
  const pc = prog(p);
  return (p.avanz>0 || pc>0) ? 'corso' : 'dafare';
}
const GRUPPI = [
  {id:'dafare', nome:'Da fare',   c:'var(--dim)',  ds:'non ancora iniziati'},
  {id:'corso',  nome:'In corso',  c:'var(--amber-ink)', ds:'lavorazione aperta'},
  {id:'fatto',  nome:'Completati',c:'var(--ok)',   ds:'chiusi'}
];

function rigaLista(p){
  const s = scadenza(p), T = TIPO(p.tipo), pc = prog(p);
  const resp = U(p.faseAss? (p.faseAss[p.fase]||p.team[0]) : p.team[0]);
  return '<div class="rg'+(p.completato?' fatto':'')+'" style="--acc:'+p.col+'" role="button" tabindex="0" '+

    '<span class="prio '+p.prio+'">'+PRIO[p.prio]+'</span>'+
    av(resp,'sm')+
    '<span class="quando'+(s.c==='alert'?' urg':'')+'">'+(p.consegna==='—'?'—':s.t)+'</span>'+
    '<span class="barra"><i><b style="width:'+pc+'%"></b></i><span>'+pc+'%</span></span>'+

function gruppiDi(lista){
  if(state.raggruppa==='scadenza'){
    const b = (n,c,f)=>({id:n, nome:n, c:c, ps:lista.filter(f)});
    return [
      b('Scadenza oggi','var(--alert)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g<=0;}),
      b('Questa settimana','var(--amber-ink)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g>0 && g<=7;}),
      b('Prossime scadenze','var(--dim)', p=>{const g=giorniA(p.consegna); return !p.completato && g!=null && g>7;}),
      b('Senza scadenza','var(--mute)', p=>!p.completato && giorniA(p.consegna)==null),
      b('Completati','var(--ok)', p=>!!p.completato)
    ];
  }
  if(state.raggruppa==='priorita'){
    return Object.keys(PRIO).map(k=>({id:k, nome:'Priorità '+PRIO[k].toLowerCase(),
      c: k==='alta'?'var(--alert)':k==='media'?'var(--amber-ink)':'var(--mute)',
      ps: lista.filter(p=>p.prio===k)}));
  }
  return GRUPPI.map(g=>Object.assign({}, g, {ps:lista.filter(p=>statoDi(p)===g.id)}));
}
function segmenti(){
  const V = [['compiti','Compiti','Divisi per stato: da fare, in corso, completati'],
             ['priorita','Priorità','Dal più urgente al meno urgente'],
             ['scadenza','Scadenza','Oggi, questa settimana, più avanti']];
  const att = V.find(v=>v[0]===state.raggruppa) || V[0];
  return '<div style="display:flex;align-items:center;gap:10px;margin:0 0 14px"><div class="seg">'+
    V.map(v=>'<button class="'+(state.raggruppa===v[0]?'on':'')+'" data-action="raggruppa" data-k="'+v[0]+'">'+v[1]+'</button>').join('')+
    '</div><span class="solo-largo" style="font-size:11.5px;color:var(--mute)">'+att[2]+'</span></div>';
}

function renderLista(lista){

function renderCal(lista){
  const m = state.meseCal, anno = m.getFullYear(), mese = m.getMonth();
  const nomeMese = m.toLocaleDateString('it-IT',{month:'long'});
  const primo = new Date(anno,mese,1);
  let start = new Date(primo); start.setDate(1 - ((primo.getDay()+6)%7));
  const oggi = isoDi(OGGI);
  let h = '<div class="cal-head" style="padding-top:0">'+
    '<span class="count">Consegne e giornate di ripresa</span>'+
    '<div class="cal-nav"><button class="iconbtn" data-action="mese" data-d="-1" title="Mese precedente">'+svg('left')+'</button>'+
      '<h2 class="cal-title">'+nomeMese+' <span>'+anno+'</span></h2>'+
      '<button class="iconbtn" data-action="mese" data-d="1" title="Mese successivo">'+svg('right')+'</button></div>'+
    '<div style="justify-self:end"><button class="btn sm" data-action="oggi">Oggi</button></div></div>';
  h += '<div class="cal-wrap"><div class="cal">';
  ['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'].forEach(d=> h+='<div class="dow">'+d+'</div>');
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    const fuori = d.getMonth()!==mese, wk = d.getDay()===0||d.getDay()===6;
    const quanti = lista.reduce((n,p)=>n+(p.eventi||[]).filter(e=>e.d===iso).length,0);
    h += '<div class="day'+(fuori?' out':'')+(wk&&!fuori?' wknd':'')+(iso===oggi?' today':'')+
      (quanti?' ha-eventi':'')+'" data-iso="'+iso+'">'+
      '<span class="n">'+d.getDate()+'</span><div class="evs">';
    const delGiorno = [];
    lista.forEach(p=> (p.eventi||[]).forEach((e,ix)=>{ if(e.d===iso) delGiorno.push({p, e, ix}); }));
    delGiorno.sort((a,b)=>String(a.e.ora||'').localeCompare(String(b.e.ora||'')));
    delGiorno.forEach(({p, e, ix})=>{
      h += '<div class="ev" role="button" tabindex="0"'+
        ' style="--acc:'+p.col+'" data-action="apri" data-id="'+p.id+'" data-p="'+p.id+'" data-i="'+ix+'"'+
        ' title="'+esc(p.cliente+' — '+e.t)+(isLock(p)?' (bloccato)':' — trascinabile, tasto destro per le opzioni')+'">'+
        (isLock(p)? svg('lock').replace('<svg','<svg style="width:9px;height:9px;flex:none"') : '')+
        (e.ora? '<i class="ora">'+esc(e.ora)+'</i>' : '')+
        '<b>'+esc(p.cliente||p.nome)+'</b> '+esc(e.t)+'</div>';
    });
    h += '</div></div>';
  }
  h += '</div></div>';
  return h;
}

/* ============ PROGETTO ============ */
/* Avanzamento fase: cerchio o tasto COMPLETATO.
   compatto = versione inline per tablet e telefono, dove la colonna di sinistra non c'è. */
function avanzamentoHTML(p,pct,F,R,C,compatto){
  if(p.completato){
    return (compatto?'':'<div class="lbl">Progetto</div>')+
      '<div class="chip fatto" style="font-size:12px;padding:6px 12px">'+svg('check')+'COMPLETATO</div>'+
      '<button class="btn sm ghost" style="'+(compatto?'':'margin-top:10px;width:100%;')+'justify-content:center" data-action="riapri-progetto" data-pid="'+p.id+'">'+
        svg('undo')+'Riapri il progetto</button>';
  }
  if(pct===100){
    const ultima = p.fase >= FZ(p).length-1;
    const nota = ultima? 'Chiude il progetto e ti riporta ai progetti. Si riapre quando vuoi.'
                       : 'Passa alla fase <b>'+esc(FZ(p)[p.fase+1].nome)+'</b>.';
    return (compatto?'':'<div class="lbl">'+esc(F.nome)+' al 100%</div>')+
      '<button class="btn-completa" data-action="completa" data-pid="'+p.id+'" title="'+(ultima?'Chiude il progetto':'Passa alla fase successiva')+'">'+
        svg('check',3)+'COMPLETATO</button>'+
      '<div class="nota-completa" style="font-size:11px;color:var(--mute);margin-top:8px;line-height:1.4">'+nota+'</div>';
  }
  return (compatto?'':'<div class="lbl">Avanzamento fase</div>')+
    '<div class="ring-wrap"><svg class="ring" viewBox="0 0 56 56"><circle class="bgc" cx="28" cy="28" r="'+R+'"/>'+
    '<circle class="fg" cx="28" cy="28" r="'+R+'" stroke-dasharray="'+(C*pct/100)+' '+C+'" transform="rotate(-90 28 28)"/></svg>'+
    '<div><div class="ring-n mono">'+pct+'%</div><div style="font-size:11px;color:var(--mute)">'+esc(F.nome)+'</div></div></div>';
}

    p.log.forEach(l=> h += '<div class="log'+(l.acc?' acc':'')+'"><i class="dot"></i><div><div>'+sicuro(l.tx)+'</div><div class="ts">'+esc(l.ts||'')+'</div></div></div>');
  }
  h += '</div>';
  if(tab==='chat' && !state.ospite){
    h += '<div class="composer"><textarea id="composer" rows="1" placeholder="Scrivi al team\u2026"></textarea>'+
      '<button class="send" data-action="invia" title="Invia">'+svg('send',2)+'</button></div>';
  }
  h += '</aside></div></div>';

  el('stage').innerHTML = h;
  const c = el('composer'); if(c){ c.value = p.draft||''; }
  /* la scheda aperta si considera vista */
  /* ...ma solo se il pannello e' davvero aperto davanti agli occhi */
  if(state.showFeed){
    if(tab==='chat'){ p.visti.chat = p.chat.length; p.visti.commenti = totCommenti(p); }
    else p.visti.attivita = p.log.length;
  }
}
/* ---------- CHECKLIST ----------
   Una subtask puo' avere la sua lista di controllo (batterie, schede,
   cavalletto...). Si spunta voce per voce: quando sono tutte fatte, la
   subtask si chiude da sola. */
const listeAperte = new Set();
function checklistHTML(p, s, i, ix){
  const mod = puo('modifica') && !bloccato(p) && !state.ospite;
  return '<div class="cl" id="cl_'+s.id+'_'+ix+'">'+
    i.lista.map((v,j)=>'<div class="cl-r'+(v.done?' done':'')+'">'+
      '<span class="box" role="button" tabindex="0" data-action="check-lista" data-id="'+s.id+'" data-i="'+ix+'" data-j="'+j+'" '+
        'aria-label="'+(v.done?'Togli la spunta':'Segna come fatta')+'">'+svg('check',3.2)+'</span>'+
      '<span class="tx">'+esc(v.t)+'</span>'+
      (mod? '<button class="cl-x" data-action="togli-voce" data-id="'+s.id+'" data-i="'+ix+'" data-j="'+j+'" title="Togli la voce" aria-label="Togli la voce">'+svg('x',2.4)+'</button>' : '')+
    '</div>').join('')+
    (i.lista.length? '' : '<div class="cl-vuota">Lista vuota: scrivi qui sotto la prima voce.</div>')+
    (mod? '<div class="cl-add"><input data-cl="'+s.id+'|'+ix+'" placeholder="Aggiungi una voce\u2026" maxlength="120" enterkeyhint="done">'+
      '<button class="btn sm" data-action="add-lista" data-id="'+s.id+'" data-i="'+ix+'">'+svg('plus')+'</button></div>' : '')+
  '</div>';
}
/* la subtask con la checklist si chiude e si riapre da sola */
function allineaLista(it){
  if(!it.lista || !it.lista.length) return false;
  const prima = it.done;
  it.done = it.lista.every(v=>v.done);
  return it.done !== prima;
}

/* la prossima subtask aperta: prima le mie, poi quelle di chiunque */
function prossimaCosa(p){
  const mie = [], altre = [];
  p.subs.forEach(t=>{
    if(t.fase < p.fase) return;               // fasi gia chiuse
    t.items.forEach((it,i)=>{
      if(it.done) return;
      const voce = {t, it, i, fase:t.fase, mia:(t.assegnato===state.utente)};
      (voce.mia? mie : altre).push(voce);
    });
  });
  const ordina = a => (a.fase!==p.fase? 1:0);
  mie.sort((a,b)=>ordina(a)-ordina(b)||a.fase-b.fase);
  altre.sort((a,b)=>ordina(a)-ordina(b)||a.fase-b.fase);
  return {voce: mie[0] || altre[0] || null, mie: mie.length, tutte: mie.length+altre.length};
}

function xProssima(){
  return '<button class="chiudi-saluti fuori" data-action="chiudi-saluti" data-b="prossima" '+
    'title="Nascondi: leggo la lista" aria-label="Nascondi">'+svg('x',2.6)+'</button>';
}
function barraProssima(p){
  if(p.completato || !boxProssima) return '';
  const {voce, mie, tutte} = prossimaCosa(p);
  if(!voce){
    return '<div class="prossima calma">'+xProssima()+'<span class="ic">'+svg('check',3)+'</span>'+
      '<span class="tx"><span class="lb">Tutto spuntato</span>'+
      '<b>Non resta niente da fare in questo progetto</b>'+
      '<span>Puoi avanzare di fase o chiuderlo.</span></span></div>';
  }
  const dove = FZ(p)[voce.fase] ? FZ(p)[voce.fase].nome : '';
  return '<div class="prossima">'+xProssima()+'<span class="ic">'+svg('spark',2.4)+'</span>'+
    '<span class="tx"><span class="lb">'+(voce.mia? 'Tocca a te' : 'Prossima cosa da fare')+'</span>'+
    '<b>'+esc(voce.it.t)+'</b>'+

/* ============ SPAZI DI LAVORO ============ */
const SPZ = () => state.spazi.find(x=>x.id===state.spazioId) || state.spazi[0];
/* In locale l'archivio e' mio e vedo tutto. In cloud lo strato Supabase
   mette a false questa variabile quando entro come collaboratore di un altro. */
let sonoTitolare = true;
/* Amministratore: vede tutto, crea i profili e decide chi vede ogni lavoro.
   Guest: vede solo i lavori che l'amministratore gli ha aperto.
   In locale sono sempre amministratore; nel cloud lo decide il database. */
let sonoAdmin = true;
/* I permessi del guest: di base puo' fare tutto, l'amministratore spegne
   quello che vuole togliergli. Arrivano dal database. */
let mieiPermessi = {};
const PERMESSI = [
  {k:'crea_lavori', l:'Creare lavori',              d:'Nuovi progetti e copie di quelli esistenti'},
  {k:'modifica',    l:'Creare e modificare task',   d:'Task, subtask, checklist, nomi, date, fasi e commenti'},
  {k:'spunta',      l:'Spuntare',                   d:'Segnare come fatte subtask e voci delle checklist'},
  {k:'elimina',     l:'Eliminare',                  d:'Lavori, task, subtask, note ed eventi'},
  {k:'visibilita',  l:'Decidere chi vede un lavoro',d:'Aprire o chiudere i suoi lavori ad altre persone'},
  {k:'spazi',       l:'Gestire gli spazi',          d:'Creare e rinominare spazi, scrivere nella bacheca'}
];
function puo(k){
  if(sonoAdmin) return true;
  /* i soldi sono l'eccezione: di base un guest non li vede */
  if(k==='soldi') return mieiPermessi.soldi === true;
  if(k==='soldi-scrive') return mieiPermessi.soldi === true && !mieiPermessi.sola_lettura;
  if(mieiPermessi.sola_lettura) return false;
  return mieiPermessi[k] !== false;
}
/* cose che restano solo dell'amministratore, qualunque permesso abbia il guest */
const SOLO_ADMIN = ['nuovo-profilo','crea-profilo','togli-profilo','togli-profilo-ok','permessi','perm-toggle',
  'togli-accesso','togli-accesso-ok','registro','registro-chi','registrati','crea-utente'];
const PERM_AZIONE = {
  'nuovo':'crea_lavori','nl-crea':'crea_lavori','duplica':'crea_lavori',
  'salva-modello-apri':'crea_lavori','salva-modello':'crea_lavori','togli-modello':'crea_lavori','togli-modello-ok':'crea_lavori',
  'cm-invia':'modifica',
  'pe-nuovo':'crea_lavori','pe-importa':'crea_lavori','pe-salva':'crea_lavori','pe-elimina':'crea_lavori','pe-usa':'crea_lavori',
  'conti':'soldi','conti-prev':'soldi-scrive','conti-add':'soldi-scrive','conti-togli':'soldi-scrive',
  'data-nuova':'modifica','data-salva':'modifica',
  'edit':'modifica','salva-campo':'modifica','nuova-task':'modifica','add-compito':'modifica',
  'tagga':'modifica','tagga-chi':'modifica','stagga':'modifica','assegna-sub':'modifica','assegna-sub-chi':'modifica',
  'fase':'modifica','indietro':'modifica','torna-a-fase':'modifica','riprendi':'modifica','completa':'modifica',
  'riapri-progetto':'modifica','menu-sposta':'modifica','lock':'modifica','attiva-lock':'modifica','invia':'modifica',
  'nuova-lista':'modifica','add-lista':'modifica','togli-voce':'modifica',

  'elimina-progetto':'elimina','conferma-elimina':'elimina','elimina-task':'elimina','elimina-compito':'elimina',
