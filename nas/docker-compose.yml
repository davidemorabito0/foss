# FOSS.chat — server dei media sul NAS (Container Station → Applicazioni → Crea)
# In CF va incollato il comando copiato da Cloudflare (tunnel «fosschat-nas»), anche intero.
services:
  media:
    image: node:22-alpine
    container_name: fosschat-media
    restart: unless-stopped
    command: ["sh", "-c", "wget -qO /tmp/avvio.sh https://foss.team/nas/avvio.sh && exec sh /tmp/avvio.sh"]
    volumes:
      - /share/FOSSchat:/data
    environment:
      - PUBBLICO=https://media.foss.team
      - CF=INCOLLA_QUI
