<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="FOSS.chat: la chat del tuo team su FOSS.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111b21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone/favicon.svg?v=45" type="image/svg+xml">
<link rel="icon" href="icone/favicon-32.png?v=45" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icone/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOSS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<script>
/* dal vecchio indirizzo (GitHub Pages) si passa a foss.team, come fa FOSS */
(function(){
  if(!/\.github\.io$/i.test(location.hostname)) return;
  var dove = 'https://foss.team/chat.html' + location.search + location.hash;
  fetch('https://foss.team/manifest.json', {mode:'no-cors', cache:'no-store'})
    .then(function(){ location.replace(dove); }, function(){});
})();
/* il tema giusto prima di disegnare qualsiasi cosa: niente lampi bianchi */
(function(){
  try{
    var c = JSON.parse(localStorage.getItem('fosschat_cfg') || '{}');
    var t = c.tema || 'sistema';
    if(t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'chiaro' : 'scuro';
    document.documentElement.setAttribute('data-tema', t);
    if(c.testo) document.documentElement.setAttribute('data-testo', c.testo);
  }catch(e){ document.documentElement.setAttribute('data-tema', 'scuro'); }
})();
</script>
<title>FOSS.chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ================= FOSS.chat ================= */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
  --verde:#00a884; --verde-forte:#008069; --verde-chiaro:#25d366; --blu-spunta:#53bdeb;
  --rosso:#ea0038; --ambra:#FFAD01;
  --r:8px; --t:14.2px;
}
:root[data-testo="piccolo"]{ --t:13px }
:root[data-testo="grande"]{ --t:16.5px }
:root[data-tema="scuro"]{
  --app:#0c1317; --pannello:#111b21; --testa:#202c33; --sfondo-chat:#0b141a;
  --mio:#005c4b; --suo:#202c33; --testo:#e9edef; --testo-2:#8696a0; --testo-3:#667781;
  --linea:#222d34; --hover:#202c33; --scelta:#2a3942; --campo:#2a3942; --icona:#aebac1;
  --menu:#233138; --ombra:0 2px 5px rgba(11,20,26,.26), 0 2px 10px rgba(11,20,26,.16);
  --badge:#00a884; --badge-testo:#111b21; --sistema:#182229; --sistema-testo:#8696a0;
  --citazione:#1d282f; --citazione-mio:#025144; --doodle:.06; --link:#53bdeb;
  color-scheme:dark;
}
:root[data-tema="chiaro"]{
  --app:#eae6df; --pannello:#ffffff; --testa:#f0f2f5; --sfondo-chat:#efeae2;
  --mio:#d9fdd3; --suo:#ffffff; --testo:#111b21; --testo-2:#667781; --testo-3:#8696a0;
  --linea:#e9edef; --hover:#f5f6f6; --scelta:#f0f2f5; --campo:#ffffff; --icona:#54656f;
  --menu:#ffffff; --ombra:0 2px 5px rgba(11,20,26,.16), 0 2px 10px rgba(11,20,26,.12);
  --badge:#25d366; --badge-testo:#ffffff; --sistema:#ffffff; --sistema-testo:#54656f;
  --citazione:#f5f6f6; --citazione-mio:#d1f4cc; --doodle:.07; --link:#027eb5;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--app);color:var(--testo);font:400 var(--t)/1.35 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
img{display:block}
svg{display:block}
.nascosto{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(134,150,160,.35);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh;height:100dvh;width:100%;position:relative;overflow:hidden;background:var(--pannello)}
@media (min-width:1441px){
  body{background:var(--app)}
  #app{max-width:1600px;margin:0 auto;height:calc(100dvh - 38px);top:19px;box-shadow:0 6px 18px rgba(11,20,26,.18)}
}

/* ---------- colonna sottile (desktop) ---------- */
.rail{width:64px;flex:none;background:var(--testa);border-right:1px solid var(--linea);display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:6px}
.rail .spazio{flex:1}
.rail-b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--icona);position:relative}
.rail-b:hover{background:rgba(134,150,160,.15)}
.rail-b.on{background:rgba(134,150,160,.22);color:var(--testo)}
.rail-b svg{width:24px;height:24px}
.rail-b .pall{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--badge);color:var(--badge-testo);
  font:600 11px/18px var(--font);padding:0 4px;text-align:center}
.rail-b .av{width:32px;height:32px;font-size:13px}
.rail-foss{width:40px;height:40px;border-radius:12px;overflow:hidden}
.rail-foss svg{width:40px;height:40px}

/* ---------- colonna delle chat ---------- */
.lato{width:30%;min-width:340px;max-width:480px;flex:none;display:flex;flex-direction:column;background:var(--pannello);
  border-right:1px solid var(--linea);position:relative;overflow:hidden}
.lato-testa{height:59px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;background:var(--pannello)}
.lato-testa h1{flex:1;margin:0;font:700 22px/1 var(--font);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.lato-testa h1 small{font:600 10px/1 var(--font);letter-spacing:.08em;color:var(--ambra);border:1px solid currentColor;border-radius:5px;padding:3px 5px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--icona);flex:none;position:relative}
.ib:hover{background:rgba(134,150,160,.15)}
.ib svg{width:24px;height:24px}
.ib.piccolo svg{width:20px;height:20px}
.ib.attivo{color:var(--verde)}
.cerca{padding:2px 12px 8px;flex:none}
.cerca label{display:flex;align-items:center;gap:12px;height:36px;border-radius:9px;background:var(--testa);padding:0 12px;color:var(--testo-2)}
:root[data-tema="chiaro"] .cerca label{background:#f0f2f5}
.cerca svg{width:18px;height:18px;flex:none}
.cerca input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:15px}
.cerca input::placeholder{color:var(--testo-2)}
.filtri{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.filtri::-webkit-scrollbar{display:none}
.filtro{height:32px;padding:0 13px;border-radius:16px;background:var(--testa);color:var(--testo-2);font-size:14.5px;white-space:nowrap;flex:none}
:root[data-tema="chiaro"] .filtro{background:#f0f2f5}
.filtro.on{background:rgba(0,168,132,.18);color:var(--verde)}
:root[data-tema="chiaro"] .filtro.on{background:#d9fdd3;color:#008069}
.lista{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.archivio-riga{display:flex;align-items:center;gap:16px;height:52px;padding:0 16px 0 28px;color:var(--testo);width:100%}
.archivio-riga:hover{background:var(--hover)}
.archivio-riga svg{width:20px;height:20px;color:var(--verde)}
.archivio-riga span{flex:1;text-align:left;font-size:16px}
.archivio-riga b{color:var(--verde);font-size:12.5px;font-weight:500}

.riga{display:flex;align-items:center;width:100%;height:72px;padding:0 0 0 13px;position:relative;text-align:left;user-select:none;-webkit-user-select:none}
.riga:hover{background:var(--hover)}
.riga.on{background:var(--scelta)}
.riga .av{width:49px;height:49px;flex:none;font-size:18px}
.riga .corpo{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;margin-left:13px;padding-right:15px;
  border-bottom:1px solid var(--linea)}
.riga:last-child .corpo{border-bottom-color:transparent}
.riga .r1,.riga .r2{display:flex;align-items:center;gap:6px;min-width:0}
.riga .nome{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--testo)}
.riga .ora{font-size:12px;color:var(--testo-2);flex:none}
.riga .ora.nuovo{color:var(--badge)}
.riga .anteprima{flex:1;min-width:0;font-size:14px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;margin-top:2px}
.riga .anteprima svg{width:16px;height:16px;flex:none}
.riga .anteprima .sp{flex:none}
.riga .anteprima .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riga .anteprima .chi{flex:none}
.riga .scrive{color:var(--verde);font-weight:500}
.riga .icone{display:flex;align-items:center;gap:6px;color:var(--testo-2);flex:none}
.riga .icone svg{width:18px;height:18px}
.contatore{min-width:20px;height:20px;border-radius:10px;background:var(--badge);color:var(--badge-testo);font:600 12px/20px var(--font);padding:0 6px;text-align:center}
.riga .giu{width:20px;height:20px;display:none;color:var(--testo-2)}
.riga:hover .giu{display:block}
.vuoto-lista{padding:40px 30px;text-align:center;color:var(--testo-2);font-size:14px;line-height:1.5}
.vuoto-lista b{display:block;color:var(--testo);font-size:16px;margin-bottom:6px;font-weight:500}
.vuoto-lista button{margin-top:16px}
.cifrato-nota{padding:24px 30px 40px;text-align:center;font-size:12.5px;color:var(--testo-3);display:flex;align-items:center;justify-content:center;gap:6px}
.cifrato-nota svg{width:12px;height:12px}
.fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:16px;background:var(--verde);color:#fff;
  display:none;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:5}
:root[data-tema="scuro"] .fab{color:#111b21}
.fab svg{width:24px;height:24px}

/* avatar */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:500;flex:none;background:#6a7175;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:60%;height:60%;color:rgba(255,255,255,.85)}
.av.gruppo{background:#5d6d77}
.av .online{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--verde-chiaro);border:2px solid var(--pannello)}

/* ---------- conversazione ---------- */
.conv{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--sfondo-chat);container-type:inline-size}
.msgs-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background-color:var(--sfondo-chat);background-size:cover;background-position:center}
.msgs-wrap .messaggi{background-color:transparent;position:relative;z-index:1}
.msgs-wrap.con-foto::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--buio,.25));pointer-events:none}
.msgs-wrap .giu-b{z-index:4}
.ios-testa,.ios-tab,.ic-ios{display:none}
.azioni-testa{display:flex;align-items:center;gap:2px;flex:none}
.stk-b{display:none}
.cam-b{display:none}
.indietro b{display:none}
.vocale .onda .pallino{position:absolute;left:0;top:50%;width:13px;height:13px;margin:-9px 0 0 -6px;border-radius:50%;background:var(--blu-spunta);display:none;pointer-events:none}
.vocale.va .onda .pallino{display:block}
.sf-ant{margin:0 20px 12px;height:150px;border-radius:12px;background-color:var(--sfondo-chat);background-size:cover;background-position:center;display:flex;flex-direction:column;
  justify-content:center;gap:8px;padding:14px;border:1px solid var(--linea)}
.sf-bolla{max-width:75%;padding:6px 10px;border-radius:10px;font-size:13.5px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.sf-bolla.suo{background:var(--suo);align-self:flex-start}
.sf-bolla.mio{background:var(--mio);align-self:flex-end}
@container (max-width:640px){ .msg{padding:0 14px} .bolla{max-width:84%} }
.conv-vuota{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--testa);
  border-bottom:6px solid var(--verde);padding:30px;color:var(--testo-2)}
:root[data-tema="chiaro"] .conv-vuota{background:#f0f2f5}
.conv-vuota .logo{width:96px;height:96px;margin-bottom:26px;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.conv-vuota .logo svg{width:96px;height:96px}
.conv-vuota h2{margin:0 0 12px;font:300 32px/1.2 var(--font);color:var(--testo)}
.conv-vuota p{margin:0;max-width:460px;font-size:14px;line-height:1.6}
.conv-vuota .piede{margin-top:40px;font-size:13px;display:flex;align-items:center;gap:6px}
.conv-vuota .piede svg{width:13px;height:13px}
.conv-testa{height:59px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 6px;background:var(--testa);z-index:3;
  border-left:1px solid var(--linea)}
.conv-testa .indietro{display:none}
.conv-testa .chi{flex:1;min-width:0;display:flex;align-items:center;gap:13px;height:100%;text-align:left;padding-left:10px}
.conv-testa .av{width:40px;height:40px;font-size:16px}
.conv-testa .tt{min-width:0;display:flex;flex-direction:column}
.conv-testa .tt b{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-testa .tt span{font-size:13px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-testa .tt span.verde{color:var(--verde)}
.messaggi{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:12px 0 8px;overscroll-behavior:contain;
  background-color:var(--sfondo-chat);background-image:var(--doodle-img);background-size:420px;background-attachment:local}
.messaggi.niente-doodle{background-image:none}
.carica-prima{display:flex;justify-content:center;padding:6px}
.carica-prima span{font-size:12.5px;color:var(--testo-2);background:var(--sistema);padding:5px 12px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.giorno{display:flex;justify-content:center;margin:10px 0 8px;position:sticky;top:6px;z-index:2}
.giorno span{font-size:12.5px;color:var(--sistema-testo);background:var(--sistema);padding:5px 12px 6px;border-radius:7.5px;
  box-shadow:0 1px .5px rgba(11,20,26,.13);text-transform:uppercase;letter-spacing:.01em}
.sistema{display:flex;justify-content:center;margin:6px 60px}
.sistema span{font-size:12.5px;color:var(--sistema-testo);background:var(--sistema);padding:5px 12px 6px;border-radius:7.5px;text-align:center;
  box-shadow:0 1px .5px rgba(11,20,26,.13);line-height:1.4}
.nonlette-sep{margin:10px 0;background:rgba(11,20,26,.06);display:flex;justify-content:center;padding:5px}
:root[data-tema="scuro"] .nonlette-sep{background:rgba(255,255,255,.03)}
.nonlette-sep span{font-size:12.5px;background:var(--sistema);color:var(--sistema-testo);padding:5px 12px;border-radius:12px;text-transform:uppercase}
.avviso-cifrato{display:flex;justify-content:center;margin:4px 40px 10px}
.avviso-cifrato span{max-width:520px;font-size:12.5px;line-height:1.45;text-align:center;padding:6px 12px;border-radius:7.5px;
  background:#ffeecd;color:#54656f;box-shadow:0 1px .5px rgba(11,20,26,.13)}
:root[data-tema="scuro"] .avviso-cifrato span{background:#182229;color:#ffd279}

.msg{display:flex;padding:0 63px;margin-bottom:2px;position:relative}
.msg.primo{margin-top:10px}
.msg.mio{justify-content:flex-end}
.msg .av-g{width:28px;height:28px;margin-right:6px;flex:none;font-size:12px;align-self:flex-start}
.msg.suo.gr .vuoto-av{width:28px;margin-right:6px;flex:none}
.bolla{position:relative;max-width:min(65%,560px);border-radius:7.5px;padding:6px 7px 8px 9px;box-shadow:0 1px .5px rgba(11,20,26,.13);
  word-wrap:break-word;overflow-wrap:anywhere;min-width:68px}
.msg.mio .bolla{background:var(--mio)}
.msg.suo .bolla{background:var(--suo)}
.msg.primo.mio .bolla{border-top-right-radius:0}
.msg.primo.suo .bolla{border-top-left-radius:0}
.msg.primo .bolla::before{content:"";position:absolute;top:0;width:8px;height:13px;background:inherit}
.msg.primo.mio .bolla::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.msg.primo.suo .bolla::before{left:-8px;clip-path:polygon(0 0,100% 0,100% 100%)}
.bolla .autore{font-size:12.8px;font-weight:500;margin-bottom:2px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
.bolla .autore i{font-style:normal;font-weight:400;color:var(--testo-2);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.bolla .testo{white-space:pre-wrap;font-size:var(--t);line-height:1.38}
.bolla .testo a{color:var(--link);text-decoration:none}
.bolla .testo a:hover{text-decoration:underline}
.bolla .testo code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:rgba(134,150,160,.16);padding:1px 4px;border-radius:4px}
.bolla .testo pre{margin:2px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;white-space:pre-wrap}
.bolla .testo.grande-emoji{font-size:44px;line-height:1.15}
.bolla.solo-emoji{background:transparent!important;box-shadow:none;padding:0 2px}
.bolla.solo-emoji::before{display:none}
.bolla.solo-emoji .meta{background:var(--sistema);border-radius:10px;padding:1px 6px;color:var(--testo-2)}
.meta{float:right;display:flex;align-items:center;gap:3px;margin:8px 0 -5px 10px;font-size:11px;color:var(--testo-2);white-space:nowrap;position:relative;top:2px}
:root[data-tema="scuro"] .msg.mio .meta{color:rgba(233,237,239,.6)}
.meta svg{width:16px;height:11px}
.meta .spunta-letta{color:var(--blu-spunta)}
.meta .orologio{width:12px;height:12px}
.meta .mod{font-style:italic}
.bolla .eliminato{display:flex;align-items:center;gap:5px;color:var(--testo-2);font-style:italic}
.bolla .eliminato svg{width:16px;height:16px}
.menu-msg{position:absolute;top:2px;right:2px;width:28px;height:24px;border-radius:0 6px 0 14px;display:none;place-items:center;color:var(--testo-2);
  background:radial-gradient(at top right, var(--sfondo-bolla, var(--suo)) 60%, transparent 80%);z-index:1}
.msg.mio .menu-msg{--sfondo-bolla:var(--mio)}
.menu-msg svg{width:20px;height:20px}
@media (hover:hover){ .bolla:hover .menu-msg{display:grid} }
.reazioni{position:absolute;bottom:-14px;display:flex;align-items:center;gap:2px;background:var(--suo);border-radius:12px;padding:1px 5px;height:24px;
  box-shadow:0 1px 3px rgba(11,20,26,.25);font-size:14px;z-index:1;cursor:pointer;border:1px solid var(--sfondo-chat)}
.msg.mio .reazioni{right:8px}
.msg.suo .reazioni{left:8px}
.reazioni b{font-weight:400;font-size:12px;color:var(--testo-2);margin-left:2px}
.msg.con-reazioni{margin-bottom:18px}
.citazione{display:flex;border-radius:7.5px;overflow:hidden;background:var(--citazione);margin:0 -3px 6px -5px;cursor:pointer;min-height:42px}
.msg.mio .citazione{background:var(--citazione-mio)}
:root[data-tema="scuro"] .citazione{background:rgba(11,20,26,.35)}
.citazione .barra{width:4px;flex:none;background:var(--col,#06cf9c)}
.citazione .cc{flex:1;min-width:0;padding:5px 8px 6px 8px}
.citazione .cc b{display:block;font-size:12.8px;font-weight:500;color:var(--col,#06cf9c)}
.citazione .cc span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.2px;color:var(--testo-2)}
.citazione .cc span svg{width:14px;height:14px;display:inline;vertical-align:-2px;margin-right:2px}
.citazione img{width:56px;height:56px;object-fit:cover;flex:none}
.msg.evidenzia .bolla{animation:evidenzia 1.6s ease}
@keyframes evidenzia{0%,60%{filter:brightness(.75)} 100%{filter:none}}

/* foto, video, sticker */
.media-box{position:relative;margin:-3px -4px 3px -6px;border-radius:6px;overflow:hidden;background:rgba(134,150,160,.18);cursor:pointer;max-width:calc(100% + 10px)}
.bolla.solo-media .media-box{max-width:100%}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;display:block}
.media-box .mini{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(12px);transform:scale(1.1)}
.media-box .ombra-ora{position:absolute;right:0;bottom:0;left:0;height:28px;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.bolla.solo-media{padding:3px 3px 3px 3px}
.bolla.solo-media .media-box{margin:0}
.bolla.solo-media .meta{position:absolute;right:7px;bottom:5px;margin:0;color:#fff;float:none;top:auto}
.bolla.solo-media .meta .spunta-letta{color:#9de1fe}
.media-box .play{position:absolute;inset:0;display:grid;place-items:center}
.media-box .play span{width:52px;height:52px;border-radius:50%;background:rgba(11,20,26,.55);display:grid;place-items:center;color:#fff}
.media-box .play svg{width:26px;height:26px}
.media-box .gif-tag{position:absolute;left:8px;bottom:8px;font:700 11px/1 var(--font);color:#fff;background:rgba(11,20,26,.55);padding:4px 6px;border-radius:5px;letter-spacing:.04em}
.media-box .dur{position:absolute;left:8px;bottom:6px;color:#fff;font-size:12px;display:flex;align-items:center;gap:4px}
.media-box .dur svg{width:15px;height:15px}
.media-offline{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 14px;text-align:center;color:var(--testo-2);
  font-size:13px;line-height:1.35;min-height:120px;background:rgba(134,150,160,.12);border-radius:6px}
.media-offline svg{width:30px;height:30px;opacity:.8}
.media-offline b{color:var(--testo);font-weight:500}
.media-offline button{margin-top:2px;color:var(--verde);font-weight:500;font-size:13px;padding:4px 10px;border-radius:14px;border:1px solid currentColor}
.media-carica{position:absolute;inset:0;display:grid;place-items:center}
.anello{width:52px;height:52px;border-radius:50%;background:rgba(11,20,26,.55);display:grid;place-items:center;color:#fff}
.anello svg{width:52px;height:52px}
.anello circle{transition:stroke-dashoffset .2s}
.didascalia{padding:3px 2px 0}
.bolla.sticker{background:transparent!important;box-shadow:none;padding:0;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.msg.suo .bolla.sticker{align-items:flex-start}
.bolla.sticker::before{display:none}
.bolla.sticker .stk{width:180px;height:180px;object-fit:contain;cursor:pointer}
.bolla.sticker .meta{position:static;background:var(--sistema);border-radius:10px;padding:2px 7px;margin:2px 0 0;float:none;top:auto;color:var(--testo-2);box-shadow:0 1px .5px rgba(11,20,26,.13)}
.msg.mio .bolla.sticker .meta{color:var(--testo-2)}

/* documento */
.doc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;background:rgba(11,20,26,.06);margin:-2px -3px 4px -5px;min-width:240px;color:inherit;text-decoration:none}
:root[data-tema="scuro"] .doc{background:rgba(11,20,26,.25)}
.doc .ic{width:34px;height:40px;flex:none;border-radius:4px;background:#e2e8ec;display:grid;place-items:center;color:#fff;font:700 9px/1 var(--font);position:relative}
.doc .ic.pdf{background:#e53935}.doc .ic.doc{background:#2b6cd8}.doc .ic.xls{background:#1e9e5a}.doc .ic.ppt{background:#e8710a}.doc .ic.zip{background:#7a5af5}.doc .ic.aud{background:#f59e0b}
.doc .nm{flex:1;min-width:0}
.doc .nm b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .nm span{font-size:12px;color:var(--testo-2)}
.doc .sc{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--testo-2);display:grid;place-items:center;color:var(--testo-2);flex:none}
.doc .sc svg{width:18px;height:18px}

/* vocale */
.vocale{display:flex;align-items:center;gap:10px;width:300px;max-width:100%;padding:2px 0 0}
.vocale .vav{position:relative;width:52px;height:52px;flex:none}
.vocale .vav .av{width:52px;height:52px;font-size:19px}
.vocale .vav .mic{position:absolute;right:-4px;bottom:-2px;width:20px;height:20px;color:var(--blu-spunta)}
.vocale .vav .mic.ascoltato{color:var(--blu-spunta)}
.vocale .vav .mic.nuovo{color:var(--verde-chiaro)}
.vocale .vp{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--testo-2)}
.vocale .vp svg{width:34px;height:34px}
.vocale .onda{flex:1;min-width:0;position:relative;height:40px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;touch-action:none}
.vocale .barre{display:flex;align-items:center;gap:2px;height:26px}
.vocale .barre i{flex:1;border-radius:2px;background:var(--testo-3);opacity:.55;min-height:3px}
.vocale .barre i.su{background:var(--blu-spunta);opacity:1}
.msg.mio .vocale .barre i.su{background:#53bdeb}
.vocale .tempo{position:absolute;left:0;bottom:-8px;font-size:11px;color:var(--testo-2)}
.vocale .vel{flex:none;height:24px;min-width:38px;border-radius:12px;background:rgba(134,150,160,.25);font:600 12px/24px var(--font);color:var(--testo);padding:0 6px;display:none}
.vocale.va .vel{display:block}
.vocale.va .vav{display:none}

/* ---------- barra per scrivere ---------- */
.scrivi{flex:none;background:var(--testa);display:flex;flex-direction:column;z-index:3;padding-bottom:env(safe-area-inset-bottom)}
.rispondi-a{display:flex;align-items:center;gap:8px;padding:6px 10px 0 16px}
.rispondi-a .citazione{flex:1;margin:0;background:var(--campo)}
:root[data-tema="scuro"] .rispondi-a .citazione{background:#1d282f}
.rispondi-a .ib{width:34px;height:34px}
.barra-scrivi{display:flex;align-items:flex-end;gap:4px;padding:5px 10px;min-height:62px}
.campo{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--campo);border-radius:8px;min-height:42px;margin:0 4px;position:relative}
@media (min-width:900px){ .cam-b{display:grid} }
.campo .ib{width:42px;height:42px;border-radius:8px}
.campo .ib svg{width:24px;height:24px}
.testo-in{flex:1;min-width:0;max-height:140px;min-height:42px;border:0;outline:0;background:transparent;resize:none;padding:11px 6px 10px 4px;
  font-size:15px;line-height:20px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word}
.testo-in::placeholder{color:var(--testo-2)}
.manda{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--icona);position:relative}
.manda.pieno{background:var(--verde);color:#fff}
:root[data-tema="scuro"] .manda.pieno{color:#111b21}
.manda svg{width:24px;height:24px}
.manda .effetto-segno{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#7a5af5;color:#fff;display:grid;place-items:center}
.manda .effetto-segno svg{width:11px;height:11px}
.effetti-b{color:var(--icona)}
.effetti-b.on{color:#a78bfa}
.allega-wrap{position:relative}

/* registrazione vocale */
.registra{display:flex;align-items:center;gap:12px;padding:5px 12px;min-height:62px}
.registra .cestino{color:var(--icona)}
.registra .punto{width:10px;height:10px;border-radius:50%;background:var(--rosso);animation:lampeggia 1s infinite}
.registra .t{font-variant-numeric:tabular-nums;font-size:17px;min-width:44px}
.registra .vivo{flex:1;height:30px;display:flex;align-items:center;gap:2px;overflow:hidden;justify-content:flex-end}
.registra .vivo i{width:3px;border-radius:2px;background:var(--testo-2);flex:none}
.registra .scorri{flex:1;text-align:center;color:var(--testo-2);font-size:14px}
@keyframes lampeggia{50%{opacity:.2}}

/* emoji, sticker e GIF */
.pannello-emoji{height:330px;flex:none;background:var(--testa);display:flex;flex-direction:column;border-top:1px solid var(--linea)}
.pe-schede{display:flex;justify-content:center;gap:4px;padding:6px 8px 0;flex:none}
.pe-scheda{height:34px;padding:0 16px;border-radius:17px;font-weight:500;color:var(--testo-2)}
.pe-scheda.on{background:rgba(134,150,160,.2);color:var(--testo)}
.pe-cat{display:flex;gap:2px;padding:4px 10px;overflow-x:auto;flex:none;scrollbar-width:none;border-bottom:1px solid var(--linea)}
.pe-cat::-webkit-scrollbar{display:none}
.pe-cat button{width:36px;height:34px;flex:none;font-size:20px;border-radius:8px;opacity:.6;position:relative}
.pe-cat button.on{opacity:1}
.pe-cat button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:2px;background:var(--verde)}
.pe-corpo{flex:1;overflow-y:auto;padding:4px 10px 10px}
.pe-tit{font-size:13px;color:var(--testo-2);padding:10px 4px 6px;text-transform:uppercase;letter-spacing:.03em}
.pe-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px}
.pe-griglia button{height:40px;font-size:27px;border-radius:8px;line-height:40px}
.pe-griglia button:hover{background:rgba(134,150,160,.18)}
.pe-griglia.stk{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.pe-griglia.stk button{height:96px;padding:6px;line-height:normal;position:relative}
.pe-griglia.stk img,.pe-griglia.stk video{width:100%;height:100%;object-fit:contain}
.pe-griglia.gif{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pe-griglia.gif button{height:100px;padding:0;overflow:hidden;background:rgba(134,150,160,.12)}
.pe-griglia.gif img,.pe-griglia.gif video{object-fit:cover}
.pe-griglia .nuovo-stk{border:2px dashed rgba(134,150,160,.45);color:var(--testo-2);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pe-griglia .nuovo-stk svg{width:28px;height:28px}
.pe-griglia .togli{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(11,20,26,.6);color:#fff;display:none;place-items:center}
.pe-griglia button:hover .togli{display:grid}
.pe-griglia .togli svg{width:14px;height:14px}
.pe-vuoto{padding:24px 12px;text-align:center;color:var(--testo-2);font-size:13.5px;line-height:1.5}
.pe-cerca{padding:8px 4px 2px}
.pe-cerca input{width:100%;height:34px;border:0;outline:0;border-radius:8px;background:var(--campo);padding:0 12px}

/* scorri giu' */
.giu-b{position:absolute;right:20px;bottom:14px;width:42px;height:42px;border-radius:50%;background:var(--testa);color:var(--icona);display:grid;place-items:center;
  box-shadow:var(--ombra);z-index:4}
.giu-b svg{width:24px;height:24px}
.giu-b .contatore{position:absolute;top:-8px;left:-6px}

/* ---------- menu e fogli ---------- */
.velo{position:fixed;inset:0;z-index:50}
.velo.scuro{background:rgba(11,20,26,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:appari .15s ease}
:root[data-tema="chiaro"] .velo.scuro{background:rgba(255,255,255,.75)}
@keyframes appari{from{opacity:0}}
.menu{position:fixed;z-index:60;background:var(--menu);border-radius:3px;box-shadow:var(--ombra);padding:9px 0;min-width:200px;max-width:300px;
  animation:menu-in .12s ease;transform-origin:top right}
@keyframes menu-in{from{opacity:0;transform:scale(.92)}}
.menu button{display:flex;align-items:center;gap:14px;width:100%;height:40px;padding:0 24px 0 20px;text-align:left;font-size:14.5px;color:var(--testo);white-space:nowrap}
.menu button:hover{background:var(--hover)}
:root[data-tema="scuro"] .menu button:hover{background:#182229}
.menu button svg{width:20px;height:20px;color:var(--icona);flex:none}
.menu button.rosso,.menu button.rosso svg{color:var(--rosso)}
.menu .sep{height:1px;background:var(--linea);margin:6px 0}
.reaz-barra{position:fixed;z-index:61;display:flex;gap:2px;background:var(--menu);border-radius:30px;padding:5px 8px;box-shadow:var(--ombra);animation:menu-in .12s ease}
.reaz-barra button{width:40px;height:40px;font-size:26px;border-radius:50%;transition:transform .12s}
.reaz-barra button:hover{transform:scale(1.18);background:var(--hover)}
.reaz-barra button.mia{background:rgba(134,150,160,.3)}
.reaz-barra .piu{font-size:22px;color:var(--testo-2);display:grid;place-items:center}
.reaz-barra .piu svg{width:22px;height:22px}

.foglio{background:var(--pannello);border-radius:12px;box-shadow:0 17px 50px rgba(11,20,26,.35);width:100%;max-width:460px;max-height:calc(100dvh - 40px);
  display:flex;flex-direction:column;overflow:hidden;animation:foglio-in .18s ease}
@keyframes foglio-in{from{opacity:0;transform:translateY(12px) scale(.98)}}
.foglio.largo{max-width:720px}
.foglio-t{padding:22px 24px 6px;font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.foglio-t .ib{margin:-8px -10px -8px auto}
.foglio-c{padding:8px 24px 16px;overflow-y:auto;color:var(--testo-2);font-size:14.5px;line-height:1.5}
.foglio-f{padding:10px 18px 18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{height:38px;padding:0 22px;border-radius:19px;font-weight:500;font-size:14px;color:var(--verde);border:1px solid var(--linea)}
.btn:hover{background:var(--hover)}
.btn.pieno{background:var(--verde);color:#fff;border-color:var(--verde)}
:root[data-tema="scuro"] .btn.pieno{color:#111b21}
.btn.pieno:hover{background:var(--verde-forte);border-color:var(--verde-forte)}
.btn.rosso{color:var(--rosso)}
.btn.pieno.rosso{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.campo-t{display:block;margin:10px 0}
.campo-t span{display:block;font-size:13px;color:var(--verde);margin-bottom:4px}
.campo-t input,.campo-t textarea{width:100%;border:0;border-bottom:2px solid var(--verde);outline:0;background:transparent;padding:6px 0;font-size:16px;color:var(--testo);resize:none}

/* ---------- pannelli che scorrono (nuova chat, impostazioni, info) ---------- */
.scorre{position:absolute;inset:0;background:var(--pannello);display:flex;flex-direction:column;z-index:8;animation:scorre-in .2s ease}
@keyframes scorre-in{from{transform:translateX(-100%)}}
.scorre.destra{animation-name:scorre-dx}
@keyframes scorre-dx{from{transform:translateX(100%)}}
.scorre-testa{height:108px;flex:none;background:var(--testa);display:flex;align-items:flex-end;gap:20px;padding:0 20px 14px;color:var(--testo)}
:root[data-tema="chiaro"] .scorre-testa{background:var(--verde-forte);color:#fff}
:root[data-tema="chiaro"] .scorre-testa .ib{color:#fff}
.scorre-testa h2{margin:0;font-size:19px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorre-testa.basso{height:59px;align-items:center}
:root[data-tema="chiaro"] .scorre-testa.basso{background:var(--testa);color:var(--testo)}
:root[data-tema="chiaro"] .scorre-testa.basso .ib{color:var(--icona)}
.scorre-corpo{flex:1;overflow-y:auto;background:var(--pannello)}
:root[data-tema="scuro"] .scorre-corpo.grigio{background:#0c1317}
:root[data-tema="chiaro"] .scorre-corpo.grigio{background:#f0f2f5}
.voce{display:flex;align-items:center;gap:16px;width:100%;min-height:62px;padding:8px 20px;text-align:left;position:relative}
.voce:hover{background:var(--hover)}
.voce .ic-tondo{width:49px;height:49px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;flex:none}
:root[data-tema="scuro"] .voce .ic-tondo{color:#111b21}
.voce .ic-tondo svg{width:24px;height:24px}
.voce .av{width:49px;height:49px;font-size:18px}
.voce .vc{flex:1;min-width:0;border-bottom:1px solid var(--linea);align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.voce:last-child .vc{border-bottom:0}
.voce .vc b{font-weight:400;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--testo)}
.blocco .voce .vc b,.blocco .voce .vc span{white-space:normal}
.voce .vc span{font-size:13.5px;color:var(--testo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voce .tag{font-size:12px;color:var(--verde);border:1px solid currentColor;border-radius:4px;padding:1px 6px;flex:none}
.voce .spunta{width:22px;height:22px;border-radius:4px;border:2px solid var(--testo-2);flex:none;display:grid;place-items:center}
.voce.scelto .spunta{background:var(--verde);border-color:var(--verde);color:#fff}
.voce .spunta svg{width:16px;height:16px;display:none}
.voce.scelto .spunta svg{display:block}
.voce .ic-sem{width:24px;height:24px;color:var(--icona);flex:none;margin:0 6px 0 4px}
.voce.rossa,.voce.rossa .ic-sem{color:var(--rosso)}
.voce.rossa .vc b{color:var(--rosso)}
.sez-t{padding:28px 30px 14px;font-size:16px;color:var(--verde)}
.sez-t.grigio{color:var(--testo-2);font-size:14px}
.blocco{background:var(--pannello);margin-bottom:10px;box-shadow:0 1px 3px rgba(11,20,26,.08)}
.profilo-big{display:flex;flex-direction:column;align-items:center;padding:28px 20px 20px;text-align:center}
.profilo-big .av{width:200px;height:200px;font-size:72px;cursor:pointer}
.profilo-big h3{margin:16px 0 2px;font-size:24px;font-weight:400;color:var(--testo);display:flex;align-items:center;gap:8px}
.profilo-big h3 .ib{width:32px;height:32px}
.profilo-big p{margin:0;color:var(--testo-2);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px}
.chip{display:flex;align-items:center;gap:6px;height:30px;border-radius:15px;background:var(--testa);padding:0 4px 0 2px;font-size:14px}
.chip .av{width:26px;height:26px;font-size:11px}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--testo-2)}
.chip button svg{width:14px;height:14px}
.grid-media{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 20px 16px}
.grid-media button{aspect-ratio:1;border-radius:6px;overflow:hidden;background:rgba(134,150,160,.15);position:relative}
.grid-media img,.grid-media video{width:100%;height:100%;object-fit:cover}
.descr{padding:0 20px 16px;color:var(--testo);font-size:15px;line-height:1.45;white-space:pre-wrap}
.descr.vuota{color:var(--testo-2)}
.opz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 20px 14px}
.opz button{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--linea);font-size:14px}
.opz button.on{border-color:var(--verde);color:var(--verde);background:rgba(0,168,132,.1)}
.opz .colore{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid transparent}
.opz .colore.on{border-color:var(--verde)}
.interr{width:40px;height:22px;border-radius:11px;background:rgba(134,150,160,.5);position:relative;flex:none;transition:background .15s}
.interr::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.interr.on{background:var(--verde)}
.interr.on::after{transform:translateX(18px)}

/* ---------- visore foto ---------- */
.visore{position:fixed;inset:0;z-index:70;background:rgba(11,20,26,.96);display:flex;flex-direction:column;animation:appari .15s}
:root[data-tema="chiaro"] .visore{background:rgba(255,255,255,.97)}
.visore-t{height:59px;flex:none;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;padding-top:env(safe-area-inset-top);box-sizing:content-box}
.visore-t .av{width:40px;height:40px;font-size:16px}
.visore-t .tt{flex:1;min-width:0}
.visore-t .tt b{display:block;font-weight:500;font-size:16px}
.visore-t .tt span{font-size:13px;color:var(--testo-2)}
.visore-c{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;touch-action:none}
.visore-c img,.visore-c video{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .05s}
.visore-did{padding:10px 20px 18px;text-align:center;color:var(--testo);font-size:15px;white-space:pre-wrap;padding-bottom:calc(18px + env(safe-area-inset-bottom))}

/* ---------- anteprima prima dell'invio ---------- */
.anteprima-invio{position:absolute;inset:0;z-index:20;background:var(--testa);display:flex;flex-direction:column}
:root[data-tema="chiaro"] .anteprima-invio{background:#e9edef}
.ai-testa{height:60px;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none}
.ai-testa b{flex:1;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-c{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 20px;position:relative}
.ai-c img,.ai-c video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ai-c .doc-grande{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--testo-2)}
.ai-c .doc-grande .ic{width:90px;height:110px;border-radius:8px;background:#5d6d77;color:#fff;display:grid;place-items:center;font:700 20px var(--font)}
.ai-didascalia{display:flex;align-items:center;gap:10px;padding:8px 20px 6px;flex:none;max-width:720px;width:100%;margin:0 auto}
.ai-didascalia input{flex:1;height:42px;border-radius:8px;border:0;outline:0;background:var(--campo);padding:0 14px;font-size:15px}
.ai-miniature{display:flex;align-items:center;gap:8px;padding:8px 20px 14px;flex:none;justify-content:center;overflow-x:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.ai-miniature button{width:52px;height:52px;border-radius:6px;overflow:hidden;border:3px solid transparent;flex:none;background:rgba(134,150,160,.2);position:relative}
.ai-miniature button.on{border-color:var(--verde)}
.ai-miniature img,.ai-miniature video{width:100%;height:100%;object-fit:cover}
.ai-miniature .agg{display:grid;place-items:center;color:var(--testo-2);border:1px solid var(--linea)}
.ai-miniature .agg svg{width:24px;height:24px}
.ai-manda{width:60px;height:60px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
:root[data-tema="scuro"] .ai-manda{color:#111b21}
.ai-manda svg{width:28px;height:28px}
.ai-strumenti{display:flex;gap:4px}

/* ---------- editor disegno e sticker ---------- */
.editor{position:fixed;inset:0;z-index:75;background:#111;display:flex;flex-direction:column;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-testa{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none;padding-top:env(safe-area-inset-top);box-sizing:content-box}
.ed-testa b{flex:1;text-align:center;font-weight:500;font-size:16px}
.ed-testa .ib{color:#fff}
.ed-testa .ib:disabled{opacity:.35}
.ed-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ed-tela{position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.12);touch-action:none}
.ed-tela canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ed-tela.scacchi{background:repeating-conic-gradient(#2a2a2a 0 25%, #3a3a3a 0 50%) 0 0/20px 20px}
.ed-tela.tondo{border-radius:50%;overflow:hidden}
.ed-barra{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ed-strumento{height:40px;min-width:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.08);color:#fff;font-size:14px}
.ed-strumento.on{background:#fff;color:#111}
.ed-strumento svg{width:20px;height:20px}
.ed-colori{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.ed-colori button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.ed-colori button.on{border-color:#fff;transform:scale(1.18)}
.ed-colori input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden}
.ed-spessore{width:110px;accent-color:#fff}
.ed-manda{width:52px;height:52px;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#fff}
.ed-manda svg{width:26px;height:26px}
.ed-avviso{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 14px;border-radius:18px;font-size:13.5px;
  white-space:nowrap;z-index:3;display:flex;align-items:center;gap:8px}
.ed-testo-in{position:absolute;z-index:4;left:50%;top:40%;transform:translate(-50%,-50%);background:transparent;border:0;outline:0;text-align:center;
  font:800 34px/1.1 var(--font);color:#fff;width:90%;caret-color:#fff}
.ed-scritta{position:absolute;font:800 34px/1.1 var(--font);white-space:pre;cursor:move;padding:4px 8px;touch-action:none;transform:translate(-50%,-50%)}
.giro{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- codice chat bloccate ---------- */
.pin-box{display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px}
.pin-box .lucch{width:56px;height:56px;border-radius:50%;background:rgba(0,168,132,.15);color:var(--verde);display:grid;place-items:center;margin-bottom:12px}
.pin-box .lucch svg{width:28px;height:28px}
.pin-box p{margin:0 0 16px;text-align:center;color:var(--testo-2);font-size:14.5px}
.pin-punti{display:flex;gap:18px;margin-bottom:10px;height:20px}
.pin-punti i{width:16px;height:16px;border-radius:50%;border:2px solid var(--testo-2);transition:background .1s,transform .1s}
.pin-punti i.pieno{background:var(--verde);border-color:var(--verde);transform:scale(1.1)}
.pin-punti.errore{animation:scuoti .4s}
@keyframes scuoti{20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)}}
.pin-msg{min-height:20px;font-size:13px;color:var(--rosso);margin-bottom:8px;text-align:center}
.pin-tasti{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pin-tasti button{height:60px;border-radius:30px;font-size:24px;background:var(--testa);color:var(--testo)}
.pin-tasti button:hover{background:var(--scelta)}
.pin-tasti button.vuoto{visibility:hidden}
.pin-tasti button svg{width:22px;height:22px;margin:auto}
.pin-dimenticato{margin-top:14px;color:var(--verde);font-size:14px}
.blocco-sopra{position:absolute;inset:0;z-index:15;background:var(--pannello);display:flex;align-items:center;justify-content:center}

/* ---------- avvisi brevi ---------- */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#323739;color:#fff;
  padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:var(--ombra);max-width:calc(100vw - 30px);animation:toast-in .2s ease;display:flex;gap:14px;align-items:center}
.toast button{color:#25d366;font-weight:600;font-size:14px}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}}

/* trascina qui */
.trascina{position:absolute;inset:0;z-index:30;background:rgba(0,168,132,.12);border:3px dashed var(--verde);display:grid;place-items:center;pointer-events:none}
.trascina span{background:var(--pannello);padding:14px 22px;border-radius:12px;font-size:16px;box-shadow:var(--ombra)}

/* condivisi da altre app */
.condivisi-anteprima{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;border-bottom:1px solid var(--linea)}
.condivisi-anteprima img,.condivisi-anteprima video{height:72px;border-radius:6px;object-fit:cover}

/* ---------- caricamento iniziale ---------- */
.avvio{position:fixed;inset:0;z-index:100;background:var(--pannello);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .3s}
.avvio .logo{width:84px;height:84px;border-radius:24px;overflow:hidden}
.avvio .logo svg{width:84px;height:84px}
.avvio .barra{width:300px;max-width:70vw;height:3px;border-radius:2px;background:rgba(134,150,160,.25);overflow:hidden}
.avvio .barra i{display:block;height:100%;width:40%;background:var(--verde);animation:carica 1.2s ease-in-out infinite}
@keyframes carica{0%{transform:translateX(-100%)} 100%{transform:translateX(260%)}}
.avvio p{margin:0;color:var(--testo-2);font-size:15px;text-align:center;max-width:320px;line-height:1.5}
.avvio .btn{margin-top:4px}

/* ======================= EFFETTI (iMessage) ======================= */
.eff-schermo{position:fixed;inset:0;z-index:80;pointer-events:none}
.eff-buio{position:fixed;inset:0;z-index:79;pointer-events:none;background:rgba(0,0,0,.6);animation:buio 3.4s ease forwards}
@keyframes buio{0%{opacity:0} 12%,80%{opacity:1} 100%{opacity:0}}
.eff-riflettore{position:fixed;inset:0;z-index:79;pointer-events:none;animation:buio 3.6s ease forwards}
.eff-eco{position:fixed;z-index:80;pointer-events:none;padding:6px 10px;border-radius:8px;font-size:15px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bolla.eff-slam{animation:slam .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes slam{0%{transform:scale(3.2) rotate(-6deg);opacity:0} 45%{transform:scale(.92) rotate(0);opacity:1} 60%{transform:scale(1.06)} 75%{transform:scale(.98)} 100%{transform:scale(1)}}
.conv.scossa{animation:scossa .45s ease .28s}
@keyframes scossa{20%{transform:translate(-6px,3px)} 40%{transform:translate(6px,-3px)} 60%{transform:translate(-4px,2px)} 80%{transform:translate(3px,-1px)}}
.bolla.eff-forte{animation:forte 1.3s ease}
@keyframes forte{0%{transform:scale(.6)} 20%{transform:scale(1.9)} 26%{transform:scale(1.9) rotate(-3deg)} 32%{transform:scale(1.9) rotate(3deg)} 38%{transform:scale(1.9) rotate(-3deg)}
  44%{transform:scale(1.9) rotate(2deg)} 52%{transform:scale(1.9) rotate(0)} 100%{transform:scale(1)}}
.msg.mio .bolla.eff-forte,.msg.mio .bolla.eff-slam{transform-origin:right center}
.msg.suo .bolla.eff-forte,.msg.suo .bolla.eff-slam{transform-origin:left center}
.bolla.eff-delicato{animation:delicato 2.2s ease}
@keyframes delicato{0%{transform:scale(.3);opacity:.3} 35%{transform:scale(.55);opacity:1} 100%{transform:scale(1)}}
.bolla.eff-inchiostro .testo,.bolla.eff-inchiostro .media-box,.bolla.eff-inchiostro .stk{filter:blur(9px);transition:filter .5s;user-select:none}
.bolla.eff-inchiostro.svelato .testo,.bolla.eff-inchiostro.svelato .media-box,.bolla.eff-inchiostro.svelato .stk{filter:none;user-select:text}
.bolla .polvere{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden;transition:opacity .5s}
.bolla.svelato .polvere{opacity:0}
.bolla .polvere canvas{width:100%;height:100%}
/* testo animato (iOS 18) */
.anim-l{display:inline-block;white-space:pre}
.anim-grande .anim-l{animation:a-grande 1.1s ease both}
@keyframes a-grande{0%{transform:scale(1)} 40%{transform:scale(1.7)} 100%{transform:scale(1)}}
.anim-piccolo .anim-l{animation:a-piccolo 1.1s ease both}
@keyframes a-piccolo{0%{transform:scale(1)} 40%{transform:scale(.55)} 100%{transform:scale(1)}}
.anim-trema .anim-l{animation:a-trema .12s linear 8 alternate}
@keyframes a-trema{0%{transform:translate(-1.5px,1px) rotate(-3deg)} 100%{transform:translate(1.5px,-1px) rotate(3deg)}}
.anim-annuisci .anim-l{animation:a-annuisci .9s ease 2}
@keyframes a-annuisci{0%,100%{transform:translateY(0)} 30%{transform:translateY(5px) rotateX(30deg)} 60%{transform:translateY(-2px)}}
.anim-esplodi .anim-l{animation:a-esplodi 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes a-esplodi{0%{transform:translate(0,0) rotate(0);opacity:1} 30%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:.9}
  70%{transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) rotate(calc(var(--rot)*.3))} 100%{transform:translate(0,0) rotate(0);opacity:1}}
.anim-onda .anim-l{animation:a-onda 1.2s ease 2}
@keyframes a-onda{0%,100%{transform:translateY(0)} 25%{transform:translateY(-7px)} 50%{transform:translateY(0)}}
.anim-fiorisci .anim-l{animation:a-fiorisci 1.6s ease both}
@keyframes a-fiorisci{0%{transform:scale(.4);opacity:0;text-shadow:0 0 0 transparent} 50%{transform:scale(1.25);opacity:1;text-shadow:0 0 12px #ffd54f,0 0 22px #ff80ab}
  100%{transform:scale(1);text-shadow:0 0 0 transparent}}
.anim-salta .anim-l{animation:a-salta .22s ease 6 alternate}
@keyframes a-salta{0%{transform:translateY(0) rotate(0)} 100%{transform:translateY(-4px) rotate(var(--rot))}}

/* foglio effetti */
.eff-foglio{max-width:520px}
.eff-schede{display:flex;justify-content:center;gap:6px;padding:12px 16px 4px}
.eff-schede button{height:34px;padding:0 16px;border-radius:17px;color:var(--testo-2);font-weight:500}
.eff-schede button.on{background:rgba(134,150,160,.22);color:var(--testo)}
.eff-anteprima{margin:14px 20px 6px;min-height:150px;border-radius:12px;background:var(--sfondo-chat);display:flex;align-items:center;justify-content:flex-end;
  padding:20px;position:relative;overflow:hidden;background-image:var(--doodle-img);background-size:320px}
.eff-anteprima .bolla{max-width:80%;background:var(--mio)}
.eff-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:10px 20px 16px}
.eff-lista button{height:66px;border-radius:12px;background:var(--testa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;
  border:2px solid transparent;color:var(--testo)}
.eff-lista button span{font-size:22px;line-height:1}
.eff-lista button.on{border-color:#a78bfa;background:rgba(167,139,250,.14)}
.formatta{display:flex;gap:6px;padding:0 20px 6px;flex-wrap:wrap}
.formatta button{height:34px;min-width:40px;padding:0 10px;border-radius:8px;background:var(--testa);font-size:15px}

let tToast = null;

  d.innerHTML = '<span>'+esc(t)+'</span>'+(azione ? '<button>'+esc(azione)+'</button>' : '');
  if(azione) d.querySelector('button').onclick = () => { d.remove(); f && f(); };

}
function errore(e, cosa){
  console.warn(cosa || 'errore', e);
  const m = String((e && (e.message || e.error_description)) || e || '');
  if(/fetch|network|failed to|load failed/i.test(m) || !navigator.onLine) toast('Sembra che manchi la connessione. Riprova tra poco.');
  else if(/troppi tentativi/i.test(m)) toast('Troppi tentativi: riprova tra qualche minuto.');
  else if(/puoi scrivere solo|non puoi|solo gli amministratori/i.test(m)) toast(m.charAt(0).toUpperCase() + m.slice(1) + '.');
  else toast((cosa ? cosa + ': ' : '') + 'qualcosa non ha funzionato.');
}

let audioCtx = null;
function suono(tipo){
  if(!S.cfg.suoni) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(tipo === 'invio'){ o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + .08); g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .14); o.start(t); o.stop(t + .15); }
    else { o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(990, t + .09); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .02);
           g.gain.exponentialRampToValueAtTime(.0001, t + .32); o.start(t); o.stop(t + .33); }
  }catch(e){}
}

/* ---------- indirizzi firmati per i file privati ---------- */
const firme = new Map();         // path -> {url, scade}
const firmeInCorso = new Map();
function urlFirmataSubito(path){
  const f = firme.get(path);
  if(f && f.scade > Date.now()) return f.url;
  urlFirmata(path).then(u => {
    if(!u) return;
    $$('[data-foto-gruppo="'+CSS.escape(path)+'"]').forEach(n => { n.innerHTML = '<img src="'+esc(u)+'" alt="">'; });
  });
  return '';
}
async function urlFirmata(path){
  if(!path) return '';
  if(/^foss:/.test(path)) return stickerFoss(path.slice(5));
  const f = firme.get(path);
  if(f && f.scade > Date.now() + 60000) return f.url;
  if(firmeInCorso.has(path)) return firmeInCorso.get(path);
  const p = (async () => {
    try{
      const {data, error} = await sb.storage.from('chat').createSignedUrl(path, 3600 * 6);
      if(error || !data) throw error || new Error('nessun indirizzo');
      const url = /^(https?:|blob:)/.test(data.signedUrl) ? data.signedUrl : SUPA_URL + '/storage/v1' + data.signedUrl;
      firme.set(path, {url, scade: Date.now() + 3600 * 6 * 1000 - 120000});
      return url;
    }catch(e){ return ''; }
    finally{ firmeInCorso.delete(path); }
  })();
  firmeInCorso.set(path, p);
  return p;
}
/* l'indirizzo di un file di un messaggio: NAS (url) o Supabase (path) */
async function urlMedia(m){
  if(!m) return '';
  if(m.locale) return m.locale;
  if(m.url) return m.url;
  return urlFirmata(m.path);
}

/* ---------- caricamento di un file, con la barra che avanza ---------- */
async function token(){
  const {data} = await sb.auth.getSession();
  return data && data.session ? data.session.access_token : '';
}
function caricaFile(path, blob, avanza){
  return new Promise(async (ok, ko) => {
    let tk = '';
    try{ tk = await token(); }catch(e){}
    if(!tk) return ko(new Error('sessione scaduta: rientra in FOSS'));
    const xhr = new XMLHttpRequest();
    /* quando il NAS sara' collegato, i file andranno li': stessa barra, stesso giro */
    const dest = MEDIA_NAS ? MEDIA_NAS.replace(/\/$/, '') + '/carica/' + path
                           : SUPA_URL + '/storage/v1/object/chat/' + path.split('/').map(encodeURIComponent).join('/');
    xhr.open('POST', dest);
    xhr.setRequestHeader('Authorization', 'Bearer ' + tk);
    if(!MEDIA_NAS){ xhr.setRequestHeader('apikey', SUPA_KEY); xhr.setRequestHeader('x-upsert', 'false'); }
    xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    xhr.setRequestHeader('Cache-Control', 'max-age=31536000');
    xhr.upload.onprogress = e => { if(e.lengthComputable && avanza) avanza(e.loaded / e.total); };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300){
        let r = {}; try{ r = JSON.parse(xhr.responseText || '{}'); }catch(e){}
        ok(MEDIA_NAS ? {url: r.url} : {path});
      } else {
        let m = 'caricamento non riuscito (' + xhr.status + ')';
        try{ const j = JSON.parse(xhr.responseText); if(j && (j.message || j.error)) m = j.message || j.error; }catch(e){}
        if(/exceeded|too large|payload/i.test(m)) m = 'il file è troppo grande (massimo 50 MB)';
        ko(new Error(m));
      }
    };
    xhr.onerror = () => ko(new Error(MEDIA_NAS ? 'Il server dei media sembra offline' : 'connessione assente'));
    xhr.send(blob);
  });
}

/* ---------- messaggi di una conversazione ---------- */
const PAGINA = 50;
function statoMsgs(id){
  let s = S.msgs.get(id);
  if(!s){ s = {lista: [], tutti: false, caricando: false, ids: new Set(), caricato: false}; S.msgs.set(id, s); }
  return s;
}
async function caricaMessaggi(conv, prima){
  const s = statoMsgs(conv);
  if(s.caricando || (prima && s.tutti)) return [];
  s.caricando = true;
  try{
    const c = S.convs.get(conv);
    let q = sb.from('chat_messaggi').select('*').eq('conv_id', conv).order('creato_il', {ascending: false}).limit(PAGINA);
    if(prima && s.lista.length) q = q.lt('creato_il', s.lista[0].creato_il);
    if(c && c.svuotata_il) q = q.gt('creato_il', c.svuotata_il);
    const {data, error} = await q;
    if(error) throw error;
    const nuovi = (data || []).reverse().filter(m => !s.ids.has(m.id));
    if((data || []).length < PAGINA) s.tutti = true;
    nuovi.forEach(m => s.ids.add(m.id));
    s.lista = prima ? nuovi.concat(s.lista) : mescola(s.lista, nuovi);
    s.caricato = true;
    await caricaReazioni(nuovi.map(m => m.id));
    /* i messaggi citati che non sono ancora caricati */
    const mancano = nuovi.filter(m => m.risponde_a && !trovaMsg(conv, m.risponde_a)).map(m => m.risponde_a);
    if(mancano.length){
      const {data: cc} = await sb.from('chat_messaggi').select('*').in('id', mancano.slice(0, 50));
      s.citati = s.citati || new Map();
      (cc || []).forEach(m => s.citati.set(m.id, m));
    }
    return nuovi;
  } finally { s.caricando = false; }
}
function mescola(a, b){
  const m = new Map();
  a.forEach(x => m.set(x.id, x));
  b.forEach(x => { const v = m.get(x.id); if(v && v !== x){ Object.assign(v, x); } else m.set(x.id, x); });
  return Array.from(m.values()).sort((x, y) => new Date(x.creato_il) - new Date(y.creato_il));
}
function trovaMsg(conv, id){
  const s = S.msgs.get(conv); if(!s) return null;
  return s.lista.find(m => m.id === id) || (s.citati && s.citati.get(id)) || null;
}
async function caricaReazioni(ids){
  if(!ids.length) return;
  for(let i = 0; i < ids.length; i += 100){
    const {data} = await sb.from('chat_reazioni').select('msg_id,utente_id,emoji').in('msg_id', ids.slice(i, i + 100));
    (data || []).forEach(r => { if(!S.reazioni.has(r.msg_id)) S.reazioni.set(r.msg_id, new Map()); S.reazioni.get(r.msg_id).set(r.utente_id, r.emoji); });
  }
}

/* ---------- spunte: inviato, arrivato, letto ---------- */
function statoSpunte(m, c){
  if(m._stato === 'invio') return 'invio';
  if(m._stato === 'errore') return 'errore';
  const altri = (c.membri || []).filter(x => x.id !== S.io);
  if(!altri.length) return 'letto';
  const t = new Date(m.creato_il).getTime();
  if(altri.every(x => new Date(x.letto).getTime() >= t)) return 'letto';
  if(altri.every(x => new Date(x.ricevuto).getTime() >= t)) return 'arrivato';
  return 'inviato';
}

/* ---------- tempo reale ---------- */
let canaleDb = null, canaleOnline = null, canaleScrive = null;
function avviaTempoReale(){
  canaleDb = sb.channel('fosschat-db')
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'chat_messaggi'}, p => arrivaMessaggio(p.new))
    .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'chat_messaggi'}, p => cambiaMessaggio(p.new))
    .on('postgres_changes', {event: '*', schema: 'public', table: 'chat_membri'}, p => cambiaMembro(p))
    .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'chat_conversazioni'}, p => cambiaConv(p.new))
    .on('postgres_changes', {event: '*', schema: 'public', table: 'chat_reazioni'}, p => cambiaReazione(p))
    .subscribe(st => { if(st === 'SUBSCRIBED' && S.pronti) recupera(); });

  canaleOnline = sb.channel('fosschat-online', {config: {presence: {key: S.io}}});
  canaleOnline.on('presence', {event: 'sync'}, () => {
    const st = canaleOnline.presenceState();
    S.online = new Set(Object.keys(st));
    aggiornaTestaConv(); disegnaListaPresto();
  }).subscribe(async st => { if(st === 'SUBSCRIBED') try{ await canaleOnline.track({id: S.io, dal: Date.now()}); }catch(e){} });

  canaleScrive = sb.channel('fosschat-scrive');
  canaleScrive.on('broadcast', {event: 'scrive'}, ({payload}) => {
    if(!payload || payload.chi === S.io || !S.convs.has(payload.conv)) return;
    if(!S.scrive.has(payload.conv)) S.scrive.set(payload.conv, new Map());
    S.scrive.get(payload.conv).set(payload.chi, {fino: Date.now() + 4500, cosa: payload.cosa || 'scrive'});
    aggiornaTestaConv(); disegnaListaPresto();
    setTimeout(() => { aggiornaTestaConv(); disegnaListaPresto(); }, 4700);
  }).subscribe();
}
let ultimoScrivo = 0;
function dicoCheScrivo(cosa){
  if(!S.aperta || !canaleScrive) return;
  const t = Date.now(); if(t - ultimoScrivo < 2500) return; ultimoScrivo = t;
  canaleScrive.send({type: 'broadcast', event: 'scrive', payload: {conv: S.aperta, chi: S.io, cosa: cosa || 'scrive'}}).catch(() => {});
}
function chiScrive(conv){
  const m = S.scrive.get(conv); if(!m) return [];
  const t = Date.now(), r = [];
  m.forEach((v, k) => { if(v.fino > t) r.push({id: k, cosa: v.cosa}); else m.delete(k); });
  return r;
}
/* dopo una disconnessione rimetto in pari l'elenco e la chat aperta */
async function recupera(){
  try{
    await caricaElenco();
    if(S.aperta && S.convs.has(S.aperta)){
      const nuovi = await caricaMessaggi(S.aperta);
      if(nuovi.length) disegnaMessaggi(true);
    }
    disegnaLista();
  }catch(e){}
}

function arrivaMessaggio(m){
  const c = S.convs.get(m.conv_id);
  if(!c){ recupera(); return; }
  const s = statoMsgs(m.conv_id);
  const gia = s.ids.has(m.id);
  if(s.caricato || m.conv_id === S.aperta){
    s.ids.add(m.id);
    s.lista = mescola(s.lista, [m]);
  }
  if(!c.ultimo || new Date(m.creato_il) >= new Date(c.ultimo.creato_il)){
    c.ultimo = {id: m.id, autore: m.autore, tipo: m.tipo, testo: c.bloccata ? null : (m.testo || '').slice(0, 140), creato_il: m.creato_il,
                eliminato: m.eliminato, media: c.bloccata ? null : m.media};
    c.ultimo_il = m.creato_il;
  }
  const mio = m.autore === S.io;
  if(!gia && !mio && m.tipo !== 'sistema'){
    S.scrive.get(m.conv_id) && S.scrive.get(m.conv_id).delete(m.autore);
    const guardo = m.conv_id === S.aperta && document.visibilityState === 'visible' && vicinoAlFondo() && sbloccata(c);
    if(guardo){ segnaLetto(m.conv_id); }
    else { c.non_lette = (c.non_lette || 0) + 1; if(!c.silenziata) suono('arrivo'); }
    aggiornaTitolo();
  }
  if(m.conv_id === S.aperta && !gia){
    aggiungiMessaggioAlFondo(m, !mio);
    if(!mio && m.media && m.media.schermo && !S.visti.has(m.id) && sbloccata(c)) eseguiEffettoSchermo(m);
  }
  disegnaLista();
}
function cambiaMessaggio(m){
  const s = S.msgs.get(m.conv_id);
  if(s){ const i = s.lista.findIndex(x => x.id === m.id); if(i >= 0){ s.lista[i] = Object.assign(s.lista[i], m); ridisegnaMessaggio(m.id); } }
  const c = S.convs.get(m.conv_id);
  if(c && c.ultimo && c.ultimo.id === m.id){ c.ultimo.eliminato = m.eliminato; if(m.eliminato){ c.ultimo.testo = null; c.ultimo.media = null; } disegnaLista(); }
}
function cambiaMembro(p){
  const n = p.new && p.new.conv_id ? p.new : null, o = p.old || {};
  const conv = (n && n.conv_id) || o.conv_id;
  if(p.eventType === 'DELETE'){
    if(o.utente_id === S.io || !o.utente_id){ recupera(); return; }
    const c = S.convs.get(conv); if(c){ c.membri = (c.membri || []).filter(x => x.id !== o.utente_id); aggiornaTestaConv(); }
    return;
  }
  if(!n) return;
  const c = S.convs.get(conv);
  if(!c){ if(n.utente_id === S.io) recupera(); return; }
  if(n.utente_id === S.io){
    ['silenziata','archiviata','fissata','svuotata_il','bloccata','letto_fino','ruolo'].forEach(k => { if(k in n) c[k] = n[k]; });
  }
  let mm = (c.membri || []).find(x => x.id === n.utente_id);
  if(!mm){ mm = {id: n.utente_id}; c.membri = (c.membri || []).concat([mm]); if(!S.persone.has(n.utente_id)) caricaPersone([n.utente_id]).then(() => aggiornaTestaConv()); }
  mm.ruolo = n.ruolo; mm.letto = n.letto_fino; mm.ricevuto = n.ricevuto_fino;
  if(conv === S.aperta) aggiornaSpunte();
  disegnaListaPresto();
}
function cambiaConv(n){
  const c = S.convs.get(n.id); if(!c) return;
  ['nome','descrizione','foto','ultimo_il'].forEach(k => { c[k] = n[k]; });
  if(n.id === S.aperta) aggiornaTestaConv();
  disegnaListaPresto();
  if(infoAperta === n.id) disegnaInfo();
}
function cambiaReazione(p){
  const r = p.eventType === 'DELETE' ? p.old : p.new;
  if(!r || !r.msg_id) return;
  if(p.eventType === 'DELETE'){ const m = S.reazioni.get(r.msg_id); if(m && r.utente_id) m.delete(r.utente_id); }
  else { if(!S.reazioni.has(r.msg_id)) S.reazioni.set(r.msg_id, new Map()); S.reazioni.get(r.msg_id).set(r.utente_id, r.emoji); }
  ridisegnaMessaggio(r.msg_id);
}

const letturaInCoda = new Set();
const segnaLettoPresto = debounce(async () => {
  const ids = Array.from(letturaInCoda); letturaInCoda.clear();

function segnaLetto(conv){

function convVisibili(){
  const elim = memoria('eliminate') || {};

    else {

      else if(c.tipo === 'gruppo') ant += '<span class="chi">'+esc(nomeDi(u.autore))+':&nbsp;</span>';

    }
  } else if(c.tipo === 'gruppo') ant = '<span class="tx">Gruppo creato</span>';
  else ant = '<span class="tx">'+esc((S.persone.get(altro(c)) || {}).ruolo || 'Nuova chat')+'</span>';

  const icone = (c.silenziata ? svg('silenzia', 1.8) : '') + (c.fissata ? svg('fissa', 1.8) : '') +
    (nl ? '<span class="contatore">'+(c.non_lette > 0 ? (c.non_lette > 99 ? '99+' : c.non_lette) : '')+'</span>' : '');
  return '<div class="riga'+(S.aperta === c.id ? ' on' : '')+(nl ? ' da-leggere' : '')+'" role="button" tabindex="0" data-a="apri" data-id="'+c.id+'">'+avatarConv(c)+
    '<span class="corpo"><span class="r1"><span class="nome">'+esc(nomeConv(c))+'</span>'+
      '<span class="ora'+(nl && !c.silenziata ? ' nuovo' : '')+'">'+(u ? dataBreve(u.creato_il) : dataBreve(c.creata_il))+'</span></span>'+
    '<span class="r2"><span class="anteprima">'+ant+'</span><span class="icone">'+icone+
      '<button class="giu" data-a="menu-riga" data-id="'+c.id+'" aria-label="Opzioni">'+svg('giu')+'</button></span></span></span></div>';
}
function spunteHTML(st, piccole){
  if(st === 'invio') return '<span class="sp">'+svg('orologio', 2)+'</span>';
  if(st === 'errore') return '<span class="sp" style="color:var(--rosso)">'+svg('info', 2)+'</span>';
  const w = piccole ? 2.2 : 2;
  if(st === 'inviato') return '<span class="sp">'+svg('spunta', w)+'</span>';
  return '<span class="sp'+(st === 'letto' ? ' spunta-letta' : '')+'"'+(st === 'letto' ? ' style="color:var(--blu-spunta)"' : '')+'>'+svg('spunte', w)+'</span>';
}

/* menu di una chat (freccina o pressione lunga) */
function menuRiga(id, x, y){
  const c = S.convs.get(id); if(!c) return;
  const nl = c.non_lette > 0 || c._nonLetta;
  apriMenu(x, y, [
    [c.archiviata ? 'Togli dall’archivio' : 'Archivia chat', 'archivio', () => impostaMembro(c, {archiviata: !c.archiviata})],
    [c.silenziata ? 'Riattiva notifiche' : 'Silenzia notifiche', c.silenziata ? 'campana' : 'silenzia', () => impostaMembro(c, {silenziata: !c.silenziata})],
    [c.fissata ? 'Sgancia chat' : 'Fissa in alto', 'fissa', () => impostaMembro(c, {fissata: !c.fissata})],
    [nl ? 'Segna come letta' : 'Segna come da leggere', 'spunte', () => {
      if(nl){ c._nonLetta = false; segnaLetto(c.id); }
      else { c._nonLetta = true; impostaMembro(c, {letto_fino: new Date(new Date(c.ultimo_il).getTime() - 1000).toISOString()}); }
      disegnaLista();
    }],
    [c.bloccata ? 'Sblocca chat' : 'Blocca chat', c.bloccata ? 'lucchettoAperto' : 'lucchetto', () => alternaBlocco(c)],
    null,
    c.tipo === 'gruppo' ? ['Esci dal gruppo', 'esci', () => esciGruppo(c), 'rosso'] : ['Elimina chat', 'cestino', () => eliminaChat(c), 'rosso'],
  ]);
}
async function impostaMembro(c, campi){
  Object.assign(c, campi);
  disegnaLista(); if(S.aperta === c.id) aggiornaTestaConv();
  const {error} = await sb.from('chat_membri').update(campi).eq('conv_id', c.id).eq('utente_id', S.io);
  if(error){ errore(error, 'Non salvato'); recupera(); }
  else if('archiviata' in campi) toast(campi.archiviata ? 'Chat archiviata' : 'Chat tolta dall’archivio', 'Annulla', () => impostaMembro(c, {archiviata: !campi.archiviata}));
}
function eliminaChat(c){
  conferma('Eliminare questa chat?', 'I messaggi spariscono da questo elenco e dalla chat solo per te. Se ti scrivono di nuovo, la chat ricompare.', 'Elimina chat', async () => {
    const t = new Date().toISOString();
    const e = memoria('eliminate') || {}; e[c.id] = t; memoria('eliminate', e);
    c.svuotata_il = t; c.archiviata = false;
    const {error} = await sb.from('chat_membri').update({svuotata_il: t, archiviata: false}).eq('conv_id', c.id).eq('utente_id', S.io);
    if(error) return errore(error, 'Non eliminata');
    S.msgs.delete(c.id);
    if(S.aperta === c.id) chiudiConv();
    disegnaLista();
  }, true);
}

/* ======================= LA CONVERSAZIONE ======================= */
let convCaricata = null, primaNonLetta = null, nuoviSotto = 0;

function sbloccata(c){ return !c || !c.bloccata || S.sbloccate.has(c.id); }

async function apriConv(id, opz){
  opz = opz || {};
  const c = S.convs.get(id);
  if(!c){ if(S.pronti) toast('Questa chat non è più disponibile.'); return; }
  if(c.bloccata && !S.sbloccate.has(id)){
    const ok = await chiediPin('Chat bloccata', 'Inserisci il codice per aprire «'+nomeConv(c)+'».');
    if(!ok) return;
    S.sbloccate.add(id);
  }
  if(S.aperta && S.aperta !== id) lasciaConv();
  const giaAperta = S.aperta === id;
  S.aperta = id;
  if(c.archiviata && S.vista !== 'archiviate' && !opz.daHash){ /* resta archiviata, la apro comunque */ }
  el('app').classList.add('in-conv');
  if(!opz.daHash){
    const h = '#c=' + id;
    if(location.hash !== h){ if(suTelefono() && !location.hash) history.pushState({c: id}, '', h); else history.replaceState({c: id}, '', h); }
  }
  primaNonLetta = c.non_lette > 0 ? c.letto_fino : null;
  nuoviSotto = 0;
  if(!giaAperta){ S.risposta = null; chiudiPannelloEmoji(); }
  disegnaConv();
  const s = statoMsgs(id);
  if(!s.caricato){
    el('msgs').innerHTML = '<div class="carica-prima"><span>Carico i messaggi…</span></div>';
    try{ await caricaMessaggi(id); }catch(e){ errore(e, 'Messaggi non caricati'); }
    if(S.aperta !== id) return;
  }
  disegnaMessaggi();
  vaiInFondo(true);
  if(c.non_lette > 0 || c._nonLetta){ c._nonLetta = false; segnaLetto(id); }
  disegnaLista();
  if(!tocco()) setTimeout(() => { const t = el('testoIn'); if(t) t.focus(); }, 60);
  /* gli effetti arrivati mentre ero altrove */
  const da = primaNonLetta ? new Date(primaNonLetta) : null;
  if(da){
    const e = s.lista.filter(m => m.autore !== S.io && m.media && m.media.schermo && !S.visti.has(m.id) && new Date(m.creato_il) > da).pop();
    if(e) setTimeout(() => eseguiEffettoSchermo(e), 400);
  }
}
function lasciaConv(){
  const id = S.aperta; if(!id) return;
  salvaBozza();
  const c = S.convs.get(id);
  if(c && c.bloccata) S.sbloccate.delete(id);    /* uscendo, una chat bloccata si richiude */
  fermaAudio();
}
function chiudiConv(){
  lasciaConv();
  S.aperta = null;
  el('app').classList.remove('in-conv');
  chiudiInfo();
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  if(suTelefono()) setTimeout(() => { if(!S.aperta) disegnaConvVuota(); }, 260); else disegnaConvVuota();
  disegnaLista();
}

function disegnaConv(){

  el('conv').innerHTML =
    '<header class="conv-testa" id="convTesta"></header>'+

  attivaScorriPerRispondere(M);

function aggiornaTestaConv(){

  const sc = chiScrive(c.id);

      (c.bloccata ? ' <span style="color:var(--testo-2);display:inline-block;width:14px;vertical-align:-1px">'+svg('lucchetto',2.2)+'</span>' : '')+'</b>'+
      '<span class="'+(verde ? 'verde' : '')+'">'+esc(stato || (c.tipo === 'gruppo' ? 'tocca per le info del gruppo' : 'tocca per le info del contatto'))+'</span></span></button>'+
    '<span class="azioni-testa"><button class="ib" data-a="cerca-in-chat" title="Cerca">'+svg('cerca')+'</button>'+
    '<button class="ib" data-a="menu-conv" title="Menu"><span class="ic-dt">'+svg('menu')+'</span><span class="ic-ios">'+svg('puntini')+'</span></button></span>';
