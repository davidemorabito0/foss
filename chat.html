/* ---------- i messaggi ---------- */
function msgVisibili(id){
  const s = S.msgs.get(id); if(!s) return [];
  return s.lista.filter(m => !S.nascosti.has(m.id));
}
function disegnaMessaggi(mantieni){
  const M = el('msgs'); const c = S.convs.get(S.aperta); if(!M || !c) return;
  const lista = msgVisibili(c.id), s = statoMsgs(c.id);
  const daFondo = M.scrollHeight - M.scrollTop;
  let h = s.tutti ? '<div class="avviso-cifrato"><span>'+svg('lucchetto').replace('<svg','<svg style="width:11px;height:11px;display:inline;vertical-align:-1px;margin-right:4px"')+
      'Questa chat è visibile solo a chi ne fa parte. Il tuo account è quello di FOSS.</span></div>'
    : '<div class="carica-prima"><span>Scorri in su per i messaggi precedenti</span></div>';
  let giorno = null, sepFatto = false;
  lista.forEach((m, i) => {
    const d = new Date(m.creato_il);
    if(!giorno || !stessoGiorno(giorno, d)){ giorno = d; h += '<div class="giorno"><span>'+dataGiorno(d)+'</span></div>'; }
    if(primaNonLetta && !sepFatto && m.autore !== S.io && m.tipo !== 'sistema' && d > new Date(primaNonLetta)){
      sepFatto = true;
      const n = lista.slice(i).filter(x => x.autore !== S.io && x.tipo !== 'sistema').length;
      h += '<div class="nonlette-sep" id="sepNonLette"><span>'+n+' '+(n === 1 ? 'messaggio non letto' : 'messaggi non letti')+'</span></div>';
    }
    h += msgHTML(m, lista[i - 1], lista[i + 1], c);
  });
  M.innerHTML = h;
  idrataMedia(M);
  if(mantieni) M.scrollTop = M.scrollHeight - daFondo;
  /* gli effetti si vedono una volta: poi restano fermi (si rivedono toccandoli) */
  const conEff = lista.filter(m => m.media && (m.media.bolla || m.media.anim) && !S.visti.has(m.id));
  if(conEff.length) setTimeout(() => conEff.forEach(m => segnaVisto(m.id)), 2600);
}
function stessoGruppo(a, b){
  if(!a || !b || a.tipo === 'sistema' || b.tipo === 'sistema') return false;
  if(a.autore !== b.autore) return false;
  const da = new Date(a.creato_il), db = new Date(b.creato_il);
  return stessoGiorno(da, db) && Math.abs(db - da) < 7 * 60000;
}
function msgHTML(m, prev, next, c){
  if(m.tipo === 'sistema') return '<div class="sistema" data-id="'+m.id+'"><span>'+esc(m.testo || '')+'</span></div>';
  const mio = m.autore === S.io, gr = c.tipo === 'gruppo';
  const primo = !stessoGruppo(prev, m), ultimo = !stessoGruppo(m, next);
  const r = S.reazioni.get(m.id), haR = r && r.size;
  let cls = 'msg ' + (mio ? 'mio' : 'suo') + (primo ? ' primo' : '') + (ultimo ? ' ultimo' : '') + (gr ? ' gr' : '') + (haR ? ' con-reazioni' : '');
  const conAv = suTelefono() ? ultimo : primo;   /* su iPhone la foto sta accanto all'ultimo messaggio del gruppo */
  const pre = gr && !mio ? (conAv ? avatar(m.autore, 'av-g') : '<span class="vuoto-av"></span>') : '';
  return '<div class="'+cls+'" data-id="'+m.id+'">'+pre+bollaHTML(m, c, primo, mio, gr)+'</div>';
}
function bollaHTML(m, c, primo, mio, gr){
  const md = m.media || {};
  let corpo = '', bcls = 'bolla';
  const autore = gr && !mio && primo && m.tipo !== 'sticker'
    ? '<div class="autore" style="color:'+colore(m.autore)+'">'+esc(nomeDi(m.autore))+((S.persone.get(m.autore) || {}).ruolo ? '<i>'+esc(S.persone.get(m.autore).ruolo)+'</i>' : '')+'</div>' : '';
  const cit = m.risponde_a && !m.eliminato ? citazioneHTML(m.risponde_a, c) : '';
  if(m.eliminato){
    corpo = '<div class="eliminato">'+svg('vietato', 1.8)+(mio ? 'Hai eliminato questo messaggio' : 'Questo messaggio è stato eliminato')+meta(m, c, mio)+'</div>';
    return '<div class="'+bcls+'">'+autore+corpo+'</div>';
  }
  const nuovoEff = !S.visti.has(m.id);
  const eff = md.bolla && (md.bolla === 'inchiostro' || nuovoEff) ? ' eff-' + md.bolla : '';
  if(m.tipo === 'testo'){
    const em = soloEmoji(m.testo);
    if(em && !cit && !md.anim){ bcls += ' solo-emoji'; corpo = '<div class="testo grande-emoji">'+esc(m.testo.trim())+'</div>'; }
    else corpo = '<div class="testo'+(md.anim && nuovoEff ? ' anim-' + md.anim : '')+'"'+(md.anim ? ' data-anim="'+esc(md.anim)+'" data-a="rianima"' : '')+'>'+
      (md.anim ? testoAnimato(m.testo, md.anim) : formatta(m.testo))+'</div>';
  } else if(m.tipo === 'foto' || m.tipo === 'video'){
    const solo = !md.did && !cit;
    if(solo) bcls += ' solo-media';
    corpo = mediaBoxHTML(m) + (md.did ? '<div class="testo didascalia">'+formatta(md.did)+'</div>' : '');
  } else if(m.tipo === 'sticker'){
    bcls += ' sticker';
    corpo = '<img class="stk" data-mid="'+m.id+'" data-a="vedi" data-id="'+m.id+'" alt="Sticker"'+(md.path && /^foss:/.test(md.path) ? ' src="'+stickerFoss(md.path.slice(5))+'"' : '')+'>';
  } else if(m.tipo === 'vocale'){
    corpo = vocaleHTML(m, mio);
  } else if(m.tipo === 'file'){
    corpo = docHTML(m);
  }
  const menu = '<button class="menu-msg" data-a="menu-msg" data-id="'+m.id+'" aria-label="Opzioni">'+svg('giu')+'</button>';
  const polvere = md.bolla === 'inchiostro' ? '<span class="polvere"><canvas data-polvere="1"></canvas></span>' : '';
  return '<div class="'+bcls+eff+'"'+(md.bolla === 'inchiostro' ? ' data-a="svela"' : '')+'>'+menu+autore+cit+corpo+
    (m.tipo === 'sticker' || bcls.includes('solo-media') || bcls.includes('solo-emoji') ? meta(m, c, mio) : (m.tipo === 'vocale' ? '' : meta(m, c, mio)))+
    polvere+reazioniHTML(m.id)+'</div>';
}
function meta(m, c, mio){
  return '<span class="meta">'+(m.media && (m.media.schermo || m.media.bolla || m.media.anim) ? '<span title="Inviato con effetto" style="display:inline-block;width:12px">'+svg('effetti', 2)+'</span>' : '')+
    ora(m.creato_il)+(mio ? spunteHTML(statoSpunte(m, c)) : '')+'</span>';
}
function reazioniHTML(id){
  const r = S.reazioni.get(id); if(!r || !r.size) return '';
  const cont = new Map(); r.forEach(e => cont.set(e, (cont.get(e) || 0) + 1));
  const ord = Array.from(cont.entries()).sort((a, b) => b[1] - a[1]);
  return '<span class="reazioni" data-a="chi-reagisce" data-id="'+id+'">'+ord.slice(0, 3).map(x => x[0]).join('')+(r.size > 1 ? '<b>'+r.size+'</b>' : '')+'</span>';
}
function citazioneHTML(rid, c){
  const q = trovaMsg(c.id, rid);
  if(!q) return '<div class="citazione" data-a="vai-msg" data-id="'+rid+'"><span class="barra"></span><span class="cc"><span>Messaggio non disponibile</span></span></div>';
  const col = q.autore === S.io ? '#06cf9c' : colore(q.autore);
  const md = q.media || {};
  let t = q.eliminato ? 'Messaggio eliminato' : '';
  let ic = '';
  if(!q.eliminato){
    if(q.tipo === 'testo') t = testoSemplice(q.testo);
    else if(q.tipo === 'foto'){ ic = svg('foto', 2); t = md.did || (md.gif ? 'GIF' : 'Foto'); }
    else if(q.tipo === 'video'){ ic = svg('video', 2); t = md.did || (md.gif ? 'GIF' : 'Video'); }
    else if(q.tipo === 'vocale'){ ic = svg('mic', 2); t = 'Messaggio vocale (' + fmtDur(md.dur) + ')'; }
    else if(q.tipo === 'sticker'){ ic = svg('sticker', 2); t = 'Sticker'; }
    else if(q.tipo === 'file'){ ic = svg('doc', 2); t = md.nome || 'Documento'; }
  }
  const mini = (q.tipo === 'foto' || q.tipo === 'video' || q.tipo === 'sticker') && !q.eliminato
    ? '<img data-mini-di="'+q.id+'" alt=""'+(md.mini ? ' src="'+esc(md.mini)+'"' : '')+'>' : '';
  return '<div class="citazione" style="--col:'+col+'" data-a="vai-msg" data-id="'+rid+'"><span class="barra"></span><span class="cc"><b>'+esc(q.autore === S.io ? 'Tu' : nomeDi(q.autore))+'</b>'+
    '<span>'+ic+esc(t)+'</span></span>'+mini+'</div>';
}
function soloEmoji(t){
  t = String(t || '').trim(); if(!t || t.length > 24) return false;
  try{
    if(!/^(?:\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t)) return false;
    const n = (t.match(/\p{Extended_Pictographic}/gu) || []).length;
    return n >= 1 && n <= 3 && !/^[\d#*\s]+$/.test(t);
  }catch(e){ return false; }
}
/* *grassetto* _corsivo_ ~barrato~ `codice` e i link */
function formatta(t){
  let s = esc(t || '');
  const blocchi = [];
  s = s.replace(/```([\s\S]+?)```/g, (_, x) => { blocchi.push('<pre>' + x + '</pre>'); return '\u0000' + (blocchi.length - 1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g, (_, x) => { blocchi.push('<code>' + x + '</code>'); return '\u0000' + (blocchi.length - 1) + '\u0000'; });
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, u => {
    blocchi.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'); return '\u0000' + (blocchi.length - 1) + '\u0000';
  });
  s = s.replace(/(^|[\s(])\*(\S(?:[^*\n]*\S)?)\*(?=$|[\s).,!?:;])/g, '$1<b>$2</b>')
       .replace(/(^|[\s(])_(\S(?:[^_\n]*\S)?)_(?=$|[\s).,!?:;])/g, '$1<i>$2</i>')
       .replace(/(^|[\s(])~(\S(?:[^~\n]*\S)?)~(?=$|[\s).,!?:;])/g, '$1<s>$2</s>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocchi[+i]);
  return s;
}
function testoAnimato(t, anim){
  const lettere = Array.from(String(t || ''));
  return lettere.map((l, i) => {
    if(l === '\n') return '<br>';
    const dx = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 60, dy = (Math.cos(i * 78.233) * 12345.678 % 1) * 50, rot = ((i * 47) % 70) - 35;
    return '<span class="anim-l" style="animation-delay:'+(anim === 'onda' || anim === 'fiorisci' || anim === 'annuisci' ? i * 45 : anim === 'esplodi' ? 0 : i * 8)+'ms;'+
      '--dx:'+dx.toFixed(0)+'px;--dy:'+dy.toFixed(0)+'px;--rot:'+rot+'deg">'+esc(l)+'</span>';
  }).join('');
}
function dimensioniMedia(md, max){
  max = max || (suTelefono() ? Math.min(260, window.innerWidth * .68) : 330);
  let w = md.w || 300, h = md.h || 220;
  const r = h / w;
  w = Math.min(max, w); if(w < 160) w = Math.min(max, 160);
  h = Math.round(w * r);
  h = Math.max(110, Math.min(h, 380));
  return [Math.round(w), h];
}
function mediaBoxHTML(m){
  const md = m.media || {};
  const [w, h] = dimensioniMedia(md);
  const st = 'width:'+w+'px;height:'+h+'px';
  const mini = md.mini ? '<img class="mini" src="'+esc(md.mini)+'" alt="">' : '';
  const carica = m._avanza != null ? '<div class="media-carica">'+anelloHTML(m._avanza)+'</div>' : '';
  const errore = m._stato === 'errore' ? '<div class="media-carica"><button class="anello" data-a="riprova" data-id="'+m.id+'" title="Riprova">'+svg('aggiorna')+'</button></div>' : '';
  if(m.tipo === 'video'){

      '<video data-mid="'+m.id+'" muted loop playsinline autoplay preload="metadata"></video><span class="gif-tag">GIF</span>'+carica+errore+'</div>';
    return '<div class="media-box" style="'+st+'" data-a="vedi" data-id="'+m.id+'">'+mini+
      '<video data-mid="'+m.id+'" preload="metadata" muted playsinline></video><span class="ombra-ora"></span>'+
      (m._avanza == null && m._stato !== 'errore' ? '<span class="play"><span>'+svg('play')+'</span></span>' : '')+
      (md.dur ? '<span class="dur">'+svg('video', 2)+fmtDur(md.dur)+'</span>' : '')+carica+errore+'</div>';

    (md.gif ? '<span class="gif-tag">GIF</span>' : '')+'<span class="ombra-ora"></span>'+carica+errore+'</div>';

function anelloHTML(p){
  const C = 2 * Math.PI * 20, v = Math.max(.02, Math.min(1, p || 0));
  return '<span class="anello"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>'+
    '<circle cx="26" cy="26" r="20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C * (1 - v))+'" transform="rotate(-90 26 26)"/></svg></span>';
}
function estensione(nome){ const m = /\.([a-z0-9]{1,6})$/i.exec(nome || ''); return m ? m[1].toLowerCase() : ''; }
function classeDoc(ext){
  if(ext === 'pdf') return 'pdf';
  if(/^(doc|docx|odt|rtf|txt|pages)$/.test(ext)) return 'doc';
  if(/^(xls|xlsx|csv|ods|numbers)$/.test(ext)) return 'xls';
  if(/^(ppt|pptx|key|odp)$/.test(ext)) return 'ppt';
  if(/^(zip|rar|7z|tar|gz)$/.test(ext)) return 'zip';
  if(/^(mp3|wav|m4a|aac|flac|ogg)$/.test(ext)) return 'aud';
  return '';
}
function docHTML(m){
  const md = m.media || {}, ext = estensione(md.nome);
  const carica = m._avanza != null ? '<span class="sc">'+'<span class="giro" style="border-color:rgba(134,150,160,.3);border-top-color:var(--verde)"></span></span>' : '<span class="sc">'+svg('scarica')+'</span>';
  return '<button class="doc" data-a="apri-doc" data-id="'+m.id+'"><span class="ic '+classeDoc(ext)+'">'+esc((ext || 'file').toUpperCase().slice(0, 4))+'</span>'+
    '<span class="nm"><b>'+esc(md.nome || 'Documento')+'</b><span>'+[ext.toUpperCase(), fmtDim(md.dim)].filter(Boolean).join(' · ')+'</span></span>'+carica+'</button>'+
    (md.did ? '<div class="testo didascalia">'+formatta(md.did)+'</div>' : '');
}
function vocaleHTML(m, mio){
  const md = m.media || {};
  const onda = ondaDa(md.onda);
  const ascoltati = memoria('ascoltati') || {};
  const nuovo = !mio && !ascoltati[m.id];
  return '<div class="vocale" data-voc="'+m.id+'">'+
    '<button class="vp" data-a="play-voc" data-id="'+m.id+'" aria-label="Ascolta">'+svg('play')+'</button>'+
    '<div class="onda" data-a="cerca-voc" data-id="'+m.id+'"><span class="barre">'+onda.map(v => '<i style="height:'+Math.max(10, v * 100)+'%"></i>').join('')+'</span><span class="pallino"></span>'+
      '<span class="tempo">'+fmtDur(md.dur)+'</span></div>'+
    '<button class="vel" data-a="vel-voc">1×</button>'+
    '<span class="vav">'+avatar(m.autore)+'<span class="mic '+(nuovo ? 'nuovo' : 'ascoltato')+'">'+svg('mic', 2.4)+'</span></span>'+
    '</div>'+meta(m, S.convs.get(m.conv_id) || {membri: []}, mio);
}
function ondaDa(s){
  const n = suTelefono() ? 32 : 40;
  if(typeof s === 'string' && s.length){
    const v = Array.from(s).map(ch => Math.max(0, Math.min(31, ch.charCodeAt(0) - 65)) / 31);
    const out = []; for(let i = 0; i < n; i++) out.push(v[Math.floor(i * v.length / n)] || .1);
    return out;
  }
  const out = []; for(let i = 0; i < n; i++) out.push(.15 + Math.abs(Math.sin(i * 1.7)) * .5); return out;
}

/* i file arrivano dopo: prima disegno, poi chiedo gli indirizzi */
async function idrataMedia(root){
  const c = S.convs.get(S.aperta); if(!c) return;
  const nodi = $$('img[data-mid]:not([src]), video[data-mid]:not([src])', root);
  for(const n of nodi){
    const m = trovaMsg(c.id, n.dataset.mid); if(!m || !m.media) continue;
    const u = await urlMedia(m.media.locale ? m.media : m.media);
    if(u){ n.src = u; if(n.tagName === 'VIDEO' && n.autoplay) n.play().catch(() => {}); n.addEventListener('load', () => { const mi = n.parentNode && n.parentNode.querySelector('.mini'); if(mi) mi.remove(); }, {once: true}); }
    else if(!m._avanza) mediaNonArriva(m.id);
  }
  $$('img[data-mini-di]:not([src])', root).forEach(async n => {
    const q = trovaMsg(c.id, n.dataset.miniDi); if(!q || !q.media) return;
    const u = await urlMedia(q.media); if(u) n.src = u;
  });
  $$('canvas[data-polvere]', root).forEach(polvere);
  /* effetti a bolla: si vedono una volta sola, quando il messaggio e' nuovo */
}
function mediaNonArriva(mid){
  const c = S.convs.get(S.aperta); if(!c) return;
  const m = trovaMsg(c.id, mid); if(!m || m._avanza != null) return;
  const nas = !!(m.media && m.media.url);

  const html = '<div class="media-offline">'+svg(nas ? 'server' : 'foto', 1.6)+
    '<b>'+(nas ? 'Il server dei media sembra offline' : (navigator.onLine ? 'File non disponibile' : 'Sei offline'))+'</b>'+
    '<span>'+(nas ? 'Il NAS non risponde: il file tornerà visibile quando sarà di nuovo acceso.' : 'Non riesco a scaricarlo adesso.')+'</span>'+
    '<button data-a="ricarica-media" data-id="'+mid+'">Riprova</button></div>';
  if(box){
    const d = document.createElement('div'); d.innerHTML = html; d.style.width = (box.offsetWidth || 260) + 'px'; d.style.maxWidth = '100%';
    box.replaceWith(d);
  }
  const v = $('.vocale[data-voc="'+mid+'"]');

}

function aggiungiMessaggioAlFondo(m, altrui){
  const M = el('msgs'); const c = S.convs.get(S.aperta); if(!M || !c) return;

/* ---------- scorrere ---------- */
function vicinoAlFondo(){ const M = el('msgs'); return !M || M.scrollHeight - M.scrollTop - M.clientHeight < 160; }
function vaiInFondo(subito){
  const M = el('msgs'); if(!M) return;
  const sep = subito && primaNonLetta && el('sepNonLette');
  const fai = () => {
    if(sep){ M.scrollTop = Math.max(0, sep.offsetTop - 80); }
    else M.scrollTo({top: M.scrollHeight, behavior: subito ? 'auto' : 'smooth'});
  };
  fai(); requestAnimationFrame(fai); setTimeout(fai, 120);
  nuoviSotto = 0; mostraGiu();
}
function mostraGiu(){
  const b = el('giuB'); if(!b) return;
  const lontano = !vicinoAlFondo();
  b.classList.toggle('nascosto', !lontano);
  b.innerHTML = svg('giu') + (nuoviSotto ? '<span class="contatore">'+nuoviSotto+'</span>' : '');
}
let caricandoSu = false;
async function alloScorrere(){
  const M = el('msgs'); if(!M) return;
  mostraGiu();
  if(vicinoAlFondo()){ nuoviSotto = 0; const c = S.convs.get(S.aperta); if(c && c.non_lette) segnaLetto(c.id); }
  if(M.scrollTop < 300 && !caricandoSu){
    const s = S.msgs.get(S.aperta); if(!s || s.tutti) return;
    caricandoSu = true;
    try{ const n = await caricaMessaggi(S.aperta, true); if(n.length) disegnaMessaggi(true); else if(s.tutti) disegnaMessaggi(true); }
    catch(e){} finally{ caricandoSu = false; }
  }
}
async function vaiAMessaggio(id){
  const conv = S.aperta; let giri = 0;
  while(!$('.msg[data-id="'+id+'"]', el('msgs')) && giri < 30){
    const s = S.msgs.get(conv); if(!s || s.tutti) break;

}

/* ---------- menu del messaggio e reazioni ---------- */
const REAZ = ['👍','❤️','😂','😮','😢','🙏'];
function menuMessaggio(id, x, y, conBarra){
  const c = S.convs.get(S.aperta); const m = c && trovaMsg(c.id, id); if(!m || m.tipo === 'sistema') return;
  const mio = m.autore === S.io, md = m.media || {};
  const voci = [];
  if(!m.eliminato){
    voci.push(['Rispondi', 'rispondi', () => impostaRisposta(m)]);
    if(m.tipo === 'testo' || md.did) voci.push(['Copia', 'copia', () => copia(m.testo || md.did)]);
    voci.push(['Reagisci', 'emoji', () => barraReazioni(m.id, x, y, true)]);
    voci.push(['Inoltra', 'inoltra', () => inoltra([m])]);
    if(m.tipo === 'foto' && !md.gif) voci.push(['Crea sticker', 'sticker', () => stickerDaMessaggio(m)]);
    if(m.tipo === 'sticker' && !(md.path && /^sticker\/[^/]+/.test(md.path) && md.path.indexOf(S.io) === 8)) voci.push(['Aggiungi ai miei sticker', 'stella', () => salvaInRaccolta(m, 'sticker')]);
    if(md.gif) voci.push(['Aggiungi alle mie GIF', 'gif', () => salvaInRaccolta(m, 'gif')]);
    if(['foto','video','file','vocale'].includes(m.tipo)) voci.push(['Scarica', 'scarica', () => scaricaMedia(m)]);
    if(mio) voci.push(['Info', 'info', () => infoMessaggio(m)]);
  }
  voci.push(null);
  voci.push(['Elimina', 'cestino', () => eliminaMessaggio(m), 'rosso']);
  apriMenu(x, y, voci, false);
  if(conBarra && !m.eliminato){
    /* come sul telefono: le reazioni sopra il messaggio, il menu sotto (o sopra se manca spazio) */
    const b = $('.msg[data-id="'+id+'"] .bolla'), menu = el('menuPop');
    if(b && menu){
      const r = b.getBoundingClientRect(), h = menu.offsetHeight, w = menu.offsetWidth;
      let top = r.bottom + 8;
      if(top + h > window.innerHeight - 8) top = Math.max(70, r.top - 8 - h);
      const left = m.autore === S.io ? Math.min(window.innerWidth - w - 8, r.right - w) : Math.max(8, r.left);
      menu.style.top = top + 'px'; menu.style.left = Math.max(8, left) + 'px';
      const sopra = top < r.top ? top - 58 : r.top - 58;
      barraReazioni(m.id, m.autore === S.io ? r.right - 150 : r.left + 150, Math.max(8, sopra));
    } else barraReazioni(m.id, x, y - 60);
  }
}
function barraReazioni(id, x, y, sola){
  const vecchia = el('reazBarra'); if(vecchia) vecchia.remove();
  const mia = (S.reazioni.get(id) || new Map()).get(S.io);
  const b = document.createElement('div'); b.className = 'reaz-barra'; b.id = 'reazBarra';
  b.innerHTML = REAZ.map(e => '<button class="'+(mia === e ? 'mia' : '')+'" data-e="'+e+'">'+e+'</button>').join('')+
    '<button class="piu" data-e="+" aria-label="Altre">'+svg('piu')+'</button>';
  document.body.appendChild(b);
  const w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';

    const t = e.target.closest('button'); if(!t) return;

async function reagisci(id, emoji){
  const c = S.convs.get(S.aperta); if(!c) return;
  if(!S.reazioni.has(id)) S.reazioni.set(id, new Map());
  const r = S.reazioni.get(id), mia = r.get(S.io);
  try{
    if(mia === emoji){
      r.delete(S.io); ridisegnaMessaggio(id);
      const {error} = await sb.from('chat_reazioni').delete().eq('msg_id', id).eq('utente_id', S.io); if(error) throw error;
    } else {
      r.set(S.io, emoji); ridisegnaMessaggio(id);
      const {error} = await sb.from('chat_reazioni').upsert({msg_id: id, utente_id: S.io, conv_id: c.id, emoji, creata_il: new Date().toISOString()}, {onConflict: 'msg_id,utente_id'});
      if(error) throw error;
    }
  }catch(e){ errore(e, 'Reazione non salvata'); }
}
function chiReagisce(id){

async function copia(t){

function eliminaMessaggio(m){
  const mio = m.autore === S.io && !m.eliminato;

async function scaricaMedia(m){
  try{
    const u = await urlMedia(m.media); if(!u) throw new Error('nessun indirizzo');
    const r = await fetch(u); const b = await r.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = (m.media && m.media.nome) || ('FOSS-chat-' + new Date(m.creato_il).toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ((b.type.split('/')[1] || 'bin').replace('jpeg', 'jpg').replace(/;.*/, '')));
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }catch(e){ toast(m.media && m.media.url ? 'Il server dei media sembra offline.' : 'Non riesco a scaricare il file.'); }
}

/* scorrere a destra un messaggio = rispondi (come sul telefono) */
function attivaScorriPerRispondere(M){
  let x0 = 0, y0 = 0, nodo = null, attivo = false;
  M.addEventListener('touchstart', e => {
    const n = e.target.closest('.msg'); if(!n || e.touches.length > 1) return;
    nodo = n; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; attivo = false;
  }, {passive: true});
  M.addEventListener('touchmove', e => {
    if(!nodo) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!attivo && Math.abs(dy) > 12){ nodo = null; return; }
    if(dx > 10 && Math.abs(dx) > Math.abs(dy)) attivo = true;
    if(attivo){ const v = Math.min(80, Math.max(0, dx)); nodo.style.transform = 'translateX('+v+'px)'; nodo.style.transition = 'none'; }
  }, {passive: true});
  M.addEventListener('touchend', () => {
    if(!nodo) return;
    const v = parseFloat((nodo.style.transform.match(/-?[\d.]+/) || [0])[0]);
    nodo.style.transition = 'transform .2s'; nodo.style.transform = '';
    if(attivo && v >= 60){ const c = S.convs.get(S.aperta); const m = trovaMsg(c.id, nodo.dataset.id); if(m && m.tipo !== 'sistema' && !m.eliminato){ impostaRisposta(m); try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} } }
    nodo = null; attivo = false;
  });
}

/* ======================= SCRIVERE E MANDARE ======================= */
function disegnaScrivi(){
  const F = el('scrivi'); const c = S.convs.get(S.aperta); if(!F || !c) return;

    '<div class="barra-scrivi" id="barraScrivi">'+

      '<span class="allega-wrap"><button class="ib" data-a="allega" id="allegaB" title="Allega">'+svg('piu', 2)+'</button></span>'+
      '<div class="campo">'+
        '<textarea class="testo-in" id="testoIn" rows="1" placeholder="'+(suTelefono() ? '' : 'Scrivi un messaggio')+'" enterkeyhint="'+(S.cfg.invio && !tocco() ? 'send' : 'enter')+'" '+
          'autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>'+
        '<button class="ib effetti-b'+(e ? ' on' : '')+'" data-a="effetti" id="effettiB" title="Effetti" style="'+(testo.trim() || e ? '' : 'display:none')+'">'+svg('effetti', 1.8)+'</button>'+
        '<button class="ib stk-b" data-a="emoji-sticker" id="stkB" title="Sticker" style="'+(testo.trim() ? 'display:none' : '')+'">'+svg('sticker', 1.8)+'</button>'+
      '</div>'+
      '<button class="ib cam-b" data-a="fotocamera" id="camB" title="Fotocamera" style="'+(testo.trim() ? 'display:none' : '')+'">'+svg('camera', 1.8)+'</button>'+
      '<button class="manda'+(testo.trim() ? ' pieno' : '')+'" id="mandaB" aria-label="'+(testo.trim() ? 'Invia' : 'Registra un vocale')+'">'+
        svg(testo.trim() ? (suTelefono() ? 'freccia' : 'manda') : 'mic', suTelefono() && testo.trim() ? 2.6 : 1.8)+(e ? '<span class="effetto-segno">'+svg('effetti', 2.4)+'</span>' : '')+'</button>'+
    '</div>';
  const t = el('testoIn');
  t.value = testo; adatta(t);
  t.addEventListener('input', () => { adatta(t); aggiornaTastoManda(); dicoCheScrivo(); salvaBozzaPresto(); });
  t.addEventListener('keydown', tastiTesto);
  t.addEventListener('paste', incolla);
  const mb = el('mandaB');
  mb.addEventListener('pointerdown', premiManda);
  mb.addEventListener('contextmenu', e => { e.preventDefault(); if(t.value.trim()) apriEffetti(); });
  if(pannelloEmojiAperto) apriPannelloEmoji(pannelloEmojiScheda);

function adatta(t){ t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
function aggiornaTastoManda(){
  const t = el('testoIn'), b = el('mandaB'); if(!t || !b) return;
  const pieno = !!t.value.trim();
  if(b.classList.contains('pieno') !== pieno){
    b.classList.toggle('pieno', pieno);
    b.innerHTML = svg(pieno ? (suTelefono() ? 'freccia' : 'manda') : 'mic', suTelefono() && pieno ? 2.6 : 1.8) + (S.effettoScelto ? '<span class="effetto-segno">'+svg('effetti', 2.4)+'</span>' : '');
    b.setAttribute('aria-label', pieno ? 'Invia' : 'Registra un vocale');
  }
  const eb = el('effettiB'), cb = el('camB'), sk = el('stkB');
  if(eb) eb.style.display = pieno || S.effettoScelto ? '' : 'none';
  if(cb) cb.style.display = pieno ? 'none' : '';
  if(sk) sk.style.display = pieno ? 'none' : '';
}
function tastiTesto(e){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && S.cfg.invio && !tocco()){ e.preventDefault(); mandaTesto(); }
  if(e.key === 'Escape'){ if(S.risposta){ S.risposta = null; disegnaScrivi(); } else if(pannelloEmojiAperto) chiudiPannelloEmoji(); }
  if(e.key === 'ArrowUp' && !e.target.value){ /* niente modifica: su FOSS.chat i messaggi non si cambiano */ }
}
const salvaBozzaPresto = debounce(salvaBozza, 600);
function salvaBozza(){
  const t = el('testoIn'); if(!t || !S.aperta) return;
  if(t.value.trim()) S.bozze[S.aperta] = t.value; else delete S.bozze[S.aperta];
  memoria('bozze', S.bozze);
}

/* il tasto in basso a destra: tocco = invia (o registra), pressione lunga sul testo = effetti */
let tPress = null;
function premiManda(e){
  const t = el('testoIn');
  if(e.button === 2) return;
  if(t && t.value.trim()){
    let lungo = false;
    tPress = setTimeout(() => { lungo = true; apriEffetti(); }, 520);
    const su = () => { clearTimeout(tPress); document.removeEventListener('pointerup', su); if(!lungo) mandaTesto(); };
    document.addEventListener('pointerup', su);
    e.preventDefault();
    return;
  }
  avviaRegistrazione(e);
}

/* ---------- invio ---------- */
function nuovoLocale(tipo, campi, convId){
  const c = S.convs.get(convId || S.aperta);
  return Object.assign({id: uuid(), conv_id: c.id, autore: S.io, tipo, testo: null, media: null, risponde_a: S.risposta && S.risposta.conv_id === c.id ? S.risposta.id : null,
                        creato_il: new Date().toISOString(), eliminato: false, _stato: 'invio'}, campi || {});
}
function mettiInLista(m){
  const s = statoMsgs(m.conv_id); s.ids.add(m.id); s.lista = mescola(s.lista, [m]);
  const c = S.convs.get(m.conv_id);
  if(c){ c.ultimo = {id: m.id, autore: m.autore, tipo: m.tipo, testo: m.testo, creato_il: m.creato_il, media: m.media}; c.ultimo_il = m.creato_il; c.archiviata = c.archiviata && false; }
  if(m.conv_id === S.aperta) aggiungiMessaggioAlFondo(m, false);
  disegnaLista();
}
async function salvaMessaggio(m){
  const riga = {id: m.id, conv_id: m.conv_id, tipo: m.tipo, testo: m.testo, media: pulisciMedia(m.media), risponde_a: m.risponde_a};
  const {data, error} = await sb.from('chat_messaggi').insert(riga).select().single();
  if(error) throw error;
  delete m._stato; delete m._avanza;
  m.creato_il = data.creato_il;
  const s = statoMsgs(m.conv_id); s.lista = mescola(s.lista, []);
  const c = S.convs.get(m.conv_id); if(c && c.ultimo && c.ultimo.id === m.id) c.ultimo.creato_il = data.creato_il;
  ridisegnaMessaggio(m.id); disegnaLista();
  return data;
}
function pulisciMedia(md){
  if(!md) return null;
  const o = {}; Object.keys(md).forEach(k => { if(k !== 'locale' && md[k] != null && md[k] !== '') o[k] = md[k]; });
  return Object.keys(o).length ? o : null;
}
async function mandaTesto(){
  const t = el('testoIn'); if(!t) return;
  const testo = t.value.replace(/\s+$/, '').replace(/^\n+/, '');
  if(!testo.trim()) return;
  if(testo.length > 6000){ toast('Il messaggio è troppo lungo (massimo 6000 caratteri).'); return; }
  const eff = S.effettoScelto ? Object.assign({}, S.effettoScelto) : null;
  const m = nuovoLocale('testo', {testo, media: eff});
  t.value = ''; adatta(t); S.effettoScelto = null; S.risposta = null;
  delete S.bozze[S.aperta]; memoria('bozze', S.bozze);
  disegnaScrivi(); el('testoIn').focus();
  mettiInLista(m);
  suono('invio');
  if(eff && eff.schermo) setTimeout(() => eseguiEffettoSchermo(m), 250);
  try{ await salvaMessaggio(m); }
  catch(e){ m._stato = 'errore'; ridisegnaMessaggio(m.id); errore(e, 'Messaggio non inviato'); }
}
async function riprova(id){
  const c = S.convs.get(S.aperta); const m = c && trovaMsg(c.id, id); if(!m) return;
  if(m._file){ return inviaFilePronto(m, m._file); }
  m._stato = 'invio'; ridisegnaMessaggio(id);
  try{ await salvaMessaggio(m); }catch(e){ m._stato = 'errore'; ridisegnaMessaggio(id); errore(e, 'Messaggio non inviato'); }
}

/* un file pronto (gia' compresso): lo carico con la barra e poi mando il messaggio */
async function inviaPreparato(conv, tipo, p, extra){
  const c = S.convs.get(conv); if(!c) return;
  const m = nuovoLocale(tipo, {media: Object.assign({locale: URL.createObjectURL(p.blob)}, p.media || {}, extra || {}), _avanza: 0}, conv);
  m._file = p;
  mettiInLista(m);
  return inviaFilePronto(m, p);
}
async function inviaFilePronto(m, p){
  m._stato = 'invio'; m._avanza = 0; ridisegnaMessaggio(m.id);
  const path = m.conv_id + '/' + uuid() + '.' + (p.ext || 'bin');
  let ultimo = 0;
  try{
    const r = await caricaFile(path, p.blob, v => {
      m._avanza = v; const t = Date.now(); if(t - ultimo < 120) return; ultimo = t;
      const n = $('.msg[data-id="'+m.id+'"] .media-carica'); if(n) n.innerHTML = anelloHTML(v);
    });
    const locale = m.media.locale;
    if(r.path){ m.media.path = r.path; firme.set(r.path, {url: locale, scade: Date.now() + 864e5}); }
    if(r.url){ m.media.url = r.url; }
    delete m._avanza;
    await salvaMessaggio(m);
    delete m._file;
  }catch(e){
    m._stato = 'errore'; delete m._avanza; ridisegnaMessaggio(m.id);
    errore(e, /server dei media/i.test(e && e.message) ? '' : 'File non inviato');
    if(/server dei media/i.test(e && e.message)) toast('Il server dei media sembra offline: il file non è partito.');
  }
}

/* ---------- registrazione dei vocali ---------- */
let reg = null;
function formatoAudio(){
  const f = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
  if(!window.MediaRecorder) return '';
  for(const x of f) try{ if(MediaRecorder.isTypeSupported(x)) return x; }catch(e){}
  return '';
}
async function avviaRegistrazione(e){
  if(reg) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast('Questo browser non registra l’audio.'); return; }
  const x0 = e.clientX, inizio = Date.now();
  let bloccata = false, annullata = false, rilasciata = false;
  const suPrima = () => { rilasciata = true; };
  document.addEventListener('pointerup', suPrima, {once: true});
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); }
  catch(err){ document.removeEventListener('pointerup', suPrima); toast('Serve il permesso di usare il microfono.'); return; }
  const tipo = formatoAudio();
  const rec = new MediaRecorder(stream, tipo ? {mimeType: tipo, audioBitsPerSecond: 48000} : undefined);
  const pezzi = [], livelli = [];
  let ac, an, buf;
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); const src = ac.createMediaStreamSource(stream); an = ac.createAnalyser(); an.fftSize = 512; src.connect(an); buf = new Uint8Array(an.fftSize); }catch(err){}
  rec.ondataavailable = ev => { if(ev.data && ev.data.size) pezzi.push(ev.data); };
  reg = {rec, stream, pezzi, livelli, inizio: Date.now(), ac};
  rec.start(250);
  dicoCheScrivo('registra');
  const F = el('barraScrivi');
  F.outerHTML = '<div class="registra" id="barraScrivi">'+
    '<button class="ib cestino" data-a="reg-annulla" title="Annulla">'+svg('cestino', 1.8)+'</button>'+
    '<span class="punto"></span><span class="t" id="regT">0:00</span>'+
    '<span class="vivo" id="regVivo"></span>'+
    '<span class="scorri" id="regScorri">‹ Scorri per annullare</span>'+
    '<button class="manda pieno" data-a="reg-manda" id="regManda" title="Invia">'+svg('manda', 1.8)+'</button></div>';
  const vivo = el('regVivo');
  if(vivo) vivo.style.display = 'none';
  const giro = setInterval(() => {
    if(!reg) return clearInterval(giro);
    const s = (Date.now() - reg.inizio) / 1000;
    const t = el('regT'); if(t) t.textContent = fmtDur(s);
    if(an){ an.getByteTimeDomainData(buf); let m = 0; for(let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128)); livelli.push(Math.min(1, m / 70)); }
    else livelli.push(.3);
    if(vivo && (bloccata || tocco() === false)){
      vivo.style.display = 'flex'; const sc = el('regScorri'); if(sc && bloccata) sc.style.display = 'none';
      const ult = livelli.slice(-60), pk = Math.max(.05, ...livelli.slice(-200)); vivo.innerHTML = ult.map(v => '<i style="height:'+Math.max(3, v / pk * 26)+'px"></i>').join('');
    }
    if(s > 600) fineRegistrazione(true);
    if(s % 3 < .11) dicoCheScrivo('registra');
  }, 100);
  reg.giro = giro;
  /* tenuto premuto: si manda lasciando. Tocco breve: resta aperto (bloccato) */
  if(rilasciata){ bloccata = true; const sc = el('regScorri'); if(sc) sc.style.display = 'none'; }
  else {
    const muovi = ev => {
      const dx = ev.clientX - x0;
      const sc = el('regScorri'); if(sc && !bloccata) sc.style.transform = 'translateX(' + Math.min(0, dx) + 'px)';
      if(dx < -110 && !bloccata){ annullata = true; pulisci(); fineRegistrazione(false); }
    };
    const su = () => {
      pulisci();
      if(annullata) return;
      if(Date.now() - inizio < 400){ bloccata = true; const sc = el('regScorri'); if(sc) sc.style.display = 'none'; const v = el('regVivo'); if(v) v.style.display = 'flex'; return; }
      if(!bloccata) fineRegistrazione(true);
    };
    const pulisci = () => { document.removeEventListener('pointermove', muovi); document.removeEventListener('pointerup', su); };
    document.addEventListener('pointermove', muovi);
    document.addEventListener('pointerup', su);
  }
  if(!tocco()){ bloccata = true; const sc = el('regScorri'); if(sc) sc.style.display = 'none'; }
}
function fineRegistrazione(manda){
  const r = reg; if(!r) return; reg = null;
  clearInterval(r.giro);
  const durata = (Date.now() - r.inizio) / 1000;
  r.rec.onstop = async () => {
    r.stream.getTracks().forEach(t => t.stop());
    try{ r.ac && r.ac.close(); }catch(e){}
    disegnaScrivi();
    if(!manda) return;
    if(durata < 0.8){ toast('Tieni premuto per registrare un vocale.'); return; }
    const tipo = (r.rec.mimeType || 'audio/webm').split(';')[0];
    const blob = new Blob(r.pezzi, {type: tipo});
    const n = 48, lv = r.livelli, onda = [];
    const picco = Math.max(.05, ...lv);
    for(let i = 0; i < n; i++){
      const a = Math.floor(i * lv.length / n), b = Math.max(a + 1, Math.floor((i + 1) * lv.length / n));
      let m = 0; for(let j = a; j < b; j++) m = Math.max(m, lv[j] || 0);
      onda.push(String.fromCharCode(65 + Math.round(Math.min(1, m / picco) * 31)));
    }
    inviaPreparato(S.aperta, 'vocale', {blob, ext: tipo.includes('mp4') ? 'm4a' : tipo.includes('ogg') ? 'ogg' : 'webm',
      media: {dur: Math.round(durata * 10) / 10, onda: onda.join(''), mime: tipo, dim: blob.size}});
  };
  try{ r.rec.stop(); }catch(e){ r.stream.getTracks().forEach(t => t.stop()); disegnaScrivi(); }
}

/* ---------- riproduzione dei vocali ---------- */
let audio = null, audioId = null, velocita = 1;
function fermaAudio(){ if(audio){ audio.pause(); } audioId = null; }
async function suonaVocale(id){
  const c = S.convs.get(S.aperta); const m = c && trovaMsg(c.id, id); if(!m) return;
  if(!audio){
    audio = new Audio(); audio.preload = 'auto';
    audio.addEventListener('timeupdate', disegnaAvanzamento);
    audio.addEventListener('ended', () => { const fatto = audioId; disegnaAvanzamento(true); audioId = null; prossimoVocale(fatto); });
    audio.addEventListener('pause', () => disegnaAvanzamento());
    audio.addEventListener('play', () => disegnaAvanzamento());
    audio.addEventListener('error', () => { const id2 = audioId; audioId = null; disegnaAvanzamento(); if(id2) mediaNonArriva(id2); });
  }
  if(audioId === id){ if(audio.paused) audio.play().catch(() => {}); else audio.pause(); return; }
  const u = await urlMedia(m.media);
  if(!u){ mediaNonArriva(id); return; }
  if(audioId){ const vecchio = audioId; audioId = null; disegnaAvanzamento(false, vecchio); }
  audioId = id; audio.src = u; audio.playbackRate = velocita;
  try{ await audio.play(); }catch(e){ if(e && e.name !== 'AbortError') toast(m.media && m.media.url ? 'Il server dei media sembra offline.' : 'Non riesco a riprodurre il vocale.'); }
  const a = memoria('ascoltati') || {}; a[id] = 1; const k = Object.keys(a); if(k.length > 500) k.slice(0, k.length - 500).forEach(x => delete a[x]); memoria('ascoltati', a);
  const mic = $('.vocale[data-voc="'+id+'"] .mic'); if(mic) mic.className = 'mic ascoltato';
}
function prossimoVocale(id){
  const c = S.convs.get(S.aperta); if(!c) return;
  const l = msgVisibili(c.id), i = l.findIndex(x => x.id === id);
  const n = l[i + 1];
  const a = memoria('ascoltati') || {};
  if(n && n.tipo === 'vocale' && n.autore !== S.io && !a[n.id] && !n.eliminato) suonaVocale(n.id);
}
function disegnaAvanzamento(finito, quale){
  const id = quale || audioId; if(!id) return;
  const v = $('.vocale[data-voc="'+id+'"]'); if(!v) return;
  const va = audioId === id && audio && !audio.paused;
  v.classList.toggle('va', audioId === id && !finito);
  const b = v.querySelector('.vp'); if(b) b.innerHTML = svg(va ? 'pausa' : 'play');
  const vel = v.querySelector('.vel'); if(vel) vel.textContent = String(velocita).replace('.', ',') + '×';
  const d = audio && isFinite(audio.duration) && audio.duration ? audio.duration : ((trovaMsg(S.aperta, id) || {}).media || {}).dur || 1;
  const p = finito || audioId !== id ? 0 : Math.min(1, (audio.currentTime || 0) / d);
  const barre = v.querySelectorAll('.barre i'); const k = Math.round(p * barre.length);
  barre.forEach((x, i) => x.classList.toggle('su', i < k));
  const pl = v.querySelector('.pallino'); if(pl) pl.style.left = (p * 100) + '%';
  const t = v.querySelector('.tempo'); if(t) t.textContent = fmtDur(audioId === id && !finito && audio.currentTime ? audio.currentTime : d);
}
function cercaVocale(id, ev){
  const o = ev.target.closest('.onda'); if(!o) return;
  const r = o.getBoundingClientRect(), p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  if(audioId !== id){ suonaVocale(id).then(() => { if(audio && isFinite(audio.duration)) audio.currentTime = p * audio.duration; }); return; }
  if(audio && isFinite(audio.duration)) audio.currentTime = p * audio.duration;
}

/* ---------- incollare e trascinare (anche GIF da altre app) ---------- */
function incolla(e){
  const f = Array.from((e.clipboardData && e.clipboardData.files) || []);
  if(f.length){ e.preventDefault(); anteprimaInvio(f); }
}
function attivaTrascina(zona){
  let n = 0, velo = null;
  zona.addEventListener('dragenter', e => { if(!Array.from(e.dataTransfer.types || []).includes('Files')) return; e.preventDefault(); n++;
    if(!velo){ velo = document.createElement('div'); velo.className = 'trascina'; velo.innerHTML = '<span>Lascia qui per inviare</span>'; zona.appendChild(velo); } });
  zona.addEventListener('dragover', e => { if(velo) e.preventDefault(); });
  zona.addEventListener('dragleave', () => { n--; if(n <= 0 && velo){ velo.remove(); velo = null; n = 0; } });
  zona.addEventListener('drop', e => {
    if(velo){ velo.remove(); velo = null; } n = 0;
    const f = Array.from(e.dataTransfer.files || []); if(!f.length) return;
    e.preventDefault(); anteprimaInvio(f);
  });
}

  apriMenu(b.left, b.top - 8, [

    ['GIF dal dispositivo', 'gif', () => scegliFile('image/gif,video/mp4,video/webm', true, f => anteprimaInvio(f, 'gif'))],
  ], false, true);
}
function scegliFile(accept, multi, fatto, cattura){
  const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = !!multi;
  if(cattura) i.setAttribute('capture', cattura);
  i.style.display = 'none'; document.body.appendChild(i);
  i.onchange = () => { const f = Array.from(i.files || []); i.remove(); if(f.length) fatto(f); };
  i.click();
  setTimeout(() => { if(document.body.contains(i) && !i.files.length) i.remove(); }, 60000);
}
async function fotocamera(){
  if(tocco() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return scegliFile('image/*,video/*', false, f => anteprimaInvio(f), 'environment');
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1920}, height: {ideal: 1080}}, audio: false}); }
  catch(e){ return scegliFile('image/*', false, f => anteprimaInvio(f)); }
  const v = document.createElement('div'); v.className = 'visore';
  v.innerHTML = '<div class="visore-t"><span class="tt"><b>Scatta una foto</b></span><button class="ib" data-x="1">'+svg('chiudi')+'</button></div>'+
    '<div class="visore-c"><video autoplay playsinline muted style="transform:scaleX(-1)"></video></div>'+

/* ======================= FOTO, VIDEO, FILE ======================= */
async function decodifica(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {imageOrientation: 'from-image'}); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { ok(i); setTimeout(() => URL.revokeObjectURL(u), 1000); };
    i.onerror = () => { URL.revokeObjectURL(u); ko(new Error('immagine non leggibile')); };
    i.src = u;
  });
}
function lato(img){ return [img.width || img.videoWidth || img.naturalWidth, img.height || img.videoHeight || img.naturalHeight]; }
function miniatura(sorg, w, h){
  const k = 32 / Math.max(w, h), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  try{ c.getContext('2d').drawImage(sorg, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .5); }catch(e){ return ''; }
}
function versoBlob(c, tipo, q){ return new Promise(ok => c.toBlob(b => ok(b), tipo, q)); }
async function prepara(file, modo){
  const t = (file.type || '').toLowerCase(), nome = file.name || 'file';
  const ext = estensione(nome);
  if(file.size > MAX_FILE) throw new Error('«' + nome + '» è troppo grande: il massimo è 50 MB');
  if(modo === 'file' || /svg/.test(t)) return {tipo: 'file', blob: file, ext: ext || 'bin', media: {nome: nome.slice(0, 120), dim: file.size, mime: t}};
  if(t === 'image/gif'){
    let w = 300, h = 300, mini = '';
    try{ const im = await decodifica(file); [w, h] = lato(im); mini = miniatura(im, w, h); }catch(e){}
    return {tipo: 'foto', blob: file, ext: 'gif', media: {w, h, mini, gif: true, dim: file.size}};
  }
  if(/^image\//.test(t) || /^(jpe?g|png|webp|heic|heif|avif|bmp)$/.test(ext)){
    let im;
    try{ im = await decodifica(file); }catch(e){ return {tipo: 'file', blob: file, ext: ext || 'img', media: {nome: nome.slice(0, 120), dim: file.size, mime: t}}; }
    let [w, h] = lato(im);
    const mini = miniatura(im, w, h);
    const tieniPng = t === 'image/png' && file.size < 1.5 * 1048576 && Math.max(w, h) <= 2400;
    if(tieniPng) return {tipo: 'foto', blob: file, ext: 'png', media: {w, h, mini, dim: file.size}};
    const max = 1920, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    const b = await versoBlob(c, 'image/jpeg', .84);
    return {tipo: 'foto', blob: b || file, ext: 'jpg', media: {w: c.width, h: c.height, mini, dim: (b || file).size}};
  }
  if(/^video\//.test(t) || /^(mp4|mov|webm|m4v)$/.test(ext)){
    const info = await infoVideo(file);
    const gif = modo === 'gif' || (info.dur && info.dur <= 15 && !info.audio && /gif/i.test(nome));
    return {tipo: 'video', blob: file, ext: ext || 'mp4', media: Object.assign({dim: file.size, gif: gif || undefined, mime: t}, info.media)};
  }
  return {tipo: 'file', blob: file, ext: ext || 'bin', media: {nome: nome.slice(0, 120), dim: file.size, mime: t}};
}
function infoVideo(file){
  return new Promise(ok => {
    const v = document.createElement('video'), u = URL.createObjectURL(file);
    let fatto = false;
    const fine = r => { if(fatto) return; fatto = true; URL.revokeObjectURL(u); ok(r); };
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = u;
    v.onloadedmetadata = () => { try{ v.currentTime = Math.min(.2, (v.duration || 1) / 2); }catch(e){ fine({media: {w: v.videoWidth, h: v.videoHeight, dur: Math.round(v.duration || 0)}}); } };
    v.onseeked = () => {
      const w = v.videoWidth || 320, h = v.videoHeight || 240;
      fine({media: {w, h, dur: Math.round(v.duration || 0), mini: miniatura(v, w, h)},
            audio: v.mozHasAudio || (v.webkitAudioDecodedByteCount > 0) || (v.audioTracks && v.audioTracks.length > 0)});
    };
    v.onerror = () => fine({media: {}});
    setTimeout(() => fine({media: {w: v.videoWidth, h: v.videoHeight, dur: Math.round(v.duration || 0)}}), 5000);
  });
}

async function mandaAnteprima(){

    const v = voci[k];

let visoreDati = null;
function mediaDellaChat(){
  const c = S.convs.get(S.aperta); if(!c) return [];
  return msgVisibili(c.id).filter(m => !m.eliminato && (m.tipo === 'foto' || m.tipo === 'video' || m.tipo === 'sticker'));

async function apriVisore(id){
  const lista = mediaDellaChat(); const i = lista.findIndex(m => m.id === id); if(i < 0) return;
  visoreDati = {lista, i, zoom: 1, x: 0, y: 0};
  let v = el('visore');
  if(!v){ v = document.createElement('div'); v.className = 'visore'; v.id = 'visore'; document.body.appendChild(v); }

async function disegnaVisore(){
  const v = el('visore'); if(!v || !visoreDati) return;
  const m = visoreDati.lista[visoreDati.i], md = m.media || {};
  const u = await urlMedia(md);
  const quando = dataGiorno(m.creato_il) + ' alle ' + ora(m.creato_il);
  let cont;
  if(!u) cont = '<div class="media-offline" style="max-width:340px">'+svg(md.url ? 'server' : 'foto', 1.6)+'<b>'+(md.url ? 'Il server dei media sembra offline' : 'File non disponibile')+'</b></div>';
  else if(m.tipo === 'video') cont = '<video src="'+esc(u)+'" controls autoplay playsinline'+(md.gif ? ' loop muted' : '')+'></video>';
  else cont = '<img src="'+esc(u)+'" alt="" id="visoreImg" draggable="false" style="'+(m.tipo === 'sticker' ? 'max-width:60vmin;max-height:60vmin' : '')+'">';
  v.innerHTML = '<div class="visore-t">'+avatar(m.autore)+'<span class="tt"><b>'+esc(m.autore === S.io ? 'Tu' : nomeDi(m.autore))+'</b><span>'+quando+'</span></span>'+
    (m.tipo === 'foto' && !md.gif ? '<button class="ib" data-v="sticker" title="Crea sticker">'+svg('sticker', 1.8)+'</button>' : '')+
    '<button class="ib" data-v="rispondi" title="Rispondi">'+svg('rispondi', 1.8)+'</button>'+
    '<button class="ib" data-v="inoltra" title="Inoltra">'+svg('inoltra', 1.8)+'</button>'+
    (m.tipo !== 'sticker' ? '<button class="ib" data-v="scarica" title="Scarica">'+svg('scarica', 1.8)+'</button>' : '')+
    '<button class="ib" data-v="chiudi" title="Chiudi">'+svg('chiudi')+'</button></div>'+
    '<div class="visore-c" id="visoreC">'+
      (visoreDati.i > 0 ? '<button class="ib" data-v="prima" style="position:absolute;left:12px;background:rgba(134,150,160,.2)">'+svg('indietro')+'</button>' : '')+cont+
      (visoreDati.i < visoreDati.lista.length - 1 ? '<button class="ib" data-v="dopo" style="position:absolute;right:12px;background:rgba(134,150,160,.2);transform:scaleX(-1)">'+svg('indietro')+'</button>' : '')+
    '</div>'+(md.did ? '<div class="visore-did">'+formatta(md.did)+'</div>' : '<div style="height:20px"></div>');
  visoreDati.zoom = 1; visoreDati.x = visoreDati.y = 0;
  v.onclick = e => {
    const b = e.target.closest('[data-v]'); if(!b) return;
    const a = b.dataset.v;
    if(a === 'chiudi') chiudiVisore();
    if(a === 'prima'){ visoreDati.i--; disegnaVisore(); }
    if(a === 'dopo'){ visoreDati.i++; disegnaVisore(); }
    if(a === 'scarica') scaricaMedia(m);
    if(a === 'inoltra'){ chiudiVisore(); inoltra([m]); }
    if(a === 'rispondi'){ chiudiVisore(); impostaRisposta(m); }
    if(a === 'sticker'){ chiudiVisore(); stickerDaMessaggio(m); }
  };
  const img = el('visoreImg'), C = el('visoreC');
  if(img && C){
    const applica = () => { img.style.transform = 'translate('+visoreDati.x+'px,'+visoreDati.y+'px) scale('+visoreDati.zoom+')'; img.style.cursor = visoreDati.zoom > 1 ? 'grab' : 'zoom-in'; };
    img.ondblclick = e => { visoreDati.zoom = visoreDati.zoom > 1 ? 1 : 2.5; visoreDati.x = visoreDati.y = 0; applica(); };
    C.onwheel = e => { e.preventDefault(); visoreDati.zoom = Math.max(1, Math.min(6, visoreDati.zoom * (e.deltaY < 0 ? 1.15 : .87))); if(visoreDati.zoom === 1) visoreDati.x = visoreDati.y = 0; applica(); };
    const punti = new Map(); let d0 = 0, z0 = 1, px = 0, py = 0, sx = 0, ultimoTocco = 0;
    C.onpointerdown = e => {
      if(e.target.closest('button')) return;
      punti.set(e.pointerId, {x: e.clientX, y: e.clientY}); C.setPointerCapture(e.pointerId);
      if(punti.size === 2){ const [a, b] = Array.from(punti.values()); d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = visoreDati.zoom; }
      px = e.clientX; py = e.clientY; sx = e.clientX;
      if(e.pointerType === 'touch'){ const t = Date.now(); if(t - ultimoTocco < 300){ img.ondblclick(); } ultimoTocco = t; }
    };
    C.onpointermove = e => {
      if(!punti.has(e.pointerId)) return;
      punti.set(e.pointerId, {x: e.clientX, y: e.clientY});
      if(punti.size === 2){ const [a, b] = Array.from(punti.values()); visoreDati.zoom = Math.max(1, Math.min(6, z0 * Math.hypot(a.x - b.x, a.y - b.y) / (d0 || 1))); applica(); return; }
      if(visoreDati.zoom > 1){ visoreDati.x += e.clientX - px; visoreDati.y += e.clientY - py; px = e.clientX; py = e.clientY; applica(); }
    };
    C.onpointerup = e => {
      punti.delete(e.pointerId);
      if(visoreDati.zoom === 1 && e.pointerType === 'touch'){
        const dx = e.clientX - sx;
        if(dx > 70 && visoreDati.i > 0){ visoreDati.i--; disegnaVisore(); }
        else if(dx < -70 && visoreDati.i < visoreDati.lista.length - 1){ visoreDati.i++; disegnaVisore(); }
      }
    };
  }
}

  const W = cv.width = Math.max(40, box.offsetWidth), H = cv.height = Math.max(30, box.offsetHeight);
  const pt = []; const n = Math.min(500, Math.round(W * H / 40));
  for(let i = 0; i < n; i++) pt.push({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.2 + .4});

const COLORI = ['#ffffff','#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#af52de','#ff2d92'];

function Tratti(canvas, scala){

Tratti.prototype.inizia = function(x, y, p){
  this.cur = {s: this.strumento, c: this.colore, w: this.spessore * this.k, pt: [[x, y, p || .5]]};

};

Tratti.prototype.fine = function(){ if(this.cur && this.cur.pt.length === 1) this.cur.pt.push([this.cur.pt[0][0] + .1, this.cur.pt[0][1] + .1, this.cur.pt[0][2]]); this.cur = null; this.ridisegna(); };

Tratti.prototype.rifai = function(){ if(this.tolti.length){ this.lista.push(this.tolti.pop()); this.ridisegna(); } };
Tratti.prototype.svuota = function(){ this.lista = []; this.tolti = []; this.ridisegna(); };
Tratti.prototype.ridisegna = function(g, sx){
  g = g || this.g; sx = sx || 1;

    const larg = i => t.s === 'evidenziatore' ? t.w * 3 : t.s === 'gomma' ? t.w * 3 : t.w * (.55 + (pt[i][2] || .5));
    if(t.s === 'evidenziatore' || t.s === 'gomma' || t.s === 'neon'){
      g.lineWidth = larg(0) * sx;
      g.beginPath(); g.moveTo(pt[0][0] * sx, pt[0][1] * sx);
      for(let i = 1; i < pt.length - 1; i++){ const mx = (pt[i][0] + pt[i + 1][0]) / 2, my = (pt[i][1] + pt[i + 1][1]) / 2; g.quadraticCurveTo(pt[i][0] * sx, pt[i][1] * sx, mx * sx, my * sx); }

  });
};

    const d = e.target.closest('[data-d]'); if(!d) return;
    const a = d.dataset.d;
    if(a === 'chiudi'){ if(T.lista.length) conferma('Lasciare il disegno?', 'Quello che hai disegnato andrà perso.', 'Lascia', chiudi, true); else chiudi(); }
    if(a === 'annulla') T.annulla();
    if(a === 'rifai') T.rifai();
    if(a === 'svuota') T.svuota();
    if(a === 'sfondo'){ sf = (sf + 1) % 3; disegnaBase(); }
    if(a === 'fatto'){
      if(!T.lista.length && !img){ toast('Disegna qualcosa prima di inviare.'); return; }
      const out = document.createElement('canvas'); out.width = W; out.height = H;
      const g = out.getContext('2d'); g.drawImage(base, 0, 0); g.drawImage(cv, 0, 0);
      const trasp = !img && sfondi[sf] === 'trasparente';
      const b = await versoBlob(out, trasp || !img ? 'image/png' : 'image/jpeg', .9);
      chiudi(); if(b) fatto(b);
    }
  };
  function scegli(n){ T.strumento = n; $$('[data-s]', v).forEach(b => b.classList.toggle('on', b.dataset.s === n)); }
}

async function apriStickerEditor(blob){
  let img;
  try{ img = await decodifica(blob); }catch(e){ toast('Questa immagine non si può usare.'); return; }
  const v = document.createElement('div'); v.className = 'editor'; v.id = 'editor';
  v.innerHTML = '<div class="ed-testa"><button class="ib" data-d="chiudi" aria-label="Chiudi">'+svg('chiudi')+'</button><b>Nuovo sticker</b>'+
    '<button class="ib" data-d="annulla" title="Annulla tratto">'+svg('annulla')+'</button></div>'+
    '<div class="ed-area" id="edArea"><div class="ed-tela scacchi" id="edTela"><canvas id="stkTela"></canvas><canvas id="stkTratti" style="pointer-events:none"></canvas></div></div>'+
    '<div class="ed-barra" id="stkBarra"></div>';
  document.body.appendChild(v);
  const area = el('edArea'), tela = el('edTela'), cv = el('stkTela'), tr = el('stkTratti');
  const N = 512; cv.width = tr.width = N; cv.height = tr.height = N;
  const lato0 = Math.min(area.clientWidth - 30, area.clientHeight - 30, 460);
  tela.style.width = tela.style.height = lato0 + 'px';
  const st = {img, forma: 'libera', contorno: true, scala: 1, x: 0, y: 0, testi: [], modo: 'muovi', senzaSfondo: false};
  const [iw, ih] = lato(img);
  st.scala = Math.max(N / iw, N / ih) * 0.92; st.x = (N - iw * st.scala) / 2; st.y = (N - ih * st.scala) / 2;
  const T = new Tratti(tr, 1); T.colore = '#ffffff'; T.spessore = 7;
  const barra = () => {
    el('stkBarra').innerHTML =
      '<button class="ed-strumento'+(st.modo === 'muovi' ? ' on' : '')+'" data-m="muovi">'+svg('foto', 1.8)+'<span>Sposta</span></button>'+
      '<button class="ed-strumento" data-d="sfondo" id="stkSfondo">'+svg('bacchetta', 1.8)+'<span>'+(st.senzaSfondo ? 'Rimetti sfondo' : st.modo === 'tocca' ? 'Tocca il soggetto' : 'Togli sfondo')+'</span></button>'+
      '<button class="ed-strumento'+(st.forma === 'libera' ? ' on' : '')+'" data-f="libera" title="Libera">'+svg('libero', 1.8)+'</button>'+
      '<button class="ed-strumento'+(st.forma === 'tonda' ? ' on' : '')+'" data-f="tonda" title="Tonda">'+svg('tondo', 1.8)+'</button>'+
      '<button class="ed-strumento'+(st.forma === 'quadra' ? ' on' : '')+'" data-f="quadra" title="Arrotondata">'+svg('quadro', 1.8)+'</button>'+
      '<button class="ed-strumento'+(st.contorno ? ' on' : '')+'" data-d="contorno">'+svg('contorno', 1.8)+'<span>Bordo</span></button>'+
      '<button class="ed-strumento" data-d="testo">'+svg('testo', 1.8)+'<span>Testo</span></button>'+
      '<button class="ed-strumento" data-d="emoji">😀</button>'+
      '<button class="ed-strumento'+(st.modo === 'disegna' ? ' on' : '')+'" data-m="disegna">'+svg('penna', 1.8)+'</button>'+
      (st.modo === 'disegna' ? barraColori(T.colore) : '')+
      '<button class="ed-manda" data-d="salva" aria-label="Salva lo sticker">'+svg('ok', 2.4)+'</button>';
  };
  barra();
  const forma = (g, n) => {
    g.beginPath();
    if(st.forma === 'tonda') g.arc(n / 2, n / 2, n / 2 - 6, 0, 6.283);
    else if(st.forma === 'quadra'){ const r = n * .16, m = 6; g.moveTo(m + r, m); g.arcTo(n - m, m, n - m, n - m, r); g.arcTo(n - m, n - m, m, n - m, r); g.arcTo(m, n - m, m, m, r); g.arcTo(m, m, n - m, m, r); }
    else g.rect(0, 0, n, n);
  };
  const disegnaTesti = (g, k) => st.testi.forEach(t => {
    g.save(); g.font = '800 ' + t.dim * k + 'px ' + getComputedStyle(document.body).fontFamily; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = t.dim * k * .22; g.strokeStyle = t.bordo; g.strokeText(t.t, t.x * k, t.y * k); g.fillStyle = t.col; g.fillText(t.t, t.x * k, t.y * k); g.restore();
  });
  /* il contorno bianco attorno al soggetto (quando lo sfondo e' trasparente) */
  const componi = (n) => {
    const k = n / N;
    const lay = document.createElement('canvas'); lay.width = lay.height = n;
    const g = lay.getContext('2d');
    g.save(); forma(g, n); g.clip();
    g.drawImage(st.img, st.x * k, st.y * k, iw * st.scala * k, ih * st.scala * k);
    g.restore();
    T.ridisegna(g, k);
    disegnaTesti(g, k);
    if(!st.contorno) return lay;
    const out = document.createElement('canvas'); out.width = out.height = n;
    const o = out.getContext('2d');
    const sil = document.createElement('canvas'); sil.width = sil.height = n;
    const s = sil.getContext('2d'); s.drawImage(lay, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = '#fff'; s.fillRect(0, 0, n, n);
    const r = Math.max(3, Math.round(n * .018));
    for(let a = 0; a < 24; a++) o.drawImage(sil, Math.cos(a / 24 * 6.283) * r, Math.sin(a / 24 * 6.283) * r);
    o.shadowColor = 'rgba(0,0,0,.25)'; o.shadowBlur = n * .01;
    o.drawImage(lay, 0, 0);
    return out;
  };
  const anteprima = () => {
    const g = cv.getContext('2d'); g.clearRect(0, 0, N, N);
    g.drawImage(componi(N), 0, 0);
    tr.getContext('2d').clearRect(0, 0, N, N);
  };
  anteprima();
  /* spostare e ingrandire con dito o mouse; trascinare le scritte */
  const punti = new Map(); let d0 = 0, s0 = 1, ultimo = null, preso = null;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const p = posTela(e, cv);
    if(st.modo === 'tocca'){
      const nx = (p[0] - st.x) / (iw * st.scala), ny = (p[1] - st.y) / (ih * st.scala);
      if(nx < 0 || nx > 1 || ny < 0 || ny > 1){ avvisoEditor('Tocca dentro la foto, sul soggetto'); return; }
      avvisoEditor('<span class="giro"></span>Ritaglio il soggetto…', true);
      st.modo = 'muovi';
      setTimeout(async () => {
        try{ st.originale = st.originale || st.img; st.img = await togliSfondo(st.originale, nx, ny); st.senzaSfondo = true; st.contorno = true; avvisoEditor(''); }
        catch(err){ console.warn(err); avvisoEditor(''); toast(/soggetto/.test(err && err.message) ? 'Non ho trovato il soggetto: tocca proprio sopra.' : 'Non riesco a togliere lo sfondo adesso: controlla la connessione.'); }
        barra(); anteprima();
      }, 30);
      return;
    }
    if(st.modo === 'disegna'){ T.inizia(p[0], p[1], p[2]); punti.set(e.pointerId, p); return; }
    preso = st.testi.slice().reverse().find(t => Math.abs(p[0] - t.x) < t.dim * Math.max(1, t.t.length * .3) && Math.abs(p[1] - t.y) < t.dim * .7) || null;
    punti.set(e.pointerId, p); ultimo = p;
    if(punti.size === 2){ const [a, b] = Array.from(punti.values()); d0 = Math.hypot(a[0] - b[0], a[1] - b[1]); s0 = st.scala; }
  });
  cv.addEventListener('pointermove', e => {
    if(!punti.has(e.pointerId)) return;
    const p = posTela(e, cv);
    if(st.modo === 'disegna'){ T.muovi(p[0], p[1], p[2]); anteprima(); return; }
    punti.set(e.pointerId, p);
    if(punti.size === 2){
      const [a, b] = Array.from(punti.values()), d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const ns = Math.max(.05, s0 * d / (d0 || 1)), cxp = N / 2, cyp = N / 2;
      st.x = cxp - (cxp - st.x) * ns / st.scala; st.y = cyp - (cyp - st.y) * ns / st.scala; st.scala = ns;
    } else if(preso){ preso.x += p[0] - ultimo[0]; preso.y += p[1] - ultimo[1]; }
    else { st.x += p[0] - ultimo[0]; st.y += p[1] - ultimo[1]; }
    ultimo = p; anteprima();
  });
  const su = e => { punti.delete(e.pointerId); if(st.modo === 'disegna') T.fine(); preso = null; anteprima(); };
  cv.addEventListener('pointerup', su); cv.addEventListener('pointercancel', su);
  cv.addEventListener('wheel', e => { e.preventDefault(); const ns = st.scala * (e.deltaY < 0 ? 1.08 : .93); st.x = N / 2 - (N / 2 - st.x) * ns / st.scala; st.y = N / 2 - (N / 2 - st.y) * ns / st.scala; st.scala = ns; anteprima(); }, {passive: false});
  const chiudi = () => v.remove();
  v.addEventListener('input', e => { if(e.target.dataset.colL){ T.colore = e.target.value; } });
  v.onclick = async e => {
    const c = e.target.closest('[data-col]'); if(c){ T.colore = c.dataset.col; barra(); return; }
    const m = e.target.closest('[data-m]'); if(m){ st.modo = m.dataset.m; barra(); return; }
    const f = e.target.closest('[data-f]'); if(f){ st.forma = f.dataset.f; tela.classList.toggle('tondo', false); barra(); anteprima(); return; }
    const d = e.target.closest('[data-d]'); if(!d) return;
    const a = d.dataset.d;
    if(a === 'chiudi') chiudi();
    if(a === 'annulla'){ if(T.lista.length) T.annulla(); else if(st.testi.length) st.testi.pop(); anteprima(); }
    if(a === 'contorno'){ st.contorno = !st.contorno; barra(); anteprima(); }
    if(a === 'testo' || a === 'emoji'){
      const chiedi = a === 'emoji' ? new Promise(ok => sceltaEmoji(ok)) : chiediTesto('Testo dello sticker', 'Scrivi qualcosa', 40);
      const t = await chiedi; if(!t) return;
      st.testi.push({t, x: N / 2, y: a === 'emoji' ? N * .3 : N * .84, dim: a === 'emoji' ? 110 : 64, col: a === 'emoji' ? '#000' : T.colore === '#ffffff' ? '#ffffff' : T.colore, bordo: a === 'emoji' ? 'rgba(0,0,0,0)' : '#111'});
      if(a === 'testo' && st.testi[st.testi.length - 1].col === '#ffffff') st.testi[st.testi.length - 1].bordo = '#111';
      st.modo = 'muovi'; barra(); anteprima();
      toast('Trascina la scritta dove vuoi.');
    }
    if(a === 'sfondo'){
      if(st.senzaSfondo){ st.img = st.originale; st.senzaSfondo = false; barra(); anteprima(); return; }
      st.modo = 'tocca'; barra();
      avvisoEditor('Tocca il soggetto da ritagliare');
      preparaSegmentatore().catch(() => {});
    }
    if(a === 'salva'){
      const out = componi(512);
      let b = await versoBlob(out, 'image/webp', .9);
      if(!b || b.type !== 'image/webp') b = await versoBlob(out, 'image/png');
      chiudi();
      salvaStickerFile(b, 'sticker', true);
    }
  };
}
/* togliere lo sfondo: tocchi il soggetto e un modello di Google (MediaPipe, licenza Apache)
   lo ritaglia direttamente nel browser. Nessuna foto esce dal dispositivo. */
const MP_V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2';
const MP_MODELLO = 'https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite';
let segmentatore = null;
async function preparaSegmentatore(){
  if(segmentatore) return segmentatore;
  const vis = await import(MP_V + '/vision_bundle.mjs');
  const files = await vis.FilesetResolver.forVisionTasks(MP_V + '/wasm');
  const Cls = vis.InteractiveSegmenterLegacy || vis.InteractiveSegmenter;
  segmentatore = await Cls.createFromOptions(files, {baseOptions: {modelAssetPath: MP_MODELLO, delegate: 'CPU'}, outputConfidenceMasks: true, outputCategoryMask: false});
  return segmentatore;
}
async function togliSfondo(img, nx, ny){
  const seg = await preparaSegmentatore();
  const [iw, ih] = lato(img), k = Math.min(1, 1024 / Math.max(iw, ih));
  const c = document.createElement('canvas'); c.width = Math.round(iw * k); c.height = Math.round(ih * k);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  const r = seg.segment(c, {keypoint: {x: Math.max(0, Math.min(1, nx)), y: Math.max(0, Math.min(1, ny))}});
  const mk = r && r.confidenceMasks && r.confidenceMasks[0];
  if(!mk) throw new Error('nessuna maschera');
  const f = mk.getAsFloat32Array(), w = mk.width, h = mk.height;
  const dati = g.getImageData(0, 0, c.width, c.height);
  let pieni = 0;
  for(let y = 0; y < c.height; y++) for(let x = 0; x < c.width; x++){
    const v = f[Math.floor(y * h / c.height) * w + Math.floor(x * w / c.width)] || 0;
    const a = Math.max(0, Math.min(1, (v - .35) / .3));
    if(a > .5) pieni++;
    dati.data[(y * c.width + x) * 4 + 3] = Math.round(a * 255);
  }
  try{ r.close && r.close(); }catch(e){}
  if(pieni < c.width * c.height * .01) throw new Error('soggetto non trovato');
  g.putImageData(dati, 0, 0);
  return c;
}
/* salva nella mia raccolta (e, se sono in una chat, lo manda subito) */
async function salvaStickerFile(blob, tipo, manda){
  const ext = blob.type === 'image/gif' ? 'gif' : blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : /mp4/.test(blob.type) ? 'mp4' : 'webp';
  const path = 'sticker/' + S.io + '/' + uuid() + '.' + ext;
  toast(tipo === 'gif' ? 'Salvo la GIF…' : 'Salvo lo sticker…');
  try{
    await caricaFile(path, blob);
    firme.set(path, {url: URL.createObjectURL(blob), scade: Date.now() + 864e5});
    const {data, error} = await sb.from('chat_sticker').insert({path, tipo: tipo === 'gif' ? 'gif' : 'sticker'}).select().single();
    if(error) throw error;
    (tipo === 'gif' ? S.gif : S.sticker).unshift(data);
    if(pannelloEmojiAperto) apriPannelloEmoji(pannelloEmojiScheda);
    if(manda && S.aperta) mandaDaRaccolta(data);
    else toast(tipo === 'gif' ? 'GIF salvata tra le tue GIF' : 'Sticker salvato tra i tuoi');

async function mandaDaRaccolta(x){

    /* una GIF salvata: la copio nella cartella della chat */
    const ext = estensione(x.path) || 'gif';

    const loc = await urlFirmata(x.path);
    const m = nuovoLocale(ext === 'mp4' ? 'video' : 'foto', {media: {gif: true, locale: loc, w: 300, h: 300}});
    try{ const dims = await new Promise(ok => { if(ext === 'mp4') return ok([320, 240]); const i = new Image(); i.onload = () => ok([i.naturalWidth, i.naturalHeight]); i.onerror = () => ok([300, 300]); i.src = loc; });
      m.media.w = dims[0]; m.media.h = dims[1]; }catch(e){}

/* tastierino: verifica col server (o raccoglie un codice nuovo). Torna il codice, o null */
function tastierino(o){
  return new Promise(fine => {
    const v = document.createElement('div');
    v.className = 'velo scuro' + (o.intero ? ' blocco-tutto' : '');
    if(o.intero){ v.style.background = 'var(--pannello)'; v.style.zIndex = 95; }
    v.innerHTML = '<div class="foglio" style="max-width:360px'+(o.intero ? ';box-shadow:none;background:transparent' : '')+'" role="dialog" aria-label="Codice">'+
      (o.intero ? '<div style="display:flex;justify-content:center;padding-top:10px"><div style="width:64px;height:64px;border-radius:18px;overflow:hidden">'+LOGO+'</div></div>' : '')+
      '<div class="foglio-t" style="justify-content:center;text-align:center">'+esc(o.titolo)+'</div>'+
      '<div class="pin-box">'+(o.intero ? '' : '<span class="lucch">'+svg('lucchetto', 1.8)+'</span>')+
        '<p>'+esc(o.testo || '')+'</p><div class="pin-punti" id="pinPunti"><i></i><i></i><i></i><i></i></div><div class="pin-msg" id="pinMsg"></div>'+
        '<div class="pin-tasti">'+[1,2,3,4,5,6,7,8,9].map(n => '<button data-n="'+n+'">'+n+'</button>').join('')+
          '<button class="'+(o.annulla === false ? 'vuoto' : '')+'" data-x="1" style="font-size:14px">Annulla</button><button data-n="0">0</button><button data-c="1" aria-label="Cancella">'+svg('indietro', 1.8)+'</button></div>'+
        (o.verifica ? '<button class="pin-dimenticato" data-d="1">Hai dimenticato il codice?</button>' : '')+
      '</div></div>';
    document.body.appendChild(v);
    let cod = '', occupato = false;
    const punti = () => $$('#pinPunti i', v).forEach((x, i) => x.classList.toggle('pieno', i < cod.length));
    const msg = t => { el('pinMsg').textContent = t || ''; };
    const sbaglia = t => { const p = el('pinPunti'); p.classList.remove('errore'); void p.offsetWidth; p.classList.add('errore'); cod = ''; punti(); msg(t); try{ navigator.vibrate && navigator.vibrate(120); }catch(e){} };
    const chiudi = r => { document.removeEventListener('keydown', tasti, true); v.remove(); fine(r); };
    const prova = async () => {
      if(!o.verifica){ chiudi(cod); return; }
      occupato = true;
      try{
        const {data, error} = await sb.rpc('chat_verifica_pin', {p_pin: cod});
        if(error) throw error;
        if(data === 'ok') return chiudi(cod);
        if(data === 'nessuno') return chiudi(cod);
        if(String(data).startsWith('fermo')){ const s = +String(data).split(':')[1] || 300; sbaglia('Troppi tentativi: riprova tra ' + Math.ceil(s / 60) + ' minut' + (Math.ceil(s / 60) === 1 ? 'o' : 'i') + '.'); }
        else { const r = +String(data).split(':')[1]; sbaglia('Codice sbagliato.' + (r >= 0 ? ' Ancora ' + r + (r === 1 ? ' tentativo.' : ' tentativi.') : '')); }
      }catch(e){ sbaglia('Non riesco a controllare il codice: sei online?'); }
      finally{ occupato = false; }
    };
    const premi = n => { if(occupato || cod.length >= 4) return; cod += n; punti(); msg(''); if(cod.length === 4) setTimeout(prova, 120); };
    const tasti = e => {
      if(/^[0-9]$/.test(e.key)){ e.preventDefault(); e.stopPropagation(); premi(e.key); }
      else if(e.key === 'Backspace'){ e.preventDefault(); e.stopPropagation(); cod = cod.slice(0, -1); punti(); }
      else if(e.key === 'Escape' && o.annulla !== false){ e.preventDefault(); chiudi(null); }
    };
    document.addEventListener('keydown', tasti, true);
    v.onclick = async e => {
      const n = e.target.closest('[data-n]'); if(n) return premi(n.dataset.n);
      if(e.target.closest('[data-c]')){ cod = cod.slice(0, -1); punti(); return; }
      if(e.target.closest('[data-x]')) return chiudi(null);
      if(e.target.closest('[data-d]')){ const ok = await codiceDimenticato(); if(ok){ msg(''); toast('Codice nuovo impostato.'); chiudi('rifatto'); } }
    };
  });
}
async function chiediPin(titolo, testo, intero){
  const r = await tastierino({titolo, testo, verifica: true, annulla: !intero, intero});
  return r || null;
}
/* sceglie un codice nuovo (due volte); se ce n'e' gia' uno chiede prima quello */
async function impostaNuovoPin(){
  let vecchio = null;
  if(S.haPin){
    vecchio = await chiediPin('Codice attuale', 'Inserisci il codice che usi adesso.');
    if(!vecchio) return false;
    if(vecchio === 'rifatto') return true;
  }
  const a = await tastierino({titolo: 'Scegli un codice', testo: 'Quattro cifre facili da ricordare per te, difficili da indovinare per gli altri.'});
  if(!a) return false;
  const b = await tastierino({titolo: 'Ripeti il codice', testo: 'Scrivilo un’altra volta per conferma.'});
  if(!b) return false;
  if(a !== b){ toast('I due codici non coincidono: riprova.'); return impostaNuovoPin(); }
  try{
    const {data, error} = await sb.rpc('chat_imposta_pin', {p_nuovo: a, p_vecchio: vecchio});
    if(error) throw error;
    if(!data){ toast('Il codice attuale non era giusto.'); return false; }
    S.haPin = true;
    toast('Codice impostato.');
    return true;
  }catch(e){ errore(e, 'Codice non salvato'); return false; }
}
/* codice dimenticato: rientro con la password di FOSS e ne scelgo uno nuovo */
async function codiceDimenticato(){
  const {data: ss} = await sb.auth.getSession();
  const mail = ss && ss.session && ss.session.user && ss.session.user.email;
  if(!mail){ toast('Rientra in FOSS e riprova.'); return false; }
  const pw = await chiediTesto('Password di FOSS', 'Per scegliere un codice nuovo scrivi la password con cui entri in FOSS (' + mail + ').', 200, 'password');
  if(!pw) return false;
  const {error} = await sb.auth.signInWithPassword({email: mail, password: pw});
  if(error){ toast('Password sbagliata.'); return false; }
  const a = await tastierino({titolo: 'Nuovo codice', testo: 'Scegli quattro cifre.'});
  if(!a) return false;
  const b = await tastierino({titolo: 'Ripeti il codice', testo: 'Scrivilo un’altra volta per conferma.'});
  if(!b || a !== b){ toast('I due codici non coincidono.'); return false; }
  const r = await sb.rpc('chat_reimposta_pin', {p_nuovo: a});
  if(r.error){ errore(r.error, 'Codice non salvato'); return false; }
  S.haPin = true;
  return true;
}

/* ---------- blocco della singola chat ---------- */
async function alternaBlocco(c){
  if(!c.bloccata){
    if(!S.haPin){
      const ok = await new Promise(r => conferma('Blocca questa chat', 'Per bloccare le chat serve un codice di 4 cifre: lo scegli adesso e vale per tutte le tue chat bloccate.', 'Scegli il codice', () => r(true), false, () => r(false)));
      if(!ok || !await impostaNuovoPin()) return;
    }
    const {data, error} = await sb.rpc('chat_blocca', {p_conv: c.id, p_si: true});
    if(error || data !== 'ok') return errore(error || data, 'Chat non bloccata');
    c.bloccata = true; S.sbloccate.add(c.id);
    toast('Chat bloccata: per aprirla servirà il codice.');
  } else {
    const pin = await chiediPin('Sblocca la chat', 'Inserisci il codice per togliere il blocco a «' + nomeConv(c) + '».');
    if(!pin) return;
    if(pin === 'rifatto') return alternaBlocco(c);
    const {data, error} = await sb.rpc('chat_blocca', {p_conv: c.id, p_si: false, p_pin: pin});
    if(error || data !== 'ok') return errore(error || data, 'Blocco non tolto');
    c.bloccata = false;
    toast('Blocco tolto.');
  }
  disegnaLista(); if(S.aperta === c.id) aggiornaTestaConv(); if(infoAperta === c.id) disegnaInfo();
}

let bloccoTotaleAperto = false, nascostaDa = 0, ultimoGesto = Date.now();
async function bloccoTotale(){
  if(!S.tutto || bloccoTotaleAperto) return true;
  bloccoTotaleAperto = true;
  fermaAudio();
  const r = await chiediPin('FOSS.chat è protetta', 'Inserisci il codice per entrare.', true);
  bloccoTotaleAperto = false;
  ultimoGesto = Date.now();

}
async function proteggiTutto(si){
  if(si){
    if(!S.haPin && !await impostaNuovoPin()) return false;
    const {data, error} = await sb.rpc('chat_proteggi_tutto', {p_si: true});
    if(error || data !== 'ok'){ errore(error || data, 'Protezione non attivata'); return false; }
    S.tutto = true; toast('FOSS.chat ora si apre solo col codice.');
    return true;
  }
  const pin = await chiediPin('Togli la protezione', 'Inserisci il codice per togliere la protezione a FOSS.chat.');
  if(!pin) return false;
  if(pin === 'rifatto') return proteggiTutto(false);
  const {data, error} = await sb.rpc('chat_proteggi_tutto', {p_si: false, p_pin: pin});
  if(error || data !== 'ok'){ errore(error || data, 'Protezione non tolta'); return false; }
  S.tutto = false; toast('Protezione tolta.');
  return true;
}
/* chi lascia lo schermo acceso: dopo un po' tutto si richiude */
function sorveglianza(){
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ultimoGesto = Date.now(); }, {passive: true, capture: true}));
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){ nascostaDa = Date.now(); return; }
    const via = Date.now() - nascostaDa;
    if(nascostaDa && via > 60000) richiudi();
    nascostaDa = 0;
  });
  setInterval(() => { if(Date.now() - ultimoGesto > 5 * 60000) richiudi(); }, 30000);
}
function richiudi(){
  const c = S.aperta && S.convs.get(S.aperta);
  if(c && c.bloccata && S.sbloccate.has(c.id)){
    S.sbloccate.delete(c.id);
    const id = c.id;
    chiudiConv();
    if(!S.tutto) toast('La chat bloccata si è richiusa.', 'Riapri', () => apriConv(id));
  }
  S.sbloccate.clear();
  if(S.tutto && !bloccoTotaleAperto) bloccoTotale();
}

async function fotoQuadrata(file){
  const im = await decodifica(file); const [w, h] = lato(im), l = Math.min(w, h), n = Math.min(640, l);

  c.getContext('2d').drawImage(im, (w - l) / 2, (h - l) / 2, l, l, 0, 0, n, n);
  return versoBlob(c, 'image/jpeg', .86);
}

function svuotaChat(){

    const {error} = await sb.from('chat_membri').update({svuotata_il: t}).eq('conv_id', c.id).eq('utente_id', S.io);
    if(error) return errore(error, 'Chat non svuotata');

function esciGruppo(c){
  c = c || S.convs.get(infoAperta || S.aperta); if(!c) return;
  conferma('Uscire da «' + nomeConv(c) + '»?', 'Non riceverai più i messaggi del gruppo. Un amministratore potrà aggiungerti di nuovo.', 'Esci', async () => {

function disegnaCerca(){
  const I2 = el('info'); const c = S.convs.get(infoAperta); if(!c) return;
  I2.innerHTML = '<div class="scorre destra" style="position:absolute"><div class="scorre-testa basso"><button class="ib" data-a="chiudi-info">'+svg('chiudi')+'</button><h2>Cerca messaggi</h2></div>'+
    '<div class="cerca" style="padding-top:10px"><label>'+svg('cerca')+'<input id="cmIn" placeholder="Cerca in questa chat" autocomplete="off"></label></div>'+
    '<div class="scorre-corpo" id="cmRis"><div class="vuoto-lista">Cerca tra i messaggi di '+esc(nomeConv(c))+'.</div></div></div>';
  const i = el('cmIn'); setTimeout(() => i.focus(), 100);
  const vai = debounce(async () => {
    const q = i.value.trim(); const R = el('cmRis'); if(!R) return;
    if(q.length < 2){ R.innerHTML = '<div class="vuoto-lista">Scrivi almeno due lettere.</div>'; return; }
    const pulito = q.replace(/[%_\\]/g, m => '\\' + m);
    let qq = sb.from('chat_messaggi').select('id,autore,testo,creato_il,tipo,media').eq('conv_id', c.id).eq('eliminato', false).ilike('testo', '%' + pulito + '%').order('creato_il', {ascending: false}).limit(60);
    if(c.svuotata_il) qq = qq.gt('creato_il', c.svuotata_il);
    const {data, error} = await qq;
    if(error){ R.innerHTML = '<div class="vuoto-lista">Ricerca non riuscita.</div>'; return; }
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    const l = (data || []).filter(m => !S.nascosti.has(m.id));
    R.innerHTML = l.length ? l.map(m => '<button class="voce" data-a="vai-msg" data-id="'+m.id+'" style="align-items:flex-start"><span class="vc" style="border-bottom:1px solid var(--linea)">'+
      '<span style="font-size:12.5px">'+dataBreve(m.creato_il)+' · '+esc(m.autore === S.io ? 'Tu' : nomeDi(m.autore))+'</span>'+
      '<b style="white-space:normal;font-size:14.5px">'+esc(testoSemplice(m.testo)).replace(re, '<mark style="background:rgba(0,168,132,.3);color:inherit;border-radius:3px">$1</mark>')+'</b></span></button>').join('')
      : '<div class="vuoto-lista">Nessun messaggio con «'+esc(q)+'».</div>';
  }, 300);
  i.oninput = vai;
}
