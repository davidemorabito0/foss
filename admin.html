<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://suqpteanvnvvmfujlevi.supabase.co https://foss.team; connect-src https://suqpteanvnvvmfujlevi.supabase.co https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FOSS · Amministrazione</title>
<link rel="icon" href="icone/favicon.svg?v=45" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060F1C; --side:#081322; --card:#0C1A2D; --card-2:#102239; --card-3:#13294A; --line:#172B47; --line-2:#22395C;
  --text:#EAF0F8; --dim:#A3B3CA; --mute:#6E819E; --amber:#FFAD01; --on-amber:#1A1305;
  --blu:#3D8BFF; --verde:#2FC27A; --arancio:#F59E0B; --viola:#8B5CF6; --rosso:#F0506E; --azzurro:#38BDF8;
  --ok:#2FC27A; --ok-soft:#0D2B22; --warn:#F2A33A; --warn-soft:#2E220C; --alert:#F0506E; --alert-soft:#2E1520;
  --r:16px; --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--amber)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;background:var(--card-2);border:1px solid var(--line-2);font-weight:600;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:#3A5683;background:var(--card-3)}
.btn svg.i{width:16px;height:16px}
.btn.prim{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.btn.prim:hover{background:#FFBC2E}
.btn.rosso{background:var(--alert-soft);color:#FF8BA0;border-color:#4E2233}
.btn.rosso:hover{background:#3E1A29;border-color:#6E2D45}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.icona{padding:7px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
input[type=email],input[type=password],input[type=text],input[type=search],input[inputmode]{width:100%;background:#091526;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;outline:none}
input:focus{border-color:var(--amber)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:18px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--amber);color:#0D1926;display:grid;place-items:center;font-style:normal;font-size:18px}
.logo small{font-weight:600;letter-spacing:0;color:var(--mute);font-size:12px;margin-left:4px}

/* accesso */
#entra{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,#0F2240 0%,var(--bg) 60%)}
.box{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.box h1{font-size:22px;margin:24px 0 6px;letter-spacing:-.01em}
.box p{color:var(--dim);margin:0 0 18px}
.box label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 6px}
.box .btn.prim{width:100%;justify-content:center;margin-top:18px;padding:12px}
.err{background:var(--alert-soft);color:#FF8BA0;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px}
.qr{background:#fff;border-radius:12px;padding:12px;width:200px;height:200px;margin:4px auto 10px;display:block}
.segreto{display:block;text-align:center;word-break:break-all;color:var(--dim);margin-bottom:6px}
.codice{font-size:22px!important;letter-spacing:.4em;text-align:center}

/* struttura */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:236px 1fr}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
aside .logo{margin:2px 8px 22px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--dim);font-weight:600;text-align:left;width:100%;transition:background .15s,color .15s}
.nav svg.i{width:18px;height:18px;color:var(--mute)}
.nav:hover{background:#0D1C31;color:var(--text)}
.nav.on{background:#13284A;color:#fff}
.nav.on svg.i{color:var(--amber)}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;background:var(--alert-soft);color:#FF8BA0;border-radius:999px;padding:1px 8px}
.chi{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 4px;display:flex;flex-direction:column;gap:10px}
.chi .io{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--amber);color:#0D1926;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background-size:cover;background-position:center}
.chi b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chi span{font-size:11.5px;color:var(--mute)}
.chi .nav{padding:9px 10px}
main{padding:26px 30px 60px;min-width:0}
.testa{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.testa h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.testa p{margin:4px 0 0;color:var(--dim)}

/* avvisi */
.avviso{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border:1px solid #4A3510;color:#F7C77A;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
.avviso svg.i{width:18px;height:18px}
.avviso.ok{background:var(--ok-soft);border-color:#17513A;color:#8FE6BE}
.avviso.ko{background:var(--alert-soft);border-color:#572036;color:#FF9DB0}
.avviso.info{background:#0B1A2F;border-color:var(--line);color:var(--dim)}
.avviso.info svg.i{color:var(--blu)}
.avviso .x{margin-left:auto;color:inherit;opacity:.7;padding:2px;border-radius:6px}
.avviso .x:hover{opacity:1}
.avviso a{display:inline-flex;align-items:center;gap:4px}
.avviso a svg.i{width:13px;height:13px;color:inherit}

/* contatori */
.griglia{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.misura .h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ic svg.i{width:18px;height:18px}
.misura .h b{font-size:13px;font-weight:600;flex:1;min-width:0;line-height:1.25}
.misura .pc{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.misura .val{font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.misura .val small{font-size:13px;font-weight:500;color:var(--mute);margin-left:4px;letter-spacing:0}
.misura .riga{display:flex;align-items:center;gap:10px;margin:10px 0 10px}
.barra{flex:1;height:6px;background:#0A1628;border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2B7BFF,#38BDF8)}
.misura .riga em{font-style:normal;font-size:12px;color:var(--dim);min-width:30px;text-align:right}
.misura.giallo .barra i{background:linear-gradient(90deg,#F59E0B,#FBBF24)} .misura.giallo .pc{color:var(--warn)}
.misura.rosso .barra i{background:linear-gradient(90deg,#E11D48,#F0506E)} .misura.rosso .pc{color:var(--alert)}
.misura .nota{font-size:12px;color:var(--mute);line-height:1.4}
.numeri{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.numeri .card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.numeri .ic{width:42px;height:42px}
.numeri .ic svg.i{width:20px;height:20px}
.numeri b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.numeri span{color:var(--dim);font-size:12.5px}

/* tabelle */
.pannello{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pannello-h{display:flex;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap}
.pannello-h .t{flex:1;min-width:200px}
.pannello-h h3{margin:0;font-size:16px;font-weight:700}
.pannello-h p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
.cerca{position:relative;width:260px;max-width:100%}
.cerca svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mute)}
.cerca input{padding:9px 12px 9px 36px;font-size:13px}
.tab-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;background:#0A1729;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #12233B;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#0E1E35}
.dx{text-align:right}
.tnome{display:flex;align-items:center;gap:10px}
.tnome svg.i{width:16px;height:16px;color:var(--c,var(--dim))}
.tnome .mono{color:var(--mute);font-size:11.5px}
.quota{display:flex;align-items:center;gap:10px;min-width:180px}
.quota .barra{height:6px}
.quota em{font-style:normal;font-size:12px;color:var(--dim);width:34px;text-align:right}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:#17304F;color:var(--dim);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.ko{background:var(--alert-soft);color:#FF8BA0} .chip.am{background:#3A2D0C;color:var(--amber)}
.barra-az{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--dim)}
.seg button.on{background:#17305A;color:#fff}
.vuoto{padding:32px;text-align:center;color:var(--mute)}
.piccolo{font-size:12px;color:var(--mute)}
.nomefile{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-weight:600}
.anteprima{width:42px;height:42px;border-radius:9px;background:#0A1628 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mute)}
.anteprima svg.i{width:18px;height:18px}
.spunta{width:18px;height:18px;accent-color:var(--amber);cursor:pointer}
.selbar{position:sticky;top:12px;z-index:5;display:flex;align-items:center;gap:12px;background:#2A1520;border:1px solid #5A2238;border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.selbar b{color:#FFC0CC}
.selbar .sp{flex:1}
.azr{display:flex;gap:6px;justify-content:flex-end}

/* comunicazioni */
.com-lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,620px);gap:16px;align-items:start}
.com-ed{display:flex;flex-direction:column;gap:12px}
.com-ed label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px}
.com-ed textarea{width:100%;min-height:290px;background:#091526;border:1px solid var(--line-2);border-radius:11px;padding:12px 13px;outline:none;resize:vertical;font:400 14px/1.55 var(--font);color:var(--text)}
.com-ed textarea:focus{border-color:var(--amber)}
.com-due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.com-az{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.com-prev{position:sticky;top:12px;padding:0;overflow:hidden}
.com-prev .h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.com-prev .h b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.com-prev iframe{display:block;width:100%;height:760px;border:0;background:#07111F}
.aiuto{font-size:12px;color:var(--mute);line-height:1.5}
.aiuto code{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:#0A1628;padding:1px 5px;border-radius:5px;color:var(--dim)}
@media (max-width:1200px){ .com-lay{grid-template-columns:1fr} .com-prev{position:static} }

/* finestre */
#modale{position:fixed;inset:0;background:rgba(3,8,16,.72);display:none;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
#modale.on{display:grid}
#modale .box{max-width:460px}
#modale h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:10px}
#modale h3 .ic{--c:var(--rosso)}
#modale ul{color:var(--dim);padding-left:18px;margin:10px 0}
#modale li{margin:4px 0}
#modale .elenco{max-height:150px;overflow:auto;background:#091526;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--dim)}
#modale .az{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card-3);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px;font-size:13px;display:none;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#toast.on{display:block}
.carica{color:var(--mute);padding:30px 0}
@media (max-width:1500px){ .griglia{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1100px){ .numeri{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:820px){
  #app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
  aside .logo{width:100%;margin:0 0 8px}
  .nav{width:auto;padding:8px 10px;font-size:13px}
  .chi{width:100%;flex-direction:row;align-items:center;justify-content:space-between;margin-top:8px}
  main{padding:20px 16px 50px}
  .griglia,.numeri{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nomefile{max-width:150px}
  .cerca{width:100%}
}
</style>
</head>
<body>

<section id="entra">
  <div class="box" id="entraBox">
    <div class="logo"><i>F</i>FOSS <small>Amministrazione</small></div>
    <div class="carica">Un attimo…</div>
  </div>
</section>

<div id="app">
  <aside>
    <div class="logo"><i>F</i>FOSS <small>Admin</small></div>
    <button class="nav on" data-vai="spazio"><svg class="i"><use href="#i-db"/></svg>Spazio e limiti</button>
    <button class="nav" data-vai="file"><svg class="i"><use href="#i-file"/></svg>File</button>
    <button class="nav" data-vai="utenti"><svg class="i"><use href="#i-users"/></svg>Utenti</button>
    <button class="nav" data-vai="inviti"><svg class="i"><use href="#i-invito"/></svg>Inviti</button>
    <button class="nav" data-vai="segnalazioni"><svg class="i"><use href="#i-bandiera"/></svg>Segnalazioni<span class="n" id="nSegn" hidden></span></button>
    <button class="nav" data-vai="comunica"><svg class="i"><use href="#i-megafono"/></svg>Comunicazioni</button>
    <button class="nav" data-vai="email"><svg class="i"><use href="#i-mail"/></svg>Email inviate</button>
    <button class="nav" data-vai="errori"><svg class="i"><use href="#i-allerta"/></svg>Errori<span class="n" id="nErr" hidden></span></button>
    <button class="nav" data-vai="backup"><svg class="i"><use href="#i-backup"/></svg>Backup</button>
    <div class="chi">
      <div class="io"><span class="av" id="chiAv"></span><div style="min-width:0"><b id="chiSono"></b><span>Amministratore</span></div></div>
      <button class="nav" data-az="esci"><svg class="i"><use href="#i-esci"/></svg>Esci</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modale"><div class="box" id="modaleBox"></div></div>
<div id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-cartella" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>

  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-griglia" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
  <symbol id="i-fatto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 10"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-esterno" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-aggiorna" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-cestino" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-esci" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></symbol>
  <symbol id="i-allerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-scarica" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-occhio" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* Il pannello non contiene chiavi segrete: la chiave qui sotto e' quella pubblica
   (la stessa del sito). Tutto quello che vedi passa dalla funzione «admin» sul
   server, che risponde solo a un amministratore con la verifica in due passaggi. */
const SUPA_URL = 'https://suqpteanvnvvmfujlevi.supabase.co';
const SUPA_KEY = 'sb_publishable_f5Kjp6NHT9yTxr1bhWJjhg_4y72V-Kj';
const REPO = 'davidemorabito0/foss';
const MB = 1024 * 1024, GB = 1024 * MB;
const LIMITI = {db: 500 * MB, file: 1 * GB, github: 1 * GB, mau: 50000, emailGiorno: 100, emailMese: 3000};
const INATTIVO = 30 * 60 * 1000;          // dopo 30 minuti fermo esce da solo

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{storageKey:'foss-admin', persistSession:true, autoRefreshToken:true}});
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (n, cl) => '<svg class="i' + (cl ? ' ' + cl : '') + '"><use href="#i-' + n + '"/></svg>';
const cerchio = (n, c) => '<span class="ic" style="--c:' + c + '">' + ico(n) + '</span>';
const peso = b => { b = +b || 0; return b >= GB ? (b / GB).toFixed(2) + ' GB' : b >= MB ? (b / MB).toFixed(1) + ' MB' : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B'; };
const pcTesto = p => p > 0 && p < 1 ? '<1%' : Math.round(p) + '%';
const data = t => t ? new Date(t).toLocaleString('it-IT', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const giorni = t => t ? Math.floor((Date.now() - new Date(t)) / 864e5) : null;
const fa = t => { const g = giorni(t); return g == null ? '—' : g === 0 ? 'oggi' : g === 1 ? 'ieri' : g + ' giorni fa'; };
const st = {vista:'spazio', dati:{}, fileOrd:'vecchi', fileBucket:'', fileCerca:'', tabCerca:'', sel:new Set(), chiusi:{}};

function toast(t){ const x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(x.__t); x.__t = setTimeout(()=>x.classList.remove('on'), 3500); }
function modale(html){ $('modaleBox').innerHTML = html; $('modale').classList.add('on'); const f = $('modaleBox').querySelector('input,button.rosso,button.prim'); if(f) setTimeout(()=>f.focus(), 30); }
function chiudi(){ $('modale').classList.remove('on'); }

/* ---------- chiamata al server ---------- */
async function chiedi(azione, extra){
  const {data, error} = await sb.functions.invoke('admin', {body:Object.assign({azione}, extra || {})});
  if(!error) return data;
  let e = 'server';
  try{ if(error.context && typeof error.context.json === 'function'){ const j = await error.context.json(); if(j && j.errore) e = j.errore; } }catch(x){}
  if(e === '2fa'){ await passo(); throw new Error('2fa'); }
  if(e === 'non-admin'){ await sb.auth.signOut(); schermoEntra('Questo account non è amministratore di FOSS.'); throw new Error(e); }
  throw new Error(e);
}

/* ---------- accesso: email e password di FOSS, poi il codice dell'app di autenticazione ---------- */
function schermoEntra(err){
  $('app').classList.remove('on'); $('entra').style.display = '';
  $('entraBox').innerHTML = '<div class="logo"><i>F</i>FOSS <small>Amministrazione</small></div>' +
    '<h1>Accesso riservato</h1><p>Entra con il tuo account FOSS da amministratore.</p>' +
    '<form id="fEntra" autocomplete="on"><label for="em">Email</label><input type="email" id="em" autocomplete="username" required>' +
    '<label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<button class="btn prim" type="submit">Entra</button></form>';
  $('fEntra').addEventListener('submit', async e=>{
    e.preventDefault();
    const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Controllo…';
    const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
    if(error){ schermoEntra(/invalid/i.test(error.message) ? 'Email o password sbagliate.' : /many|rate/i.test(error.message) ? 'Troppi tentativi: aspetta qualche minuto.' : 'Accesso non riuscito.'); return; }
    passo();
  });
  setTimeout(()=>{ const x = $('em'); if(x) x.focus(); }, 30);
}
async function passo(){
  const {data:s} = await sb.auth.getSession();
  if(!s || !s.session){ schermoEntra(); return; }
  const {data:l} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(l && l.currentLevel === 'aal2'){ entra(s.session); return; }
  const {data:f} = await sb.auth.mfa.listFactors();
  const pronto = ((f && f.totp) || []).find(x=>x.status === 'verified');
  if(pronto) schermoCodice(pronto.id); else schermoIscrivi();
}
function boxCodice(titolo, testo, extra, err){
  $('app').classList.remove('on'); $('entra').style.display = '';
  $('entraBox').innerHTML = '<div class="logo"><i>F</i>FOSS <small>Amministrazione</small></div><h1>' + titolo + '</h1><p>' + testo + '</p>' + (extra || '') +
    '<form id="fCod"><label for="cod">Codice di 6 cifre</label><input id="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" class="codice" required>' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<button class="btn prim" type="submit">Conferma</button></form>' +
    '<p style="margin:16px 0 0;text-align:center"><button class="btn sm" type="button" data-az="esci">Esci</button></p>';
  setTimeout(()=>{ const x = $('cod'); if(x) x.focus(); }, 30);
}
function schermoCodice(fid, err){
  boxCodice('Verifica in due passaggi', 'Apri l’app di autenticazione sul telefono e scrivi il codice di FOSS.', '', err);
  $('fCod').addEventListener('submit', async e=>{
    e.preventDefault();
    const {error} = await sb.auth.mfa.challengeAndVerify({factorId:fid, code:$('cod').value.trim()});
    if(error){ schermoCodice(fid, 'Codice sbagliato o scaduto: riprova con quello nuovo.'); return; }
    passo();
  });
}
async function schermoIscrivi(err){
  /* prima volta: si collega l'app di autenticazione (Google Authenticator, Authy, 1Password…) */
  const {data:f} = await sb.auth.mfa.listFactors();
  for(const x of ((f && f.all) || []).filter(x=>x.status !== 'verified')) await sb.auth.mfa.unenroll({factorId:x.id});
  const {data, error} = await sb.auth.mfa.enroll({factorType:'totp', friendlyName:'FOSS admin'});
  if(error){ schermoEntra('Non riesco ad attivare la verifica in due passaggi: ' + error.message); return; }
  boxCodice('Attiva la verifica in due passaggi',
    'Serve una volta sola. Inquadra il codice con un’app di autenticazione (Google Authenticator, Authy, 1Password…), poi scrivi il codice che ti mostra.',
    '<img class="qr" alt="Codice QR" src="' + esc(data.totp.qr_code) + '"><span class="segreto mono">' + esc(data.totp.secret) + '</span>', err);
  $('fCod').addEventListener('submit', async e=>{
    e.preventDefault();
    const {error:e2} = await sb.auth.mfa.challengeAndVerify({factorId:data.id, code:$('cod').value.trim()});
    if(e2){ toast('Codice sbagliato: riprova con quello nuovo.'); $('cod').value = ''; $('cod').focus(); return; }
    passo();
  });
}
function entra(sessione){
  $('entra').style.display = 'none'; $('app').classList.add('on');
  const em = sessione.user.email || '';
  $('chiSono').textContent = em;
  $('chiAv').textContent = em.slice(0, 1).toUpperCase();
  vai(st.vista);
}
async function esci(){ await sb.auth.signOut(); st.dati = {}; schermoEntra(); }

/* ---------- uscita automatica ---------- */
let ultimoGesto = Date.now();
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ ultimoGesto = Date.now(); }, true));
setInterval(async ()=>{ if($('app').classList.contains('on') && Date.now() - ultimoGesto > INATTIVO){ await esci(); schermoEntra('Sei uscito dopo 30 minuti di inattività.'); } }, 30000);

/* ---------- viste ---------- */
function vai(v){
  st.vista = v;
  document.querySelectorAll('.nav[data-vai]').forEach(b=>b.classList.toggle('on', b.dataset.vai === v));
  $('main').innerHTML = '<div class="carica">Carico…</div>';
  ({spazio:vistaSpazio, file:vistaFile, utenti:vistaUtenti, inviti:vistaInviti, segnalazioni:vistaSegn, email:vistaEmail, backup:vistaBackup, errori:vistaErrori, comunica:vistaComunica}[v])()
    .catch(e=>{ if(e.message !== '2fa' && e.message !== 'non-admin') $('main').innerHTML = '<div class="avviso ko">' + ico('allerta') + 'Non riesco a leggere i dati (' + esc(e.message) + '). Riprova tra poco.</div>'; });
}
function testa(titolo, sotto, destra){
  return '<div class="testa"><div><h2>' + titolo + '</h2><p>' + sotto + '</p></div>' + (destra || '') + '</div>';
}
function avviso(tipo, icona, html, chiave){
  if(chiave && st.chiusi[chiave]) return '';
  return '<div class="avviso ' + tipo + '">' + ico(icona) + '<span>' + html + '</span>' +
    (chiave ? '<button class="x" data-chiudi-avviso="' + chiave + '" aria-label="Chiudi">' + ico('x') + '</button>' : '') + '</div>';
}
function misura(o){
  const pc = o.limite ? Math.min(100, o.usato / o.limite * 100) : 0;
  const cl = pc >= 85 ? 'rosso' : pc >= 60 ? 'giallo' : '';
  return '<div class="card misura ' + cl + '"><div class="h">' + cerchio(o.ic, o.c) + '<b>' + o.titolo + '</b><span class="pc">' + pcTesto(pc) + '</span></div>' +
    '<div class="val">' + o.testo + '</div>' +
    '<div class="riga"><div class="barra"><i style="width:' + Math.max(pc, 1.2) + '%"></i></div><em>' + pcTesto(pc) + '</em></div>' +
    '<div class="nota">' + o.nota + '</div></div>';
}
async function github(){
  try{ const r = await fetch('https://api.github.com/repos/' + REPO); if(!r.ok) return null; const j = await r.json(); return (j.size || 0) * 1024; }catch(e){ return null; }
}
const NOMI_BUCKET = {avatar:'foto profilo', allegati:'allegati'};
const TAB = {
  spazi:['Spazi (con le copertine)', 'cartella', 'var(--arancio)'], backup_giornalieri:['Backup', 'backup', 'var(--azzurro)'],
  progetti:['Progetti', 'griglia', 'var(--rosso)'], elementi:['Task, voci, commenti, chat', 'file', 'var(--rosso)'],
  spazio_lavoro:['Preferenze di ognuno', 'ingranaggio', 'var(--dim)'], notifiche:['Notifiche', 'campana', 'var(--rosso)'],
  avvisi_email:['Email della bustina', 'mail', 'var(--rosso)'], push_iscrizioni:['Telefoni iscritti agli avvisi', 'telefono', 'var(--blu)'],
  membri_progetto:['Persone nei progetti', 'users', 'var(--blu)'], membri_org:['Persone nei team', 'users', 'var(--blu)'],
  link_cliente:['Link per i clienti', 'link', 'var(--blu)'], calendari:['Calendari', 'calendario', 'var(--dim)'],
  segnalazioni:['Segnalazioni', 'bandiera', 'var(--arancio)'], inviti:['Inviti', 'invito', 'var(--verde)'], profili:['Profili', 'user', 'var(--blu)'],
  organizzazioni:['Team', 'users', 'var(--viola)'], modelli:['Preset', 'griglia', 'var(--viola)'], conti:['Soldi', 'euro', 'var(--verde)'],
  errori_app:['Errori', 'allerta', 'var(--arancio)'], inviti_codici:['Codici degli inviti', 'chiave', 'var(--dim)'], admin_foss:['Amministratori', 'chiave', 'var(--amber)']
};
async function vistaSpazio(){
  const [s, gh] = await Promise.all([chiedi('stato'), github()]);
  st.dati.stato = s; st.dati.gh = gh;
  disegnaSpazio();
}
function disegnaSpazio(){
  const s = st.dati.stato, gh = st.dati.gh;
  const file = (s.file || []).reduce((a, x)=>a + (+x.byte || 0), 0), nFile = (s.file || []).reduce((a, x)=>a + (+x.n || 0), 0);
  const allarmi = [];
  [[s.db_byte / LIMITI.db, 'il database'], [file / LIMITI.file, 'lo spazio file'], [gh != null ? gh / LIMITI.github : 0, 'il sito su GitHub'],
   [s.email_oggi / LIMITI.emailGiorno, 'le email di oggi'], [s.email_mese / LIMITI.emailMese, 'le email del mese']]
    .forEach(([p, n])=>{ if(p >= .85) allarmi.push('<b>' + n + '</b> è oltre l’85% del limite'); else if(p >= .6) allarmi.push(n + ' ha superato il 60%'); });
  if(s.errori_7) allarmi.push(s.errori_7 + (s.errori_7 === 1 ? ' errore' : ' errori') + ' negli ultimi 7 giorni (vedi <b>Errori</b>)');
  if(s.backup_ultimo_giro && s.backup_ultimo_giro.stato && s.backup_ultimo_giro.stato !== 'succeeded') allarmi.push('<b>l’ultimo backup notturno non è riuscito</b>');
  $('nErr').hidden = !s.errori_7; $('nErr').textContent = s.errori_7;
  let h = testa('Spazio e limiti', 'Quanto stai usando dei piani gratuiti, aggiornato adesso.', '<button class="btn" data-az="ricarica">' + ico('aggiorna') + 'Aggiorna</button>');
  h += allarmi.length ? avviso('', 'allerta', allarmi.map((x, i)=>i ? x : x.replace(/^(<b>)?(\w)/, (m, b, c)=>(b || '') + c.toUpperCase())).join(' · ') + '.')
                      : avviso('ok', 'fatto', 'Tutto sotto il 60% dei limiti gratuiti.', 'ok-spazio');
  h += '<div class="griglia">' +
    misura({titolo:'Database (Supabase)', ic:'db', c:'var(--blu)', usato:s.db_byte, limite:LIMITI.db, testo:peso(s.db_byte) + '<small>su 500 MB</small>', nota:'Progetti, spazi, commenti, copertine e backup.'}) +
    misura({titolo:'File caricati (Supabase)', ic:'cartella', c:'var(--verde)', usato:file, limite:LIMITI.file, testo:peso(file) + '<small>su 1 GB</small>',
      nota:nFile + ' file · ' + (s.file || []).map(x=>esc(NOMI_BUCKET[x.bucket] || x.bucket) + ' ' + peso(x.byte)).join(' · ')}) +
    misura({titolo:'Sito su GitHub', ic:'codice', c:'var(--arancio)', usato:gh || 0, limite:LIMITI.github, testo:gh == null ? 'n.d.' : peso(gh) + '<small>su 1 GB</small>', nota:'Dimensione del repository. Traffico: 100 GB al mese, non misurabile da qui.'}) +
    misura({titolo:'Utenti attivi nel mese', ic:'users', c:'var(--blu)', usato:s.attivi_30, limite:LIMITI.mau, testo:s.attivi_30 + '<small>su 50.000</small>', nota:s.utenti + ' account in tutto.'}) +
    misura({titolo:'Email di oggi (Resend)', ic:'mail', c:'var(--rosso)', usato:s.email_oggi, limite:LIMITI.emailGiorno, testo:s.email_oggi + '<small>su 100</small>', nota:'Inviti e avvisi della bustina. Si azzera a mezzanotte.'}) +
    misura({titolo:'Email del mese (Resend)', ic:'mail', c:'var(--rosso)', usato:s.email_mese, limite:LIMITI.emailMese, testo:s.email_mese + '<small>su 3.000</small>', nota:'Si azzera il primo del mese.'}) +
    '</div>';
  h += '<div class="numeri">' + [[s.utenti, 'account', 'user', 'var(--blu)'], [s.organizzazioni, 'team', 'users', 'var(--viola)'], [s.spazi, 'spazi', 'cartella', 'var(--arancio)'],
    [s.progetti, 'progetti', 'griglia', 'var(--verde)'], [s.progetti_fatti, 'completati', 'fatto', 'var(--azzurro)'], [nFile, 'file', 'file', 'var(--dim)']]
    .map(x=>'<div class="card">' + cerchio(x[2], x[3]) + '<div><b>' + esc(x[0]) + '</b><span>' + x[1] + '</span></div></div>').join('') + '</div>';
  h += avviso('info', 'info', 'Il traffico scaricato (5 GB al mese su Supabase) e i progetti attivi (2 su 2: FOSS e Idratati) si vedono solo nel ' +
    '<a href="https://supabase.com/dashboard/project/suqpteanvnvvmfujlevi" target="_blank" rel="noopener noreferrer">pannello di Supabase' + ico('esterno') + '</a>.');
  h += '<div class="pannello"><div class="pannello-h">' + cerchio('torta', 'var(--amber)') +
    '<div class="t"><h3>Cosa occupa il database</h3><p>Dettaglio delle tabelle e dello spazio usato.</p></div>' +
    '<label class="cerca">' + ico('cerca') + '<input type="search" id="cercaTab" placeholder="Cerca tabella…" value="' + esc(st.tabCerca) + '"></label></div>' +
    '<div class="tab-wrap"><table><thead><tr><th>Tabella</th><th class="dx">Righe</th><th class="dx">Spazio</th><th style="width:28%"></th></tr></thead><tbody id="righeTab"></tbody></table></div></div>';
  $('main').innerHTML = h;
  righeTabelle();
}
function righeTabelle(){
  const s = st.dati.stato, q = st.tabCerca.toLowerCase();
  const tot = (s.tabelle || []).reduce((a, t)=>a + (+t.byte || 0), 0) || 1;
  const l = (s.tabelle || []).filter(t=>!q || t.nome.toLowerCase().includes(q) || ((TAB[t.nome] || [])[0] || '').toLowerCase().includes(q));
  $('righeTab').innerHTML = l.length ? l.map(t=>{ const d = TAB[t.nome] || [t.nome, 'db', 'var(--dim)'], p = t.byte / tot * 100;
    return '<tr><td><span class="tnome" style="--c:' + d[2] + '">' + ico(d[1]) + esc(d[0]) + ' <span class="mono">' + esc(t.nome) + '</span></span></td>' +

const nomeFile = f => String(f.nome).split('/').pop().replace(/^[a-z0-9]{8,14}-/, '');

function fileVisibili(){
  const q = st.fileCerca.toLowerCase();
  const l = (st.dati.file || []).filter(f=>(!st.fileBucket || f.bucket === st.fileBucket) &&
    (!q || nomeFile(f).toLowerCase().includes(q) || String(f.progetto || '').toLowerCase().includes(q) || String(f.chi || '').toLowerCase().includes(q)));
  if(st.fileOrd === 'vecchi') l.sort((a, b)=>String(a.creato).localeCompare(String(b.creato)));
  if(st.fileOrd === 'nuovi') l.sort((a, b)=>String(b.creato).localeCompare(String(a.creato)));
  if(st.fileOrd === 'grandi') l.sort((a, b)=>(+b.byte || 0) - (+a.byte || 0));
  return l;
}
function disegnaFile(){

  h += '<div class="barra-az"><div class="seg">' + [['vecchi', 'Più vecchi'], ['nuovi', 'Più nuovi'], ['grandi', 'Più grandi']].map(x=>'<button data-ord="' + x[0] + '" class="' + (st.fileOrd === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<div class="seg">' + [['', 'Tutti'], ['allegati', 'Allegati'], ['avatar', 'Foto profilo']].map(x=>'<button data-buck="' + x[0] + '" class="' + (st.fileBucket === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<span style="flex:1"></span><label class="cerca">' + ico('cerca') + '<input type="search" id="cercaFile" placeholder="Cerca file, progetto, persona…" value="' + esc(st.fileCerca) + '"></label></div>';
  if(!l.length){ $('main').innerHTML = h + '<div class="pannello vuoto">' + (tutti.length ? 'Nessun file con questo filtro.' : 'Nessun file caricato.') + '</div>'; return; }
  h += '<div class="pannello"><div class="tab-wrap"><table><thead><tr>' +
    '<th style="width:40px"><input type="checkbox" class="spunta" data-tutti="1"' + (tuttiSel ? ' checked' : '') + ' aria-label="Scegli tutti" title="Scegli tutti"></th>' +
    '<th>File</th><th>Progetto</th><th>Di</th><th>Caricato</th><th class="dx">Peso</th><th class="dx">Azioni</th></tr></thead><tbody>' +
    l.map(f=>{ const k = f.bucket + '|' + f.nome;
      return '<tr><td><input type="checkbox" class="spunta" data-sel="' + esc(k) + '"' + (st.sel.has(k) ? ' checked' : '') + ' aria-label="Scegli"></td>' +
        '<td><div class="tnome"><span class="anteprima"' + (f.anteprima ? ' style="background-image:url(\'' + esc(f.anteprima) + '\')"' : '') + '>' + (f.anteprima ? '' : ico(tipoIcona(f))) + '</span>' +
          '<div style="min-width:0"><span class="nomefile" title="' + esc(f.nome) + '">' + esc(nomeFile(f)) + '</span><span class="chip">' + esc(NOMI_BUCKET[f.bucket] || f.bucket) + '</span></div></div></td>' +

        '<td>' + data(f.creato) + '<div class="piccolo">' + fa(f.creato) + '</div></td><td class="dx">' + peso(f.byte) + '</td>' +

function chiediTogliFile(chiavi){
  const l = (st.dati.file || []).filter(f=>chiavi.includes(f.bucket + '|' + f.nome));
  if(!l.length) return;
  st.daTogliere = chiavi;
  const b = l.reduce((a, f)=>a + (+f.byte || 0), 0), uno = l.length === 1;
  modale('<h3>' + cerchio('cestino', 'var(--rosso)') + (uno ? 'Eliminare questo file?' : 'Eliminare ' + l.length + ' file?') + '</h3>' +
    '<div class="elenco">' + l.slice(0, 12).map(f=>esc(nomeFile(f)) + ' · ' + peso(f.byte)).join('<br>') + (l.length > 12 ? '<br>… e altri ' + (l.length - 12) : '') + '</div>' +
    '<p style="color:var(--dim);margin:12px 0 0">Liberi ' + peso(b) + '. Cosa succede:</p><ul>' +
    '<li>' + (uno ? 'Il file sparisce' : 'I file spariscono') + ' per sempre: non sono nei backup.</li>' +

}
async function togliFile(){
  const chiavi = st.daTogliere || []; chiudi();
  const per = {};
  chiavi.forEach(k=>{ const i = k.indexOf('|'); (per[k.slice(0, i)] = per[k.slice(0, i)] || []).push(k.slice(i + 1)); });
  let n = 0;
  try{
    for(const bucket in per){ const r = await chiedi('togli-file', {bucket, nomi:per[bucket]}); n += r.tolti || 0; }
    toast(n === chiavi.length ? (n === 1 ? 'File eliminato.' : n + ' file eliminati.') : 'Eliminati ' + n + ' file su ' + chiavi.length + '.');
  }catch(e){ toast('Non riuscito: ' + e.message); }
  chiavi.forEach(k=>st.sel.delete(k));
  vai('file');
}

  if(!prova){
    modale('<h3>' + cerchio('invia', 'var(--amber)') + 'Mandare a ' + n + (n === 1 ? ' persona?' : ' persone?') + '</h3>' +
      '<p style="color:var(--dim);margin:4px 0 0">«' + esc(b.oggetto) + '» parte adesso a tutte le persone iscritte con l’account confermato. Ognuna la riceve da sola: nessuno vede gli indirizzi degli altri.</p>' +
      '<ul><li>Una volta partita non si può ritirare.</li><li>Conviene prima mandarne una prova a te.</li></ul>' +
      '<div class="az"><button class="btn" data-az="chiudi">Annulla</button><button class="btn prim" data-az="com-tutti-ok">' + ico('invia') + 'Manda a ' + n + '</button></div>');
    return;
  }
  t.disabled = true;
  try{ const r = await chiedi('comunicazione-prova', {mail:b}); toast(r.inviate ? 'Prova mandata alla tua email.' : 'La prova non è partita.'); }
  catch(e){ toast(e.message === 'chiave' ? 'Manca la chiave di Resend.' : 'La prova non è partita: ' + e.message); }
  t.disabled = false;
  vai('comunica');
}
async function mandaComTutti(){
  chiudi();
  const n = st.dati.com ? st.dati.com.destinatari : 0;
  try{
    const r = await chiedi('comunicazione-invia', {mail:st.bozza, quanti:n});
    toast(r.errori ? 'Partite ' + r.inviate + ' su ' + r.destinatari + '.' : 'Comunicazione mandata a ' + r.inviate + (r.inviate === 1 ? ' persona.' : ' persone.'));
  }catch(e){
    toast({limite:'Oggi superi il limite gratuito di 100 email: mandala domani.', conferma:'Nel frattempo è cambiato il numero di iscritti: riprova.', vuota:'Servono oggetto e testo.'}[e.message] || 'Non partita: ' + e.message);
  }
  vai('comunica');
}

/* ---------- backup ---------- */
async function vistaBackup(){
  const s = st.dati.stato = await chiedi('stato');
  const l = s.backup || [], g = s.backup_ultimo_giro;
  let h = testa('Backup', 'Ogni notte alle 3:30 si salva una copia di tutti i dati. Restano le ultime 7, più 5 fatte a mano.',
    '<button class="btn prim" data-az="backup-ora">' + ico('backup') + 'Fai un backup adesso</button>');
  if(g) h += g.stato === 'succeeded' ? avviso('ok', 'fatto', 'Ultimo backup automatico riuscito: ' + data(g.quando) + '.')
                                     : avviso('ko', 'allerta', 'L’ultimo backup automatico (' + data(g.quando) + ') non è riuscito: ' + esc(g.msg || g.stato));
  h += avviso('info', 'info', 'La copia sta sul database stesso: ti salva da un errore (un progetto cancellato per sbaglio). ' +
    'Per averne una anche fuori, ogni tanto premi <b>Scarica</b> e tieni il file sul computer. I file caricati (allegati, foto) non sono nel backup: c’è solo il loro elenco.');
  h += '<div class="pannello"><div class="tab-wrap"><table><thead><tr><th>Quando</th><th>Tipo</th><th class="dx">Righe</th><th class="dx">Peso</th><th class="dx">Azioni</th></tr></thead><tbody>' +
    (l.length ? l.map(b=>'<tr><td>' + data(b.creato) + '<div class="piccolo">' + fa(b.creato) + '</div></td><td><span class="chip' + (b.tipo === 'manuale' ? ' am' : '') + '">' + (b.tipo === 'manuale' ? 'a mano' : 'notturno') + '</span></td>' +
      '<td class="dx">' + esc(b.righe) + '</td><td class="dx">' + peso(b.byte) + '</td><td><div class="azr"><button class="btn sm" data-scarica="' + esc(b.posto) + '">' + ico('scarica') + 'Scarica</button></div></td></tr>').join('')
      : '<tr><td colspan="5" class="vuoto">Ancora nessun backup.</td></tr>') + '</tbody></table></div></div>';
  h += '<p class="piccolo" style="margin-top:14px">Per ripristinare un backup chiedi a Claude: si fa un pezzo alla volta, senza toccare il resto.</p>';
  $('main').innerHTML = h;
}
async function scaricaBackup(posto, b){
  b.disabled = true;
  try{
    const r = await chiedi('scarica-backup', {posto});
    const blob = new Blob([JSON.stringify(r.dati)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'foss-backup-' + String(r.creato_il).slice(0, 16).replace(/[:T]/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Backup scaricato: tienilo in un posto sicuro, contiene tutti i dati.');
  }catch(e){ toast('Download non riuscito: ' + e.message); }
  b.disabled = false;
}

/* ---------- tocchi ---------- */
document.addEventListener('input', e=>{
  if(e.target.id === 'cercaTab'){ st.tabCerca = e.target.value; righeTabelle(); }
  if(e.target.dataset && e.target.dataset.com){
    bozzaCom()[e.target.dataset.com] = e.target.value; salvaBozza();
    if(e.target.dataset.com === 'oggetto' && $('comOgg')) $('comOgg').textContent = e.target.value;
    anteprimaCom(); return;
  }
  if(e.target.id === 'cercaFile'){ st.fileCerca = e.target.value; st.focusCerca = true; disegnaFile(); }
});
document.addEventListener('click', async e=>{
  const t = e.target.closest('button, input[type=checkbox]'); if(!t) return;
  const d = t.dataset;
  if(d.vai) return vai(d.vai);
  if(d.chiudiAvviso){ st.chiusi[d.chiudiAvviso] = true; const a = t.closest('.avviso'); if(a) a.remove(); return; }
  if(d.ord){ st.fileOrd = d.ord; return disegnaFile(); }
  if(d.buck !== undefined){ st.fileBucket = d.buck; return disegnaFile(); }
  if(d.tutti){ const l = fileVisibili(); if(t.checked) l.forEach(f=>st.sel.add(f.bucket + '|' + f.nome)); else l.forEach(f=>st.sel.delete(f.bucket + '|' + f.nome)); return disegnaFile(); }
  if(d.sel){ t.checked ? st.sel.add(d.sel) : st.sel.delete(d.sel); return disegnaFile(); }
  if(d.togli1) return chiediTogliFile([d.togli1]);
  if(d.apri){ const i = d.apri.indexOf('|'); const w = window.open('about:blank', '_blank'); if(w) w.opener = null;
    try{ const r = await chiedi('link-file', {bucket:d.apri.slice(0, i), nome:d.apri.slice(i + 1)}); if(w) w.location.href = r.url; }catch(x){ if(w) w.close(); toast('Il file non si apre.'); } return; }
  if(d.ut) return azioneUtente(d.ut, d.id);
  if(d.ok) return faiUtente(d.ok, d.id);
  if(d.annulla){ try{ await chiedi('annulla-invito', {id:d.annulla}); toast('Invito annullato.'); }catch(x){ toast('Non riuscito.'); } return vai('inviti'); }
  if(d.segn){ try{ await chiedi('segna', {id:d.segn, stato:d.stato}); }catch(x){ toast('Non riuscito.'); } return vai('segnalazioni'); }
  if(d.scarica) return scaricaBackup(d.scarica, t);
  switch(d.az){
    case 'esci': return esci();
    case 'chiudi': return chiudi();
    case 'ricarica': return vai(st.vista);
    case 'deseleziona': st.sel.clear(); return disegnaFile();
    case 'com-prova': return mandaCom(true, t);
    case 'com-tutti': return mandaCom(false, t);
    case 'com-tutti-ok': return mandaComTutti();
    case 'com-esempio': st.bozza = Object.assign({}, ESEMPIO); salvaBozza(); return vai('comunica');
    case 'togli-file': return chiediTogliFile([...st.sel]);
    case 'togli-file-ok': return togliFile();
    case 'backup-ora': t.disabled = true; t.lastChild.textContent = 'Salvo…';
      try{ await chiedi('backup-ora'); toast('Backup fatto.'); }catch(x){ toast('Backup non riuscito: ' + x.message); } return vai('backup');
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') chiudi(); });
$('modale').addEventListener('click', e=>{ if(e.target.id === 'modale') chiudi(); });
sb.auth.onAuthStateChange(ev=>{ if(ev === 'SIGNED_OUT' && $('app').classList.contains('on')) schermoEntra(); });
passo();
</script>
