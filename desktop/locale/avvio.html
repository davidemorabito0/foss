<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOSS</title>
<!-- La prima pagina dell'app: aspetta che ci sia la rete, poi apre FOSS (o la chat) dal sito. -->
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0D1926;color:#E8EEF7;font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 24px;box-sizing:border-box}
  svg{width:64px;height:64px;animation:respiro 1.8s ease-in-out infinite}
  p{margin:0;color:#9FB0C3;max-width:340px}
  @keyframes respiro{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="c">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="15" fill="#13263A"/>
    <rect x="17" y="12" width="11" height="31" rx="5.5" fill="#FFAD01"/>
    <path d="M22.5 42c3.6 4.6 5.6 7.6 5.6 10.1a5.6 5.6 0 0 1-11.2 0c0-2.5 2-5.5 5.6-10.1z" fill="#FFAD01"/>
    <rect x="17" y="12" width="32" height="10" rx="5" fill="#E8EEF7"/>
    <rect x="17" y="27" width="25" height="9.5" rx="4.75" fill="#E8EEF7"/>
  </svg>
  <p id="t">Apro FOSS…</p>
</div>
<script>
(function(){
  var dest = window.__fossDestinazione || 'https://foss.team/';
  var base = dest.replace(/chat\.html$/, '');
  var t = document.getElementById('t'), tentativi = 0, timer = 0;
  if(/chat\.html$/.test(dest)) t.textContent = 'Apro FOSS.chat…';
  function prova(){
    clearTimeout(timer);
    fetch(base + 'manifest.json?r=' + Date.now(), {cache: 'no-store', mode: 'no-cors'})
      .then(function(){ location.replace(dest); }, function(){
        tentativi++;
        t.textContent = 'Non c’è connessione a internet. Riprovo da solo appena torna…';
        timer = setTimeout(prova, Math.min(15000, 1500 * tentativi));
      });
  }
  window.addEventListener('online', prova);
  prova();
})();
</script>
</body>
</html>
