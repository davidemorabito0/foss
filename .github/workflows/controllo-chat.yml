# Prove di FOSS.chat nel browser (sviluppo/test/app), con il Supabase finto: a ogni modifica
# della chat e a mano (Actions → «Controllo chat» → Run workflow). Non pubblica niente.
name: Controllo chat

on:
  workflow_dispatch:
  push:
    branches: [main, 'prova-*']
    paths: ['chat.html', 'sviluppo/chat/**', 'sviluppo/test/app/**', '.github/workflows/controllo-chat.yml']

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright
        run: pip install playwright
      - name: chat.html è aggiornata dai sorgenti?
        run: |
          cp chat.html /tmp/chat-pubblicata.html
          python3 sviluppo/chat/build.py
          cmp chat.html /tmp/chat-pubblicata.html && echo "chat.html uguale ai sorgenti"
      - name: Prove
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          cd sviluppo/test/app
          esito=0
          for t in prova7 prova8 prova9 prova11 prova13 prova14 prova15 prova16 prova17 prova18 prova19 prova20 prova21 prova22 prova24; do
            echo "::group::$t"
            if ! out=$(timeout 600 python3 $t.py 2>&1); then echo "$out"; echo "::error::$t si è fermata"; esito=1; else echo "$out"; fi
            echo "::endgroup::"
            ok=$(echo "$out" | grep -c '^ *ok ' || true)
            xx=$(echo "$out" | grep -E '^ *XX |PROVA FALLITA' || true)
            echo "$t: $ok riuscite"
            if [ -n "$xx" ]; then echo "$xx"; echo "::error::$t ha prove fallite"; esito=1; fi
          done
          exit $esito
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-chat
          path: sviluppo/test/app/shot/
          retention-days: 7
